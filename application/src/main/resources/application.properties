spring.application.name=acme-finance
spring.main.web-application-type=none
spring.datasource.url=${ACME_DATABASE_URL:jdbc:postgresql://localhost:5432/finance}
spring.datasource.username=${ACME_DATABASE_USER:finance}
spring.datasource.password=${ACME_DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=16
spring.sql.init.mode=always
grpc.server.port=${ACME_GRPC_PORT:9090}
acme.mesh.target=${ACME_MESH_TARGET:localhost:15001}
logging.structured.format.console=logstash
