syntax = "proto3";

package acme.compliance.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/compliance/v1/compliance.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Compliance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/compliance/v1;compliancev1";
option java_multiple_files = true;
option java_outer_classname = "ControlWorkflowServiceProto";
option java_package = "com.acme.compliance.v1";

// Runs the long-lived workflow that takes a control from start to finish.
service ControlWorkflowService {
  // Starts a control.
  rpc StartControlWorkflow(StartControlWorkflowRequest) returns (StartControlWorkflowResponse);

  // Advances a control.
  rpc AdvanceControlWorkflow(AdvanceControlWorkflowRequest) returns (AdvanceControlWorkflowResponse);

  // Cancels a control.
  rpc CancelControlWorkflow(CancelControlWorkflowRequest) returns (CancelControlWorkflowResponse);

  // Retrys a control.
  rpc RetryControlWorkflow(RetryControlWorkflowRequest) returns (RetryControlWorkflowResponse);

  // Resumes a control.
  rpc ResumeControlWorkflow(ResumeControlWorkflowRequest) returns (ResumeControlWorkflowResponse);

  // Signals a control.
  rpc SignalControlWorkflow(SignalControlWorkflowRequest) returns (SignalControlWorkflowResponse);
}

// The request of `StartControlWorkflow`.
message StartControlWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string control_id = 2;
  Control control = 3;
  StartControlWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartControlWorkflow`.
message StartControlWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Control control = 1;
  StartControlWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

