syntax = "proto3";

package acme.compliance.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/compliance/v1/compliance.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Compliance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/compliance/v1;compliancev1";
option java_multiple_files = true;
option java_outer_classname = "ControlLifecycleServiceProto";
option java_package = "com.acme.compliance.v1";

// Moves a control between the states of its lifecycle.
service ControlLifecycleService {
  // Activates a control.
  rpc ActivateControl(ActivateControlRequest) returns (ActivateControlResponse);

  // Suspends a control.
  rpc SuspendControl(SuspendControlRequest) returns (SuspendControlResponse);

  // Reinstates a control.
  rpc ReinstateControl(ReinstateControlRequest) returns (ReinstateControlResponse);

  // Terminates a control.
  rpc TerminateControl(TerminateControlRequest) returns (TerminateControlResponse);

  // Renews a control.
  rpc RenewControl(RenewControlRequest) returns (RenewControlResponse);

  // Expires a control.
  rpc ExpireControl(ExpireControlRequest) returns (ExpireControlResponse);

  // Returns a control.
  rpc GetControlLifecycle(GetControlLifecycleRequest) returns (GetControlLifecycleResponse);

  // Schedules a control.
  rpc ScheduleControlExpiry(ScheduleControlExpiryRequest) returns (ScheduleControlExpiryResponse);
}

// The request of `ActivateControl`.
message ActivateControlRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string control_id = 2;
  ActivateControlRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateControl`.
message ActivateControlResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Control control = 1;
  ActivateControlResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

