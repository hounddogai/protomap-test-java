syntax = "proto3";

package acme.compliance.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/compliance/v1/compliance.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Compliance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/compliance/v1;compliancev1";
option java_multiple_files = true;
option java_outer_classname = "AttestationWorkflowServiceProto";
option java_package = "com.acme.compliance.v1";

// Runs the long-lived workflow that takes an attestation from start to finish.
service AttestationWorkflowService {
  // Starts an attestation.
  rpc StartAttestationWorkflow(StartAttestationWorkflowRequest) returns (StartAttestationWorkflowResponse);

  // Advances an attestation.
  rpc AdvanceAttestationWorkflow(AdvanceAttestationWorkflowRequest) returns (AdvanceAttestationWorkflowResponse);

  // Cancels an attestation.
  rpc CancelAttestationWorkflow(CancelAttestationWorkflowRequest) returns (CancelAttestationWorkflowResponse);

  // Retrys an attestation.
  rpc RetryAttestationWorkflow(RetryAttestationWorkflowRequest) returns (RetryAttestationWorkflowResponse);

  // Pauses an attestation.
  rpc PauseAttestationWorkflow(PauseAttestationWorkflowRequest) returns (PauseAttestationWorkflowResponse);

  // Resumes an attestation.
  rpc ResumeAttestationWorkflow(ResumeAttestationWorkflowRequest) returns (ResumeAttestationWorkflowResponse);

  // Returns an attestation.
  rpc InspectAttestationWorkflow(InspectAttestationWorkflowRequest) returns (InspectAttestationWorkflowResponse);

  // Lists attestations a page at a time.
  rpc ListAttestationWorkflows(ListAttestationWorkflowsRequest) returns (ListAttestationWorkflowsResponse);

  // Signals an attestation.
  rpc SignalAttestationWorkflow(SignalAttestationWorkflowRequest) returns (SignalAttestationWorkflowResponse);
}

// The request of `StartAttestationWorkflow`.
message StartAttestationWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string attestation_id = 2;
  Attestation attestation = 3;
  StartAttestationWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartAttestationWorkflow`.
message StartAttestationWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Attestation attestation = 1;
  StartAttestationWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

