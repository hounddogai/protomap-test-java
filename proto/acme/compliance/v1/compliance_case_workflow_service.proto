syntax = "proto3";

package acme.compliance.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/compliance/v1/compliance.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Compliance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/compliance/v1;compliancev1";
option java_multiple_files = true;
option java_outer_classname = "ComplianceCaseWorkflowServiceProto";
option java_package = "com.acme.compliance.v1";

// Runs the long-lived workflow that takes a compliance case from start to finish.
service ComplianceCaseWorkflowService {
  // Starts a compliance case.
  rpc StartComplianceCaseWorkflow(StartComplianceCaseWorkflowRequest) returns (StartComplianceCaseWorkflowResponse);

  // Advances a compliance case.
  rpc AdvanceComplianceCaseWorkflow(AdvanceComplianceCaseWorkflowRequest) returns (AdvanceComplianceCaseWorkflowResponse);

  // Cancels a compliance case.
  rpc CancelComplianceCaseWorkflow(CancelComplianceCaseWorkflowRequest) returns (CancelComplianceCaseWorkflowResponse);

  // Retrys a compliance case.
  rpc RetryComplianceCaseWorkflow(RetryComplianceCaseWorkflowRequest) returns (RetryComplianceCaseWorkflowResponse);

  // Pauses a compliance case.
  rpc PauseComplianceCaseWorkflow(PauseComplianceCaseWorkflowRequest) returns (PauseComplianceCaseWorkflowResponse);

  // Resumes a compliance case.
  rpc ResumeComplianceCaseWorkflow(ResumeComplianceCaseWorkflowRequest) returns (ResumeComplianceCaseWorkflowResponse);

  // Returns a compliance case.
  rpc InspectComplianceCaseWorkflow(InspectComplianceCaseWorkflowRequest) returns (InspectComplianceCaseWorkflowResponse);

  // Lists compliance cases a page at a time.
  rpc ListComplianceCaseWorkflows(ListComplianceCaseWorkflowsRequest) returns (ListComplianceCaseWorkflowsResponse);
}

// The request of `StartComplianceCaseWorkflow`.
message StartComplianceCaseWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string compliance_case_id = 2;
  ComplianceCase compliance_case = 3;
  StartComplianceCaseWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartComplianceCaseWorkflow`.
message StartComplianceCaseWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ComplianceCase compliance_case = 1;
  StartComplianceCaseWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

