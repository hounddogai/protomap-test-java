syntax = "proto3";

package acme.compliance.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/compliance/v1/compliance.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Compliance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/compliance/v1;compliancev1";
option java_multiple_files = true;
option java_outer_classname = "AttestationCalculationServiceProto";
option java_package = "com.acme.compliance.v1";

// Computes the figures of an attestation, such as totals, taxes, and estimates.
service AttestationCalculationService {
  // Calculates an attestation.
  rpc CalculateAttestation(CalculateAttestationRequest) returns (CalculateAttestationResponse);

  // Estimates an attestation.
  rpc EstimateAttestation(EstimateAttestationRequest) returns (EstimateAttestationResponse);

  // Quotes an attestation.
  rpc QuoteAttestation(QuoteAttestationRequest) returns (QuoteAttestationResponse);

  // Compares an attestation.
  rpc CompareAttestationOptions(CompareAttestationOptionsRequest) returns (CompareAttestationOptionsResponse);

  // Recalculates an attestation.
  rpc RecalculateAttestations(RecalculateAttestationsRequest) returns (RecalculateAttestationsResponse);

  // Simulates an attestation.
  rpc SimulateAttestation(SimulateAttestationRequest) returns (SimulateAttestationResponse);

  // Explains an attestation.
  rpc ExplainAttestationCalculation(ExplainAttestationCalculationRequest) returns (ExplainAttestationCalculationResponse);

  // Returns an attestation.
  rpc GetAttestationRates(GetAttestationRatesRequest) returns (GetAttestationRatesResponse);
}

// The request of `CalculateAttestation`.
message CalculateAttestationRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string attestation_id = 2;
  Attestation attestation = 3;
  CalculateAttestationRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateAttestation`.
message CalculateAttestationResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateAttestationResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Attestation attestation = 1;
  CalculateAttestationResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

