syntax = "proto3";

package acme.compliance.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/compliance/v1/compliance.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Compliance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/compliance/v1;compliancev1";
option java_multiple_files = true;
option java_outer_classname = "ControlApprovalServiceProto";
option java_package = "com.acme.compliance.v1";

// Routes controls through approval, with escalation and delegation.
service ControlApprovalService {
  // Submits a control.
  rpc SubmitControl(SubmitControlRequest) returns (SubmitControlResponse);

  // Approves a control.
  rpc ApproveControl(ApproveControlRequest) returns (ApproveControlResponse);

  // Rejects a control.
  rpc RejectControl(RejectControlRequest) returns (RejectControlResponse);

  // Escalates a control.
  rpc EscalateControl(EscalateControlRequest) returns (EscalateControlResponse);

  // Lists controls a page at a time.
  rpc ListPendingControls(ListPendingControlsRequest) returns (ListPendingControlsResponse);

  // Recalls a control.
  rpc RecallControl(RecallControlRequest) returns (RecallControlResponse);

  // Returns a control.
  rpc GetControlApprovalStatus(GetControlApprovalStatusRequest) returns (GetControlApprovalStatusResponse);

  // Comments a control.
  rpc CommentControlApproval(CommentControlApprovalRequest) returns (CommentControlApprovalResponse);
}

// The request of `SubmitControl`.
message SubmitControlRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string control_id = 2;
  Control control = 3;
  SubmitControlRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitControl`.
message SubmitControlResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Control control = 1;
  SubmitControlResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

