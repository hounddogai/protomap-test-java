syntax = "proto3";

package acme.compliance.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/compliance/v1/compliance.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Compliance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/compliance/v1;compliancev1";
option java_multiple_files = true;
option java_outer_classname = "AttestationReportingServiceProto";
option java_package = "com.acme.compliance.v1";

// Builds and schedules reports about attestations.
service AttestationReportingService {
  // Generates an attestation.
  rpc GenerateAttestationReport(GenerateAttestationReportRequest) returns (GenerateAttestationReportResponse);

  // Returns an attestation.
  rpc FetchAttestationReport(FetchAttestationReportRequest) returns (FetchAttestationReportResponse);

  // Schedules an attestation.
  rpc ScheduleAttestationReport(ScheduleAttestationReportRequest) returns (ScheduleAttestationReportResponse);

  // Streams the changes of attestations as they happen.
  rpc StreamAttestationMetrics(StreamAttestationMetricsRequest) returns (stream StreamAttestationMetricsResponse);

  // Lists attestations a page at a time.
  rpc ListAttestationReports(ListAttestationReportsRequest) returns (ListAttestationReportsResponse);

  // Shares an attestation.
  rpc ShareAttestationReport(ShareAttestationReportRequest) returns (ShareAttestationReportResponse);

  // Counts attestations by status.
  rpc CountAttestationTotals(CountAttestationTotalsRequest) returns (CountAttestationTotalsResponse);

  // Deletes an attestation.
  rpc DeleteAttestationReport(DeleteAttestationReportRequest) returns (DeleteAttestationReportResponse);
}

// The request of `GenerateAttestationReport`.
message GenerateAttestationReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string attestation_id = 2;
  GenerateAttestationReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateAttestationReport`.
message GenerateAttestationReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchAttestationReport`.
message FetchAttestationReportRequest {
  acme.common.v1.RequestContext context = 1;
  string attestation_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchAttestationReport`.
message FetchAttestationReportResponse {
  Attestation attestation = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleAttestationReport`.
message ScheduleAttestationReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string attestation_id = 2;
  ScheduleAttestationReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleAttestationReport`.
message ScheduleAttestationReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamAttestationMetrics`.
message StreamAttestationMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated AttestationStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamAttestationMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamAttestationMetrics`.
message StreamAttestationMetricsResponse {
  Attestation attestation = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListAttestationReports`.
message ListAttestationReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated AttestationStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListAttestationReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListAttestationReports`.
message ListAttestationReportsResponse {
  repeated Attestation attestations = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareAttestationReport`.
message ShareAttestationReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string attestation_id = 2;
  ShareAttestationReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareAttestationReport`.
message ShareAttestationReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Attestation attestation = 1;
  ShareAttestationReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountAttestationTotals`.
message CountAttestationTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated AttestationStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountAttestationTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountAttestationTotals`.
message CountAttestationTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteAttestationReport`.
message DeleteAttestationReportRequest {
  acme.common.v1.RequestContext context = 1;
  string attestation_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteAttestationReport`.
message DeleteAttestationReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
