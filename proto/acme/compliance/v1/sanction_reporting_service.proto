syntax = "proto3";

package acme.compliance.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/compliance/v1/compliance.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Compliance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/compliance/v1;compliancev1";
option java_multiple_files = true;
option java_outer_classname = "SanctionReportingServiceProto";
option java_package = "com.acme.compliance.v1";

// Builds and schedules reports about sanctions.
service SanctionReportingService {
  // Generates a sanction.
  rpc GenerateSanctionReport(GenerateSanctionReportRequest) returns (GenerateSanctionReportResponse);

  // Returns a sanction.
  rpc FetchSanctionReport(FetchSanctionReportRequest) returns (FetchSanctionReportResponse);

  // Schedules a sanction.
  rpc ScheduleSanctionReport(ScheduleSanctionReportRequest) returns (ScheduleSanctionReportResponse);

  // Streams the changes of sanctions as they happen.
  rpc StreamSanctionMetrics(StreamSanctionMetricsRequest) returns (stream StreamSanctionMetricsResponse);

  // Lists sanctions a page at a time.
  rpc ListSanctionReports(ListSanctionReportsRequest) returns (ListSanctionReportsResponse);

  // Counts sanctions by status.
  rpc CountSanctionTotals(CountSanctionTotalsRequest) returns (CountSanctionTotalsResponse);

  // Deletes a sanction.
  rpc DeleteSanctionReport(DeleteSanctionReportRequest) returns (DeleteSanctionReportResponse);
}

// The request of `GenerateSanctionReport`.
message GenerateSanctionReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string sanction_id = 2;
  GenerateSanctionReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateSanctionReport`.
message GenerateSanctionReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchSanctionReport`.
message FetchSanctionReportRequest {
  acme.common.v1.RequestContext context = 1;
  string sanction_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchSanctionReport`.
message FetchSanctionReportResponse {
  Sanction sanction = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleSanctionReport`.
message ScheduleSanctionReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string sanction_id = 2;
  ScheduleSanctionReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleSanctionReport`.
message ScheduleSanctionReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamSanctionMetrics`.
message StreamSanctionMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SanctionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamSanctionMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamSanctionMetrics`.
message StreamSanctionMetricsResponse {
  Sanction sanction = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListSanctionReports`.
message ListSanctionReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SanctionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListSanctionReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListSanctionReports`.
message ListSanctionReportsResponse {
  repeated Sanction sanctions = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountSanctionTotals`.
message CountSanctionTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated SanctionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountSanctionTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountSanctionTotals`.
message CountSanctionTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteSanctionReport`.
message DeleteSanctionReportRequest {
  acme.common.v1.RequestContext context = 1;
  string sanction_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteSanctionReport`.
message DeleteSanctionReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
