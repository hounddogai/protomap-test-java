syntax = "proto3";

package acme.compliance.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/compliance/v1/compliance.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Compliance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/compliance/v1;compliancev1";
option java_multiple_files = true;
option java_outer_classname = "SanctionValidationServiceProto";
option java_package = "com.acme.compliance.v1";

// Checks sanctions against the rules before anything acts on them.
service SanctionValidationService {
  // Validates a sanction.
  rpc ValidateSanction(ValidateSanctionRequest) returns (ValidateSanctionResponse);

  // Previews a sanction.
  rpc PreviewSanction(PreviewSanctionRequest) returns (PreviewSanctionResponse);

  // Checks a sanction.
  rpc CheckSanctionEligibility(CheckSanctionEligibilityRequest) returns (CheckSanctionEligibilityResponse);

  // Normalizes a sanction.
  rpc NormalizeSanction(NormalizeSanctionRequest) returns (NormalizeSanctionResponse);

  // Explains a sanction.
  rpc ExplainSanctionDecision(ExplainSanctionDecisionRequest) returns (ExplainSanctionDecisionResponse);

  // Scores a sanction.
  rpc ScoreSanction(ScoreSanctionRequest) returns (ScoreSanctionResponse);

  // Returns a sanction.
  rpc GetSanctionRules(GetSanctionRulesRequest) returns (GetSanctionRulesResponse);
}

// The request of `ValidateSanction`.
message ValidateSanctionRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string sanction_id = 2;
  Sanction sanction = 3;
  ValidateSanctionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateSanction`.
message ValidateSanctionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Sanction sanction = 1;
  ValidateSanctionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

