syntax = "proto3";

package acme.compliance.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/compliance/v1/compliance.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Compliance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/compliance/v1;compliancev1";
option java_multiple_files = true;
option java_outer_classname = "SanctionLifecycleServiceProto";
option java_package = "com.acme.compliance.v1";

// Moves a sanction between the states of its lifecycle.
service SanctionLifecycleService {
  // Activates a sanction.
  rpc ActivateSanction(ActivateSanctionRequest) returns (ActivateSanctionResponse);

  // Suspends a sanction.
  rpc SuspendSanction(SuspendSanctionRequest) returns (SuspendSanctionResponse);

  // Reinstates a sanction.
  rpc ReinstateSanction(ReinstateSanctionRequest) returns (ReinstateSanctionResponse);

  // Renews a sanction.
  rpc RenewSanction(RenewSanctionRequest) returns (RenewSanctionResponse);

  // Expires a sanction.
  rpc ExpireSanction(ExpireSanctionRequest) returns (ExpireSanctionResponse);

  // Returns a sanction.
  rpc GetSanctionLifecycle(GetSanctionLifecycleRequest) returns (GetSanctionLifecycleResponse);

  // Schedules a sanction.
  rpc ScheduleSanctionExpiry(ScheduleSanctionExpiryRequest) returns (ScheduleSanctionExpiryResponse);
}

// The request of `ActivateSanction`.
message ActivateSanctionRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string sanction_id = 2;
  ActivateSanctionRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateSanction`.
message ActivateSanctionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Sanction sanction = 1;
  ActivateSanctionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

