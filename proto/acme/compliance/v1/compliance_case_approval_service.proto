syntax = "proto3";

package acme.compliance.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/compliance/v1/compliance.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Compliance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/compliance/v1;compliancev1";
option java_multiple_files = true;
option java_outer_classname = "ComplianceCaseApprovalServiceProto";
option java_package = "com.acme.compliance.v1";

// Routes compliance cases through approval, with escalation and delegation.
service ComplianceCaseApprovalService {
  // Submits a compliance case.
  rpc SubmitComplianceCase(SubmitComplianceCaseRequest) returns (SubmitComplianceCaseResponse);

  // Approves a compliance case.
  rpc ApproveComplianceCase(ApproveComplianceCaseRequest) returns (ApproveComplianceCaseResponse);

  // Rejects a compliance case.
  rpc RejectComplianceCase(RejectComplianceCaseRequest) returns (RejectComplianceCaseResponse);

  // Escalates a compliance case.
  rpc EscalateComplianceCase(EscalateComplianceCaseRequest) returns (EscalateComplianceCaseResponse);

  // Lists compliance cases a page at a time.
  rpc ListPendingComplianceCases(ListPendingComplianceCasesRequest) returns (ListPendingComplianceCasesResponse);

  // Delegates a compliance case.
  rpc DelegateComplianceCaseApproval(DelegateComplianceCaseApprovalRequest) returns (DelegateComplianceCaseApprovalResponse);

  // Recalls a compliance case.
  rpc RecallComplianceCase(RecallComplianceCaseRequest) returns (RecallComplianceCaseResponse);

  // Returns a compliance case.
  rpc GetComplianceCaseApprovalStatus(GetComplianceCaseApprovalStatusRequest) returns (GetComplianceCaseApprovalStatusResponse);

  // Comments a compliance case.
  rpc CommentComplianceCaseApproval(CommentComplianceCaseApprovalRequest) returns (CommentComplianceCaseApprovalResponse);
}

// The request of `SubmitComplianceCase`.
message SubmitComplianceCaseRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string compliance_case_id = 2;
  ComplianceCase compliance_case = 3;
  SubmitComplianceCaseRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitComplianceCase`.
message SubmitComplianceCaseResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ComplianceCase compliance_case = 1;
  SubmitComplianceCaseResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

