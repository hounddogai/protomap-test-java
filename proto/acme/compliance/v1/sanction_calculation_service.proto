syntax = "proto3";

package acme.compliance.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/compliance/v1/compliance.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Compliance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/compliance/v1;compliancev1";
option java_multiple_files = true;
option java_outer_classname = "SanctionCalculationServiceProto";
option java_package = "com.acme.compliance.v1";

// Computes the figures of a sanction, such as totals, taxes, and estimates.
service SanctionCalculationService {
  // Calculates a sanction.
  rpc CalculateSanction(CalculateSanctionRequest) returns (CalculateSanctionResponse);

  // Estimates a sanction.
  rpc EstimateSanction(EstimateSanctionRequest) returns (EstimateSanctionResponse);

  // Compares a sanction.
  rpc CompareSanctionOptions(CompareSanctionOptionsRequest) returns (CompareSanctionOptionsResponse);

  // Simulates a sanction.
  rpc SimulateSanction(SimulateSanctionRequest) returns (SimulateSanctionResponse);

  // Explains a sanction.
  rpc ExplainSanctionCalculation(ExplainSanctionCalculationRequest) returns (ExplainSanctionCalculationResponse);

  // Returns a sanction.
  rpc GetSanctionRates(GetSanctionRatesRequest) returns (GetSanctionRatesResponse);
}

// The request of `CalculateSanction`.
message CalculateSanctionRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string sanction_id = 2;
  Sanction sanction = 3;
  CalculateSanctionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateSanction`.
message CalculateSanctionResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateSanctionResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Sanction sanction = 1;
  CalculateSanctionResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

