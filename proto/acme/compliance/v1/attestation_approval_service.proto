syntax = "proto3";

package acme.compliance.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/compliance/v1/compliance.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Compliance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/compliance/v1;compliancev1";
option java_multiple_files = true;
option java_outer_classname = "AttestationApprovalServiceProto";
option java_package = "com.acme.compliance.v1";

// Routes attestations through approval, with escalation and delegation.
service AttestationApprovalService {
  // Submits an attestation.
  rpc SubmitAttestation(SubmitAttestationRequest) returns (SubmitAttestationResponse);

  // Approves an attestation.
  rpc ApproveAttestation(ApproveAttestationRequest) returns (ApproveAttestationResponse);

  // Rejects an attestation.
  rpc RejectAttestation(RejectAttestationRequest) returns (RejectAttestationResponse);

  // Escalates an attestation.
  rpc EscalateAttestation(EscalateAttestationRequest) returns (EscalateAttestationResponse);

  // Delegates an attestation.
  rpc DelegateAttestationApproval(DelegateAttestationApprovalRequest) returns (DelegateAttestationApprovalResponse);

  // Returns an attestation.
  rpc GetAttestationApprovalStatus(GetAttestationApprovalStatusRequest) returns (GetAttestationApprovalStatusResponse);

  // Comments an attestation.
  rpc CommentAttestationApproval(CommentAttestationApprovalRequest) returns (CommentAttestationApprovalResponse);
}

// The request of `SubmitAttestation`.
message SubmitAttestationRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string attestation_id = 2;
  Attestation attestation = 3;
  SubmitAttestationRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitAttestation`.
message SubmitAttestationResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Attestation attestation = 1;
  SubmitAttestationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

