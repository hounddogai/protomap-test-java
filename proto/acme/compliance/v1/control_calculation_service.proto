syntax = "proto3";

package acme.compliance.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/compliance/v1/compliance.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Compliance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/compliance/v1;compliancev1";
option java_multiple_files = true;
option java_outer_classname = "ControlCalculationServiceProto";
option java_package = "com.acme.compliance.v1";

// Computes the figures of a control, such as totals, taxes, and estimates.
service ControlCalculationService {
  // Calculates a control.
  rpc CalculateControl(CalculateControlRequest) returns (CalculateControlResponse);

  // Estimates a control.
  rpc EstimateControl(EstimateControlRequest) returns (EstimateControlResponse);

  // Quotes a control.
  rpc QuoteControl(QuoteControlRequest) returns (QuoteControlResponse);

  // Compares a control.
  rpc CompareControlOptions(CompareControlOptionsRequest) returns (CompareControlOptionsResponse);

  // Recalculates a control.
  rpc RecalculateControls(RecalculateControlsRequest) returns (RecalculateControlsResponse);

  // Simulates a control.
  rpc SimulateControl(SimulateControlRequest) returns (SimulateControlResponse);

  // Explains a control.
  rpc ExplainControlCalculation(ExplainControlCalculationRequest) returns (ExplainControlCalculationResponse);

  // Returns a control.
  rpc GetControlRates(GetControlRatesRequest) returns (GetControlRatesResponse);
}

// The request of `CalculateControl`.
message CalculateControlRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string control_id = 2;
  Control control = 3;
  CalculateControlRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateControl`.
message CalculateControlResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateControlResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Control control = 1;
  CalculateControlResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

