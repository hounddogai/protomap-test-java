syntax = "proto3";

package acme.compliance.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/compliance/v1/compliance.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Compliance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/compliance/v1;compliancev1";
option java_multiple_files = true;
option java_outer_classname = "SanctionApprovalServiceProto";
option java_package = "com.acme.compliance.v1";

// Routes sanctions through approval, with escalation and delegation.
service SanctionApprovalService {
  // Submits a sanction.
  rpc SubmitSanction(SubmitSanctionRequest) returns (SubmitSanctionResponse);

  // Approves a sanction.
  rpc ApproveSanction(ApproveSanctionRequest) returns (ApproveSanctionResponse);

  // Rejects a sanction.
  rpc RejectSanction(RejectSanctionRequest) returns (RejectSanctionResponse);

  // Escalates a sanction.
  rpc EscalateSanction(EscalateSanctionRequest) returns (EscalateSanctionResponse);

  // Lists sanctions a page at a time.
  rpc ListPendingSanctions(ListPendingSanctionsRequest) returns (ListPendingSanctionsResponse);

  // Delegates a sanction.
  rpc DelegateSanctionApproval(DelegateSanctionApprovalRequest) returns (DelegateSanctionApprovalResponse);

  // Recalls a sanction.
  rpc RecallSanction(RecallSanctionRequest) returns (RecallSanctionResponse);

  // Returns a sanction.
  rpc GetSanctionApprovalStatus(GetSanctionApprovalStatusRequest) returns (GetSanctionApprovalStatusResponse);

  // Comments a sanction.
  rpc CommentSanctionApproval(CommentSanctionApprovalRequest) returns (CommentSanctionApprovalResponse);
}

// The request of `SubmitSanction`.
message SubmitSanctionRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string sanction_id = 2;
  Sanction sanction = 3;
  SubmitSanctionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitSanction`.
message SubmitSanctionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Sanction sanction = 1;
  SubmitSanctionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

