syntax = "proto3";

package acme.budgeting.v1;

import "acme/budgeting/v1/budgeting.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Budgeting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/budgeting/v1;budgetingv1";
option java_multiple_files = true;
option java_outer_classname = "BudgetValidationServiceProto";
option java_package = "com.acme.budgeting.v1";

// Checks budgets against the rules before anything acts on them.
service BudgetValidationService {
  // Validates a budget.
  rpc ValidateBudget(ValidateBudgetRequest) returns (ValidateBudgetResponse);

  // Previews a budget.
  rpc PreviewBudget(PreviewBudgetRequest) returns (PreviewBudgetResponse);

  // Checks a budget.
  rpc CheckBudgetEligibility(CheckBudgetEligibilityRequest) returns (CheckBudgetEligibilityResponse);

  // Normalizes a budget.
  rpc NormalizeBudget(NormalizeBudgetRequest) returns (NormalizeBudgetResponse);

  // Scores a budget.
  rpc ScoreBudget(ScoreBudgetRequest) returns (ScoreBudgetResponse);

  // Lints a budget.
  rpc LintBudgets(LintBudgetsRequest) returns (LintBudgetsResponse);

  // Returns a budget.
  rpc GetBudgetRules(GetBudgetRulesRequest) returns (GetBudgetRulesResponse);
}

// The request of `ValidateBudget`.
message ValidateBudgetRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string budget_id = 2;
  Budget budget = 3;
  ValidateBudgetRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateBudget`.
message ValidateBudgetResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Budget budget = 1;
  ValidateBudgetResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

