// The request of `GetBudgetRules`.
message GetBudgetRulesRequest {
  acme.common.v1.RequestContext context = 1;
  string budget_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetBudgetRules`.
message GetBudgetRulesResponse {
  Budget budget = 1;
  acme.common.v1.OperationResult result = 2;
}
