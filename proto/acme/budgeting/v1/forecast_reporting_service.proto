syntax = "proto3";

package acme.budgeting.v1;

import "acme/budgeting/v1/budgeting.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Budgeting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/budgeting/v1;budgetingv1";
option java_multiple_files = true;
option java_outer_classname = "ForecastReportingServiceProto";
option java_package = "com.acme.budgeting.v1";

// Builds and schedules reports about forecasts.
service ForecastReportingService {
  // Generates a forecast.
  rpc GenerateForecastReport(GenerateForecastReportRequest) returns (GenerateForecastReportResponse);

  // Returns a forecast.
  rpc FetchForecastReport(FetchForecastReportRequest) returns (FetchForecastReportResponse);

  // Schedules a forecast.
  rpc ScheduleForecastReport(ScheduleForecastReportRequest) returns (ScheduleForecastReportResponse);

  // Lists forecasts a page at a time.
  rpc ListForecastReports(ListForecastReportsRequest) returns (ListForecastReportsResponse);

  // Shares a forecast.
  rpc ShareForecastReport(ShareForecastReportRequest) returns (ShareForecastReportResponse);

  // Counts forecasts by status.
  rpc CountForecastTotals(CountForecastTotalsRequest) returns (CountForecastTotalsResponse);
}

// The request of `GenerateForecastReport`.
message GenerateForecastReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string forecast_id = 2;
  GenerateForecastReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateForecastReport`.
message GenerateForecastReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchForecastReport`.
message FetchForecastReportRequest {
  acme.common.v1.RequestContext context = 1;
  string forecast_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchForecastReport`.
message FetchForecastReportResponse {
  Forecast forecast = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleForecastReport`.
message ScheduleForecastReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string forecast_id = 2;
  ScheduleForecastReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleForecastReport`.
message ScheduleForecastReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListForecastReports`.
message ListForecastReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ForecastStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListForecastReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListForecastReports`.
message ListForecastReportsResponse {
  repeated Forecast forecasts = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareForecastReport`.
message ShareForecastReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string forecast_id = 2;
  ShareForecastReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareForecastReport`.
message ShareForecastReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Forecast forecast = 1;
  ShareForecastReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountForecastTotals`.
message CountForecastTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ForecastStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountForecastTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountForecastTotals`.
message CountForecastTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}
