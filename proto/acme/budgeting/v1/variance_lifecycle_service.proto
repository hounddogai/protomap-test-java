syntax = "proto3";

package acme.budgeting.v1;

import "acme/budgeting/v1/budgeting.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Budgeting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/budgeting/v1;budgetingv1";
option java_multiple_files = true;
option java_outer_classname = "VarianceLifecycleServiceProto";
option java_package = "com.acme.budgeting.v1";

// Moves a variance between the states of its lifecycle.
service VarianceLifecycleService {
  // Activates a variance.
  rpc ActivateVariance(ActivateVarianceRequest) returns (ActivateVarianceResponse);

  // Suspends a variance.
  rpc SuspendVariance(SuspendVarianceRequest) returns (SuspendVarianceResponse);

  // Terminates a variance.
  rpc TerminateVariance(TerminateVarianceRequest) returns (TerminateVarianceResponse);

  // Renews a variance.
  rpc RenewVariance(RenewVarianceRequest) returns (RenewVarianceResponse);

  // Expires a variance.
  rpc ExpireVariance(ExpireVarianceRequest) returns (ExpireVarianceResponse);

  // Returns a variance.
  rpc GetVarianceLifecycle(GetVarianceLifecycleRequest) returns (GetVarianceLifecycleResponse);

  // Schedules a variance.
  rpc ScheduleVarianceExpiry(ScheduleVarianceExpiryRequest) returns (ScheduleVarianceExpiryResponse);
}

// The request of `ActivateVariance`.
message ActivateVarianceRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string variance_id = 2;
  ActivateVarianceRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateVariance`.
message ActivateVarianceResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Variance variance = 1;
  ActivateVarianceResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

