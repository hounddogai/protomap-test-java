syntax = "proto3";

package acme.budgeting.v1;

import "acme/budgeting/v1/budgeting.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Budgeting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/budgeting/v1;budgetingv1";
option java_multiple_files = true;
option java_outer_classname = "ForecastApprovalServiceProto";
option java_package = "com.acme.budgeting.v1";

// Routes forecasts through approval, with escalation and delegation.
service ForecastApprovalService {
  // Submits a forecast.
  rpc SubmitForecast(SubmitForecastRequest) returns (SubmitForecastResponse);

  // Approves a forecast.
  rpc ApproveForecast(ApproveForecastRequest) returns (ApproveForecastResponse);

  // Rejects a forecast.
  rpc RejectForecast(RejectForecastRequest) returns (RejectForecastResponse);

  // Lists forecasts a page at a time.
  rpc ListPendingForecasts(ListPendingForecastsRequest) returns (ListPendingForecastsResponse);

  // Delegates a forecast.
  rpc DelegateForecastApproval(DelegateForecastApprovalRequest) returns (DelegateForecastApprovalResponse);

  // Recalls a forecast.
  rpc RecallForecast(RecallForecastRequest) returns (RecallForecastResponse);

  // Returns a forecast.
  rpc GetForecastApprovalStatus(GetForecastApprovalStatusRequest) returns (GetForecastApprovalStatusResponse);

  // Comments a forecast.
  rpc CommentForecastApproval(CommentForecastApprovalRequest) returns (CommentForecastApprovalResponse);
}

// The request of `SubmitForecast`.
message SubmitForecastRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string forecast_id = 2;
  Forecast forecast = 3;
  SubmitForecastRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitForecast`.
message SubmitForecastResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Forecast forecast = 1;
  SubmitForecastResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

