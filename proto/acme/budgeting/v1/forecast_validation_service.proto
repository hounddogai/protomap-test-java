syntax = "proto3";

package acme.budgeting.v1;

import "acme/budgeting/v1/budgeting.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Budgeting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/budgeting/v1;budgetingv1";
option java_multiple_files = true;
option java_outer_classname = "ForecastValidationServiceProto";
option java_package = "com.acme.budgeting.v1";

// Checks forecasts against the rules before anything acts on them.
service ForecastValidationService {
  // Validates a forecast.
  rpc ValidateForecast(ValidateForecastRequest) returns (ValidateForecastResponse);

  // Previews a forecast.
  rpc PreviewForecast(PreviewForecastRequest) returns (PreviewForecastResponse);

  // Checks a forecast.
  rpc CheckForecastEligibility(CheckForecastEligibilityRequest) returns (CheckForecastEligibilityResponse);

  // Normalizes a forecast.
  rpc NormalizeForecast(NormalizeForecastRequest) returns (NormalizeForecastResponse);

  // Explains a forecast.
  rpc ExplainForecastDecision(ExplainForecastDecisionRequest) returns (ExplainForecastDecisionResponse);

  // Scores a forecast.
  rpc ScoreForecast(ScoreForecastRequest) returns (ScoreForecastResponse);
}

// The request of `ValidateForecast`.
message ValidateForecastRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string forecast_id = 2;
  Forecast forecast = 3;
  ValidateForecastRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateForecast`.
message ValidateForecastResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Forecast forecast = 1;
  ValidateForecastResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

