syntax = "proto3";

package acme.budgeting.v1;

import "acme/budgeting/v1/budgeting.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Budgeting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/budgeting/v1;budgetingv1";
option java_multiple_files = true;
option java_outer_classname = "VarianceValidationServiceProto";
option java_package = "com.acme.budgeting.v1";

// Checks variances against the rules before anything acts on them.
service VarianceValidationService {
  // Validates a variance.
  rpc ValidateVariance(ValidateVarianceRequest) returns (ValidateVarianceResponse);

  // Previews a variance.
  rpc PreviewVariance(PreviewVarianceRequest) returns (PreviewVarianceResponse);

  // Checks a variance.
  rpc CheckVarianceEligibility(CheckVarianceEligibilityRequest) returns (CheckVarianceEligibilityResponse);

  // Explains a variance.
  rpc ExplainVarianceDecision(ExplainVarianceDecisionRequest) returns (ExplainVarianceDecisionResponse);

  // Scores a variance.
  rpc ScoreVariance(ScoreVarianceRequest) returns (ScoreVarianceResponse);

  // Returns a variance.
  rpc GetVarianceRules(GetVarianceRulesRequest) returns (GetVarianceRulesResponse);
}

// The request of `ValidateVariance`.
message ValidateVarianceRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string variance_id = 2;
  Variance variance = 3;
  ValidateVarianceRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateVariance`.
message ValidateVarianceResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Variance variance = 1;
  ValidateVarianceResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

