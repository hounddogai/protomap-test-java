syntax = "proto3";

package acme.budgeting.v1;

import "acme/budgeting/v1/budgeting.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Budgeting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/budgeting/v1;budgetingv1";
option java_multiple_files = true;
option java_outer_classname = "BudgetLineApprovalServiceProto";
option java_package = "com.acme.budgeting.v1";

// Routes budget lines through approval, with escalation and delegation.
service BudgetLineApprovalService {
  // Submits a budget line.
  rpc SubmitBudgetLine(SubmitBudgetLineRequest) returns (SubmitBudgetLineResponse);

  // Approves a budget line.
  rpc ApproveBudgetLine(ApproveBudgetLineRequest) returns (ApproveBudgetLineResponse);

  // Rejects a budget line.
  rpc RejectBudgetLine(RejectBudgetLineRequest) returns (RejectBudgetLineResponse);

  // Escalates a budget line.
  rpc EscalateBudgetLine(EscalateBudgetLineRequest) returns (EscalateBudgetLineResponse);

  // Lists budget lines a page at a time.
  rpc ListPendingBudgetLines(ListPendingBudgetLinesRequest) returns (ListPendingBudgetLinesResponse);

  // Delegates a budget line.
  rpc DelegateBudgetLineApproval(DelegateBudgetLineApprovalRequest) returns (DelegateBudgetLineApprovalResponse);

  // Recalls a budget line.
  rpc RecallBudgetLine(RecallBudgetLineRequest) returns (RecallBudgetLineResponse);

  // Returns a budget line.
  rpc GetBudgetLineApprovalStatus(GetBudgetLineApprovalStatusRequest) returns (GetBudgetLineApprovalStatusResponse);

  // Comments a budget line.
  rpc CommentBudgetLineApproval(CommentBudgetLineApprovalRequest) returns (CommentBudgetLineApprovalResponse);
}

// The request of `SubmitBudgetLine`.
message SubmitBudgetLineRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string budget_line_id = 2;
  BudgetLine budget_line = 3;
  SubmitBudgetLineRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitBudgetLine`.
message SubmitBudgetLineResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  BudgetLine budget_line = 1;
  SubmitBudgetLineResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

