syntax = "proto3";

package acme.budgeting.v1;

import "acme/budgeting/v1/budgeting.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Budgeting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/budgeting/v1;budgetingv1";
option java_multiple_files = true;
option java_outer_classname = "BudgetLineLifecycleServiceProto";
option java_package = "com.acme.budgeting.v1";

// Moves a budget line between the states of its lifecycle.
service BudgetLineLifecycleService {
  // Activates a budget line.
  rpc ActivateBudgetLine(ActivateBudgetLineRequest) returns (ActivateBudgetLineResponse);

  // Suspends a budget line.
  rpc SuspendBudgetLine(SuspendBudgetLineRequest) returns (SuspendBudgetLineResponse);

  // Reinstates a budget line.
  rpc ReinstateBudgetLine(ReinstateBudgetLineRequest) returns (ReinstateBudgetLineResponse);

  // Terminates a budget line.
  rpc TerminateBudgetLine(TerminateBudgetLineRequest) returns (TerminateBudgetLineResponse);

  // Expires a budget line.
  rpc ExpireBudgetLine(ExpireBudgetLineRequest) returns (ExpireBudgetLineResponse);

  // Returns a budget line.
  rpc GetBudgetLineLifecycle(GetBudgetLineLifecycleRequest) returns (GetBudgetLineLifecycleResponse);

  // Schedules a budget line.
  rpc ScheduleBudgetLineExpiry(ScheduleBudgetLineExpiryRequest) returns (ScheduleBudgetLineExpiryResponse);
}

// The request of `ActivateBudgetLine`.
message ActivateBudgetLineRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string budget_line_id = 2;
  ActivateBudgetLineRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateBudgetLine`.
message ActivateBudgetLineResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  BudgetLine budget_line = 1;
  ActivateBudgetLineResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

