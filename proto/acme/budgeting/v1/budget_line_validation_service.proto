syntax = "proto3";

package acme.budgeting.v1;

import "acme/budgeting/v1/budgeting.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Budgeting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/budgeting/v1;budgetingv1";
option java_multiple_files = true;
option java_outer_classname = "BudgetLineValidationServiceProto";
option java_package = "com.acme.budgeting.v1";

// Checks budget lines against the rules before anything acts on them.
service BudgetLineValidationService {
  // Validates a budget line.
  rpc ValidateBudgetLine(ValidateBudgetLineRequest) returns (ValidateBudgetLineResponse);

  // Previews a budget line.
  rpc PreviewBudgetLine(PreviewBudgetLineRequest) returns (PreviewBudgetLineResponse);

  // Checks a budget line.
  rpc CheckBudgetLineEligibility(CheckBudgetLineEligibilityRequest) returns (CheckBudgetLineEligibilityResponse);

  // Normalizes a budget line.
  rpc NormalizeBudgetLine(NormalizeBudgetLineRequest) returns (NormalizeBudgetLineResponse);

  // Explains a budget line.
  rpc ExplainBudgetLineDecision(ExplainBudgetLineDecisionRequest) returns (ExplainBudgetLineDecisionResponse);

  // Scores a budget line.
  rpc ScoreBudgetLine(ScoreBudgetLineRequest) returns (ScoreBudgetLineResponse);
}

// The request of `ValidateBudgetLine`.
message ValidateBudgetLineRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string budget_line_id = 2;
  BudgetLine budget_line = 3;
  ValidateBudgetLineRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateBudgetLine`.
message ValidateBudgetLineResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  BudgetLine budget_line = 1;
  ValidateBudgetLineResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

