  acme.common.v1.OperationResult result = 3;
}

// The request of `GetVarianceSyncState`.
message GetVarianceSyncStateRequest {
  acme.common.v1.RequestContext context = 1;
  string variance_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetVarianceSyncState`.
message GetVarianceSyncStateResponse {
  Variance variance = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ListVarianceConflicts`.
message ListVarianceConflictsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated VarianceStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListVarianceConflictsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListVarianceConflicts`.
message ListVarianceConflictsResponse {
  repeated Variance variances = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}
