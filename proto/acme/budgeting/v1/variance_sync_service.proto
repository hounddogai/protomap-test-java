syntax = "proto3";

package acme.budgeting.v1;

import "acme/budgeting/v1/budgeting.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Budgeting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/budgeting/v1;budgetingv1";
option java_multiple_files = true;
option java_outer_classname = "VarianceSyncServiceProto";
option java_package = "com.acme.budgeting.v1";

// Keeps variances in step with the systems of record in other regions.
service VarianceSyncService {
  // Syncs a variance.
  rpc SyncVariances(SyncVariancesRequest) returns (SyncVariancesResponse);

  // Pushs a variance.
  rpc PushVariance(PushVarianceRequest) returns (PushVarianceResponse);

  // Pulls a variance.
  rpc PullVariances(PullVariancesRequest) returns (PullVariancesResponse);

  // Reconciles a variance.
  rpc ReconcileVariances(ReconcileVariancesRequest) returns (ReconcileVariancesResponse);

  // Exchanges changes of variances with a peer.
  rpc StreamVarianceChanges(stream StreamVarianceChangesRequest) returns (stream StreamVarianceChangesResponse);

  // Resolves a variance.
  rpc ResolveVarianceConflict(ResolveVarianceConflictRequest) returns (ResolveVarianceConflictResponse);

  // Returns a variance.
  rpc GetVarianceSyncState(GetVarianceSyncStateRequest) returns (GetVarianceSyncStateResponse);

  // Lists variances a page at a time.
  rpc ListVarianceConflicts(ListVarianceConflictsRequest) returns (ListVarianceConflictsResponse);
}

// The request of `SyncVariances`.
message SyncVariancesRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string variance_id = 2;
  Variance variance = 3;
  SyncVariancesRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SyncVariances`.
message SyncVariancesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Variance variance = 1;
  SyncVariancesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PushVariance`.
message PushVarianceRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string variance_id = 2;
  Variance variance = 3;
  PushVarianceRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `PushVariance`.
message PushVarianceResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Variance variance = 1;
  PushVarianceResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PullVariances`.
message PullVariancesRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string variance_id = 2;
  Variance variance = 3;
  PullVariancesRequest.Details details = 4;
