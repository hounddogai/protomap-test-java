syntax = "proto3";

package acme.budgeting.v1;

import "acme/budgeting/v1/budgeting.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Budgeting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/budgeting/v1;budgetingv1";
option java_multiple_files = true;
option java_outer_classname = "BudgetApprovalServiceProto";
option java_package = "com.acme.budgeting.v1";

// Routes budgets through approval, with escalation and delegation.
service BudgetApprovalService {
  // Submits a budget.
  rpc SubmitBudget(SubmitBudgetRequest) returns (SubmitBudgetResponse);

  // Approves a budget.
  rpc ApproveBudget(ApproveBudgetRequest) returns (ApproveBudgetResponse);

  // Rejects a budget.
  rpc RejectBudget(RejectBudgetRequest) returns (RejectBudgetResponse);

  // Escalates a budget.
  rpc EscalateBudget(EscalateBudgetRequest) returns (EscalateBudgetResponse);

  // Lists budgets a page at a time.
  rpc ListPendingBudgets(ListPendingBudgetsRequest) returns (ListPendingBudgetsResponse);

  // Delegates a budget.
  rpc DelegateBudgetApproval(DelegateBudgetApprovalRequest) returns (DelegateBudgetApprovalResponse);

  // Recalls a budget.
  rpc RecallBudget(RecallBudgetRequest) returns (RecallBudgetResponse);

  // Returns a budget.
  rpc GetBudgetApprovalStatus(GetBudgetApprovalStatusRequest) returns (GetBudgetApprovalStatusResponse);

  // Comments a budget.
  rpc CommentBudgetApproval(CommentBudgetApprovalRequest) returns (CommentBudgetApprovalResponse);
}

// The request of `SubmitBudget`.
message SubmitBudgetRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string budget_id = 2;
  Budget budget = 3;
  SubmitBudgetRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitBudget`.
message SubmitBudgetResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Budget budget = 1;
  SubmitBudgetResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

