syntax = "proto3";

package acme.budgeting.v1;

import "acme/budgeting/v1/budgeting.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Budgeting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/budgeting/v1;budgetingv1";
option java_multiple_files = true;
option java_outer_classname = "ForecastWorkflowServiceProto";
option java_package = "com.acme.budgeting.v1";

// Runs the long-lived workflow that takes a forecast from start to finish.
service ForecastWorkflowService {
  // Starts a forecast.
  rpc StartForecastWorkflow(StartForecastWorkflowRequest) returns (StartForecastWorkflowResponse);

  // Advances a forecast.
  rpc AdvanceForecastWorkflow(AdvanceForecastWorkflowRequest) returns (AdvanceForecastWorkflowResponse);

  // Cancels a forecast.
  rpc CancelForecastWorkflow(CancelForecastWorkflowRequest) returns (CancelForecastWorkflowResponse);

  // Retrys a forecast.
  rpc RetryForecastWorkflow(RetryForecastWorkflowRequest) returns (RetryForecastWorkflowResponse);

  // Pauses a forecast.
  rpc PauseForecastWorkflow(PauseForecastWorkflowRequest) returns (PauseForecastWorkflowResponse);

  // Resumes a forecast.
  rpc ResumeForecastWorkflow(ResumeForecastWorkflowRequest) returns (ResumeForecastWorkflowResponse);

  // Returns a forecast.
  rpc InspectForecastWorkflow(InspectForecastWorkflowRequest) returns (InspectForecastWorkflowResponse);

  // Lists forecasts a page at a time.
  rpc ListForecastWorkflows(ListForecastWorkflowsRequest) returns (ListForecastWorkflowsResponse);
}

// The request of `StartForecastWorkflow`.
message StartForecastWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string forecast_id = 2;
  Forecast forecast = 3;
  StartForecastWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartForecastWorkflow`.
message StartForecastWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Forecast forecast = 1;
  StartForecastWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

