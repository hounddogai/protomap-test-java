syntax = "proto3";

package acme.budgeting.v1;

import "acme/budgeting/v1/budgeting.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Budgeting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/budgeting/v1;budgetingv1";
option java_multiple_files = true;
option java_outer_classname = "VarianceReportingServiceProto";
option java_package = "com.acme.budgeting.v1";

// Builds and schedules reports about variances.
service VarianceReportingService {
  // Generates a variance.
  rpc GenerateVarianceReport(GenerateVarianceReportRequest) returns (GenerateVarianceReportResponse);

  // Returns a variance.
  rpc FetchVarianceReport(FetchVarianceReportRequest) returns (FetchVarianceReportResponse);

  // Schedules a variance.
  rpc ScheduleVarianceReport(ScheduleVarianceReportRequest) returns (ScheduleVarianceReportResponse);

  // Streams the changes of variances as they happen.
  rpc StreamVarianceMetrics(StreamVarianceMetricsRequest) returns (stream StreamVarianceMetricsResponse);

  // Lists variances a page at a time.
  rpc ListVarianceReports(ListVarianceReportsRequest) returns (ListVarianceReportsResponse);

  // Shares a variance.
  rpc ShareVarianceReport(ShareVarianceReportRequest) returns (ShareVarianceReportResponse);

  // Counts variances by status.
  rpc CountVarianceTotals(CountVarianceTotalsRequest) returns (CountVarianceTotalsResponse);

  // Deletes a variance.
  rpc DeleteVarianceReport(DeleteVarianceReportRequest) returns (DeleteVarianceReportResponse);
}

// The request of `GenerateVarianceReport`.
message GenerateVarianceReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string variance_id = 2;
  GenerateVarianceReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateVarianceReport`.
message GenerateVarianceReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchVarianceReport`.
message FetchVarianceReportRequest {
  acme.common.v1.RequestContext context = 1;
  string variance_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchVarianceReport`.
message FetchVarianceReportResponse {
  Variance variance = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleVarianceReport`.
message ScheduleVarianceReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string variance_id = 2;
  ScheduleVarianceReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleVarianceReport`.
message ScheduleVarianceReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamVarianceMetrics`.
message StreamVarianceMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated VarianceStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamVarianceMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamVarianceMetrics`.
message StreamVarianceMetricsResponse {
  Variance variance = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListVarianceReports`.
message ListVarianceReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated VarianceStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListVarianceReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListVarianceReports`.
message ListVarianceReportsResponse {
  repeated Variance variances = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareVarianceReport`.
message ShareVarianceReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string variance_id = 2;
  ShareVarianceReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareVarianceReport`.
message ShareVarianceReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Variance variance = 1;
  ShareVarianceReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountVarianceTotals`.
message CountVarianceTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated VarianceStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountVarianceTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountVarianceTotals`.
message CountVarianceTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteVarianceReport`.
message DeleteVarianceReportRequest {
  acme.common.v1.RequestContext context = 1;
  string variance_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteVarianceReport`.
message DeleteVarianceReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
