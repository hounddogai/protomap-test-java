syntax = "proto3";

package acme.budgeting.v1;

import "acme/budgeting/v1/budgeting.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Budgeting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/budgeting/v1;budgetingv1";
option java_multiple_files = true;
option java_outer_classname = "ForecastCalculationServiceProto";
option java_package = "com.acme.budgeting.v1";

// Computes the figures of a forecast, such as totals, taxes, and estimates.
service ForecastCalculationService {
  // Calculates a forecast.
  rpc CalculateForecast(CalculateForecastRequest) returns (CalculateForecastResponse);

  // Estimates a forecast.
  rpc EstimateForecast(EstimateForecastRequest) returns (EstimateForecastResponse);

  // Quotes a forecast.
  rpc QuoteForecast(QuoteForecastRequest) returns (QuoteForecastResponse);

  // Compares a forecast.
  rpc CompareForecastOptions(CompareForecastOptionsRequest) returns (CompareForecastOptionsResponse);

  // Recalculates a forecast.
  rpc RecalculateForecasts(RecalculateForecastsRequest) returns (RecalculateForecastsResponse);

  // Simulates a forecast.
  rpc SimulateForecast(SimulateForecastRequest) returns (SimulateForecastResponse);

  // Explains a forecast.
  rpc ExplainForecastCalculation(ExplainForecastCalculationRequest) returns (ExplainForecastCalculationResponse);

  // Returns a forecast.
  rpc GetForecastRates(GetForecastRatesRequest) returns (GetForecastRatesResponse);
}

// The request of `CalculateForecast`.
message CalculateForecastRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string forecast_id = 2;
  Forecast forecast = 3;
  CalculateForecastRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateForecast`.
message CalculateForecastResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateForecastResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Forecast forecast = 1;
  CalculateForecastResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

