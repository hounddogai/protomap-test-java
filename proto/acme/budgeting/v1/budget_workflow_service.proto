syntax = "proto3";

package acme.budgeting.v1;

import "acme/budgeting/v1/budgeting.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Budgeting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/budgeting/v1;budgetingv1";
option java_multiple_files = true;
option java_outer_classname = "BudgetWorkflowServiceProto";
option java_package = "com.acme.budgeting.v1";

// Runs the long-lived workflow that takes a budget from start to finish.
service BudgetWorkflowService {
  // Starts a budget.
  rpc StartBudgetWorkflow(StartBudgetWorkflowRequest) returns (StartBudgetWorkflowResponse);

  // Advances a budget.
  rpc AdvanceBudgetWorkflow(AdvanceBudgetWorkflowRequest) returns (AdvanceBudgetWorkflowResponse);

  // Cancels a budget.
  rpc CancelBudgetWorkflow(CancelBudgetWorkflowRequest) returns (CancelBudgetWorkflowResponse);

  // Retrys a budget.
  rpc RetryBudgetWorkflow(RetryBudgetWorkflowRequest) returns (RetryBudgetWorkflowResponse);

  // Pauses a budget.
  rpc PauseBudgetWorkflow(PauseBudgetWorkflowRequest) returns (PauseBudgetWorkflowResponse);

  // Resumes a budget.
  rpc ResumeBudgetWorkflow(ResumeBudgetWorkflowRequest) returns (ResumeBudgetWorkflowResponse);

  // Returns a budget.
  rpc InspectBudgetWorkflow(InspectBudgetWorkflowRequest) returns (InspectBudgetWorkflowResponse);

  // Lists budgets a page at a time.
  rpc ListBudgetWorkflows(ListBudgetWorkflowsRequest) returns (ListBudgetWorkflowsResponse);

  // Signals a budget.
  rpc SignalBudgetWorkflow(SignalBudgetWorkflowRequest) returns (SignalBudgetWorkflowResponse);
}

// The request of `StartBudgetWorkflow`.
message StartBudgetWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string budget_id = 2;
  Budget budget = 3;
  StartBudgetWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartBudgetWorkflow`.
message StartBudgetWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Budget budget = 1;
  StartBudgetWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

