    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string forecast_id = 2;
  Forecast forecast = 3;
  ReconcileForecastsRequest.Details details = 4;
  string reason = 5;
