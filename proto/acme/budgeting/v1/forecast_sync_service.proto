// The request of `GetForecastSyncState`.
message GetForecastSyncStateRequest {
  acme.common.v1.RequestContext context = 1;
  string forecast_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetForecastSyncState`.
message GetForecastSyncStateResponse {
  Forecast forecast = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ListForecastConflicts`.
message ListForecastConflictsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ForecastStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListForecastConflictsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListForecastConflicts`.
message ListForecastConflictsResponse {
  repeated Forecast forecasts = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}
