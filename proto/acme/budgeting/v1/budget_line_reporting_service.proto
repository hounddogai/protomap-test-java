syntax = "proto3";

package acme.budgeting.v1;

import "acme/budgeting/v1/budgeting.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Budgeting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/budgeting/v1;budgetingv1";
option java_multiple_files = true;
option java_outer_classname = "BudgetLineReportingServiceProto";
option java_package = "com.acme.budgeting.v1";

// Builds and schedules reports about budget lines.
service BudgetLineReportingService {
  // Generates a budget line.
  rpc GenerateBudgetLineReport(GenerateBudgetLineReportRequest) returns (GenerateBudgetLineReportResponse);

  // Returns a budget line.
  rpc FetchBudgetLineReport(FetchBudgetLineReportRequest) returns (FetchBudgetLineReportResponse);

  // Schedules a budget line.
  rpc ScheduleBudgetLineReport(ScheduleBudgetLineReportRequest) returns (ScheduleBudgetLineReportResponse);

  // Streams the changes of budget lines as they happen.
  rpc StreamBudgetLineMetrics(StreamBudgetLineMetricsRequest) returns (stream StreamBudgetLineMetricsResponse);

  // Lists budget lines a page at a time.
  rpc ListBudgetLineReports(ListBudgetLineReportsRequest) returns (ListBudgetLineReportsResponse);

  // Shares a budget line.
  rpc ShareBudgetLineReport(ShareBudgetLineReportRequest) returns (ShareBudgetLineReportResponse);

  // Counts budget lines by status.
  rpc CountBudgetLineTotals(CountBudgetLineTotalsRequest) returns (CountBudgetLineTotalsResponse);

  // Deletes a budget line.
  rpc DeleteBudgetLineReport(DeleteBudgetLineReportRequest) returns (DeleteBudgetLineReportResponse);
}

// The request of `GenerateBudgetLineReport`.
message GenerateBudgetLineReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string budget_line_id = 2;
  GenerateBudgetLineReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateBudgetLineReport`.
message GenerateBudgetLineReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchBudgetLineReport`.
message FetchBudgetLineReportRequest {
  acme.common.v1.RequestContext context = 1;
  string budget_line_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchBudgetLineReport`.
message FetchBudgetLineReportResponse {
  BudgetLine budget_line = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleBudgetLineReport`.
message ScheduleBudgetLineReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string budget_line_id = 2;
  ScheduleBudgetLineReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleBudgetLineReport`.
message ScheduleBudgetLineReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamBudgetLineMetrics`.
message StreamBudgetLineMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated BudgetLineStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamBudgetLineMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamBudgetLineMetrics`.
message StreamBudgetLineMetricsResponse {
  BudgetLine budget_line = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListBudgetLineReports`.
message ListBudgetLineReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated BudgetLineStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListBudgetLineReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListBudgetLineReports`.
message ListBudgetLineReportsResponse {
  repeated BudgetLine budget_lines = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareBudgetLineReport`.
message ShareBudgetLineReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string budget_line_id = 2;
  ShareBudgetLineReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareBudgetLineReport`.
message ShareBudgetLineReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  BudgetLine budget_line = 1;
  ShareBudgetLineReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountBudgetLineTotals`.
message CountBudgetLineTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated BudgetLineStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountBudgetLineTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountBudgetLineTotals`.
message CountBudgetLineTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteBudgetLineReport`.
message DeleteBudgetLineReportRequest {
  acme.common.v1.RequestContext context = 1;
  string budget_line_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteBudgetLineReport`.
message DeleteBudgetLineReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
