syntax = "proto3";

package acme.budgeting.v1;

import "acme/budgeting/v1/budgeting.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Budgeting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/budgeting/v1;budgetingv1";
option java_multiple_files = true;
option java_outer_classname = "ForecastLifecycleServiceProto";
option java_package = "com.acme.budgeting.v1";

// Moves a forecast between the states of its lifecycle.
service ForecastLifecycleService {
  // Activates a forecast.
  rpc ActivateForecast(ActivateForecastRequest) returns (ActivateForecastResponse);

  // Suspends a forecast.
  rpc SuspendForecast(SuspendForecastRequest) returns (SuspendForecastResponse);

  // Reinstates a forecast.
  rpc ReinstateForecast(ReinstateForecastRequest) returns (ReinstateForecastResponse);

  // Terminates a forecast.
  rpc TerminateForecast(TerminateForecastRequest) returns (TerminateForecastResponse);

  // Renews a forecast.
  rpc RenewForecast(RenewForecastRequest) returns (RenewForecastResponse);

  // Expires a forecast.
  rpc ExpireForecast(ExpireForecastRequest) returns (ExpireForecastResponse);

  // Returns a forecast.
  rpc GetForecastLifecycle(GetForecastLifecycleRequest) returns (GetForecastLifecycleResponse);

  // Schedules a forecast.
  rpc ScheduleForecastExpiry(ScheduleForecastExpiryRequest) returns (ScheduleForecastExpiryResponse);
}

// The request of `ActivateForecast`.
message ActivateForecastRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string forecast_id = 2;
  ActivateForecastRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateForecast`.
message ActivateForecastResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Forecast forecast = 1;
  ActivateForecastResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

