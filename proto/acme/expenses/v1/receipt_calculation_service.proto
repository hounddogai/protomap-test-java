syntax = "proto3";

package acme.expenses.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/expenses/v1/expenses.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Expenses.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/expenses/v1;expensesv1";
option java_multiple_files = true;
option java_outer_classname = "ReceiptCalculationServiceProto";
option java_package = "com.acme.expenses.v1";

// Computes the figures of a receipt, such as totals, taxes, and estimates.
service ReceiptCalculationService {
  // Calculates a receipt.
  rpc CalculateReceipt(CalculateReceiptRequest) returns (CalculateReceiptResponse);

  // Estimates a receipt.
  rpc EstimateReceipt(EstimateReceiptRequest) returns (EstimateReceiptResponse);

  // Compares a receipt.
  rpc CompareReceiptOptions(CompareReceiptOptionsRequest) returns (CompareReceiptOptionsResponse);

  // Recalculates a receipt.
  rpc RecalculateReceipts(RecalculateReceiptsRequest) returns (RecalculateReceiptsResponse);

  // Simulates a receipt.
  rpc SimulateReceipt(SimulateReceiptRequest) returns (SimulateReceiptResponse);

  // Explains a receipt.
  rpc ExplainReceiptCalculation(ExplainReceiptCalculationRequest) returns (ExplainReceiptCalculationResponse);

  // Returns a receipt.
  rpc GetReceiptRates(GetReceiptRatesRequest) returns (GetReceiptRatesResponse);
}

// The request of `CalculateReceipt`.
message CalculateReceiptRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string receipt_id = 2;
  Receipt receipt = 3;
  CalculateReceiptRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateReceipt`.
message CalculateReceiptResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateReceiptResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Receipt receipt = 1;
  CalculateReceiptResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

