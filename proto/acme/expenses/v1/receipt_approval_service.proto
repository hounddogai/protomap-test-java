syntax = "proto3";

package acme.expenses.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/expenses/v1/expenses.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Expenses.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/expenses/v1;expensesv1";
option java_multiple_files = true;
option java_outer_classname = "ReceiptApprovalServiceProto";
option java_package = "com.acme.expenses.v1";

// Routes receipts through approval, with escalation and delegation.
service ReceiptApprovalService {
  // Submits a receipt.
  rpc SubmitReceipt(SubmitReceiptRequest) returns (SubmitReceiptResponse);

  // Approves a receipt.
  rpc ApproveReceipt(ApproveReceiptRequest) returns (ApproveReceiptResponse);

  // Rejects a receipt.
  rpc RejectReceipt(RejectReceiptRequest) returns (RejectReceiptResponse);

  // Escalates a receipt.
  rpc EscalateReceipt(EscalateReceiptRequest) returns (EscalateReceiptResponse);

  // Lists receipts a page at a time.
  rpc ListPendingReceipts(ListPendingReceiptsRequest) returns (ListPendingReceiptsResponse);

  // Delegates a receipt.
  rpc DelegateReceiptApproval(DelegateReceiptApprovalRequest) returns (DelegateReceiptApprovalResponse);

  // Returns a receipt.
  rpc GetReceiptApprovalStatus(GetReceiptApprovalStatusRequest) returns (GetReceiptApprovalStatusResponse);

  // Comments a receipt.
  rpc CommentReceiptApproval(CommentReceiptApprovalRequest) returns (CommentReceiptApprovalResponse);
}

// The request of `SubmitReceipt`.
message SubmitReceiptRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string receipt_id = 2;
  Receipt receipt = 3;
  SubmitReceiptRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitReceipt`.
message SubmitReceiptResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Receipt receipt = 1;
  SubmitReceiptResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

