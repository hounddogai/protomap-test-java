option csharp_namespace = "Acme.Expenses.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/expenses/v1;expensesv1";
option java_multiple_files = true;
option java_outer_classname = "MileageClaimLifecycleServiceProto";
option java_package = "com.acme.expenses.v1";

// Moves a mileage claim between the states of its lifecycle.
service MileageClaimLifecycleService {
  // Activates a mileage claim.
  rpc ActivateMileageClaim(ActivateMileageClaimRequest) returns (ActivateMileageClaimResponse);

  // Suspends a mileage claim.
  rpc SuspendMileageClaim(SuspendMileageClaimRequest) returns (SuspendMileageClaimResponse);

  // Reinstates a mileage claim.
  rpc ReinstateMileageClaim(ReinstateMileageClaimRequest) returns (ReinstateMileageClaimResponse);

  // Terminates a mileage claim.
  rpc TerminateMileageClaim(TerminateMileageClaimRequest) returns (TerminateMileageClaimResponse);

  // Renews a mileage claim.
  rpc RenewMileageClaim(RenewMileageClaimRequest) returns (RenewMileageClaimResponse);

  // Expires a mileage claim.
  rpc ExpireMileageClaim(ExpireMileageClaimRequest) returns (ExpireMileageClaimResponse);

  // Returns a mileage claim.
  rpc GetMileageClaimLifecycle(GetMileageClaimLifecycleRequest) returns (GetMileageClaimLifecycleResponse);

  // Schedules a mileage claim.
  rpc ScheduleMileageClaimExpiry(ScheduleMileageClaimExpiryRequest) returns (ScheduleMileageClaimExpiryResponse);
}

// The request of `ActivateMileageClaim`.
message ActivateMileageClaimRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string mileage_claim_id = 2;
  ActivateMileageClaimRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateMileageClaim`.
message ActivateMileageClaimResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  MileageClaim mileage_claim = 1;
  ActivateMileageClaimResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

