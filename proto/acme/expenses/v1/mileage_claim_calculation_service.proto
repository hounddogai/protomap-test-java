syntax = "proto3";

package acme.expenses.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/expenses/v1/expenses.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Expenses.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/expenses/v1;expensesv1";
option java_multiple_files = true;
option java_outer_classname = "MileageClaimCalculationServiceProto";
option java_package = "com.acme.expenses.v1";

// Computes the figures of a mileage claim, such as totals, taxes, and estimates.
service MileageClaimCalculationService {
  // Calculates a mileage claim.
  rpc CalculateMileageClaim(CalculateMileageClaimRequest) returns (CalculateMileageClaimResponse);

  // Estimates a mileage claim.
  rpc EstimateMileageClaim(EstimateMileageClaimRequest) returns (EstimateMileageClaimResponse);

  // Quotes a mileage claim.
  rpc QuoteMileageClaim(QuoteMileageClaimRequest) returns (QuoteMileageClaimResponse);

  // Compares a mileage claim.
  rpc CompareMileageClaimOptions(CompareMileageClaimOptionsRequest) returns (CompareMileageClaimOptionsResponse);

  // Recalculates a mileage claim.
  rpc RecalculateMileageClaims(RecalculateMileageClaimsRequest) returns (RecalculateMileageClaimsResponse);

  // Explains a mileage claim.
  rpc ExplainMileageClaimCalculation(ExplainMileageClaimCalculationRequest) returns (ExplainMileageClaimCalculationResponse);

  // Returns a mileage claim.
  rpc GetMileageClaimRates(GetMileageClaimRatesRequest) returns (GetMileageClaimRatesResponse);
}

// The request of `CalculateMileageClaim`.
message CalculateMileageClaimRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string mileage_claim_id = 2;
  MileageClaim mileage_claim = 3;
  CalculateMileageClaimRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateMileageClaim`.
message CalculateMileageClaimResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateMileageClaimResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  MileageClaim mileage_claim = 1;
  CalculateMileageClaimResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

