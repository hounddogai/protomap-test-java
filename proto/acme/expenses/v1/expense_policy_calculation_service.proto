syntax = "proto3";

package acme.expenses.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/expenses/v1/expenses.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Expenses.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/expenses/v1;expensesv1";
option java_multiple_files = true;
option java_outer_classname = "ExpensePolicyCalculationServiceProto";
option java_package = "com.acme.expenses.v1";

// Computes the figures of an expense policy, such as totals, taxes, and estimates.
service ExpensePolicyCalculationService {
  // Calculates an expense policy.
  rpc CalculateExpensePolicy(CalculateExpensePolicyRequest) returns (CalculateExpensePolicyResponse);

  // Estimates an expense policy.
  rpc EstimateExpensePolicy(EstimateExpensePolicyRequest) returns (EstimateExpensePolicyResponse);

  // Quotes an expense policy.
  rpc QuoteExpensePolicy(QuoteExpensePolicyRequest) returns (QuoteExpensePolicyResponse);

  // Recalculates an expense policy.
  rpc RecalculateExpensePolicies(RecalculateExpensePoliciesRequest) returns (RecalculateExpensePoliciesResponse);

  // Simulates an expense policy.
  rpc SimulateExpensePolicy(SimulateExpensePolicyRequest) returns (SimulateExpensePolicyResponse);

  // Explains an expense policy.
  rpc ExplainExpensePolicyCalculation(ExplainExpensePolicyCalculationRequest) returns (ExplainExpensePolicyCalculationResponse);

  // Returns an expense policy.
  rpc GetExpensePolicyRates(GetExpensePolicyRatesRequest) returns (GetExpensePolicyRatesResponse);
}

// The request of `CalculateExpensePolicy`.
message CalculateExpensePolicyRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string expense_policy_id = 2;
  ExpensePolicy expense_policy = 3;
  CalculateExpensePolicyRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateExpensePolicy`.
message CalculateExpensePolicyResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateExpensePolicyResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  ExpensePolicy expense_policy = 1;
  CalculateExpensePolicyResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

