syntax = "proto3";

package acme.expenses.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/expenses/v1/expenses.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Expenses.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/expenses/v1;expensesv1";
option java_multiple_files = true;
option java_outer_classname = "ExpensePolicySyncServiceProto";
option java_package = "com.acme.expenses.v1";

// Keeps expense policies in step with the systems of record in other regions.
service ExpensePolicySyncService {
  // Syncs an expense policy.
  rpc SyncExpensePolicies(SyncExpensePoliciesRequest) returns (SyncExpensePoliciesResponse);

  // Pushs an expense policy.
  rpc PushExpensePolicy(PushExpensePolicyRequest) returns (PushExpensePolicyResponse);

  // Pulls an expense policy.
  rpc PullExpensePolicies(PullExpensePoliciesRequest) returns (PullExpensePoliciesResponse);

  // Reconciles an expense policy.
  rpc ReconcileExpensePolicies(ReconcileExpensePoliciesRequest) returns (ReconcileExpensePoliciesResponse);

  // Exchanges changes of expense policies with a peer.
  rpc StreamExpensePolicyChanges(stream StreamExpensePolicyChangesRequest) returns (stream StreamExpensePolicyChangesResponse);

  // Resolves an expense policy.
  rpc ResolveExpensePolicyConflict(ResolveExpensePolicyConflictRequest) returns (ResolveExpensePolicyConflictResponse);

  // Returns an expense policy.
  rpc GetExpensePolicySyncState(GetExpensePolicySyncStateRequest) returns (GetExpensePolicySyncStateResponse);

  // Lists expense policies a page at a time.
  rpc ListExpensePolicyConflicts(ListExpensePolicyConflictsRequest) returns (ListExpensePolicyConflictsResponse);
}

// The request of `SyncExpensePolicies`.
message SyncExpensePoliciesRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string expense_policy_id = 2;
  ExpensePolicy expense_policy = 3;
  SyncExpensePoliciesRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SyncExpensePolicies`.
message SyncExpensePoliciesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ExpensePolicy expense_policy = 1;
  SyncExpensePoliciesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

