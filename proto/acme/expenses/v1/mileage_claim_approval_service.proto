syntax = "proto3";

package acme.expenses.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/expenses/v1/expenses.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Expenses.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/expenses/v1;expensesv1";
option java_multiple_files = true;
option java_outer_classname = "MileageClaimApprovalServiceProto";
option java_package = "com.acme.expenses.v1";

// Routes mileage claims through approval, with escalation and delegation.
service MileageClaimApprovalService {
  // Submits a mileage claim.
  rpc SubmitMileageClaim(SubmitMileageClaimRequest) returns (SubmitMileageClaimResponse);

  // Approves a mileage claim.
  rpc ApproveMileageClaim(ApproveMileageClaimRequest) returns (ApproveMileageClaimResponse);

  // Rejects a mileage claim.
  rpc RejectMileageClaim(RejectMileageClaimRequest) returns (RejectMileageClaimResponse);

  // Escalates a mileage claim.
  rpc EscalateMileageClaim(EscalateMileageClaimRequest) returns (EscalateMileageClaimResponse);

  // Returns a mileage claim.
  rpc GetMileageClaimApprovalStatus(GetMileageClaimApprovalStatusRequest) returns (GetMileageClaimApprovalStatusResponse);

  // Comments a mileage claim.
  rpc CommentMileageClaimApproval(CommentMileageClaimApprovalRequest) returns (CommentMileageClaimApprovalResponse);
}

// The request of `SubmitMileageClaim`.
message SubmitMileageClaimRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string mileage_claim_id = 2;
  MileageClaim mileage_claim = 3;
  SubmitMileageClaimRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitMileageClaim`.
message SubmitMileageClaimResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  MileageClaim mileage_claim = 1;
  SubmitMileageClaimResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ApproveMileageClaim`.
message ApproveMileageClaimRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
