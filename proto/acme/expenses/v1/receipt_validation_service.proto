syntax = "proto3";

package acme.expenses.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/expenses/v1/expenses.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Expenses.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/expenses/v1;expensesv1";
option java_multiple_files = true;
option java_outer_classname = "ReceiptValidationServiceProto";
option java_package = "com.acme.expenses.v1";

// Checks receipts against the rules before anything acts on them.
service ReceiptValidationService {
  // Validates a receipt.
  rpc ValidateReceipt(ValidateReceiptRequest) returns (ValidateReceiptResponse);

  // Previews a receipt.
  rpc PreviewReceipt(PreviewReceiptRequest) returns (PreviewReceiptResponse);

  // Checks a receipt.
  rpc CheckReceiptEligibility(CheckReceiptEligibilityRequest) returns (CheckReceiptEligibilityResponse);

  // Normalizes a receipt.
  rpc NormalizeReceipt(NormalizeReceiptRequest) returns (NormalizeReceiptResponse);

  // Explains a receipt.
  rpc ExplainReceiptDecision(ExplainReceiptDecisionRequest) returns (ExplainReceiptDecisionResponse);

  // Scores a receipt.
  rpc ScoreReceipt(ScoreReceiptRequest) returns (ScoreReceiptResponse);

  // Lints a receipt.
  rpc LintReceipts(LintReceiptsRequest) returns (LintReceiptsResponse);

  // Returns a receipt.
  rpc GetReceiptRules(GetReceiptRulesRequest) returns (GetReceiptRulesResponse);
}

// The request of `ValidateReceipt`.
message ValidateReceiptRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string receipt_id = 2;
  Receipt receipt = 3;
  ValidateReceiptRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateReceipt`.
message ValidateReceiptResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Receipt receipt = 1;
  ValidateReceiptResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

