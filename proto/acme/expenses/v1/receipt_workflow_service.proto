syntax = "proto3";

package acme.expenses.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/expenses/v1/expenses.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Expenses.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/expenses/v1;expensesv1";
option java_multiple_files = true;
option java_outer_classname = "ReceiptWorkflowServiceProto";
option java_package = "com.acme.expenses.v1";

// Runs the long-lived workflow that takes a receipt from start to finish.
service ReceiptWorkflowService {
  // Starts a receipt.
  rpc StartReceiptWorkflow(StartReceiptWorkflowRequest) returns (StartReceiptWorkflowResponse);

  // Advances a receipt.
  rpc AdvanceReceiptWorkflow(AdvanceReceiptWorkflowRequest) returns (AdvanceReceiptWorkflowResponse);

  // Retrys a receipt.
  rpc RetryReceiptWorkflow(RetryReceiptWorkflowRequest) returns (RetryReceiptWorkflowResponse);

  // Pauses a receipt.
  rpc PauseReceiptWorkflow(PauseReceiptWorkflowRequest) returns (PauseReceiptWorkflowResponse);

  // Returns a receipt.
  rpc InspectReceiptWorkflow(InspectReceiptWorkflowRequest) returns (InspectReceiptWorkflowResponse);

  // Signals a receipt.
  rpc SignalReceiptWorkflow(SignalReceiptWorkflowRequest) returns (SignalReceiptWorkflowResponse);
}

// The request of `StartReceiptWorkflow`.
message StartReceiptWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string receipt_id = 2;
  Receipt receipt = 3;
  StartReceiptWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartReceiptWorkflow`.
message StartReceiptWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Receipt receipt = 1;
  StartReceiptWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

