syntax = "proto3";

package acme.expenses.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/expenses/v1/expenses.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Expenses.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/expenses/v1;expensesv1";
option java_multiple_files = true;
option java_outer_classname = "ExpenseReportValidationServiceProto";
option java_package = "com.acme.expenses.v1";

// Checks expense reports against the rules before anything acts on them.
service ExpenseReportValidationService {
  // Validates an expense report.
  rpc ValidateExpenseReport(ValidateExpenseReportRequest) returns (ValidateExpenseReportResponse);

  // Previews an expense report.
  rpc PreviewExpenseReport(PreviewExpenseReportRequest) returns (PreviewExpenseReportResponse);

  // Checks an expense report.
  rpc CheckExpenseReportEligibility(CheckExpenseReportEligibilityRequest) returns (CheckExpenseReportEligibilityResponse);

  // Explains an expense report.
  rpc ExplainExpenseReportDecision(ExplainExpenseReportDecisionRequest) returns (ExplainExpenseReportDecisionResponse);

  // Scores an expense report.
  rpc ScoreExpenseReport(ScoreExpenseReportRequest) returns (ScoreExpenseReportResponse);

  // Lints an expense report.
  rpc LintExpenseReports(LintExpenseReportsRequest) returns (LintExpenseReportsResponse);

  // Returns an expense report.
  rpc GetExpenseReportRules(GetExpenseReportRulesRequest) returns (GetExpenseReportRulesResponse);
}

// The request of `ValidateExpenseReport`.
message ValidateExpenseReportRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string expense_report_id = 2;
  ExpenseReport expense_report = 3;
  ValidateExpenseReportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateExpenseReport`.
message ValidateExpenseReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ExpenseReport expense_report = 1;
  ValidateExpenseReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

