syntax = "proto3";

package acme.expenses.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/expenses/v1/expenses.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Expenses.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/expenses/v1;expensesv1";
option java_multiple_files = true;
option java_outer_classname = "ReceiptLifecycleServiceProto";
option java_package = "com.acme.expenses.v1";

// Moves a receipt between the states of its lifecycle.
service ReceiptLifecycleService {
  // Activates a receipt.
  rpc ActivateReceipt(ActivateReceiptRequest) returns (ActivateReceiptResponse);

  // Suspends a receipt.
  rpc SuspendReceipt(SuspendReceiptRequest) returns (SuspendReceiptResponse);

  // Reinstates a receipt.
  rpc ReinstateReceipt(ReinstateReceiptRequest) returns (ReinstateReceiptResponse);

  // Terminates a receipt.
  rpc TerminateReceipt(TerminateReceiptRequest) returns (TerminateReceiptResponse);

  // Renews a receipt.
  rpc RenewReceipt(RenewReceiptRequest) returns (RenewReceiptResponse);

  // Expires a receipt.
  rpc ExpireReceipt(ExpireReceiptRequest) returns (ExpireReceiptResponse);

  // Returns a receipt.
  rpc GetReceiptLifecycle(GetReceiptLifecycleRequest) returns (GetReceiptLifecycleResponse);

  // Schedules a receipt.
  rpc ScheduleReceiptExpiry(ScheduleReceiptExpiryRequest) returns (ScheduleReceiptExpiryResponse);
}

// The request of `ActivateReceipt`.
message ActivateReceiptRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string receipt_id = 2;
  ActivateReceiptRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateReceipt`.
message ActivateReceiptResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Receipt receipt = 1;
  ActivateReceiptResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

