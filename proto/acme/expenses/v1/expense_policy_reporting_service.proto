syntax = "proto3";

package acme.expenses.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/expenses/v1/expenses.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Expenses.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/expenses/v1;expensesv1";
option java_multiple_files = true;
option java_outer_classname = "ExpensePolicyReportingServiceProto";
option java_package = "com.acme.expenses.v1";

// Builds and schedules reports about expense policies.
service ExpensePolicyReportingService {
  // Generates an expense policy.
  rpc GenerateExpensePolicyReport(GenerateExpensePolicyReportRequest) returns (GenerateExpensePolicyReportResponse);

  // Returns an expense policy.
  rpc FetchExpensePolicyReport(FetchExpensePolicyReportRequest) returns (FetchExpensePolicyReportResponse);

  // Schedules an expense policy.
  rpc ScheduleExpensePolicyReport(ScheduleExpensePolicyReportRequest) returns (ScheduleExpensePolicyReportResponse);

  // Streams the changes of expense policies as they happen.
  rpc StreamExpensePolicyMetrics(StreamExpensePolicyMetricsRequest) returns (stream StreamExpensePolicyMetricsResponse);

  // Lists expense policies a page at a time.
  rpc ListExpensePolicyReports(ListExpensePolicyReportsRequest) returns (ListExpensePolicyReportsResponse);

  // Counts expense policies by status.
  rpc CountExpensePolicyTotals(CountExpensePolicyTotalsRequest) returns (CountExpensePolicyTotalsResponse);

  // Deletes an expense policy.
  rpc DeleteExpensePolicyReport(DeleteExpensePolicyReportRequest) returns (DeleteExpensePolicyReportResponse);
}

// The request of `GenerateExpensePolicyReport`.
message GenerateExpensePolicyReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string expense_policy_id = 2;
  GenerateExpensePolicyReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateExpensePolicyReport`.
message GenerateExpensePolicyReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchExpensePolicyReport`.
message FetchExpensePolicyReportRequest {
  acme.common.v1.RequestContext context = 1;
  string expense_policy_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchExpensePolicyReport`.
message FetchExpensePolicyReportResponse {
  ExpensePolicy expense_policy = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleExpensePolicyReport`.
message ScheduleExpensePolicyReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string expense_policy_id = 2;
  ScheduleExpensePolicyReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleExpensePolicyReport`.
message ScheduleExpensePolicyReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamExpensePolicyMetrics`.
message StreamExpensePolicyMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ExpensePolicyStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamExpensePolicyMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamExpensePolicyMetrics`.
message StreamExpensePolicyMetricsResponse {
  ExpensePolicy expense_policy = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListExpensePolicyReports`.
message ListExpensePolicyReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ExpensePolicyStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListExpensePolicyReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListExpensePolicyReports`.
message ListExpensePolicyReportsResponse {
  repeated ExpensePolicy expense_policies = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountExpensePolicyTotals`.
message CountExpensePolicyTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ExpensePolicyStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountExpensePolicyTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountExpensePolicyTotals`.
message CountExpensePolicyTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteExpensePolicyReport`.
message DeleteExpensePolicyReportRequest {
  acme.common.v1.RequestContext context = 1;
  string expense_policy_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteExpensePolicyReport`.
message DeleteExpensePolicyReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
