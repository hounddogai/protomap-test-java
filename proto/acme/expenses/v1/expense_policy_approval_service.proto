syntax = "proto3";

package acme.expenses.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/expenses/v1/expenses.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Expenses.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/expenses/v1;expensesv1";
option java_multiple_files = true;
option java_outer_classname = "ExpensePolicyApprovalServiceProto";
option java_package = "com.acme.expenses.v1";

// Routes expense policies through approval, with escalation and delegation.
service ExpensePolicyApprovalService {
  // Submits an expense policy.
  rpc SubmitExpensePolicy(SubmitExpensePolicyRequest) returns (SubmitExpensePolicyResponse);

  // Approves an expense policy.
  rpc ApproveExpensePolicy(ApproveExpensePolicyRequest) returns (ApproveExpensePolicyResponse);

  // Rejects an expense policy.
  rpc RejectExpensePolicy(RejectExpensePolicyRequest) returns (RejectExpensePolicyResponse);

  // Escalates an expense policy.
  rpc EscalateExpensePolicy(EscalateExpensePolicyRequest) returns (EscalateExpensePolicyResponse);

  // Lists expense policies a page at a time.
  rpc ListPendingExpensePolicies(ListPendingExpensePoliciesRequest) returns (ListPendingExpensePoliciesResponse);

  // Delegates an expense policy.
  rpc DelegateExpensePolicyApproval(DelegateExpensePolicyApprovalRequest) returns (DelegateExpensePolicyApprovalResponse);

  // Recalls an expense policy.
  rpc RecallExpensePolicy(RecallExpensePolicyRequest) returns (RecallExpensePolicyResponse);

  // Comments an expense policy.
  rpc CommentExpensePolicyApproval(CommentExpensePolicyApprovalRequest) returns (CommentExpensePolicyApprovalResponse);
}

// The request of `SubmitExpensePolicy`.
message SubmitExpensePolicyRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string expense_policy_id = 2;
  ExpensePolicy expense_policy = 3;
  SubmitExpensePolicyRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitExpensePolicy`.
message SubmitExpensePolicyResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ExpensePolicy expense_policy = 1;
  SubmitExpensePolicyResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

