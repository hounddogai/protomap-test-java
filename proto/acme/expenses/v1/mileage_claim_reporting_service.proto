syntax = "proto3";

package acme.expenses.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/expenses/v1/expenses.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Expenses.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/expenses/v1;expensesv1";
option java_multiple_files = true;
option java_outer_classname = "MileageClaimReportingServiceProto";
option java_package = "com.acme.expenses.v1";

// Builds and schedules reports about mileage claims.
service MileageClaimReportingService {
  // Generates a mileage claim.
  rpc GenerateMileageClaimReport(GenerateMileageClaimReportRequest) returns (GenerateMileageClaimReportResponse);

  // Returns a mileage claim.
  rpc FetchMileageClaimReport(FetchMileageClaimReportRequest) returns (FetchMileageClaimReportResponse);

  // Streams the changes of mileage claims as they happen.
  rpc StreamMileageClaimMetrics(StreamMileageClaimMetricsRequest) returns (stream StreamMileageClaimMetricsResponse);

  // Lists mileage claims a page at a time.
  rpc ListMileageClaimReports(ListMileageClaimReportsRequest) returns (ListMileageClaimReportsResponse);

  // Shares a mileage claim.
  rpc ShareMileageClaimReport(ShareMileageClaimReportRequest) returns (ShareMileageClaimReportResponse);

  // Counts mileage claims by status.
  rpc CountMileageClaimTotals(CountMileageClaimTotalsRequest) returns (CountMileageClaimTotalsResponse);
}

// The request of `GenerateMileageClaimReport`.
message GenerateMileageClaimReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string mileage_claim_id = 2;
  GenerateMileageClaimReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateMileageClaimReport`.
message GenerateMileageClaimReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchMileageClaimReport`.
message FetchMileageClaimReportRequest {
  acme.common.v1.RequestContext context = 1;
  string mileage_claim_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchMileageClaimReport`.
message FetchMileageClaimReportResponse {
  MileageClaim mileage_claim = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `StreamMileageClaimMetrics`.
message StreamMileageClaimMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated MileageClaimStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamMileageClaimMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamMileageClaimMetrics`.
message StreamMileageClaimMetricsResponse {
  MileageClaim mileage_claim = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListMileageClaimReports`.
message ListMileageClaimReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated MileageClaimStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListMileageClaimReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListMileageClaimReports`.
message ListMileageClaimReportsResponse {
  repeated MileageClaim mileage_claims = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareMileageClaimReport`.
message ShareMileageClaimReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string mileage_claim_id = 2;
  ShareMileageClaimReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareMileageClaimReport`.
message ShareMileageClaimReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  MileageClaim mileage_claim = 1;
  ShareMileageClaimReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountMileageClaimTotals`.
message CountMileageClaimTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated MileageClaimStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountMileageClaimTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountMileageClaimTotals`.
message CountMileageClaimTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}
