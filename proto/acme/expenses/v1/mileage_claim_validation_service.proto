syntax = "proto3";

package acme.expenses.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/expenses/v1/expenses.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Expenses.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/expenses/v1;expensesv1";
option java_multiple_files = true;
option java_outer_classname = "MileageClaimValidationServiceProto";
option java_package = "com.acme.expenses.v1";

// Checks mileage claims against the rules before anything acts on them.
service MileageClaimValidationService {
  // Validates a mileage claim.
  rpc ValidateMileageClaim(ValidateMileageClaimRequest) returns (ValidateMileageClaimResponse);

  // Previews a mileage claim.
  rpc PreviewMileageClaim(PreviewMileageClaimRequest) returns (PreviewMileageClaimResponse);

  // Checks a mileage claim.
  rpc CheckMileageClaimEligibility(CheckMileageClaimEligibilityRequest) returns (CheckMileageClaimEligibilityResponse);

  // Normalizes a mileage claim.
  rpc NormalizeMileageClaim(NormalizeMileageClaimRequest) returns (NormalizeMileageClaimResponse);

  // Scores a mileage claim.
  rpc ScoreMileageClaim(ScoreMileageClaimRequest) returns (ScoreMileageClaimResponse);

  // Lints a mileage claim.
  rpc LintMileageClaims(LintMileageClaimsRequest) returns (LintMileageClaimsResponse);

  // Returns a mileage claim.
  rpc GetMileageClaimRules(GetMileageClaimRulesRequest) returns (GetMileageClaimRulesResponse);
}

// The request of `ValidateMileageClaim`.
message ValidateMileageClaimRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string mileage_claim_id = 2;
  MileageClaim mileage_claim = 3;
  ValidateMileageClaimRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateMileageClaim`.
message ValidateMileageClaimResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  MileageClaim mileage_claim = 1;
  ValidateMileageClaimResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

