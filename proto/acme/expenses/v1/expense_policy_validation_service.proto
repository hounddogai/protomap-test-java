syntax = "proto3";

package acme.expenses.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/expenses/v1/expenses.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Expenses.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/expenses/v1;expensesv1";
option java_multiple_files = true;
option java_outer_classname = "ExpensePolicyValidationServiceProto";
option java_package = "com.acme.expenses.v1";

// Checks expense policies against the rules before anything acts on them.
service ExpensePolicyValidationService {
  // Validates an expense policy.
  rpc ValidateExpensePolicy(ValidateExpensePolicyRequest) returns (ValidateExpensePolicyResponse);

  // Previews an expense policy.
  rpc PreviewExpensePolicy(PreviewExpensePolicyRequest) returns (PreviewExpensePolicyResponse);

  // Checks an expense policy.
  rpc CheckExpensePolicyEligibility(CheckExpensePolicyEligibilityRequest) returns (CheckExpensePolicyEligibilityResponse);

  // Normalizes an expense policy.
  rpc NormalizeExpensePolicy(NormalizeExpensePolicyRequest) returns (NormalizeExpensePolicyResponse);

  // Explains an expense policy.
  rpc ExplainExpensePolicyDecision(ExplainExpensePolicyDecisionRequest) returns (ExplainExpensePolicyDecisionResponse);

  // Scores an expense policy.
  rpc ScoreExpensePolicy(ScoreExpensePolicyRequest) returns (ScoreExpensePolicyResponse);

  // Lints an expense policy.
  rpc LintExpensePolicies(LintExpensePoliciesRequest) returns (LintExpensePoliciesResponse);

  // Returns an expense policy.
  rpc GetExpensePolicyRules(GetExpensePolicyRulesRequest) returns (GetExpensePolicyRulesResponse);
}

// The request of `ValidateExpensePolicy`.
message ValidateExpensePolicyRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string expense_policy_id = 2;
  ExpensePolicy expense_policy = 3;
  ValidateExpensePolicyRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateExpensePolicy`.
message ValidateExpensePolicyResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ExpensePolicy expense_policy = 1;
  ValidateExpensePolicyResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

