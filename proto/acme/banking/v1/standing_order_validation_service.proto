syntax = "proto3";

package acme.banking.v1;

import "acme/banking/v1/banking.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Banking.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/banking/v1;bankingv1";
option java_multiple_files = true;
option java_outer_classname = "StandingOrderValidationServiceProto";
option java_package = "com.acme.banking.v1";

// Checks standing orders against the rules before anything acts on them.
service StandingOrderValidationService {
  // Validates a standing order.
  rpc ValidateStandingOrder(ValidateStandingOrderRequest) returns (ValidateStandingOrderResponse);

  // Previews a standing order.
  rpc PreviewStandingOrder(PreviewStandingOrderRequest) returns (PreviewStandingOrderResponse);

  // Checks a standing order.
  rpc CheckStandingOrderEligibility(CheckStandingOrderEligibilityRequest) returns (CheckStandingOrderEligibilityResponse);

  // Normalizes a standing order.
  rpc NormalizeStandingOrder(NormalizeStandingOrderRequest) returns (NormalizeStandingOrderResponse);

  // Explains a standing order.
  rpc ExplainStandingOrderDecision(ExplainStandingOrderDecisionRequest) returns (ExplainStandingOrderDecisionResponse);

  // Scores a standing order.
  rpc ScoreStandingOrder(ScoreStandingOrderRequest) returns (ScoreStandingOrderResponse);

  // Lints a standing order.
  rpc LintStandingOrders(LintStandingOrdersRequest) returns (LintStandingOrdersResponse);

  // Returns a standing order.
  rpc GetStandingOrderRules(GetStandingOrderRulesRequest) returns (GetStandingOrderRulesResponse);
}

// The request of `ValidateStandingOrder`.
message ValidateStandingOrderRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string standing_order_id = 2;
  StandingOrder standing_order = 3;
  ValidateStandingOrderRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateStandingOrder`.
message ValidateStandingOrderResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  StandingOrder standing_order = 1;
  ValidateStandingOrderResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

