syntax = "proto3";

package acme.banking.v1;

import "acme/banking/v1/banking.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Banking.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/banking/v1;bankingv1";
option java_multiple_files = true;
option java_outer_classname = "MandateApprovalServiceProto";
option java_package = "com.acme.banking.v1";

// Routes mandates through approval, with escalation and delegation.
service MandateApprovalService {
  // Submits a mandate.
  rpc SubmitMandate(SubmitMandateRequest) returns (SubmitMandateResponse);

  // Approves a mandate.
  rpc ApproveMandate(ApproveMandateRequest) returns (ApproveMandateResponse);

  // Rejects a mandate.
  rpc RejectMandate(RejectMandateRequest) returns (RejectMandateResponse);

  // Escalates a mandate.
  rpc EscalateMandate(EscalateMandateRequest) returns (EscalateMandateResponse);

  // Lists mandates a page at a time.
  rpc ListPendingMandates(ListPendingMandatesRequest) returns (ListPendingMandatesResponse);

  // Delegates a mandate.
  rpc DelegateMandateApproval(DelegateMandateApprovalRequest) returns (DelegateMandateApprovalResponse);

  // Recalls a mandate.
  rpc RecallMandate(RecallMandateRequest) returns (RecallMandateResponse);

  // Returns a mandate.
  rpc GetMandateApprovalStatus(GetMandateApprovalStatusRequest) returns (GetMandateApprovalStatusResponse);

  // Comments a mandate.
  rpc CommentMandateApproval(CommentMandateApprovalRequest) returns (CommentMandateApprovalResponse);
}

// The request of `SubmitMandate`.
message SubmitMandateRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string mandate_id = 2;
  Mandate mandate = 3;
  SubmitMandateRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitMandate`.
message SubmitMandateResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Mandate mandate = 1;
  SubmitMandateResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

