syntax = "proto3";

package acme.banking.v1;

import "acme/banking/v1/banking.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Banking.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/banking/v1;bankingv1";
option java_multiple_files = true;
option java_outer_classname = "BankAccountWorkflowServiceProto";
option java_package = "com.acme.banking.v1";

// Runs the long-lived workflow that takes a bank account from start to finish.
service BankAccountWorkflowService {
  // Starts a bank account.
  rpc StartBankAccountWorkflow(StartBankAccountWorkflowRequest) returns (StartBankAccountWorkflowResponse);

  // Advances a bank account.
  rpc AdvanceBankAccountWorkflow(AdvanceBankAccountWorkflowRequest) returns (AdvanceBankAccountWorkflowResponse);

  // Cancels a bank account.
  rpc CancelBankAccountWorkflow(CancelBankAccountWorkflowRequest) returns (CancelBankAccountWorkflowResponse);

  // Resumes a bank account.
  rpc ResumeBankAccountWorkflow(ResumeBankAccountWorkflowRequest) returns (ResumeBankAccountWorkflowResponse);

  // Returns a bank account.
  rpc InspectBankAccountWorkflow(InspectBankAccountWorkflowRequest) returns (InspectBankAccountWorkflowResponse);

  // Lists bank accounts a page at a time.
  rpc ListBankAccountWorkflows(ListBankAccountWorkflowsRequest) returns (ListBankAccountWorkflowsResponse);

  // Signals a bank account.
  rpc SignalBankAccountWorkflow(SignalBankAccountWorkflowRequest) returns (SignalBankAccountWorkflowResponse);
}

// The request of `StartBankAccountWorkflow`.
message StartBankAccountWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string bank_account_id = 2;
  BankAccount bank_account = 3;
  StartBankAccountWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartBankAccountWorkflow`.
message StartBankAccountWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  BankAccount bank_account = 1;
  StartBankAccountWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

