option csharp_namespace = "Acme.Banking.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/banking/v1;bankingv1";
option java_multiple_files = true;
option java_outer_classname = "StandingOrderWorkflowServiceProto";
option java_package = "com.acme.banking.v1";

// Runs the long-lived workflow that takes a standing order from start to finish.
service StandingOrderWorkflowService {
  // Starts a standing order.
  rpc StartStandingOrderWorkflow(StartStandingOrderWorkflowRequest) returns (StartStandingOrderWorkflowResponse);

  // Advances a standing order.
  rpc AdvanceStandingOrderWorkflow(AdvanceStandingOrderWorkflowRequest) returns (AdvanceStandingOrderWorkflowResponse);

  // Cancels a standing order.
  rpc CancelStandingOrderWorkflow(CancelStandingOrderWorkflowRequest) returns (CancelStandingOrderWorkflowResponse);

  // Retrys a standing order.
  rpc RetryStandingOrderWorkflow(RetryStandingOrderWorkflowRequest) returns (RetryStandingOrderWorkflowResponse);

  // Pauses a standing order.
  rpc PauseStandingOrderWorkflow(PauseStandingOrderWorkflowRequest) returns (PauseStandingOrderWorkflowResponse);

  // Resumes a standing order.
  rpc ResumeStandingOrderWorkflow(ResumeStandingOrderWorkflowRequest) returns (ResumeStandingOrderWorkflowResponse);

  // Returns a standing order.
  rpc InspectStandingOrderWorkflow(InspectStandingOrderWorkflowRequest) returns (InspectStandingOrderWorkflowResponse);

  // Lists standing orders a page at a time.
  rpc ListStandingOrderWorkflows(ListStandingOrderWorkflowsRequest) returns (ListStandingOrderWorkflowsResponse);

  // Signals a standing order.
  rpc SignalStandingOrderWorkflow(SignalStandingOrderWorkflowRequest) returns (SignalStandingOrderWorkflowResponse);
}

// The request of `StartStandingOrderWorkflow`.
message StartStandingOrderWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string standing_order_id = 2;
  StandingOrder standing_order = 3;
  StartStandingOrderWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartStandingOrderWorkflow`.
message StartStandingOrderWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  StandingOrder standing_order = 1;
  StartStandingOrderWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

