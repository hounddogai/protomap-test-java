syntax = "proto3";

package acme.banking.v1;

import "acme/banking/v1/banking.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Banking.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/banking/v1;bankingv1";
option java_multiple_files = true;
option java_outer_classname = "StandingOrderApprovalServiceProto";
option java_package = "com.acme.banking.v1";

// Routes standing orders through approval, with escalation and delegation.
service StandingOrderApprovalService {
  // Submits a standing order.
  rpc SubmitStandingOrder(SubmitStandingOrderRequest) returns (SubmitStandingOrderResponse);

  // Approves a standing order.
  rpc ApproveStandingOrder(ApproveStandingOrderRequest) returns (ApproveStandingOrderResponse);

  // Escalates a standing order.
  rpc EscalateStandingOrder(EscalateStandingOrderRequest) returns (EscalateStandingOrderResponse);

  // Lists standing orders a page at a time.
  rpc ListPendingStandingOrders(ListPendingStandingOrdersRequest) returns (ListPendingStandingOrdersResponse);

  // Delegates a standing order.
  rpc DelegateStandingOrderApproval(DelegateStandingOrderApprovalRequest) returns (DelegateStandingOrderApprovalResponse);

  // Recalls a standing order.
  rpc RecallStandingOrder(RecallStandingOrderRequest) returns (RecallStandingOrderResponse);
}

// The request of `SubmitStandingOrder`.
message SubmitStandingOrderRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string standing_order_id = 2;
  StandingOrder standing_order = 3;
  SubmitStandingOrderRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitStandingOrder`.
message SubmitStandingOrderResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  StandingOrder standing_order = 1;
  SubmitStandingOrderResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ApproveStandingOrder`.
message ApproveStandingOrderRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
