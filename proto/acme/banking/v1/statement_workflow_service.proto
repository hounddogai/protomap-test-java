import "acme/common/v1/paging.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Banking.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/banking/v1;bankingv1";
option java_multiple_files = true;
option java_outer_classname = "StatementWorkflowServiceProto";
option java_package = "com.acme.banking.v1";

// Runs the long-lived workflow that takes a statement from start to finish.
service StatementWorkflowService {
  // Starts a statement.
  rpc StartStatementWorkflow(StartStatementWorkflowRequest) returns (StartStatementWorkflowResponse);

  // Advances a statement.
  rpc AdvanceStatementWorkflow(AdvanceStatementWorkflowRequest) returns (AdvanceStatementWorkflowResponse);

  // Cancels a statement.
  rpc CancelStatementWorkflow(CancelStatementWorkflowRequest) returns (CancelStatementWorkflowResponse);

  // Retrys a statement.
  rpc RetryStatementWorkflow(RetryStatementWorkflowRequest) returns (RetryStatementWorkflowResponse);

  // Pauses a statement.
  rpc PauseStatementWorkflow(PauseStatementWorkflowRequest) returns (PauseStatementWorkflowResponse);

  // Resumes a statement.
  rpc ResumeStatementWorkflow(ResumeStatementWorkflowRequest) returns (ResumeStatementWorkflowResponse);

  // Returns a statement.
  rpc InspectStatementWorkflow(InspectStatementWorkflowRequest) returns (InspectStatementWorkflowResponse);

  // Lists statements a page at a time.
  rpc ListStatementWorkflows(ListStatementWorkflowsRequest) returns (ListStatementWorkflowsResponse);

  // Signals a statement.
  rpc SignalStatementWorkflow(SignalStatementWorkflowRequest) returns (SignalStatementWorkflowResponse);
}

// The request of `StartStatementWorkflow`.
message StartStatementWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string statement_id = 2;
  Statement statement = 3;
  StartStatementWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartStatementWorkflow`.
message StartStatementWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Statement statement = 1;
  StartStatementWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

