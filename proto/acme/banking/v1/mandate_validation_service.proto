syntax = "proto3";

package acme.banking.v1;

import "acme/banking/v1/banking.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Banking.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/banking/v1;bankingv1";
option java_multiple_files = true;
option java_outer_classname = "MandateValidationServiceProto";
option java_package = "com.acme.banking.v1";

// Checks mandates against the rules before anything acts on them.
service MandateValidationService {
  // Validates a mandate.
  rpc ValidateMandate(ValidateMandateRequest) returns (ValidateMandateResponse);

  // Previews a mandate.
  rpc PreviewMandate(PreviewMandateRequest) returns (PreviewMandateResponse);

  // Normalizes a mandate.
  rpc NormalizeMandate(NormalizeMandateRequest) returns (NormalizeMandateResponse);

  // Explains a mandate.
  rpc ExplainMandateDecision(ExplainMandateDecisionRequest) returns (ExplainMandateDecisionResponse);

  // Scores a mandate.
  rpc ScoreMandate(ScoreMandateRequest) returns (ScoreMandateResponse);

  // Lints a mandate.
  rpc LintMandates(LintMandatesRequest) returns (LintMandatesResponse);

  // Returns a mandate.
  rpc GetMandateRules(GetMandateRulesRequest) returns (GetMandateRulesResponse);
}

// The request of `ValidateMandate`.
message ValidateMandateRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string mandate_id = 2;
  Mandate mandate = 3;
  ValidateMandateRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateMandate`.
message ValidateMandateResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Mandate mandate = 1;
  ValidateMandateResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

