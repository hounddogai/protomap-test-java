// The request of `GetMandateRules`.
message GetMandateRulesRequest {
  acme.common.v1.RequestContext context = 1;
  string mandate_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetMandateRules`.
message GetMandateRulesResponse {
  Mandate mandate = 1;
  acme.common.v1.OperationResult result = 2;
}
