syntax = "proto3";

package acme.banking.v1;

import "acme/banking/v1/banking.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Banking.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/banking/v1;bankingv1";
option java_multiple_files = true;
option java_outer_classname = "MandateCalculationServiceProto";
option java_package = "com.acme.banking.v1";

// Computes the figures of a mandate, such as totals, taxes, and estimates.
service MandateCalculationService {
  // Calculates a mandate.
  rpc CalculateMandate(CalculateMandateRequest) returns (CalculateMandateResponse);

  // Estimates a mandate.
  rpc EstimateMandate(EstimateMandateRequest) returns (EstimateMandateResponse);

  // Quotes a mandate.
  rpc QuoteMandate(QuoteMandateRequest) returns (QuoteMandateResponse);

  // Compares a mandate.
  rpc CompareMandateOptions(CompareMandateOptionsRequest) returns (CompareMandateOptionsResponse);

  // Recalculates a mandate.
  rpc RecalculateMandates(RecalculateMandatesRequest) returns (RecalculateMandatesResponse);

  // Explains a mandate.
  rpc ExplainMandateCalculation(ExplainMandateCalculationRequest) returns (ExplainMandateCalculationResponse);

  // Returns a mandate.
  rpc GetMandateRates(GetMandateRatesRequest) returns (GetMandateRatesResponse);
}

// The request of `CalculateMandate`.
message CalculateMandateRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string mandate_id = 2;
  Mandate mandate = 3;
  CalculateMandateRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateMandate`.
message CalculateMandateResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateMandateResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Mandate mandate = 1;
  CalculateMandateResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

