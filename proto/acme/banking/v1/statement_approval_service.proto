syntax = "proto3";

package acme.banking.v1;

import "acme/banking/v1/banking.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Banking.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/banking/v1;bankingv1";
option java_multiple_files = true;
option java_outer_classname = "StatementApprovalServiceProto";
option java_package = "com.acme.banking.v1";

// Routes statements through approval, with escalation and delegation.
service StatementApprovalService {
  // Submits a statement.
  rpc SubmitStatement(SubmitStatementRequest) returns (SubmitStatementResponse);

  // Approves a statement.
  rpc ApproveStatement(ApproveStatementRequest) returns (ApproveStatementResponse);

  // Rejects a statement.
  rpc RejectStatement(RejectStatementRequest) returns (RejectStatementResponse);

  // Escalates a statement.
  rpc EscalateStatement(EscalateStatementRequest) returns (EscalateStatementResponse);

  // Lists statements a page at a time.
  rpc ListPendingStatements(ListPendingStatementsRequest) returns (ListPendingStatementsResponse);

  // Recalls a statement.
  rpc RecallStatement(RecallStatementRequest) returns (RecallStatementResponse);

  // Returns a statement.
  rpc GetStatementApprovalStatus(GetStatementApprovalStatusRequest) returns (GetStatementApprovalStatusResponse);

  // Comments a statement.
  rpc CommentStatementApproval(CommentStatementApprovalRequest) returns (CommentStatementApprovalResponse);
}

// The request of `SubmitStatement`.
message SubmitStatementRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string statement_id = 2;
  Statement statement = 3;
  SubmitStatementRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitStatement`.
message SubmitStatementResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Statement statement = 1;
  SubmitStatementResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

