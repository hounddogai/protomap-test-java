syntax = "proto3";

package acme.audit.v1;

import "acme/audit/v1/audit.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Audit.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/audit/v1;auditv1";
option java_multiple_files = true;
option java_outer_classname = "RetentionPolicyValidationServiceProto";
option java_package = "com.acme.audit.v1";

// Checks retention policies against the rules before anything acts on them.
service RetentionPolicyValidationService {
  // Validates a retention policy.
  rpc ValidateRetentionPolicy(ValidateRetentionPolicyRequest) returns (ValidateRetentionPolicyResponse);

  // Previews a retention policy.
  rpc PreviewRetentionPolicy(PreviewRetentionPolicyRequest) returns (PreviewRetentionPolicyResponse);

  // Checks a retention policy.
  rpc CheckRetentionPolicyEligibility(CheckRetentionPolicyEligibilityRequest) returns (CheckRetentionPolicyEligibilityResponse);

  // Normalizes a retention policy.
  rpc NormalizeRetentionPolicy(NormalizeRetentionPolicyRequest) returns (NormalizeRetentionPolicyResponse);

  // Explains a retention policy.
  rpc ExplainRetentionPolicyDecision(ExplainRetentionPolicyDecisionRequest) returns (ExplainRetentionPolicyDecisionResponse);

  // Scores a retention policy.
  rpc ScoreRetentionPolicy(ScoreRetentionPolicyRequest) returns (ScoreRetentionPolicyResponse);

  // Lints a retention policy.
  rpc LintRetentionPolicies(LintRetentionPoliciesRequest) returns (LintRetentionPoliciesResponse);

  // Returns a retention policy.
  rpc GetRetentionPolicyRules(GetRetentionPolicyRulesRequest) returns (GetRetentionPolicyRulesResponse);
}

// The request of `ValidateRetentionPolicy`.
message ValidateRetentionPolicyRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string retention_policy_id = 2;
  RetentionPolicy retention_policy = 3;
  ValidateRetentionPolicyRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateRetentionPolicy`.
message ValidateRetentionPolicyResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  RetentionPolicy retention_policy = 1;
  ValidateRetentionPolicyResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

