syntax = "proto3";

package acme.audit.v1;

import "acme/audit/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Audit.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/audit/v1;auditv1";
option java_multiple_files = true;
option java_outer_classname = "AuditTrailSyncServiceProto";
option java_package = "com.acme.audit.v1";

// Keeps audit trails in step with the systems of record in other regions.
service AuditTrailSyncService {
  // Syncs an audit trail.
  rpc SyncAuditTrails(SyncAuditTrailsRequest) returns (SyncAuditTrailsResponse);

  // Pushs an audit trail.
  rpc PushAuditTrail(PushAuditTrailRequest) returns (PushAuditTrailResponse);

  // Pulls an audit trail.
  rpc PullAuditTrails(PullAuditTrailsRequest) returns (PullAuditTrailsResponse);

  // Reconciles an audit trail.
  rpc ReconcileAuditTrails(ReconcileAuditTrailsRequest) returns (ReconcileAuditTrailsResponse);

  // Resolves an audit trail.
  rpc ResolveAuditTrailConflict(ResolveAuditTrailConflictRequest) returns (ResolveAuditTrailConflictResponse);

  // Returns an audit trail.
  rpc GetAuditTrailSyncState(GetAuditTrailSyncStateRequest) returns (GetAuditTrailSyncStateResponse);

  // Lists audit trails a page at a time.
  rpc ListAuditTrailConflicts(ListAuditTrailConflictsRequest) returns (ListAuditTrailConflictsResponse);
}

// The request of `SyncAuditTrails`.
message SyncAuditTrailsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string audit_trail_id = 2;
  AuditTrail audit_trail = 3;
  SyncAuditTrailsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SyncAuditTrails`.
message SyncAuditTrailsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  AuditTrail audit_trail = 1;
  SyncAuditTrailsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

