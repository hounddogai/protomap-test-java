// The request of `PruneAuditTrailVersions`.
message PruneAuditTrailVersionsRequest {
  acme.common.v1.RequestContext context = 1;
  string audit_trail_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `PruneAuditTrailVersions`.
message PruneAuditTrailVersionsResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
