    google.protobuf.Timestamp effective_at = 5;
  }

  AuditTrail audit_trail = 1;
  RepairAuditTrailResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `InspectAuditTrail`.
message InspectAuditTrailRequest {
  acme.common.v1.RequestContext context = 1;
  string audit_trail_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `InspectAuditTrail`.
message InspectAuditTrailResponse {
  AuditTrail audit_trail = 1;
  acme.common.v1.OperationResult result = 2;
}
