syntax = "proto3";

package acme.audit.v1;

import "acme/audit/v1/audit.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Audit.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/audit/v1;auditv1";
option java_multiple_files = true;
option java_outer_classname = "AuditEventExportServiceProto";
option java_package = "com.acme.audit.v1";

// Exports audit events to files and other systems.
service AuditEventExportService {
  // Streams every matching audit event.
  rpc StreamAuditEventExport(StreamAuditEventExportRequest) returns (stream StreamAuditEventExportResponse);

  // Returns an audit event.
  rpc GetAuditEventExport(GetAuditEventExportRequest) returns (GetAuditEventExportResponse);

  // Cancels an audit event.
  rpc CancelAuditEventExport(CancelAuditEventExportRequest) returns (CancelAuditEventExportResponse);

  // Lists audit events a page at a time.
  rpc ListAuditEventExports(ListAuditEventExportsRequest) returns (ListAuditEventExportsResponse);

  // Schedules an audit event.
  rpc ScheduleAuditEventExport(ScheduleAuditEventExportRequest) returns (ScheduleAuditEventExportResponse);

  // Retrys an audit event.
  rpc RetryAuditEventExport(RetryAuditEventExportRequest) returns (RetryAuditEventExportResponse);

  // Shares an audit event.
  rpc ShareAuditEventExport(ShareAuditEventExportRequest) returns (ShareAuditEventExportResponse);
}

// The request of `StreamAuditEventExport`.
message StreamAuditEventExportRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated AuditEventStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamAuditEventExportRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `StreamAuditEventExport`.
message StreamAuditEventExportResponse {
  AuditEvent audit_event = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `GetAuditEventExport`.
message GetAuditEventExportRequest {
  acme.common.v1.RequestContext context = 1;
  string audit_event_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetAuditEventExport`.
message GetAuditEventExportResponse {
  AuditEvent audit_event = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `CancelAuditEventExport`.
message CancelAuditEventExportRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string audit_event_id = 2;
  CancelAuditEventExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `CancelAuditEventExport`.
message CancelAuditEventExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  AuditEvent audit_event = 1;
  CancelAuditEventExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListAuditEventExports`.
message ListAuditEventExportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated AuditEventStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListAuditEventExportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListAuditEventExports`.
message ListAuditEventExportsResponse {
  repeated AuditEvent audit_events = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ScheduleAuditEventExport`.
message ScheduleAuditEventExportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string audit_event_id = 2;
  ScheduleAuditEventExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleAuditEventExport`.
message ScheduleAuditEventExportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `RetryAuditEventExport`.
message RetryAuditEventExportRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string audit_event_id = 2;
  AuditEvent audit_event = 3;
  RetryAuditEventExportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RetryAuditEventExport`.
message RetryAuditEventExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  AuditEvent audit_event = 1;
  RetryAuditEventExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareAuditEventExport`.
message ShareAuditEventExportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string audit_event_id = 2;
  ShareAuditEventExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareAuditEventExport`.
message ShareAuditEventExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  AuditEvent audit_event = 1;
  ShareAuditEventExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}
