  NotifyRetentionPolicyWatchersRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `NotifyRetentionPolicyWatchers`.
message NotifyRetentionPolicyWatchersResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  RetentionPolicy retention_policy = 1;
  NotifyRetentionPolicyWatchersResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListRetentionPolicySubscriptions`.
message ListRetentionPolicySubscriptionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RetentionPolicyStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListRetentionPolicySubscriptionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListRetentionPolicySubscriptions`.
message ListRetentionPolicySubscriptionsResponse {
  repeated RetentionPolicy retention_policies = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SendRetentionPolicyTestNotice`.
message SendRetentionPolicyTestNoticeRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
