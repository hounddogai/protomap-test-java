}

// The request of `GetRetentionPolicyPreferences`.
message GetRetentionPolicyPreferencesRequest {
  acme.common.v1.RequestContext context = 1;
  string retention_policy_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetRetentionPolicyPreferences`.
message GetRetentionPolicyPreferencesResponse {
  RetentionPolicy retention_policy = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `StreamRetentionPolicyNotices`.
message StreamRetentionPolicyNoticesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RetentionPolicyStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamRetentionPolicyNoticesRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamRetentionPolicyNotices`.
message StreamRetentionPolicyNoticesResponse {
  RetentionPolicy retention_policy = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}
