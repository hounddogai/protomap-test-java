syntax = "proto3";

package acme.audit.v1;

import "acme/audit/v1/audit.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Audit.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/audit/v1;auditv1";
option java_multiple_files = true;
option java_outer_classname = "RetentionPolicyExportServiceProto";
option java_package = "com.acme.audit.v1";

// Exports retention policies to files and other systems.
service RetentionPolicyExportService {
  // Streams every matching retention policy.
  rpc StreamRetentionPolicyExport(StreamRetentionPolicyExportRequest) returns (stream StreamRetentionPolicyExportResponse);

  // Returns a retention policy.
  rpc GetRetentionPolicyExport(GetRetentionPolicyExportRequest) returns (GetRetentionPolicyExportResponse);

  // Cancels a retention policy.
  rpc CancelRetentionPolicyExport(CancelRetentionPolicyExportRequest) returns (CancelRetentionPolicyExportResponse);

  // Schedules a retention policy.
  rpc ScheduleRetentionPolicyExport(ScheduleRetentionPolicyExportRequest) returns (ScheduleRetentionPolicyExportResponse);

  // Retrys a retention policy.
  rpc RetryRetentionPolicyExport(RetryRetentionPolicyExportRequest) returns (RetryRetentionPolicyExportResponse);

  // Shares a retention policy.
  rpc ShareRetentionPolicyExport(ShareRetentionPolicyExportRequest) returns (ShareRetentionPolicyExportResponse);
}

// The request of `StreamRetentionPolicyExport`.
message StreamRetentionPolicyExportRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RetentionPolicyStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamRetentionPolicyExportRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `StreamRetentionPolicyExport`.
message StreamRetentionPolicyExportResponse {
  RetentionPolicy retention_policy = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `GetRetentionPolicyExport`.
message GetRetentionPolicyExportRequest {
  acme.common.v1.RequestContext context = 1;
  string retention_policy_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetRetentionPolicyExport`.
message GetRetentionPolicyExportResponse {
  RetentionPolicy retention_policy = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `CancelRetentionPolicyExport`.
message CancelRetentionPolicyExportRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string retention_policy_id = 2;
  CancelRetentionPolicyExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `CancelRetentionPolicyExport`.
message CancelRetentionPolicyExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  RetentionPolicy retention_policy = 1;
  CancelRetentionPolicyExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ScheduleRetentionPolicyExport`.
message ScheduleRetentionPolicyExportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string retention_policy_id = 2;
  ScheduleRetentionPolicyExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleRetentionPolicyExport`.
message ScheduleRetentionPolicyExportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `RetryRetentionPolicyExport`.
message RetryRetentionPolicyExportRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string retention_policy_id = 2;
  RetentionPolicy retention_policy = 3;
  RetryRetentionPolicyExportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RetryRetentionPolicyExport`.
message RetryRetentionPolicyExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  RetentionPolicy retention_policy = 1;
  RetryRetentionPolicyExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareRetentionPolicyExport`.
message ShareRetentionPolicyExportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string retention_policy_id = 2;
  ShareRetentionPolicyExportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareRetentionPolicyExport`.
message ShareRetentionPolicyExportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  RetentionPolicy retention_policy = 1;
  ShareRetentionPolicyExportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}
