// The request of `ReconcileRetentionPolicies`.
message ReconcileRetentionPoliciesRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
