syntax = "proto3";

package acme.audit.v1;

import "acme/audit/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Audit.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/audit/v1;auditv1";
option java_multiple_files = true;
option java_outer_classname = "RetentionPolicySyncServiceProto";
option java_package = "com.acme.audit.v1";

// Keeps retention policies in step with the systems of record in other regions.
service RetentionPolicySyncService {
  // Syncs a retention policy.
  rpc SyncRetentionPolicies(SyncRetentionPoliciesRequest) returns (SyncRetentionPoliciesResponse);

  // Pushs a retention policy.
  rpc PushRetentionPolicy(PushRetentionPolicyRequest) returns (PushRetentionPolicyResponse);

  // Pulls a retention policy.
  rpc PullRetentionPolicies(PullRetentionPoliciesRequest) returns (PullRetentionPoliciesResponse);

  // Reconciles a retention policy.
  rpc ReconcileRetentionPolicies(ReconcileRetentionPoliciesRequest) returns (ReconcileRetentionPoliciesResponse);

  // Exchanges changes of retention policies with a peer.
  rpc StreamRetentionPolicyChanges(stream StreamRetentionPolicyChangesRequest) returns (stream StreamRetentionPolicyChangesResponse);

  // Resolves a retention policy.
  rpc ResolveRetentionPolicyConflict(ResolveRetentionPolicyConflictRequest) returns (ResolveRetentionPolicyConflictResponse);

  // Returns a retention policy.
  rpc GetRetentionPolicySyncState(GetRetentionPolicySyncStateRequest) returns (GetRetentionPolicySyncStateResponse);

  // Lists retention policies a page at a time.
  rpc ListRetentionPolicyConflicts(ListRetentionPolicyConflictsRequest) returns (ListRetentionPolicyConflictsResponse);
}

// The request of `SyncRetentionPolicies`.
message SyncRetentionPoliciesRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string retention_policy_id = 2;
  RetentionPolicy retention_policy = 3;
  SyncRetentionPoliciesRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SyncRetentionPolicies`.
message SyncRetentionPoliciesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  RetentionPolicy retention_policy = 1;
  SyncRetentionPoliciesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PushRetentionPolicy`.
message PushRetentionPolicyRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string retention_policy_id = 2;
  RetentionPolicy retention_policy = 3;
  PushRetentionPolicyRequest.Details details = 4;
  string reason = 5;
