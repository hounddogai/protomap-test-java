  ResolveRetentionPolicyConflictResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetRetentionPolicySyncState`.
message GetRetentionPolicySyncStateRequest {
  acme.common.v1.RequestContext context = 1;
  string retention_policy_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetRetentionPolicySyncState`.
message GetRetentionPolicySyncStateResponse {
  RetentionPolicy retention_policy = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ListRetentionPolicyConflicts`.
message ListRetentionPolicyConflictsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RetentionPolicyStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListRetentionPolicyConflictsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListRetentionPolicyConflicts`.
message ListRetentionPolicyConflictsResponse {
  repeated RetentionPolicy retention_policies = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}
