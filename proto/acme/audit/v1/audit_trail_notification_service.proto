syntax = "proto3";

package acme.audit.v1;

import "acme/audit/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Audit.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/audit/v1;auditv1";
option java_multiple_files = true;
option java_outer_classname = "AuditTrailNotificationServiceProto";
option java_package = "com.acme.audit.v1";

// Tells the people who follow an audit trail what changed.
service AuditTrailNotificationService {
  // Subscribes an audit trail.
  rpc SubscribeAuditTrailUpdates(SubscribeAuditTrailUpdatesRequest) returns (SubscribeAuditTrailUpdatesResponse);

  // Unsubscribes an audit trail.
  rpc UnsubscribeAuditTrailUpdates(UnsubscribeAuditTrailUpdatesRequest) returns (UnsubscribeAuditTrailUpdatesResponse);

  // Notifys an audit trail.
  rpc NotifyAuditTrailWatchers(NotifyAuditTrailWatchersRequest) returns (NotifyAuditTrailWatchersResponse);

  // Lists audit trails a page at a time.
  rpc ListAuditTrailSubscriptions(ListAuditTrailSubscriptionsRequest) returns (ListAuditTrailSubscriptionsResponse);

  // Sends an audit trail.
  rpc SendAuditTrailTestNotice(SendAuditTrailTestNoticeRequest) returns (SendAuditTrailTestNoticeResponse);

  // Returns an audit trail.
  rpc GetAuditTrailPreferences(GetAuditTrailPreferencesRequest) returns (GetAuditTrailPreferencesResponse);

  // Streams the changes of audit trails as they happen.
  rpc StreamAuditTrailNotices(StreamAuditTrailNoticesRequest) returns (stream StreamAuditTrailNoticesResponse);
}

// The request of `SubscribeAuditTrailUpdates`.
message SubscribeAuditTrailUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string audit_trail_id = 2;
  SubscribeAuditTrailUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SubscribeAuditTrailUpdates`.
message SubscribeAuditTrailUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  AuditTrail audit_trail = 1;
  SubscribeAuditTrailUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `UnsubscribeAuditTrailUpdates`.
message UnsubscribeAuditTrailUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string audit_trail_id = 2;
  UnsubscribeAuditTrailUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `UnsubscribeAuditTrailUpdates`.
message UnsubscribeAuditTrailUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  AuditTrail audit_trail = 1;
  UnsubscribeAuditTrailUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `NotifyAuditTrailWatchers`.
message NotifyAuditTrailWatchersRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string audit_trail_id = 2;
  NotifyAuditTrailWatchersRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `NotifyAuditTrailWatchers`.
message NotifyAuditTrailWatchersResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  AuditTrail audit_trail = 1;
  NotifyAuditTrailWatchersResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListAuditTrailSubscriptions`.
message ListAuditTrailSubscriptionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated AuditTrailStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListAuditTrailSubscriptionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListAuditTrailSubscriptions`.
message ListAuditTrailSubscriptionsResponse {
  repeated AuditTrail audit_trails = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SendAuditTrailTestNotice`.
message SendAuditTrailTestNoticeRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string audit_trail_id = 2;
  SendAuditTrailTestNoticeRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SendAuditTrailTestNotice`.
message SendAuditTrailTestNoticeResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  AuditTrail audit_trail = 1;
  SendAuditTrailTestNoticeResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetAuditTrailPreferences`.
message GetAuditTrailPreferencesRequest {
  acme.common.v1.RequestContext context = 1;
  string audit_trail_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetAuditTrailPreferences`.
message GetAuditTrailPreferencesResponse {
  AuditTrail audit_trail = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `StreamAuditTrailNotices`.
message StreamAuditTrailNoticesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated AuditTrailStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamAuditTrailNoticesRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamAuditTrailNotices`.
message StreamAuditTrailNoticesResponse {
  AuditTrail audit_trail = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}
