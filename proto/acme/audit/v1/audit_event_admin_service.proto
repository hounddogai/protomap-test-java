// The request of `InspectAuditEvent`.
message InspectAuditEventRequest {
  acme.common.v1.RequestContext context = 1;
  string audit_event_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `InspectAuditEvent`.
message InspectAuditEventResponse {
