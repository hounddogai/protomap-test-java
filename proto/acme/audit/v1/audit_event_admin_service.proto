syntax = "proto3";

package acme.audit.v1;

import "acme/audit/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Audit.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/audit/v1;auditv1";
option java_multiple_files = true;
option java_outer_classname = "AuditEventAdminServiceProto";
option java_package = "com.acme.audit.v1";

// Operator actions on audit events that support staff run by hand.
service AuditEventAdminService {
  // Archives an audit event.
  rpc ArchiveAuditEvent(ArchiveAuditEventRequest) returns (ArchiveAuditEventResponse);

  // Restores an audit event.
  rpc RestoreAuditEvent(RestoreAuditEventRequest) returns (RestoreAuditEventResponse);

  // Deletes an audit event.
  rpc PurgeAuditEvent(PurgeAuditEventRequest) returns (PurgeAuditEventResponse);

  // Reassigns an audit event.
  rpc ReassignAuditEvent(ReassignAuditEventRequest) returns (ReassignAuditEventResponse);

  // Locks an audit event.
  rpc LockAuditEvent(LockAuditEventRequest) returns (LockAuditEventResponse);

  // Unlocks an audit event.
  rpc UnlockAuditEvent(UnlockAuditEventRequest) returns (UnlockAuditEventResponse);

  // Transfers an audit event.
  rpc TransferAuditEvent(TransferAuditEventRequest) returns (TransferAuditEventResponse);

  // Returns an audit event.
  rpc InspectAuditEvent(InspectAuditEventRequest) returns (InspectAuditEventResponse);
}

// The request of `ArchiveAuditEvent`.
message ArchiveAuditEventRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string audit_event_id = 2;
  ArchiveAuditEventRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ArchiveAuditEvent`.
message ArchiveAuditEventResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  AuditEvent audit_event = 1;
  ArchiveAuditEventResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `RestoreAuditEvent`.
message RestoreAuditEventRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
