}

// The request of `PurgeAuditEvent`.
message PurgeAuditEventRequest {
  acme.common.v1.RequestContext context = 1;
  string audit_event_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `PurgeAuditEvent`.
message PurgeAuditEventResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}

// The request of `ReassignAuditEvent`.
message ReassignAuditEventRequest {
  // What the operation needs besides the record.
  message Details {
    acme.identity.v1.UserRef assignee = 1;
    string queue = 2;
    int32 capacity = 3;
    string assignee_email = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string audit_event_id = 2;
  ReassignAuditEventRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ReassignAuditEvent`.
