syntax = "proto3";

package acme.audit.v1;

import "acme/audit/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Audit.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/audit/v1;auditv1";
option java_multiple_files = true;
option java_outer_classname = "AuditEventNotificationServiceProto";
option java_package = "com.acme.audit.v1";

// Tells the people who follow an audit event what changed.
service AuditEventNotificationService {
  // Subscribes an audit event.
  rpc SubscribeAuditEventUpdates(SubscribeAuditEventUpdatesRequest) returns (SubscribeAuditEventUpdatesResponse);

  // Unsubscribes an audit event.
  rpc UnsubscribeAuditEventUpdates(UnsubscribeAuditEventUpdatesRequest) returns (UnsubscribeAuditEventUpdatesResponse);

  // Notifys an audit event.
  rpc NotifyAuditEventWatchers(NotifyAuditEventWatchersRequest) returns (NotifyAuditEventWatchersResponse);

  // Lists audit events a page at a time.
  rpc ListAuditEventSubscriptions(ListAuditEventSubscriptionsRequest) returns (ListAuditEventSubscriptionsResponse);

  // Sends an audit event.
  rpc SendAuditEventTestNotice(SendAuditEventTestNoticeRequest) returns (SendAuditEventTestNoticeResponse);

  // Returns an audit event.
  rpc GetAuditEventPreferences(GetAuditEventPreferencesRequest) returns (GetAuditEventPreferencesResponse);

  // Streams the changes of audit events as they happen.
  rpc StreamAuditEventNotices(StreamAuditEventNoticesRequest) returns (stream StreamAuditEventNoticesResponse);
}

// The request of `SubscribeAuditEventUpdates`.
message SubscribeAuditEventUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string audit_event_id = 2;
  SubscribeAuditEventUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SubscribeAuditEventUpdates`.
message SubscribeAuditEventUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  AuditEvent audit_event = 1;
  SubscribeAuditEventUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `UnsubscribeAuditEventUpdates`.
message UnsubscribeAuditEventUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string audit_event_id = 2;
  UnsubscribeAuditEventUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `UnsubscribeAuditEventUpdates`.
message UnsubscribeAuditEventUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  AuditEvent audit_event = 1;
  UnsubscribeAuditEventUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `NotifyAuditEventWatchers`.
message NotifyAuditEventWatchersRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string audit_event_id = 2;
  NotifyAuditEventWatchersRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `NotifyAuditEventWatchers`.
message NotifyAuditEventWatchersResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  AuditEvent audit_event = 1;
  NotifyAuditEventWatchersResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListAuditEventSubscriptions`.
message ListAuditEventSubscriptionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated AuditEventStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListAuditEventSubscriptionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListAuditEventSubscriptions`.
message ListAuditEventSubscriptionsResponse {
  repeated AuditEvent audit_events = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SendAuditEventTestNotice`.
message SendAuditEventTestNoticeRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string audit_event_id = 2;
  SendAuditEventTestNoticeRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SendAuditEventTestNotice`.
message SendAuditEventTestNoticeResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  AuditEvent audit_event = 1;
  SendAuditEventTestNoticeResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetAuditEventPreferences`.
message GetAuditEventPreferencesRequest {
  acme.common.v1.RequestContext context = 1;
  string audit_event_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetAuditEventPreferences`.
message GetAuditEventPreferencesResponse {
  AuditEvent audit_event = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `StreamAuditEventNotices`.
message StreamAuditEventNoticesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated AuditEventStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamAuditEventNoticesRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamAuditEventNotices`.
message StreamAuditEventNoticesResponse {
  AuditEvent audit_event = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}
