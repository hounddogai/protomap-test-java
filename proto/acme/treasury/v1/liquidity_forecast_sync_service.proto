    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  LiquidityForecast liquidity_forecast = 1;
  PullLiquidityForecastsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `StreamLiquidityForecastChanges`.
message StreamLiquidityForecastChangesRequest {
  // An acknowledgment of a change the peer sent.
  message ChangeAck {
    int64 sequence = 1;
    string status = 2;
  }

  acme.common.v1.RequestContext context = 1;
  oneof frame {
    LiquidityForecast change = 2;
    StreamLiquidityForecastChangesRequest.ChangeAck ack = 3;
  }
  string cursor = 4;
}

// The response of `StreamLiquidityForecastChanges`.
message StreamLiquidityForecastChangesResponse {
  LiquidityForecast liquidity_forecast = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ResolveLiquidityForecastConflict`.
message ResolveLiquidityForecastConflictRequest {
  // What the operation needs besides the record.
  message Details {
