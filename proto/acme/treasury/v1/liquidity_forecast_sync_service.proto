message ResolveLiquidityForecastConflictResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  LiquidityForecast liquidity_forecast = 1;
  ResolveLiquidityForecastConflictResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetLiquidityForecastSyncState`.
message GetLiquidityForecastSyncStateRequest {
  acme.common.v1.RequestContext context = 1;
  string liquidity_forecast_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetLiquidityForecastSyncState`.
message GetLiquidityForecastSyncStateResponse {
  LiquidityForecast liquidity_forecast = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ListLiquidityForecastConflicts`.
message ListLiquidityForecastConflictsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated LiquidityForecastStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListLiquidityForecastConflictsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListLiquidityForecastConflicts`.
message ListLiquidityForecastConflictsResponse {
  repeated LiquidityForecast liquidity_forecasts = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}
