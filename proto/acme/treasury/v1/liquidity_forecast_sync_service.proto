syntax = "proto3";

package acme.treasury.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/treasury/v1/treasury.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Treasury.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/treasury/v1;treasuryv1";
option java_multiple_files = true;
option java_outer_classname = "LiquidityForecastSyncServiceProto";
option java_package = "com.acme.treasury.v1";

// Keeps liquidity forecasts in step with the systems of record in other regions.
service LiquidityForecastSyncService {
  // Syncs a liquidity forecast.
  rpc SyncLiquidityForecasts(SyncLiquidityForecastsRequest) returns (SyncLiquidityForecastsResponse);

  // Pushs a liquidity forecast.
  rpc PushLiquidityForecast(PushLiquidityForecastRequest) returns (PushLiquidityForecastResponse);

  // Pulls a liquidity forecast.
  rpc PullLiquidityForecasts(PullLiquidityForecastsRequest) returns (PullLiquidityForecastsResponse);

  // Exchanges changes of liquidity forecasts with a peer.
  rpc StreamLiquidityForecastChanges(stream StreamLiquidityForecastChangesRequest) returns (stream StreamLiquidityForecastChangesResponse);

  // Resolves a liquidity forecast.
  rpc ResolveLiquidityForecastConflict(ResolveLiquidityForecastConflictRequest) returns (ResolveLiquidityForecastConflictResponse);

  // Returns a liquidity forecast.
  rpc GetLiquidityForecastSyncState(GetLiquidityForecastSyncStateRequest) returns (GetLiquidityForecastSyncStateResponse);

  // Lists liquidity forecasts a page at a time.
  rpc ListLiquidityForecastConflicts(ListLiquidityForecastConflictsRequest) returns (ListLiquidityForecastConflictsResponse);
}

// The request of `SyncLiquidityForecasts`.
message SyncLiquidityForecastsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string liquidity_forecast_id = 2;
  LiquidityForecast liquidity_forecast = 3;
  SyncLiquidityForecastsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SyncLiquidityForecasts`.
message SyncLiquidityForecastsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  LiquidityForecast liquidity_forecast = 1;
  SyncLiquidityForecastsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PushLiquidityForecast`.
message PushLiquidityForecastRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string liquidity_forecast_id = 2;
  LiquidityForecast liquidity_forecast = 3;
  PushLiquidityForecastRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `PushLiquidityForecast`.
message PushLiquidityForecastResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  LiquidityForecast liquidity_forecast = 1;
  PushLiquidityForecastResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PullLiquidityForecasts`.
message PullLiquidityForecastsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
