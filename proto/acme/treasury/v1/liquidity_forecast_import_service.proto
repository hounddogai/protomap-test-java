syntax = "proto3";

package acme.treasury.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/treasury/v1/treasury.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Treasury.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/treasury/v1;treasuryv1";
option java_multiple_files = true;
option java_outer_classname = "LiquidityForecastImportServiceProto";
option java_package = "com.acme.treasury.v1";

// Takes liquidity forecasts in bulk from partners and legacy systems.
service LiquidityForecastImportService {
  // Takes a stream of liquidity forecasts and answers once at the end.
  rpc ImportLiquidityForecasts(stream ImportLiquidityForecastsRequest) returns (ImportLiquidityForecastsResponse);

  // Returns a liquidity forecast.
  rpc GetLiquidityForecastImportStatus(GetLiquidityForecastImportStatusRequest) returns (GetLiquidityForecastImportStatusResponse);

  // Cancels a liquidity forecast.
  rpc CancelLiquidityForecastImport(CancelLiquidityForecastImportRequest) returns (CancelLiquidityForecastImportResponse);

  // Validates a liquidity forecast.
  rpc ValidateLiquidityForecastImport(ValidateLiquidityForecastImportRequest) returns (ValidateLiquidityForecastImportResponse);

  // Lists liquidity forecasts a page at a time.
  rpc ListLiquidityForecastImports(ListLiquidityForecastImportsRequest) returns (ListLiquidityForecastImportsResponse);

  // Retrys a liquidity forecast.
  rpc RetryLiquidityForecastImport(RetryLiquidityForecastImportRequest) returns (RetryLiquidityForecastImportResponse);

  // Maps a liquidity forecast.
  rpc MapLiquidityForecastImportColumns(MapLiquidityForecastImportColumnsRequest) returns (MapLiquidityForecastImportColumnsResponse);
}

// The request of `ImportLiquidityForecasts`.
message ImportLiquidityForecastsRequest {
  // What a stream of records starts with.
  message StreamHeader {
    string source = 1;
    string format = 2;
    int64 total_records = 3;
    acme.common.v1.ContactInfo submitted_by = 4;
  }

  acme.common.v1.RequestContext context = 1;
  oneof chunk {
    ImportLiquidityForecastsRequest.StreamHeader header = 2;
    LiquidityForecast record = 3;
  }
  int64 sequence = 4;
}

// The response of `ImportLiquidityForecasts`.
message ImportLiquidityForecastsResponse {
  // A record the import turned down.
  message Rejection {
    int64 sequence = 1;
    string reason = 2;
    string liquidity_forecast_id = 3;
  }

  int64 accepted = 1;
  int64 rejected = 2;
  repeated ImportLiquidityForecastsResponse.Rejection rejections = 3;
  acme.common.v1.OperationResult result = 4;
}

// The request of `GetLiquidityForecastImportStatus`.
message GetLiquidityForecastImportStatusRequest {
  acme.common.v1.RequestContext context = 1;
  string liquidity_forecast_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetLiquidityForecastImportStatus`.
message GetLiquidityForecastImportStatusResponse {
  LiquidityForecast liquidity_forecast = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `CancelLiquidityForecastImport`.
message CancelLiquidityForecastImportRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string liquidity_forecast_id = 2;
  CancelLiquidityForecastImportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `CancelLiquidityForecastImport`.
message CancelLiquidityForecastImportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  LiquidityForecast liquidity_forecast = 1;
  CancelLiquidityForecastImportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ValidateLiquidityForecastImport`.
message ValidateLiquidityForecastImportRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string liquidity_forecast_id = 2;
  LiquidityForecast liquidity_forecast = 3;
  ValidateLiquidityForecastImportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateLiquidityForecastImport`.
message ValidateLiquidityForecastImportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  LiquidityForecast liquidity_forecast = 1;
  ValidateLiquidityForecastImportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListLiquidityForecastImports`.
message ListLiquidityForecastImportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated LiquidityForecastStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListLiquidityForecastImportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListLiquidityForecastImports`.
message ListLiquidityForecastImportsResponse {
  repeated LiquidityForecast liquidity_forecasts = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `RetryLiquidityForecastImport`.
message RetryLiquidityForecastImportRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string liquidity_forecast_id = 2;
  LiquidityForecast liquidity_forecast = 3;
  RetryLiquidityForecastImportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RetryLiquidityForecastImport`.
message RetryLiquidityForecastImportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  LiquidityForecast liquidity_forecast = 1;
  RetryLiquidityForecastImportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `MapLiquidityForecastImportColumns`.
message MapLiquidityForecastImportColumnsRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string liquidity_forecast_id = 2;
  LiquidityForecast liquidity_forecast = 3;
  MapLiquidityForecastImportColumnsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `MapLiquidityForecastImportColumns`.
message MapLiquidityForecastImportColumnsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  LiquidityForecast liquidity_forecast = 1;
  MapLiquidityForecastImportColumnsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}
