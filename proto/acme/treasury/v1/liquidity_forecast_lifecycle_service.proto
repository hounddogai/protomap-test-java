option csharp_namespace = "Acme.Treasury.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/treasury/v1;treasuryv1";
option java_multiple_files = true;
option java_outer_classname = "LiquidityForecastLifecycleServiceProto";
option java_package = "com.acme.treasury.v1";

// Moves a liquidity forecast between the states of its lifecycle.
service LiquidityForecastLifecycleService {
  // Activates a liquidity forecast.
  rpc ActivateLiquidityForecast(ActivateLiquidityForecastRequest) returns (ActivateLiquidityForecastResponse);

  // Suspends a liquidity forecast.
  rpc SuspendLiquidityForecast(SuspendLiquidityForecastRequest) returns (SuspendLiquidityForecastResponse);

  // Reinstates a liquidity forecast.
  rpc ReinstateLiquidityForecast(ReinstateLiquidityForecastRequest) returns (ReinstateLiquidityForecastResponse);

  // Terminates a liquidity forecast.
  rpc TerminateLiquidityForecast(TerminateLiquidityForecastRequest) returns (TerminateLiquidityForecastResponse);

  // Renews a liquidity forecast.
  rpc RenewLiquidityForecast(RenewLiquidityForecastRequest) returns (RenewLiquidityForecastResponse);

  // Expires a liquidity forecast.
  rpc ExpireLiquidityForecast(ExpireLiquidityForecastRequest) returns (ExpireLiquidityForecastResponse);

  // Returns a liquidity forecast.
  rpc GetLiquidityForecastLifecycle(GetLiquidityForecastLifecycleRequest) returns (GetLiquidityForecastLifecycleResponse);

  // Schedules a liquidity forecast.
  rpc ScheduleLiquidityForecastExpiry(ScheduleLiquidityForecastExpiryRequest) returns (ScheduleLiquidityForecastExpiryResponse);
}

// The request of `ActivateLiquidityForecast`.
message ActivateLiquidityForecastRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string liquidity_forecast_id = 2;
  ActivateLiquidityForecastRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateLiquidityForecast`.
message ActivateLiquidityForecastResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  LiquidityForecast liquidity_forecast = 1;
  ActivateLiquidityForecastResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

