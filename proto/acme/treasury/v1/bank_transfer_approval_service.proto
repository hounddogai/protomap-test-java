syntax = "proto3";

package acme.treasury.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/treasury/v1/treasury.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Treasury.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/treasury/v1;treasuryv1";
option java_multiple_files = true;
option java_outer_classname = "BankTransferApprovalServiceProto";
option java_package = "com.acme.treasury.v1";

// Routes bank transfers through approval, with escalation and delegation.
service BankTransferApprovalService {
  // Submits a bank transfer.
  rpc SubmitBankTransfer(SubmitBankTransferRequest) returns (SubmitBankTransferResponse);

  // Approves a bank transfer.
  rpc ApproveBankTransfer(ApproveBankTransferRequest) returns (ApproveBankTransferResponse);

  // Escalates a bank transfer.
  rpc EscalateBankTransfer(EscalateBankTransferRequest) returns (EscalateBankTransferResponse);

  // Lists bank transfers a page at a time.
  rpc ListPendingBankTransfers(ListPendingBankTransfersRequest) returns (ListPendingBankTransfersResponse);

  // Delegates a bank transfer.
  rpc DelegateBankTransferApproval(DelegateBankTransferApprovalRequest) returns (DelegateBankTransferApprovalResponse);

  // Comments a bank transfer.
  rpc CommentBankTransferApproval(CommentBankTransferApprovalRequest) returns (CommentBankTransferApprovalResponse);
}

// The request of `SubmitBankTransfer`.
message SubmitBankTransferRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string bank_transfer_id = 2;
  BankTransfer bank_transfer = 3;
  SubmitBankTransferRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitBankTransfer`.
message SubmitBankTransferResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  BankTransfer bank_transfer = 1;
  SubmitBankTransferResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

