syntax = "proto3";

package acme.treasury.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/treasury/v1/treasury.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Treasury.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/treasury/v1;treasuryv1";
option java_multiple_files = true;
option java_outer_classname = "CashPositionWorkflowServiceProto";
option java_package = "com.acme.treasury.v1";

// Runs the long-lived workflow that takes a cash position from start to finish.
service CashPositionWorkflowService {
  // Starts a cash position.
  rpc StartCashPositionWorkflow(StartCashPositionWorkflowRequest) returns (StartCashPositionWorkflowResponse);

  // Advances a cash position.
  rpc AdvanceCashPositionWorkflow(AdvanceCashPositionWorkflowRequest) returns (AdvanceCashPositionWorkflowResponse);

  // Retrys a cash position.
  rpc RetryCashPositionWorkflow(RetryCashPositionWorkflowRequest) returns (RetryCashPositionWorkflowResponse);

  // Resumes a cash position.
  rpc ResumeCashPositionWorkflow(ResumeCashPositionWorkflowRequest) returns (ResumeCashPositionWorkflowResponse);

  // Returns a cash position.
  rpc InspectCashPositionWorkflow(InspectCashPositionWorkflowRequest) returns (InspectCashPositionWorkflowResponse);

  // Lists cash positions a page at a time.
  rpc ListCashPositionWorkflows(ListCashPositionWorkflowsRequest) returns (ListCashPositionWorkflowsResponse);

  // Signals a cash position.
  rpc SignalCashPositionWorkflow(SignalCashPositionWorkflowRequest) returns (SignalCashPositionWorkflowResponse);
}

// The request of `StartCashPositionWorkflow`.
message StartCashPositionWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string cash_position_id = 2;
  CashPosition cash_position = 3;
  StartCashPositionWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartCashPositionWorkflow`.
message StartCashPositionWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CashPosition cash_position = 1;
  StartCashPositionWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

