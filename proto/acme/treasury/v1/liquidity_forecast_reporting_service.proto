syntax = "proto3";

package acme.treasury.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/treasury/v1/treasury.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Treasury.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/treasury/v1;treasuryv1";
option java_multiple_files = true;
option java_outer_classname = "LiquidityForecastReportingServiceProto";
option java_package = "com.acme.treasury.v1";

// Builds and schedules reports about liquidity forecasts.
service LiquidityForecastReportingService {
  // Generates a liquidity forecast.
  rpc GenerateLiquidityForecastReport(GenerateLiquidityForecastReportRequest) returns (GenerateLiquidityForecastReportResponse);

  // Returns a liquidity forecast.
  rpc FetchLiquidityForecastReport(FetchLiquidityForecastReportRequest) returns (FetchLiquidityForecastReportResponse);

  // Schedules a liquidity forecast.
  rpc ScheduleLiquidityForecastReport(ScheduleLiquidityForecastReportRequest) returns (ScheduleLiquidityForecastReportResponse);

  // Streams the changes of liquidity forecasts as they happen.
  rpc StreamLiquidityForecastMetrics(StreamLiquidityForecastMetricsRequest) returns (stream StreamLiquidityForecastMetricsResponse);

  // Shares a liquidity forecast.
  rpc ShareLiquidityForecastReport(ShareLiquidityForecastReportRequest) returns (ShareLiquidityForecastReportResponse);

  // Counts liquidity forecasts by status.
  rpc CountLiquidityForecastTotals(CountLiquidityForecastTotalsRequest) returns (CountLiquidityForecastTotalsResponse);

  // Deletes a liquidity forecast.
  rpc DeleteLiquidityForecastReport(DeleteLiquidityForecastReportRequest) returns (DeleteLiquidityForecastReportResponse);
}

// The request of `GenerateLiquidityForecastReport`.
message GenerateLiquidityForecastReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string liquidity_forecast_id = 2;
  GenerateLiquidityForecastReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateLiquidityForecastReport`.
message GenerateLiquidityForecastReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchLiquidityForecastReport`.
message FetchLiquidityForecastReportRequest {
  acme.common.v1.RequestContext context = 1;
  string liquidity_forecast_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchLiquidityForecastReport`.
message FetchLiquidityForecastReportResponse {
  LiquidityForecast liquidity_forecast = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleLiquidityForecastReport`.
message ScheduleLiquidityForecastReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string liquidity_forecast_id = 2;
  ScheduleLiquidityForecastReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleLiquidityForecastReport`.
message ScheduleLiquidityForecastReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamLiquidityForecastMetrics`.
message StreamLiquidityForecastMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated LiquidityForecastStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamLiquidityForecastMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamLiquidityForecastMetrics`.
message StreamLiquidityForecastMetricsResponse {
  LiquidityForecast liquidity_forecast = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ShareLiquidityForecastReport`.
message ShareLiquidityForecastReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string liquidity_forecast_id = 2;
  ShareLiquidityForecastReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareLiquidityForecastReport`.
message ShareLiquidityForecastReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  LiquidityForecast liquidity_forecast = 1;
  ShareLiquidityForecastReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountLiquidityForecastTotals`.
message CountLiquidityForecastTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated LiquidityForecastStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountLiquidityForecastTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountLiquidityForecastTotals`.
message CountLiquidityForecastTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteLiquidityForecastReport`.
message DeleteLiquidityForecastReportRequest {
  acme.common.v1.RequestContext context = 1;
  string liquidity_forecast_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteLiquidityForecastReport`.
message DeleteLiquidityForecastReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
