import "acme/treasury/v1/treasury.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Treasury.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/treasury/v1;treasuryv1";
option java_multiple_files = true;
option java_outer_classname = "BankTransferLifecycleServiceProto";
option java_package = "com.acme.treasury.v1";

// Moves a bank transfer between the states of its lifecycle.
service BankTransferLifecycleService {
  // Activates a bank transfer.
  rpc ActivateBankTransfer(ActivateBankTransferRequest) returns (ActivateBankTransferResponse);

  // Suspends a bank transfer.
  rpc SuspendBankTransfer(SuspendBankTransferRequest) returns (SuspendBankTransferResponse);

  // Reinstates a bank transfer.
  rpc ReinstateBankTransfer(ReinstateBankTransferRequest) returns (ReinstateBankTransferResponse);

  // Terminates a bank transfer.
  rpc TerminateBankTransfer(TerminateBankTransferRequest) returns (TerminateBankTransferResponse);

  // Renews a bank transfer.
  rpc RenewBankTransfer(RenewBankTransferRequest) returns (RenewBankTransferResponse);

  // Expires a bank transfer.
  rpc ExpireBankTransfer(ExpireBankTransferRequest) returns (ExpireBankTransferResponse);

  // Returns a bank transfer.
  rpc GetBankTransferLifecycle(GetBankTransferLifecycleRequest) returns (GetBankTransferLifecycleResponse);

  // Schedules a bank transfer.
  rpc ScheduleBankTransferExpiry(ScheduleBankTransferExpiryRequest) returns (ScheduleBankTransferExpiryResponse);
}

// The request of `ActivateBankTransfer`.
message ActivateBankTransferRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string bank_transfer_id = 2;
  ActivateBankTransferRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateBankTransfer`.
message ActivateBankTransferResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  BankTransfer bank_transfer = 1;
  ActivateBankTransferResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

