    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CashPosition cash_position = 1;
  ApproveCashPositionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListPendingCashPositions`.
message ListPendingCashPositionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated CashPositionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListPendingCashPositionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListPendingCashPositions`.
message ListPendingCashPositionsResponse {
  repeated CashPosition cash_positions = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

