syntax = "proto3";

package acme.treasury.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/treasury/v1/treasury.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Treasury.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/treasury/v1;treasuryv1";
option java_multiple_files = true;
option java_outer_classname = "CashPositionApprovalServiceProto";
option java_package = "com.acme.treasury.v1";

// Routes cash positions through approval, with escalation and delegation.
service CashPositionApprovalService {
  // Submits a cash position.
  rpc SubmitCashPosition(SubmitCashPositionRequest) returns (SubmitCashPositionResponse);

  // Approves a cash position.
  rpc ApproveCashPosition(ApproveCashPositionRequest) returns (ApproveCashPositionResponse);

  // Lists cash positions a page at a time.
  rpc ListPendingCashPositions(ListPendingCashPositionsRequest) returns (ListPendingCashPositionsResponse);

  // Delegates a cash position.
  rpc DelegateCashPositionApproval(DelegateCashPositionApprovalRequest) returns (DelegateCashPositionApprovalResponse);

  // Recalls a cash position.
  rpc RecallCashPosition(RecallCashPositionRequest) returns (RecallCashPositionResponse);

  // Returns a cash position.
  rpc GetCashPositionApprovalStatus(GetCashPositionApprovalStatusRequest) returns (GetCashPositionApprovalStatusResponse);

  // Comments a cash position.
  rpc CommentCashPositionApproval(CommentCashPositionApprovalRequest) returns (CommentCashPositionApprovalResponse);
}

// The request of `SubmitCashPosition`.
message SubmitCashPositionRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string cash_position_id = 2;
  CashPosition cash_position = 3;
  SubmitCashPositionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitCashPosition`.
message SubmitCashPositionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CashPosition cash_position = 1;
  SubmitCashPositionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ApproveCashPosition`.
message ApproveCashPositionRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
