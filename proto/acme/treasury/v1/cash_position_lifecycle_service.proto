syntax = "proto3";

package acme.treasury.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/treasury/v1/treasury.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Treasury.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/treasury/v1;treasuryv1";
option java_multiple_files = true;
option java_outer_classname = "CashPositionLifecycleServiceProto";
option java_package = "com.acme.treasury.v1";

// Moves a cash position between the states of its lifecycle.
service CashPositionLifecycleService {
  // Activates a cash position.
  rpc ActivateCashPosition(ActivateCashPositionRequest) returns (ActivateCashPositionResponse);

  // Suspends a cash position.
  rpc SuspendCashPosition(SuspendCashPositionRequest) returns (SuspendCashPositionResponse);

  // Reinstates a cash position.
  rpc ReinstateCashPosition(ReinstateCashPositionRequest) returns (ReinstateCashPositionResponse);

  // Terminates a cash position.
  rpc TerminateCashPosition(TerminateCashPositionRequest) returns (TerminateCashPositionResponse);

  // Renews a cash position.
  rpc RenewCashPosition(RenewCashPositionRequest) returns (RenewCashPositionResponse);

  // Expires a cash position.
  rpc ExpireCashPosition(ExpireCashPositionRequest) returns (ExpireCashPositionResponse);

  // Returns a cash position.
  rpc GetCashPositionLifecycle(GetCashPositionLifecycleRequest) returns (GetCashPositionLifecycleResponse);

  // Schedules a cash position.
  rpc ScheduleCashPositionExpiry(ScheduleCashPositionExpiryRequest) returns (ScheduleCashPositionExpiryResponse);
}

// The request of `ActivateCashPosition`.
message ActivateCashPositionRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string cash_position_id = 2;
  ActivateCashPositionRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateCashPosition`.
message ActivateCashPositionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CashPosition cash_position = 1;
  ActivateCashPositionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

