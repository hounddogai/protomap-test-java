syntax = "proto3";

package acme.treasury.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/treasury/v1/treasury.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Treasury.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/treasury/v1;treasuryv1";
option java_multiple_files = true;
option java_outer_classname = "BankTransferReportingServiceProto";
option java_package = "com.acme.treasury.v1";

// Builds and schedules reports about bank transfers.
service BankTransferReportingService {
  // Generates a bank transfer.
  rpc GenerateBankTransferReport(GenerateBankTransferReportRequest) returns (GenerateBankTransferReportResponse);

  // Returns a bank transfer.
  rpc FetchBankTransferReport(FetchBankTransferReportRequest) returns (FetchBankTransferReportResponse);

  // Schedules a bank transfer.
  rpc ScheduleBankTransferReport(ScheduleBankTransferReportRequest) returns (ScheduleBankTransferReportResponse);

  // Streams the changes of bank transfers as they happen.
  rpc StreamBankTransferMetrics(StreamBankTransferMetricsRequest) returns (stream StreamBankTransferMetricsResponse);

  // Lists bank transfers a page at a time.
  rpc ListBankTransferReports(ListBankTransferReportsRequest) returns (ListBankTransferReportsResponse);

  // Shares a bank transfer.
  rpc ShareBankTransferReport(ShareBankTransferReportRequest) returns (ShareBankTransferReportResponse);

  // Counts bank transfers by status.
  rpc CountBankTransferTotals(CountBankTransferTotalsRequest) returns (CountBankTransferTotalsResponse);

  // Deletes a bank transfer.
  rpc DeleteBankTransferReport(DeleteBankTransferReportRequest) returns (DeleteBankTransferReportResponse);
}

// The request of `GenerateBankTransferReport`.
message GenerateBankTransferReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string bank_transfer_id = 2;
  GenerateBankTransferReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateBankTransferReport`.
message GenerateBankTransferReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchBankTransferReport`.
message FetchBankTransferReportRequest {
  acme.common.v1.RequestContext context = 1;
  string bank_transfer_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchBankTransferReport`.
message FetchBankTransferReportResponse {
  BankTransfer bank_transfer = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleBankTransferReport`.
message ScheduleBankTransferReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string bank_transfer_id = 2;
  ScheduleBankTransferReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleBankTransferReport`.
message ScheduleBankTransferReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamBankTransferMetrics`.
message StreamBankTransferMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated BankTransferStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamBankTransferMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamBankTransferMetrics`.
message StreamBankTransferMetricsResponse {
  BankTransfer bank_transfer = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListBankTransferReports`.
message ListBankTransferReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated BankTransferStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListBankTransferReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListBankTransferReports`.
message ListBankTransferReportsResponse {
  repeated BankTransfer bank_transfers = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareBankTransferReport`.
message ShareBankTransferReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string bank_transfer_id = 2;
  ShareBankTransferReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareBankTransferReport`.
message ShareBankTransferReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  BankTransfer bank_transfer = 1;
  ShareBankTransferReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountBankTransferTotals`.
message CountBankTransferTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated BankTransferStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountBankTransferTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountBankTransferTotals`.
message CountBankTransferTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteBankTransferReport`.
message DeleteBankTransferReportRequest {
  acme.common.v1.RequestContext context = 1;
  string bank_transfer_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteBankTransferReport`.
message DeleteBankTransferReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
