syntax = "proto3";

package acme.treasury.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/treasury/v1/treasury.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Treasury.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/treasury/v1;treasuryv1";
option java_multiple_files = true;
option java_outer_classname = "LiquidityForecastValidationServiceProto";
option java_package = "com.acme.treasury.v1";

// Checks liquidity forecasts against the rules before anything acts on them.
service LiquidityForecastValidationService {
  // Validates a liquidity forecast.
  rpc ValidateLiquidityForecast(ValidateLiquidityForecastRequest) returns (ValidateLiquidityForecastResponse);

  // Previews a liquidity forecast.
  rpc PreviewLiquidityForecast(PreviewLiquidityForecastRequest) returns (PreviewLiquidityForecastResponse);

  // Checks a liquidity forecast.
  rpc CheckLiquidityForecastEligibility(CheckLiquidityForecastEligibilityRequest) returns (CheckLiquidityForecastEligibilityResponse);

  // Explains a liquidity forecast.
  rpc ExplainLiquidityForecastDecision(ExplainLiquidityForecastDecisionRequest) returns (ExplainLiquidityForecastDecisionResponse);

  // Scores a liquidity forecast.
  rpc ScoreLiquidityForecast(ScoreLiquidityForecastRequest) returns (ScoreLiquidityForecastResponse);

  // Lints a liquidity forecast.
  rpc LintLiquidityForecasts(LintLiquidityForecastsRequest) returns (LintLiquidityForecastsResponse);

  // Returns a liquidity forecast.
  rpc GetLiquidityForecastRules(GetLiquidityForecastRulesRequest) returns (GetLiquidityForecastRulesResponse);
}

// The request of `ValidateLiquidityForecast`.
message ValidateLiquidityForecastRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string liquidity_forecast_id = 2;
  LiquidityForecast liquidity_forecast = 3;
  ValidateLiquidityForecastRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateLiquidityForecast`.
message ValidateLiquidityForecastResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  LiquidityForecast liquidity_forecast = 1;
  ValidateLiquidityForecastResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

