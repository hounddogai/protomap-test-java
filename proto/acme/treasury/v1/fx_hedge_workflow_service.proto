syntax = "proto3";

package acme.treasury.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/treasury/v1/treasury.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Treasury.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/treasury/v1;treasuryv1";
option java_multiple_files = true;
option java_outer_classname = "FxHedgeWorkflowServiceProto";
option java_package = "com.acme.treasury.v1";

// Runs the long-lived workflow that takes a fx hedge from start to finish.
service FxHedgeWorkflowService {
  // Starts a fx hedge.
  rpc StartFxHedgeWorkflow(StartFxHedgeWorkflowRequest) returns (StartFxHedgeWorkflowResponse);

  // Advances a fx hedge.
  rpc AdvanceFxHedgeWorkflow(AdvanceFxHedgeWorkflowRequest) returns (AdvanceFxHedgeWorkflowResponse);

  // Cancels a fx hedge.
  rpc CancelFxHedgeWorkflow(CancelFxHedgeWorkflowRequest) returns (CancelFxHedgeWorkflowResponse);

  // Retrys a fx hedge.
  rpc RetryFxHedgeWorkflow(RetryFxHedgeWorkflowRequest) returns (RetryFxHedgeWorkflowResponse);

  // Pauses a fx hedge.
  rpc PauseFxHedgeWorkflow(PauseFxHedgeWorkflowRequest) returns (PauseFxHedgeWorkflowResponse);

  // Resumes a fx hedge.
  rpc ResumeFxHedgeWorkflow(ResumeFxHedgeWorkflowRequest) returns (ResumeFxHedgeWorkflowResponse);

  // Returns a fx hedge.
  rpc InspectFxHedgeWorkflow(InspectFxHedgeWorkflowRequest) returns (InspectFxHedgeWorkflowResponse);

  // Lists fx hedges a page at a time.
  rpc ListFxHedgeWorkflows(ListFxHedgeWorkflowsRequest) returns (ListFxHedgeWorkflowsResponse);

  // Signals a fx hedge.
  rpc SignalFxHedgeWorkflow(SignalFxHedgeWorkflowRequest) returns (SignalFxHedgeWorkflowResponse);
}

// The request of `StartFxHedgeWorkflow`.
message StartFxHedgeWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string fx_hedge_id = 2;
  FxHedge fx_hedge = 3;
  StartFxHedgeWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartFxHedgeWorkflow`.
message StartFxHedgeWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FxHedge fx_hedge = 1;
  StartFxHedgeWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

