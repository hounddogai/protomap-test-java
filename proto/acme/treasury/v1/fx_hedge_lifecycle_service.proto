syntax = "proto3";

package acme.treasury.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/treasury/v1/treasury.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Treasury.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/treasury/v1;treasuryv1";
option java_multiple_files = true;
option java_outer_classname = "FxHedgeLifecycleServiceProto";
option java_package = "com.acme.treasury.v1";

// Moves a fx hedge between the states of its lifecycle.
service FxHedgeLifecycleService {
  // Activates a fx hedge.
  rpc ActivateFxHedge(ActivateFxHedgeRequest) returns (ActivateFxHedgeResponse);

  // Suspends a fx hedge.
  rpc SuspendFxHedge(SuspendFxHedgeRequest) returns (SuspendFxHedgeResponse);

  // Reinstates a fx hedge.
  rpc ReinstateFxHedge(ReinstateFxHedgeRequest) returns (ReinstateFxHedgeResponse);

  // Terminates a fx hedge.
  rpc TerminateFxHedge(TerminateFxHedgeRequest) returns (TerminateFxHedgeResponse);

  // Renews a fx hedge.
  rpc RenewFxHedge(RenewFxHedgeRequest) returns (RenewFxHedgeResponse);

  // Expires a fx hedge.
  rpc ExpireFxHedge(ExpireFxHedgeRequest) returns (ExpireFxHedgeResponse);

  // Returns a fx hedge.
  rpc GetFxHedgeLifecycle(GetFxHedgeLifecycleRequest) returns (GetFxHedgeLifecycleResponse);
}

// The request of `ActivateFxHedge`.
message ActivateFxHedgeRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string fx_hedge_id = 2;
  ActivateFxHedgeRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateFxHedge`.
message ActivateFxHedgeResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FxHedge fx_hedge = 1;
  ActivateFxHedgeResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

