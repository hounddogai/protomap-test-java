syntax = "proto3";

package acme.treasury.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/treasury/v1/treasury.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Treasury.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/treasury/v1;treasuryv1";
option java_multiple_files = true;
option java_outer_classname = "BankTransferValidationServiceProto";
option java_package = "com.acme.treasury.v1";

// Checks bank transfers against the rules before anything acts on them.
service BankTransferValidationService {
  // Validates a bank transfer.
  rpc ValidateBankTransfer(ValidateBankTransferRequest) returns (ValidateBankTransferResponse);

  // Previews a bank transfer.
  rpc PreviewBankTransfer(PreviewBankTransferRequest) returns (PreviewBankTransferResponse);

  // Checks a bank transfer.
  rpc CheckBankTransferEligibility(CheckBankTransferEligibilityRequest) returns (CheckBankTransferEligibilityResponse);

  // Normalizes a bank transfer.
  rpc NormalizeBankTransfer(NormalizeBankTransferRequest) returns (NormalizeBankTransferResponse);

  // Explains a bank transfer.
  rpc ExplainBankTransferDecision(ExplainBankTransferDecisionRequest) returns (ExplainBankTransferDecisionResponse);

  // Scores a bank transfer.
  rpc ScoreBankTransfer(ScoreBankTransferRequest) returns (ScoreBankTransferResponse);
}

// The request of `ValidateBankTransfer`.
message ValidateBankTransferRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string bank_transfer_id = 2;
  BankTransfer bank_transfer = 3;
  ValidateBankTransferRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateBankTransfer`.
message ValidateBankTransferResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  BankTransfer bank_transfer = 1;
  ValidateBankTransferResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

