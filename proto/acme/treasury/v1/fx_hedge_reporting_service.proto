syntax = "proto3";

package acme.treasury.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/treasury/v1/treasury.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Treasury.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/treasury/v1;treasuryv1";
option java_multiple_files = true;
option java_outer_classname = "FxHedgeReportingServiceProto";
option java_package = "com.acme.treasury.v1";

// Builds and schedules reports about fx hedges.
service FxHedgeReportingService {
  // Generates a fx hedge.
  rpc GenerateFxHedgeReport(GenerateFxHedgeReportRequest) returns (GenerateFxHedgeReportResponse);

  // Returns a fx hedge.
  rpc FetchFxHedgeReport(FetchFxHedgeReportRequest) returns (FetchFxHedgeReportResponse);

  // Streams the changes of fx hedges as they happen.
  rpc StreamFxHedgeMetrics(StreamFxHedgeMetricsRequest) returns (stream StreamFxHedgeMetricsResponse);

  // Lists fx hedges a page at a time.
  rpc ListFxHedgeReports(ListFxHedgeReportsRequest) returns (ListFxHedgeReportsResponse);

  // Counts fx hedges by status.
  rpc CountFxHedgeTotals(CountFxHedgeTotalsRequest) returns (CountFxHedgeTotalsResponse);

  // Deletes a fx hedge.
  rpc DeleteFxHedgeReport(DeleteFxHedgeReportRequest) returns (DeleteFxHedgeReportResponse);
}

// The request of `GenerateFxHedgeReport`.
message GenerateFxHedgeReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string fx_hedge_id = 2;
  GenerateFxHedgeReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateFxHedgeReport`.
message GenerateFxHedgeReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchFxHedgeReport`.
message FetchFxHedgeReportRequest {
  acme.common.v1.RequestContext context = 1;
  string fx_hedge_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchFxHedgeReport`.
message FetchFxHedgeReportResponse {
  FxHedge fx_hedge = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `StreamFxHedgeMetrics`.
message StreamFxHedgeMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FxHedgeStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamFxHedgeMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamFxHedgeMetrics`.
message StreamFxHedgeMetricsResponse {
  FxHedge fx_hedge = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListFxHedgeReports`.
message ListFxHedgeReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FxHedgeStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListFxHedgeReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListFxHedgeReports`.
message ListFxHedgeReportsResponse {
  repeated FxHedge fx_hedges = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountFxHedgeTotals`.
message CountFxHedgeTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FxHedgeStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountFxHedgeTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountFxHedgeTotals`.
message CountFxHedgeTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteFxHedgeReport`.
message DeleteFxHedgeReportRequest {
  acme.common.v1.RequestContext context = 1;
  string fx_hedge_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteFxHedgeReport`.
message DeleteFxHedgeReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
