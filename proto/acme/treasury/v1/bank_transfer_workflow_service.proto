option csharp_namespace = "Acme.Treasury.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/treasury/v1;treasuryv1";
option java_multiple_files = true;
option java_outer_classname = "BankTransferWorkflowServiceProto";
option java_package = "com.acme.treasury.v1";

// Runs the long-lived workflow that takes a bank transfer from start to finish.
service BankTransferWorkflowService {
  // Starts a bank transfer.
  rpc StartBankTransferWorkflow(StartBankTransferWorkflowRequest) returns (StartBankTransferWorkflowResponse);

  // Advances a bank transfer.
  rpc AdvanceBankTransferWorkflow(AdvanceBankTransferWorkflowRequest) returns (AdvanceBankTransferWorkflowResponse);

  // Cancels a bank transfer.
  rpc CancelBankTransferWorkflow(CancelBankTransferWorkflowRequest) returns (CancelBankTransferWorkflowResponse);

  // Retrys a bank transfer.
  rpc RetryBankTransferWorkflow(RetryBankTransferWorkflowRequest) returns (RetryBankTransferWorkflowResponse);

  // Pauses a bank transfer.
  rpc PauseBankTransferWorkflow(PauseBankTransferWorkflowRequest) returns (PauseBankTransferWorkflowResponse);

  // Resumes a bank transfer.
  rpc ResumeBankTransferWorkflow(ResumeBankTransferWorkflowRequest) returns (ResumeBankTransferWorkflowResponse);

  // Returns a bank transfer.
  rpc InspectBankTransferWorkflow(InspectBankTransferWorkflowRequest) returns (InspectBankTransferWorkflowResponse);

  // Lists bank transfers a page at a time.
  rpc ListBankTransferWorkflows(ListBankTransferWorkflowsRequest) returns (ListBankTransferWorkflowsResponse);

  // Signals a bank transfer.
  rpc SignalBankTransferWorkflow(SignalBankTransferWorkflowRequest) returns (SignalBankTransferWorkflowResponse);
}

// The request of `StartBankTransferWorkflow`.
message StartBankTransferWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string bank_transfer_id = 2;
  BankTransfer bank_transfer = 3;
  StartBankTransferWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartBankTransferWorkflow`.
message StartBankTransferWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  BankTransfer bank_transfer = 1;
  StartBankTransferWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

