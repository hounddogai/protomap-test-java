syntax = "proto3";

package acme.treasury.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/treasury/v1/treasury.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Treasury.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/treasury/v1;treasuryv1";
option java_multiple_files = true;
option java_outer_classname = "BankTransferQueryServiceProto";
option java_package = "com.acme.treasury.v1";

// Answers read-only questions about bank transfers, for screens and reports.
service BankTransferQueryService {
  // Returns a bank transfer.
  rpc LookupBankTransfer(LookupBankTransferRequest) returns (LookupBankTransferResponse);

  // Lists bank transfers a page at a time.
  rpc BrowseBankTransfers(BrowseBankTransfersRequest) returns (BrowseBankTransfersResponse);

  // Lists bank transfers a page at a time.
  rpc FindBankTransfers(FindBankTransfersRequest) returns (FindBankTransfersResponse);

  // Counts bank transfers by status.
  rpc CountBankTransfers(CountBankTransfersRequest) returns (CountBankTransfersResponse);

  // Returns several bank transfers at once.
  rpc ResolveBankTransfers(ResolveBankTransfersRequest) returns (ResolveBankTransfersResponse);

  // Lists bank transfers a page at a time.
  rpc SuggestBankTransfers(SuggestBankTransfersRequest) returns (SuggestBankTransfersResponse);

  // Returns a bank transfer.
  rpc PeekBankTransfer(PeekBankTransferRequest) returns (PeekBankTransferResponse);
}

// The request of `LookupBankTransfer`.
message LookupBankTransferRequest {
  acme.common.v1.RequestContext context = 1;
  string bank_transfer_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupBankTransfer`.
message LookupBankTransferResponse {
  BankTransfer bank_transfer = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseBankTransfers`.
message BrowseBankTransfersRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated BankTransferStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseBankTransfersRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseBankTransfers`.
message BrowseBankTransfersResponse {
  repeated BankTransfer bank_transfers = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindBankTransfers`.
message FindBankTransfersRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated BankTransferStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindBankTransfersRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindBankTransfers`.
message FindBankTransfersResponse {
  repeated BankTransfer bank_transfers = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountBankTransfers`.
message CountBankTransfersRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated BankTransferStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountBankTransfersRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountBankTransfers`.
message CountBankTransfersResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveBankTransfers`.
message ResolveBankTransfersRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string bank_transfer_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveBankTransfers`.
message ResolveBankTransfersResponse {
  repeated BankTransfer bank_transfers = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SuggestBankTransfers`.
message SuggestBankTransfersRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated BankTransferStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestBankTransfersRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestBankTransfers`.
message SuggestBankTransfersResponse {
  repeated BankTransfer bank_transfers = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekBankTransfer`.
message PeekBankTransferRequest {
  acme.common.v1.RequestContext context = 1;
  string bank_transfer_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekBankTransfer`.
message PeekBankTransferResponse {
  BankTransfer bank_transfer = 1;
  acme.common.v1.OperationResult result = 2;
}
