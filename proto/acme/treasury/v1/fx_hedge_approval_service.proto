syntax = "proto3";

package acme.treasury.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/treasury/v1/treasury.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Treasury.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/treasury/v1;treasuryv1";
option java_multiple_files = true;
option java_outer_classname = "FxHedgeApprovalServiceProto";
option java_package = "com.acme.treasury.v1";

// Routes fx hedges through approval, with escalation and delegation.
service FxHedgeApprovalService {
  // Submits a fx hedge.
  rpc SubmitFxHedge(SubmitFxHedgeRequest) returns (SubmitFxHedgeResponse);

  // Approves a fx hedge.
  rpc ApproveFxHedge(ApproveFxHedgeRequest) returns (ApproveFxHedgeResponse);

  // Escalates a fx hedge.
  rpc EscalateFxHedge(EscalateFxHedgeRequest) returns (EscalateFxHedgeResponse);

  // Lists fx hedges a page at a time.
  rpc ListPendingFxHedges(ListPendingFxHedgesRequest) returns (ListPendingFxHedgesResponse);

  // Returns a fx hedge.
  rpc GetFxHedgeApprovalStatus(GetFxHedgeApprovalStatusRequest) returns (GetFxHedgeApprovalStatusResponse);

  // Comments a fx hedge.
  rpc CommentFxHedgeApproval(CommentFxHedgeApprovalRequest) returns (CommentFxHedgeApprovalResponse);
}

// The request of `SubmitFxHedge`.
message SubmitFxHedgeRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string fx_hedge_id = 2;
  FxHedge fx_hedge = 3;
  SubmitFxHedgeRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitFxHedge`.
message SubmitFxHedgeResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FxHedge fx_hedge = 1;
  SubmitFxHedgeResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ApproveFxHedge`.
message ApproveFxHedgeRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string fx_hedge_id = 2;
  FxHedge fx_hedge = 3;
  ApproveFxHedgeRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ApproveFxHedge`.
message ApproveFxHedgeResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FxHedge fx_hedge = 1;
  ApproveFxHedgeResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `EscalateFxHedge`.
message EscalateFxHedgeRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string fx_hedge_id = 2;
  FxHedge fx_hedge = 3;
  EscalateFxHedgeRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `EscalateFxHedge`.
message EscalateFxHedgeResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FxHedge fx_hedge = 1;
  EscalateFxHedgeResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListPendingFxHedges`.
message ListPendingFxHedgesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FxHedgeStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListPendingFxHedgesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListPendingFxHedges`.
message ListPendingFxHedgesResponse {
  repeated FxHedge fx_hedges = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetFxHedgeApprovalStatus`.
message GetFxHedgeApprovalStatusRequest {
  acme.common.v1.RequestContext context = 1;
  string fx_hedge_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetFxHedgeApprovalStatus`.
message GetFxHedgeApprovalStatusResponse {
  FxHedge fx_hedge = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `CommentFxHedgeApproval`.
message CommentFxHedgeApprovalRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string fx_hedge_id = 2;
  FxHedge fx_hedge = 3;
  CommentFxHedgeApprovalRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CommentFxHedgeApproval`.
message CommentFxHedgeApprovalResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FxHedge fx_hedge = 1;
  CommentFxHedgeApprovalResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}
