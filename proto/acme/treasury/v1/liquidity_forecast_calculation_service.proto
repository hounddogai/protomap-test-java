syntax = "proto3";

package acme.treasury.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/treasury/v1/treasury.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Treasury.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/treasury/v1;treasuryv1";
option java_multiple_files = true;
option java_outer_classname = "LiquidityForecastCalculationServiceProto";
option java_package = "com.acme.treasury.v1";

// Computes the figures of a liquidity forecast, such as totals, taxes, and estimates.
service LiquidityForecastCalculationService {
  // Calculates a liquidity forecast.
  rpc CalculateLiquidityForecast(CalculateLiquidityForecastRequest) returns (CalculateLiquidityForecastResponse);

  // Estimates a liquidity forecast.
  rpc EstimateLiquidityForecast(EstimateLiquidityForecastRequest) returns (EstimateLiquidityForecastResponse);

  // Quotes a liquidity forecast.
  rpc QuoteLiquidityForecast(QuoteLiquidityForecastRequest) returns (QuoteLiquidityForecastResponse);

  // Compares a liquidity forecast.
  rpc CompareLiquidityForecastOptions(CompareLiquidityForecastOptionsRequest) returns (CompareLiquidityForecastOptionsResponse);

  // Recalculates a liquidity forecast.
  rpc RecalculateLiquidityForecasts(RecalculateLiquidityForecastsRequest) returns (RecalculateLiquidityForecastsResponse);

  // Simulates a liquidity forecast.
  rpc SimulateLiquidityForecast(SimulateLiquidityForecastRequest) returns (SimulateLiquidityForecastResponse);

  // Explains a liquidity forecast.
  rpc ExplainLiquidityForecastCalculation(ExplainLiquidityForecastCalculationRequest) returns (ExplainLiquidityForecastCalculationResponse);

  // Returns a liquidity forecast.
  rpc GetLiquidityForecastRates(GetLiquidityForecastRatesRequest) returns (GetLiquidityForecastRatesResponse);
}

// The request of `CalculateLiquidityForecast`.
message CalculateLiquidityForecastRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string liquidity_forecast_id = 2;
  LiquidityForecast liquidity_forecast = 3;
  CalculateLiquidityForecastRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateLiquidityForecast`.
message CalculateLiquidityForecastResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateLiquidityForecastResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  LiquidityForecast liquidity_forecast = 1;
  CalculateLiquidityForecastResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

