syntax = "proto3";

package acme.assets.v1;

import "acme/assets/v1/assets.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Assets.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/assets/v1;assetsv1";
option java_multiple_files = true;
option java_outer_classname = "AssetTransferLifecycleServiceProto";
option java_package = "com.acme.assets.v1";

// Moves an asset transfer between the states of its lifecycle.
service AssetTransferLifecycleService {
  // Activates an asset transfer.
  rpc ActivateAssetTransfer(ActivateAssetTransferRequest) returns (ActivateAssetTransferResponse);

  // Suspends an asset transfer.
  rpc SuspendAssetTransfer(SuspendAssetTransferRequest) returns (SuspendAssetTransferResponse);

  // Reinstates an asset transfer.
  rpc ReinstateAssetTransfer(ReinstateAssetTransferRequest) returns (ReinstateAssetTransferResponse);

  // Terminates an asset transfer.
  rpc TerminateAssetTransfer(TerminateAssetTransferRequest) returns (TerminateAssetTransferResponse);

  // Renews an asset transfer.
  rpc RenewAssetTransfer(RenewAssetTransferRequest) returns (RenewAssetTransferResponse);

  // Expires an asset transfer.
  rpc ExpireAssetTransfer(ExpireAssetTransferRequest) returns (ExpireAssetTransferResponse);

  // Returns an asset transfer.
  rpc GetAssetTransferLifecycle(GetAssetTransferLifecycleRequest) returns (GetAssetTransferLifecycleResponse);

  // Schedules an asset transfer.
  rpc ScheduleAssetTransferExpiry(ScheduleAssetTransferExpiryRequest) returns (ScheduleAssetTransferExpiryResponse);
}

// The request of `ActivateAssetTransfer`.
message ActivateAssetTransferRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string asset_transfer_id = 2;
  ActivateAssetTransferRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateAssetTransfer`.
message ActivateAssetTransferResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  AssetTransfer asset_transfer = 1;
  ActivateAssetTransferResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

