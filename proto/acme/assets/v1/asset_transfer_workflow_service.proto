syntax = "proto3";

package acme.assets.v1;

import "acme/assets/v1/assets.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Assets.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/assets/v1;assetsv1";
option java_multiple_files = true;
option java_outer_classname = "AssetTransferWorkflowServiceProto";
option java_package = "com.acme.assets.v1";

// Runs the long-lived workflow that takes an asset transfer from start to finish.
service AssetTransferWorkflowService {
  // Starts an asset transfer.
  rpc StartAssetTransferWorkflow(StartAssetTransferWorkflowRequest) returns (StartAssetTransferWorkflowResponse);

  // Advances an asset transfer.
  rpc AdvanceAssetTransferWorkflow(AdvanceAssetTransferWorkflowRequest) returns (AdvanceAssetTransferWorkflowResponse);

  // Cancels an asset transfer.
  rpc CancelAssetTransferWorkflow(CancelAssetTransferWorkflowRequest) returns (CancelAssetTransferWorkflowResponse);

  // Pauses an asset transfer.
  rpc PauseAssetTransferWorkflow(PauseAssetTransferWorkflowRequest) returns (PauseAssetTransferWorkflowResponse);

  // Resumes an asset transfer.
  rpc ResumeAssetTransferWorkflow(ResumeAssetTransferWorkflowRequest) returns (ResumeAssetTransferWorkflowResponse);

  // Returns an asset transfer.
  rpc InspectAssetTransferWorkflow(InspectAssetTransferWorkflowRequest) returns (InspectAssetTransferWorkflowResponse);

  // Lists asset transfers a page at a time.
  rpc ListAssetTransferWorkflows(ListAssetTransferWorkflowsRequest) returns (ListAssetTransferWorkflowsResponse);

  // Signals an asset transfer.
  rpc SignalAssetTransferWorkflow(SignalAssetTransferWorkflowRequest) returns (SignalAssetTransferWorkflowResponse);
}

// The request of `StartAssetTransferWorkflow`.
message StartAssetTransferWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string asset_transfer_id = 2;
  AssetTransfer asset_transfer = 3;
  StartAssetTransferWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartAssetTransferWorkflow`.
message StartAssetTransferWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  AssetTransfer asset_transfer = 1;
  StartAssetTransferWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

