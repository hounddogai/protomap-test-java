syntax = "proto3";

package acme.assets.v1;

import "acme/assets/v1/assets.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Assets.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/assets/v1;assetsv1";
option java_multiple_files = true;
option java_outer_classname = "AssetTransferSyncServiceProto";
option java_package = "com.acme.assets.v1";

// Keeps asset transfers in step with the systems of record in other regions.
service AssetTransferSyncService {
  // Syncs an asset transfer.
  rpc SyncAssetTransfers(SyncAssetTransfersRequest) returns (SyncAssetTransfersResponse);

  // Pushs an asset transfer.
  rpc PushAssetTransfer(PushAssetTransferRequest) returns (PushAssetTransferResponse);

  // Pulls an asset transfer.
  rpc PullAssetTransfers(PullAssetTransfersRequest) returns (PullAssetTransfersResponse);

  // Reconciles an asset transfer.
  rpc ReconcileAssetTransfers(ReconcileAssetTransfersRequest) returns (ReconcileAssetTransfersResponse);

  // Returns an asset transfer.
  rpc GetAssetTransferSyncState(GetAssetTransferSyncStateRequest) returns (GetAssetTransferSyncStateResponse);

  // Lists asset transfers a page at a time.
  rpc ListAssetTransferConflicts(ListAssetTransferConflictsRequest) returns (ListAssetTransferConflictsResponse);
}

// The request of `SyncAssetTransfers`.
message SyncAssetTransfersRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string asset_transfer_id = 2;
  AssetTransfer asset_transfer = 3;
  SyncAssetTransfersRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SyncAssetTransfers`.
message SyncAssetTransfersResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  AssetTransfer asset_transfer = 1;
  SyncAssetTransfersResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PushAssetTransfer`.
message PushAssetTransferRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string asset_transfer_id = 2;
  AssetTransfer asset_transfer = 3;
  PushAssetTransferRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `PushAssetTransfer`.
message PushAssetTransferResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  AssetTransfer asset_transfer = 1;
  PushAssetTransferResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PullAssetTransfers`.
message PullAssetTransfersRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string asset_transfer_id = 2;
  AssetTransfer asset_transfer = 3;
  PullAssetTransfersRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `PullAssetTransfers`.
message PullAssetTransfersResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  AssetTransfer asset_transfer = 1;
  PullAssetTransfersResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ReconcileAssetTransfers`.
message ReconcileAssetTransfersRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string asset_transfer_id = 2;
  AssetTransfer asset_transfer = 3;
  ReconcileAssetTransfersRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ReconcileAssetTransfers`.
message ReconcileAssetTransfersResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  AssetTransfer asset_transfer = 1;
  ReconcileAssetTransfersResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetAssetTransferSyncState`.
message GetAssetTransferSyncStateRequest {
  acme.common.v1.RequestContext context = 1;
  string asset_transfer_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetAssetTransferSyncState`.
message GetAssetTransferSyncStateResponse {
  AssetTransfer asset_transfer = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ListAssetTransferConflicts`.
message ListAssetTransferConflictsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated AssetTransferStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListAssetTransferConflictsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListAssetTransferConflicts`.
message ListAssetTransferConflictsResponse {
  repeated AssetTransfer asset_transfers = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}
