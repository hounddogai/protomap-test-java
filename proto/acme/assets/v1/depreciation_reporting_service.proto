syntax = "proto3";

package acme.assets.v1;

import "acme/assets/v1/assets.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Assets.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/assets/v1;assetsv1";
option java_multiple_files = true;
option java_outer_classname = "DepreciationReportingServiceProto";
option java_package = "com.acme.assets.v1";

// Builds and schedules reports about depreciations.
service DepreciationReportingService {
  // Generates a depreciation.
  rpc GenerateDepreciationReport(GenerateDepreciationReportRequest) returns (GenerateDepreciationReportResponse);

  // Returns a depreciation.
  rpc FetchDepreciationReport(FetchDepreciationReportRequest) returns (FetchDepreciationReportResponse);

  // Streams the changes of depreciations as they happen.
  rpc StreamDepreciationMetrics(StreamDepreciationMetricsRequest) returns (stream StreamDepreciationMetricsResponse);

  // Lists depreciations a page at a time.
  rpc ListDepreciationReports(ListDepreciationReportsRequest) returns (ListDepreciationReportsResponse);

  // Shares a depreciation.
  rpc ShareDepreciationReport(ShareDepreciationReportRequest) returns (ShareDepreciationReportResponse);

  // Deletes a depreciation.
  rpc DeleteDepreciationReport(DeleteDepreciationReportRequest) returns (DeleteDepreciationReportResponse);
}

// The request of `GenerateDepreciationReport`.
message GenerateDepreciationReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string depreciation_id = 2;
  GenerateDepreciationReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateDepreciationReport`.
message GenerateDepreciationReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchDepreciationReport`.
message FetchDepreciationReportRequest {
  acme.common.v1.RequestContext context = 1;
  string depreciation_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchDepreciationReport`.
message FetchDepreciationReportResponse {
  Depreciation depreciation = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `StreamDepreciationMetrics`.
message StreamDepreciationMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DepreciationStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamDepreciationMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamDepreciationMetrics`.
message StreamDepreciationMetricsResponse {
  Depreciation depreciation = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListDepreciationReports`.
message ListDepreciationReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DepreciationStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListDepreciationReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListDepreciationReports`.
message ListDepreciationReportsResponse {
  repeated Depreciation depreciations = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareDepreciationReport`.
message ShareDepreciationReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string depreciation_id = 2;
  ShareDepreciationReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareDepreciationReport`.
message ShareDepreciationReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Depreciation depreciation = 1;
  ShareDepreciationReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteDepreciationReport`.
message DeleteDepreciationReportRequest {
  acme.common.v1.RequestContext context = 1;
  string depreciation_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteDepreciationReport`.
message DeleteDepreciationReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
