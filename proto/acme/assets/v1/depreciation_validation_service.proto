syntax = "proto3";

package acme.assets.v1;

import "acme/assets/v1/assets.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Assets.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/assets/v1;assetsv1";
option java_multiple_files = true;
option java_outer_classname = "DepreciationValidationServiceProto";
option java_package = "com.acme.assets.v1";

// Checks depreciations against the rules before anything acts on them.
service DepreciationValidationService {
  // Validates a depreciation.
  rpc ValidateDepreciation(ValidateDepreciationRequest) returns (ValidateDepreciationResponse);

  // Previews a depreciation.
  rpc PreviewDepreciation(PreviewDepreciationRequest) returns (PreviewDepreciationResponse);

  // Checks a depreciation.
  rpc CheckDepreciationEligibility(CheckDepreciationEligibilityRequest) returns (CheckDepreciationEligibilityResponse);

  // Normalizes a depreciation.
  rpc NormalizeDepreciation(NormalizeDepreciationRequest) returns (NormalizeDepreciationResponse);

  // Explains a depreciation.
  rpc ExplainDepreciationDecision(ExplainDepreciationDecisionRequest) returns (ExplainDepreciationDecisionResponse);

  // Scores a depreciation.
  rpc ScoreDepreciation(ScoreDepreciationRequest) returns (ScoreDepreciationResponse);

  // Lints a depreciation.
  rpc LintDepreciations(LintDepreciationsRequest) returns (LintDepreciationsResponse);

  // Returns a depreciation.
  rpc GetDepreciationRules(GetDepreciationRulesRequest) returns (GetDepreciationRulesResponse);
}

// The request of `ValidateDepreciation`.
message ValidateDepreciationRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string depreciation_id = 2;
  Depreciation depreciation = 3;
  ValidateDepreciationRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateDepreciation`.
message ValidateDepreciationResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Depreciation depreciation = 1;
  ValidateDepreciationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

