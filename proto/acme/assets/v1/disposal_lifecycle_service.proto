syntax = "proto3";

package acme.assets.v1;

import "acme/assets/v1/assets.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Assets.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/assets/v1;assetsv1";
option java_multiple_files = true;
option java_outer_classname = "DisposalLifecycleServiceProto";
option java_package = "com.acme.assets.v1";

// Moves a disposal between the states of its lifecycle.
service DisposalLifecycleService {
  // Activates a disposal.
  rpc ActivateDisposal(ActivateDisposalRequest) returns (ActivateDisposalResponse);

  // Suspends a disposal.
  rpc SuspendDisposal(SuspendDisposalRequest) returns (SuspendDisposalResponse);

  // Reinstates a disposal.
  rpc ReinstateDisposal(ReinstateDisposalRequest) returns (ReinstateDisposalResponse);

  // Terminates a disposal.
  rpc TerminateDisposal(TerminateDisposalRequest) returns (TerminateDisposalResponse);

  // Renews a disposal.
  rpc RenewDisposal(RenewDisposalRequest) returns (RenewDisposalResponse);

  // Expires a disposal.
  rpc ExpireDisposal(ExpireDisposalRequest) returns (ExpireDisposalResponse);

  // Returns a disposal.
  rpc GetDisposalLifecycle(GetDisposalLifecycleRequest) returns (GetDisposalLifecycleResponse);

  // Schedules a disposal.
  rpc ScheduleDisposalExpiry(ScheduleDisposalExpiryRequest) returns (ScheduleDisposalExpiryResponse);
}

// The request of `ActivateDisposal`.
message ActivateDisposalRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string disposal_id = 2;
  ActivateDisposalRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateDisposal`.
message ActivateDisposalResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Disposal disposal = 1;
  ActivateDisposalResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

