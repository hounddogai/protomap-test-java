syntax = "proto3";

package acme.assets.v1;

import "acme/assets/v1/assets.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Assets.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/assets/v1;assetsv1";
option java_multiple_files = true;
option java_outer_classname = "DisposalSyncServiceProto";
option java_package = "com.acme.assets.v1";

// Keeps disposals in step with the systems of record in other regions.
service DisposalSyncService {
  // Syncs a disposal.
  rpc SyncDisposals(SyncDisposalsRequest) returns (SyncDisposalsResponse);

  // Pushs a disposal.
  rpc PushDisposal(PushDisposalRequest) returns (PushDisposalResponse);

  // Reconciles a disposal.
  rpc ReconcileDisposals(ReconcileDisposalsRequest) returns (ReconcileDisposalsResponse);

  // Exchanges changes of disposals with a peer.
  rpc StreamDisposalChanges(stream StreamDisposalChangesRequest) returns (stream StreamDisposalChangesResponse);

  // Returns a disposal.
  rpc GetDisposalSyncState(GetDisposalSyncStateRequest) returns (GetDisposalSyncStateResponse);

  // Lists disposals a page at a time.
  rpc ListDisposalConflicts(ListDisposalConflictsRequest) returns (ListDisposalConflictsResponse);
}

// The request of `SyncDisposals`.
message SyncDisposalsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string disposal_id = 2;
  Disposal disposal = 3;
  SyncDisposalsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SyncDisposals`.
message SyncDisposalsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Disposal disposal = 1;
  SyncDisposalsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PushDisposal`.
message PushDisposalRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string disposal_id = 2;
  Disposal disposal = 3;
  PushDisposalRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `PushDisposal`.
message PushDisposalResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Disposal disposal = 1;
  PushDisposalResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ReconcileDisposals`.
message ReconcileDisposalsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string disposal_id = 2;
  Disposal disposal = 3;
  ReconcileDisposalsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ReconcileDisposals`.
message ReconcileDisposalsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Disposal disposal = 1;
  ReconcileDisposalsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `StreamDisposalChanges`.
message StreamDisposalChangesRequest {
  // An acknowledgment of a change the peer sent.
  message ChangeAck {
    int64 sequence = 1;
    string status = 2;
  }

  acme.common.v1.RequestContext context = 1;
  oneof frame {
    Disposal change = 2;
    StreamDisposalChangesRequest.ChangeAck ack = 3;
  }
  string cursor = 4;
}

// The response of `StreamDisposalChanges`.
message StreamDisposalChangesResponse {
  Disposal disposal = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `GetDisposalSyncState`.
message GetDisposalSyncStateRequest {
  acme.common.v1.RequestContext context = 1;
  string disposal_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetDisposalSyncState`.
message GetDisposalSyncStateResponse {
  Disposal disposal = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ListDisposalConflicts`.
message ListDisposalConflictsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DisposalStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListDisposalConflictsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListDisposalConflicts`.
message ListDisposalConflictsResponse {
  repeated Disposal disposals = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}
