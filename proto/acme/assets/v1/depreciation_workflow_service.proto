syntax = "proto3";

package acme.assets.v1;

import "acme/assets/v1/assets.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Assets.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/assets/v1;assetsv1";
option java_multiple_files = true;
option java_outer_classname = "DepreciationWorkflowServiceProto";
option java_package = "com.acme.assets.v1";

// Runs the long-lived workflow that takes a depreciation from start to finish.
service DepreciationWorkflowService {
  // Starts a depreciation.
  rpc StartDepreciationWorkflow(StartDepreciationWorkflowRequest) returns (StartDepreciationWorkflowResponse);

  // Advances a depreciation.
  rpc AdvanceDepreciationWorkflow(AdvanceDepreciationWorkflowRequest) returns (AdvanceDepreciationWorkflowResponse);

  // Cancels a depreciation.
  rpc CancelDepreciationWorkflow(CancelDepreciationWorkflowRequest) returns (CancelDepreciationWorkflowResponse);

  // Retrys a depreciation.
  rpc RetryDepreciationWorkflow(RetryDepreciationWorkflowRequest) returns (RetryDepreciationWorkflowResponse);

  // Pauses a depreciation.
  rpc PauseDepreciationWorkflow(PauseDepreciationWorkflowRequest) returns (PauseDepreciationWorkflowResponse);

  // Resumes a depreciation.
  rpc ResumeDepreciationWorkflow(ResumeDepreciationWorkflowRequest) returns (ResumeDepreciationWorkflowResponse);

  // Returns a depreciation.
  rpc InspectDepreciationWorkflow(InspectDepreciationWorkflowRequest) returns (InspectDepreciationWorkflowResponse);

  // Lists depreciations a page at a time.
  rpc ListDepreciationWorkflows(ListDepreciationWorkflowsRequest) returns (ListDepreciationWorkflowsResponse);
}

// The request of `StartDepreciationWorkflow`.
message StartDepreciationWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string depreciation_id = 2;
  Depreciation depreciation = 3;
  StartDepreciationWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartDepreciationWorkflow`.
message StartDepreciationWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Depreciation depreciation = 1;
  StartDepreciationWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

