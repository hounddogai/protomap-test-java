  Disposal disposal = 1;
  LintDisposalsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetDisposalRules`.
message GetDisposalRulesRequest {
  acme.common.v1.RequestContext context = 1;
  string disposal_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetDisposalRules`.
message GetDisposalRulesResponse {
  Disposal disposal = 1;
  acme.common.v1.OperationResult result = 2;
}
