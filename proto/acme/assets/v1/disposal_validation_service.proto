syntax = "proto3";

package acme.assets.v1;

import "acme/assets/v1/assets.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Assets.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/assets/v1;assetsv1";
option java_multiple_files = true;
option java_outer_classname = "DisposalValidationServiceProto";
option java_package = "com.acme.assets.v1";

// Checks disposals against the rules before anything acts on them.
service DisposalValidationService {
  // Validates a disposal.
  rpc ValidateDisposal(ValidateDisposalRequest) returns (ValidateDisposalResponse);

  // Previews a disposal.
  rpc PreviewDisposal(PreviewDisposalRequest) returns (PreviewDisposalResponse);

  // Normalizes a disposal.
  rpc NormalizeDisposal(NormalizeDisposalRequest) returns (NormalizeDisposalResponse);

  // Scores a disposal.
  rpc ScoreDisposal(ScoreDisposalRequest) returns (ScoreDisposalResponse);

  // Lints a disposal.
  rpc LintDisposals(LintDisposalsRequest) returns (LintDisposalsResponse);

  // Returns a disposal.
  rpc GetDisposalRules(GetDisposalRulesRequest) returns (GetDisposalRulesResponse);
}

// The request of `ValidateDisposal`.
message ValidateDisposalRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string disposal_id = 2;
  Disposal disposal = 3;
  ValidateDisposalRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateDisposal`.
message ValidateDisposalResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Disposal disposal = 1;
  ValidateDisposalResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PreviewDisposal`.
message PreviewDisposalRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string disposal_id = 2;
  Disposal disposal = 3;
  PreviewDisposalRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `PreviewDisposal`.
message PreviewDisposalResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Disposal disposal = 1;
  PreviewDisposalResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `NormalizeDisposal`.
message NormalizeDisposalRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string disposal_id = 2;
  Disposal disposal = 3;
  NormalizeDisposalRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `NormalizeDisposal`.
message NormalizeDisposalResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Disposal disposal = 1;
  NormalizeDisposalResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ScoreDisposal`.
message ScoreDisposalRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string disposal_id = 2;
  Disposal disposal = 3;
  ScoreDisposalRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ScoreDisposal`.
message ScoreDisposalResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated ScoreDisposalResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Disposal disposal = 1;
  ScoreDisposalResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

