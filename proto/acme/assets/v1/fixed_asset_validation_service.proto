    google.protobuf.Timestamp effective_at = 5;
  }

  FixedAsset fixed_asset = 1;
  LintFixedAssetsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetFixedAssetRules`.
message GetFixedAssetRulesRequest {
  acme.common.v1.RequestContext context = 1;
  string fixed_asset_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetFixedAssetRules`.
message GetFixedAssetRulesResponse {
  FixedAsset fixed_asset = 1;
  acme.common.v1.OperationResult result = 2;
}
