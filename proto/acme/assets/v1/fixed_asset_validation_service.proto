syntax = "proto3";

package acme.assets.v1;

import "acme/assets/v1/assets.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Assets.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/assets/v1;assetsv1";
option java_multiple_files = true;
option java_outer_classname = "FixedAssetValidationServiceProto";
option java_package = "com.acme.assets.v1";

// Checks fixed assets against the rules before anything acts on them.
service FixedAssetValidationService {
  // Validates a fixed asset.
  rpc ValidateFixedAsset(ValidateFixedAssetRequest) returns (ValidateFixedAssetResponse);

  // Previews a fixed asset.
  rpc PreviewFixedAsset(PreviewFixedAssetRequest) returns (PreviewFixedAssetResponse);

  // Checks a fixed asset.
  rpc CheckFixedAssetEligibility(CheckFixedAssetEligibilityRequest) returns (CheckFixedAssetEligibilityResponse);

  // Scores a fixed asset.
  rpc ScoreFixedAsset(ScoreFixedAssetRequest) returns (ScoreFixedAssetResponse);

  // Lints a fixed asset.
  rpc LintFixedAssets(LintFixedAssetsRequest) returns (LintFixedAssetsResponse);

  // Returns a fixed asset.
  rpc GetFixedAssetRules(GetFixedAssetRulesRequest) returns (GetFixedAssetRulesResponse);
}

// The request of `ValidateFixedAsset`.
message ValidateFixedAssetRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string fixed_asset_id = 2;
  FixedAsset fixed_asset = 3;
  ValidateFixedAssetRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateFixedAsset`.
message ValidateFixedAssetResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FixedAsset fixed_asset = 1;
  ValidateFixedAssetResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PreviewFixedAsset`.
message PreviewFixedAssetRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string fixed_asset_id = 2;
  FixedAsset fixed_asset = 3;
  PreviewFixedAssetRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `PreviewFixedAsset`.
message PreviewFixedAssetResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FixedAsset fixed_asset = 1;
  PreviewFixedAssetResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CheckFixedAssetEligibility`.
message CheckFixedAssetEligibilityRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string fixed_asset_id = 2;
  FixedAsset fixed_asset = 3;
  CheckFixedAssetEligibilityRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CheckFixedAssetEligibility`.
message CheckFixedAssetEligibilityResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FixedAsset fixed_asset = 1;
  CheckFixedAssetEligibilityResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ScoreFixedAsset`.
message ScoreFixedAssetRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string fixed_asset_id = 2;
  FixedAsset fixed_asset = 3;
  ScoreFixedAssetRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ScoreFixedAsset`.
message ScoreFixedAssetResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated ScoreFixedAssetResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  FixedAsset fixed_asset = 1;
  ScoreFixedAssetResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

