syntax = "proto3";

package acme.assets.v1;

import "acme/assets/v1/assets.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Assets.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/assets/v1;assetsv1";
option java_multiple_files = true;
option java_outer_classname = "DisposalCalculationServiceProto";
option java_package = "com.acme.assets.v1";

// Computes the figures of a disposal, such as totals, taxes, and estimates.
service DisposalCalculationService {
  // Calculates a disposal.
  rpc CalculateDisposal(CalculateDisposalRequest) returns (CalculateDisposalResponse);

  // Estimates a disposal.
  rpc EstimateDisposal(EstimateDisposalRequest) returns (EstimateDisposalResponse);

  // Quotes a disposal.
  rpc QuoteDisposal(QuoteDisposalRequest) returns (QuoteDisposalResponse);

  // Compares a disposal.
  rpc CompareDisposalOptions(CompareDisposalOptionsRequest) returns (CompareDisposalOptionsResponse);

  // Recalculates a disposal.
  rpc RecalculateDisposals(RecalculateDisposalsRequest) returns (RecalculateDisposalsResponse);

  // Simulates a disposal.
  rpc SimulateDisposal(SimulateDisposalRequest) returns (SimulateDisposalResponse);

  // Explains a disposal.
  rpc ExplainDisposalCalculation(ExplainDisposalCalculationRequest) returns (ExplainDisposalCalculationResponse);

  // Returns a disposal.
  rpc GetDisposalRates(GetDisposalRatesRequest) returns (GetDisposalRatesResponse);
}

// The request of `CalculateDisposal`.
message CalculateDisposalRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string disposal_id = 2;
  Disposal disposal = 3;
  CalculateDisposalRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateDisposal`.
message CalculateDisposalResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateDisposalResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Disposal disposal = 1;
  CalculateDisposalResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

