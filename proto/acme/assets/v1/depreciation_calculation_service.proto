  acme.common.v1.RequestContext context = 1;
  string depreciation_id = 2;
  Depreciation depreciation = 3;
  ExplainDepreciationCalculationRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ExplainDepreciationCalculation`.
message ExplainDepreciationCalculationResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Depreciation depreciation = 1;
  ExplainDepreciationCalculationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetDepreciationRates`.
message GetDepreciationRatesRequest {
  acme.common.v1.RequestContext context = 1;
