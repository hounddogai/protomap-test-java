syntax = "proto3";

package acme.assets.v1;

import "acme/assets/v1/assets.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Assets.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/assets/v1;assetsv1";
option java_multiple_files = true;
option java_outer_classname = "DepreciationQueryServiceProto";
option java_package = "com.acme.assets.v1";

// Answers read-only questions about depreciations, for screens and reports.
service DepreciationQueryService {
  // Returns a depreciation.
  rpc LookupDepreciation(LookupDepreciationRequest) returns (LookupDepreciationResponse);

  // Lists depreciations a page at a time.
  rpc BrowseDepreciations(BrowseDepreciationsRequest) returns (BrowseDepreciationsResponse);

  // Lists depreciations a page at a time.
  rpc FindDepreciations(FindDepreciationsRequest) returns (FindDepreciationsResponse);

  // Counts depreciations by status.
  rpc CountDepreciations(CountDepreciationsRequest) returns (CountDepreciationsResponse);

  // Returns several depreciations at once.
  rpc ResolveDepreciations(ResolveDepreciationsRequest) returns (ResolveDepreciationsResponse);

  // Streams every matching depreciation.
  rpc ExportDepreciations(ExportDepreciationsRequest) returns (stream ExportDepreciationsResponse);

  // Summarizes a depreciation.
  rpc SummarizeDepreciations(SummarizeDepreciationsRequest) returns (SummarizeDepreciationsResponse);

  // Lists depreciations a page at a time.
  rpc SuggestDepreciations(SuggestDepreciationsRequest) returns (SuggestDepreciationsResponse);

  // Returns a depreciation.
  rpc PeekDepreciation(PeekDepreciationRequest) returns (PeekDepreciationResponse);
}

// The request of `LookupDepreciation`.
message LookupDepreciationRequest {
  acme.common.v1.RequestContext context = 1;
  string depreciation_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupDepreciation`.
message LookupDepreciationResponse {
  Depreciation depreciation = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseDepreciations`.
message BrowseDepreciationsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DepreciationStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseDepreciationsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseDepreciations`.
message BrowseDepreciationsResponse {
  repeated Depreciation depreciations = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindDepreciations`.
message FindDepreciationsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DepreciationStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindDepreciationsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindDepreciations`.
message FindDepreciationsResponse {
  repeated Depreciation depreciations = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountDepreciations`.
message CountDepreciationsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DepreciationStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountDepreciationsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountDepreciations`.
message CountDepreciationsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveDepreciations`.
message ResolveDepreciationsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string depreciation_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveDepreciations`.
message ResolveDepreciationsResponse {
  repeated Depreciation depreciations = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportDepreciations`.
message ExportDepreciationsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DepreciationStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportDepreciationsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportDepreciations`.
message ExportDepreciationsResponse {
  Depreciation depreciation = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeDepreciations`.
message SummarizeDepreciationsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string depreciation_id = 2;
  SummarizeDepreciationsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeDepreciations`.
message SummarizeDepreciationsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestDepreciations`.
message SuggestDepreciationsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DepreciationStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestDepreciationsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestDepreciations`.
message SuggestDepreciationsResponse {
  repeated Depreciation depreciations = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekDepreciation`.
message PeekDepreciationRequest {
  acme.common.v1.RequestContext context = 1;
  string depreciation_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekDepreciation`.
message PeekDepreciationResponse {
  Depreciation depreciation = 1;
  acme.common.v1.OperationResult result = 2;
}
