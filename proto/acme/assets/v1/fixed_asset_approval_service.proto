syntax = "proto3";

package acme.assets.v1;

import "acme/assets/v1/assets.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Assets.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/assets/v1;assetsv1";
option java_multiple_files = true;
option java_outer_classname = "FixedAssetApprovalServiceProto";
option java_package = "com.acme.assets.v1";

// Routes fixed assets through approval, with escalation and delegation.
service FixedAssetApprovalService {
  // Submits a fixed asset.
  rpc SubmitFixedAsset(SubmitFixedAssetRequest) returns (SubmitFixedAssetResponse);

  // Approves a fixed asset.
  rpc ApproveFixedAsset(ApproveFixedAssetRequest) returns (ApproveFixedAssetResponse);

  // Rejects a fixed asset.
  rpc RejectFixedAsset(RejectFixedAssetRequest) returns (RejectFixedAssetResponse);

  // Escalates a fixed asset.
  rpc EscalateFixedAsset(EscalateFixedAssetRequest) returns (EscalateFixedAssetResponse);

  // Lists fixed assets a page at a time.
  rpc ListPendingFixedAssets(ListPendingFixedAssetsRequest) returns (ListPendingFixedAssetsResponse);

  // Delegates a fixed asset.
  rpc DelegateFixedAssetApproval(DelegateFixedAssetApprovalRequest) returns (DelegateFixedAssetApprovalResponse);

  // Recalls a fixed asset.
  rpc RecallFixedAsset(RecallFixedAssetRequest) returns (RecallFixedAssetResponse);

  // Returns a fixed asset.
  rpc GetFixedAssetApprovalStatus(GetFixedAssetApprovalStatusRequest) returns (GetFixedAssetApprovalStatusResponse);

  // Comments a fixed asset.
  rpc CommentFixedAssetApproval(CommentFixedAssetApprovalRequest) returns (CommentFixedAssetApprovalResponse);
}

// The request of `SubmitFixedAsset`.
message SubmitFixedAssetRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string fixed_asset_id = 2;
  FixedAsset fixed_asset = 3;
  SubmitFixedAssetRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitFixedAsset`.
message SubmitFixedAssetResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FixedAsset fixed_asset = 1;
  SubmitFixedAssetResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

