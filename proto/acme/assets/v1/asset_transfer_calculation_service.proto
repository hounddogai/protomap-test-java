syntax = "proto3";

package acme.assets.v1;

import "acme/assets/v1/assets.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Assets.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/assets/v1;assetsv1";
option java_multiple_files = true;
option java_outer_classname = "AssetTransferCalculationServiceProto";
option java_package = "com.acme.assets.v1";

// Computes the figures of an asset transfer, such as totals, taxes, and estimates.
service AssetTransferCalculationService {
  // Calculates an asset transfer.
  rpc CalculateAssetTransfer(CalculateAssetTransferRequest) returns (CalculateAssetTransferResponse);

  // Estimates an asset transfer.
  rpc EstimateAssetTransfer(EstimateAssetTransferRequest) returns (EstimateAssetTransferResponse);

  // Quotes an asset transfer.
  rpc QuoteAssetTransfer(QuoteAssetTransferRequest) returns (QuoteAssetTransferResponse);

  // Compares an asset transfer.
  rpc CompareAssetTransferOptions(CompareAssetTransferOptionsRequest) returns (CompareAssetTransferOptionsResponse);

  // Recalculates an asset transfer.
  rpc RecalculateAssetTransfers(RecalculateAssetTransfersRequest) returns (RecalculateAssetTransfersResponse);

  // Simulates an asset transfer.
  rpc SimulateAssetTransfer(SimulateAssetTransferRequest) returns (SimulateAssetTransferResponse);

  // Explains an asset transfer.
  rpc ExplainAssetTransferCalculation(ExplainAssetTransferCalculationRequest) returns (ExplainAssetTransferCalculationResponse);

  // Returns an asset transfer.
  rpc GetAssetTransferRates(GetAssetTransferRatesRequest) returns (GetAssetTransferRatesResponse);
}

// The request of `CalculateAssetTransfer`.
message CalculateAssetTransferRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string asset_transfer_id = 2;
  AssetTransfer asset_transfer = 3;
  CalculateAssetTransferRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateAssetTransfer`.
message CalculateAssetTransferResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateAssetTransferResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  AssetTransfer asset_transfer = 1;
  CalculateAssetTransferResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

