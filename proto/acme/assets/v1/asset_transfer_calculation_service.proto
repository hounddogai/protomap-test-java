  }

  AssetTransfer asset_transfer = 1;
  ExplainAssetTransferCalculationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetAssetTransferRates`.
message GetAssetTransferRatesRequest {
