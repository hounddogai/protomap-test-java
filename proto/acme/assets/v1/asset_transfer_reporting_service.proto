syntax = "proto3";

package acme.assets.v1;

import "acme/assets/v1/assets.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Assets.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/assets/v1;assetsv1";
option java_multiple_files = true;
option java_outer_classname = "AssetTransferReportingServiceProto";
option java_package = "com.acme.assets.v1";

// Builds and schedules reports about asset transfers.
service AssetTransferReportingService {
  // Generates an asset transfer.
  rpc GenerateAssetTransferReport(GenerateAssetTransferReportRequest) returns (GenerateAssetTransferReportResponse);

  // Returns an asset transfer.
  rpc FetchAssetTransferReport(FetchAssetTransferReportRequest) returns (FetchAssetTransferReportResponse);

  // Schedules an asset transfer.
  rpc ScheduleAssetTransferReport(ScheduleAssetTransferReportRequest) returns (ScheduleAssetTransferReportResponse);

  // Streams the changes of asset transfers as they happen.
  rpc StreamAssetTransferMetrics(StreamAssetTransferMetricsRequest) returns (stream StreamAssetTransferMetricsResponse);

  // Lists asset transfers a page at a time.
  rpc ListAssetTransferReports(ListAssetTransferReportsRequest) returns (ListAssetTransferReportsResponse);

  // Shares an asset transfer.
  rpc ShareAssetTransferReport(ShareAssetTransferReportRequest) returns (ShareAssetTransferReportResponse);

  // Counts asset transfers by status.
  rpc CountAssetTransferTotals(CountAssetTransferTotalsRequest) returns (CountAssetTransferTotalsResponse);

  // Deletes an asset transfer.
  rpc DeleteAssetTransferReport(DeleteAssetTransferReportRequest) returns (DeleteAssetTransferReportResponse);
}

// The request of `GenerateAssetTransferReport`.
message GenerateAssetTransferReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string asset_transfer_id = 2;
  GenerateAssetTransferReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateAssetTransferReport`.
message GenerateAssetTransferReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchAssetTransferReport`.
message FetchAssetTransferReportRequest {
  acme.common.v1.RequestContext context = 1;
  string asset_transfer_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchAssetTransferReport`.
message FetchAssetTransferReportResponse {
  AssetTransfer asset_transfer = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleAssetTransferReport`.
message ScheduleAssetTransferReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string asset_transfer_id = 2;
  ScheduleAssetTransferReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleAssetTransferReport`.
message ScheduleAssetTransferReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamAssetTransferMetrics`.
message StreamAssetTransferMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated AssetTransferStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamAssetTransferMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamAssetTransferMetrics`.
message StreamAssetTransferMetricsResponse {
  AssetTransfer asset_transfer = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListAssetTransferReports`.
message ListAssetTransferReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated AssetTransferStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListAssetTransferReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListAssetTransferReports`.
message ListAssetTransferReportsResponse {
  repeated AssetTransfer asset_transfers = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareAssetTransferReport`.
message ShareAssetTransferReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string asset_transfer_id = 2;
  ShareAssetTransferReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareAssetTransferReport`.
message ShareAssetTransferReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  AssetTransfer asset_transfer = 1;
  ShareAssetTransferReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountAssetTransferTotals`.
message CountAssetTransferTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated AssetTransferStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountAssetTransferTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountAssetTransferTotals`.
message CountAssetTransferTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteAssetTransferReport`.
message DeleteAssetTransferReportRequest {
  acme.common.v1.RequestContext context = 1;
  string asset_transfer_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteAssetTransferReport`.
message DeleteAssetTransferReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
