syntax = "proto3";

package acme.payroll.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/payroll/v1/payroll.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Payroll.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/payroll/v1;payrollv1";
option java_multiple_files = true;
option java_outer_classname = "PayRunApprovalServiceProto";
option java_package = "com.acme.payroll.v1";

// Routes pay runs through approval, with escalation and delegation.
service PayRunApprovalService {
  // Submits a pay run.
  rpc SubmitPayRun(SubmitPayRunRequest) returns (SubmitPayRunResponse);

  // Approves a pay run.
  rpc ApprovePayRun(ApprovePayRunRequest) returns (ApprovePayRunResponse);

  // Rejects a pay run.
  rpc RejectPayRun(RejectPayRunRequest) returns (RejectPayRunResponse);

  // Escalates a pay run.
  rpc EscalatePayRun(EscalatePayRunRequest) returns (EscalatePayRunResponse);

  // Lists pay runs a page at a time.
  rpc ListPendingPayRuns(ListPendingPayRunsRequest) returns (ListPendingPayRunsResponse);

  // Delegates a pay run.
  rpc DelegatePayRunApproval(DelegatePayRunApprovalRequest) returns (DelegatePayRunApprovalResponse);

  // Recalls a pay run.
  rpc RecallPayRun(RecallPayRunRequest) returns (RecallPayRunResponse);

  // Returns a pay run.
  rpc GetPayRunApprovalStatus(GetPayRunApprovalStatusRequest) returns (GetPayRunApprovalStatusResponse);
}

// The request of `SubmitPayRun`.
message SubmitPayRunRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string pay_run_id = 2;
  PayRun pay_run = 3;
  SubmitPayRunRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitPayRun`.
message SubmitPayRunResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PayRun pay_run = 1;
  SubmitPayRunResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

