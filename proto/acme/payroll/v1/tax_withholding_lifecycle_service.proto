import "acme/payroll/v1/payroll.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Payroll.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/payroll/v1;payrollv1";
option java_multiple_files = true;
option java_outer_classname = "TaxWithholdingLifecycleServiceProto";
option java_package = "com.acme.payroll.v1";

// Moves a tax withholding between the states of its lifecycle.
service TaxWithholdingLifecycleService {
  // Activates a tax withholding.
  rpc ActivateTaxWithholding(ActivateTaxWithholdingRequest) returns (ActivateTaxWithholdingResponse);

  // Suspends a tax withholding.
  rpc SuspendTaxWithholding(SuspendTaxWithholdingRequest) returns (SuspendTaxWithholdingResponse);

  // Reinstates a tax withholding.
  rpc ReinstateTaxWithholding(ReinstateTaxWithholdingRequest) returns (ReinstateTaxWithholdingResponse);

  // Terminates a tax withholding.
  rpc TerminateTaxWithholding(TerminateTaxWithholdingRequest) returns (TerminateTaxWithholdingResponse);

  // Renews a tax withholding.
  rpc RenewTaxWithholding(RenewTaxWithholdingRequest) returns (RenewTaxWithholdingResponse);

  // Expires a tax withholding.
  rpc ExpireTaxWithholding(ExpireTaxWithholdingRequest) returns (ExpireTaxWithholdingResponse);

  // Returns a tax withholding.
  rpc GetTaxWithholdingLifecycle(GetTaxWithholdingLifecycleRequest) returns (GetTaxWithholdingLifecycleResponse);

  // Schedules a tax withholding.
  rpc ScheduleTaxWithholdingExpiry(ScheduleTaxWithholdingExpiryRequest) returns (ScheduleTaxWithholdingExpiryResponse);
}

// The request of `ActivateTaxWithholding`.
message ActivateTaxWithholdingRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string tax_withholding_id = 2;
  ActivateTaxWithholdingRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateTaxWithholding`.
message ActivateTaxWithholdingResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  TaxWithholding tax_withholding = 1;
  ActivateTaxWithholdingResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

