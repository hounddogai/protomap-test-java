  }

  PayStub pay_stub = 1;
  ExplainPayStubCalculationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetPayStubRates`.
message GetPayStubRatesRequest {
