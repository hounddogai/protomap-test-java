syntax = "proto3";

package acme.payroll.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/payroll/v1/payroll.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Payroll.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/payroll/v1;payrollv1";
option java_multiple_files = true;
option java_outer_classname = "PayRunWorkflowServiceProto";
option java_package = "com.acme.payroll.v1";

// Runs the long-lived workflow that takes a pay run from start to finish.
service PayRunWorkflowService {
  // Starts a pay run.
  rpc StartPayRunWorkflow(StartPayRunWorkflowRequest) returns (StartPayRunWorkflowResponse);

  // Advances a pay run.
  rpc AdvancePayRunWorkflow(AdvancePayRunWorkflowRequest) returns (AdvancePayRunWorkflowResponse);

  // Cancels a pay run.
  rpc CancelPayRunWorkflow(CancelPayRunWorkflowRequest) returns (CancelPayRunWorkflowResponse);

  // Retrys a pay run.
  rpc RetryPayRunWorkflow(RetryPayRunWorkflowRequest) returns (RetryPayRunWorkflowResponse);

  // Pauses a pay run.
  rpc PausePayRunWorkflow(PausePayRunWorkflowRequest) returns (PausePayRunWorkflowResponse);

  // Resumes a pay run.
  rpc ResumePayRunWorkflow(ResumePayRunWorkflowRequest) returns (ResumePayRunWorkflowResponse);

  // Returns a pay run.
  rpc InspectPayRunWorkflow(InspectPayRunWorkflowRequest) returns (InspectPayRunWorkflowResponse);

  // Lists pay runs a page at a time.
  rpc ListPayRunWorkflows(ListPayRunWorkflowsRequest) returns (ListPayRunWorkflowsResponse);

  // Signals a pay run.
  rpc SignalPayRunWorkflow(SignalPayRunWorkflowRequest) returns (SignalPayRunWorkflowResponse);
}

// The request of `StartPayRunWorkflow`.
message StartPayRunWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string pay_run_id = 2;
  PayRun pay_run = 3;
  StartPayRunWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartPayRunWorkflow`.
message StartPayRunWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PayRun pay_run = 1;
  StartPayRunWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

