syntax = "proto3";

package acme.payroll.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/payroll/v1/payroll.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Payroll.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/payroll/v1;payrollv1";
option java_multiple_files = true;
option java_outer_classname = "DeductionWorkflowServiceProto";
option java_package = "com.acme.payroll.v1";

// Runs the long-lived workflow that takes a deduction from start to finish.
service DeductionWorkflowService {
  // Starts a deduction.
  rpc StartDeductionWorkflow(StartDeductionWorkflowRequest) returns (StartDeductionWorkflowResponse);

  // Advances a deduction.
  rpc AdvanceDeductionWorkflow(AdvanceDeductionWorkflowRequest) returns (AdvanceDeductionWorkflowResponse);

  // Cancels a deduction.
  rpc CancelDeductionWorkflow(CancelDeductionWorkflowRequest) returns (CancelDeductionWorkflowResponse);

  // Retrys a deduction.
  rpc RetryDeductionWorkflow(RetryDeductionWorkflowRequest) returns (RetryDeductionWorkflowResponse);

  // Pauses a deduction.
  rpc PauseDeductionWorkflow(PauseDeductionWorkflowRequest) returns (PauseDeductionWorkflowResponse);

  // Resumes a deduction.
  rpc ResumeDeductionWorkflow(ResumeDeductionWorkflowRequest) returns (ResumeDeductionWorkflowResponse);

  // Returns a deduction.
  rpc InspectDeductionWorkflow(InspectDeductionWorkflowRequest) returns (InspectDeductionWorkflowResponse);

  // Lists deductions a page at a time.
  rpc ListDeductionWorkflows(ListDeductionWorkflowsRequest) returns (ListDeductionWorkflowsResponse);

  // Signals a deduction.
  rpc SignalDeductionWorkflow(SignalDeductionWorkflowRequest) returns (SignalDeductionWorkflowResponse);
}

// The request of `StartDeductionWorkflow`.
message StartDeductionWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string deduction_id = 2;
  Deduction deduction = 3;
  StartDeductionWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartDeductionWorkflow`.
message StartDeductionWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Deduction deduction = 1;
  StartDeductionWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

