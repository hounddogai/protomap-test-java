syntax = "proto3";

package acme.payroll.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/payroll/v1/payroll.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Payroll.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/payroll/v1;payrollv1";
option java_multiple_files = true;
option java_outer_classname = "TaxWithholdingValidationServiceProto";
option java_package = "com.acme.payroll.v1";

// Checks tax withholdings against the rules before anything acts on them.
service TaxWithholdingValidationService {
  // Validates a tax withholding.
  rpc ValidateTaxWithholding(ValidateTaxWithholdingRequest) returns (ValidateTaxWithholdingResponse);

  // Previews a tax withholding.
  rpc PreviewTaxWithholding(PreviewTaxWithholdingRequest) returns (PreviewTaxWithholdingResponse);

  // Checks a tax withholding.
  rpc CheckTaxWithholdingEligibility(CheckTaxWithholdingEligibilityRequest) returns (CheckTaxWithholdingEligibilityResponse);

  // Normalizes a tax withholding.
  rpc NormalizeTaxWithholding(NormalizeTaxWithholdingRequest) returns (NormalizeTaxWithholdingResponse);

  // Explains a tax withholding.
  rpc ExplainTaxWithholdingDecision(ExplainTaxWithholdingDecisionRequest) returns (ExplainTaxWithholdingDecisionResponse);

  // Scores a tax withholding.
  rpc ScoreTaxWithholding(ScoreTaxWithholdingRequest) returns (ScoreTaxWithholdingResponse);

  // Lints a tax withholding.
  rpc LintTaxWithholdings(LintTaxWithholdingsRequest) returns (LintTaxWithholdingsResponse);
}

// The request of `ValidateTaxWithholding`.
message ValidateTaxWithholdingRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string tax_withholding_id = 2;
  TaxWithholding tax_withholding = 3;
  ValidateTaxWithholdingRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateTaxWithholding`.
message ValidateTaxWithholdingResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  TaxWithholding tax_withholding = 1;
  ValidateTaxWithholdingResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

