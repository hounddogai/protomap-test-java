syntax = "proto3";

package acme.payroll.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/payroll/v1/payroll.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Payroll.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/payroll/v1;payrollv1";
option java_multiple_files = true;
option java_outer_classname = "PayRunValidationServiceProto";
option java_package = "com.acme.payroll.v1";

// Checks pay runs against the rules before anything acts on them.
service PayRunValidationService {
  // Validates a pay run.
  rpc ValidatePayRun(ValidatePayRunRequest) returns (ValidatePayRunResponse);

  // Previews a pay run.
  rpc PreviewPayRun(PreviewPayRunRequest) returns (PreviewPayRunResponse);

  // Checks a pay run.
  rpc CheckPayRunEligibility(CheckPayRunEligibilityRequest) returns (CheckPayRunEligibilityResponse);

  // Explains a pay run.
  rpc ExplainPayRunDecision(ExplainPayRunDecisionRequest) returns (ExplainPayRunDecisionResponse);

  // Lints a pay run.
  rpc LintPayRuns(LintPayRunsRequest) returns (LintPayRunsResponse);

  // Returns a pay run.
  rpc GetPayRunRules(GetPayRunRulesRequest) returns (GetPayRunRulesResponse);
}

// The request of `ValidatePayRun`.
message ValidatePayRunRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string pay_run_id = 2;
  PayRun pay_run = 3;
  ValidatePayRunRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidatePayRun`.
message ValidatePayRunResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PayRun pay_run = 1;
  ValidatePayRunResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

