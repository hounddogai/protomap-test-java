syntax = "proto3";

package acme.payroll.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/payroll/v1/payroll.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Payroll.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/payroll/v1;payrollv1";
option java_multiple_files = true;
option java_outer_classname = "PayStubValidationServiceProto";
option java_package = "com.acme.payroll.v1";

// Checks pay stubs against the rules before anything acts on them.
service PayStubValidationService {
  // Validates a pay stub.
  rpc ValidatePayStub(ValidatePayStubRequest) returns (ValidatePayStubResponse);

  // Previews a pay stub.
  rpc PreviewPayStub(PreviewPayStubRequest) returns (PreviewPayStubResponse);

  // Checks a pay stub.
  rpc CheckPayStubEligibility(CheckPayStubEligibilityRequest) returns (CheckPayStubEligibilityResponse);

  // Normalizes a pay stub.
  rpc NormalizePayStub(NormalizePayStubRequest) returns (NormalizePayStubResponse);

  // Explains a pay stub.
  rpc ExplainPayStubDecision(ExplainPayStubDecisionRequest) returns (ExplainPayStubDecisionResponse);

  // Scores a pay stub.
  rpc ScorePayStub(ScorePayStubRequest) returns (ScorePayStubResponse);

  // Lints a pay stub.
  rpc LintPayStubs(LintPayStubsRequest) returns (LintPayStubsResponse);

  // Returns a pay stub.
  rpc GetPayStubRules(GetPayStubRulesRequest) returns (GetPayStubRulesResponse);
}

// The request of `ValidatePayStub`.
message ValidatePayStubRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string pay_stub_id = 2;
  PayStub pay_stub = 3;
  ValidatePayStubRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidatePayStub`.
message ValidatePayStubResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PayStub pay_stub = 1;
  ValidatePayStubResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

