syntax = "proto3";

package acme.payroll.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/payroll/v1/payroll.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Payroll.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/payroll/v1;payrollv1";
option java_multiple_files = true;
option java_outer_classname = "PayStubQueryServiceProto";
option java_package = "com.acme.payroll.v1";

// Answers read-only questions about pay stubs, for screens and reports.
service PayStubQueryService {
  // Returns a pay stub.
  rpc LookupPayStub(LookupPayStubRequest) returns (LookupPayStubResponse);

  // Lists pay stubs a page at a time.
  rpc BrowsePayStubs(BrowsePayStubsRequest) returns (BrowsePayStubsResponse);

  // Lists pay stubs a page at a time.
  rpc FindPayStubs(FindPayStubsRequest) returns (FindPayStubsResponse);

  // Counts pay stubs by status.
  rpc CountPayStubs(CountPayStubsRequest) returns (CountPayStubsResponse);

  // Returns several pay stubs at once.
  rpc ResolvePayStubs(ResolvePayStubsRequest) returns (ResolvePayStubsResponse);

  // Streams every matching pay stub.
  rpc ExportPayStubs(ExportPayStubsRequest) returns (stream ExportPayStubsResponse);

  // Summarizes a pay stub.
  rpc SummarizePayStubs(SummarizePayStubsRequest) returns (SummarizePayStubsResponse);

  // Returns a pay stub.
  rpc PeekPayStub(PeekPayStubRequest) returns (PeekPayStubResponse);
}

// The request of `LookupPayStub`.
message LookupPayStubRequest {
  acme.common.v1.RequestContext context = 1;
  string pay_stub_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupPayStub`.
message LookupPayStubResponse {
  PayStub pay_stub = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowsePayStubs`.
message BrowsePayStubsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PayStubStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowsePayStubsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowsePayStubs`.
message BrowsePayStubsResponse {
  repeated PayStub pay_stubs = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindPayStubs`.
message FindPayStubsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PayStubStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindPayStubsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindPayStubs`.
message FindPayStubsResponse {
  repeated PayStub pay_stubs = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountPayStubs`.
message CountPayStubsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PayStubStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountPayStubsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountPayStubs`.
message CountPayStubsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolvePayStubs`.
message ResolvePayStubsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string pay_stub_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolvePayStubs`.
message ResolvePayStubsResponse {
  repeated PayStub pay_stubs = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportPayStubs`.
message ExportPayStubsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PayStubStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportPayStubsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportPayStubs`.
message ExportPayStubsResponse {
  PayStub pay_stub = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizePayStubs`.
message SummarizePayStubsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string pay_stub_id = 2;
  SummarizePayStubsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizePayStubs`.
message SummarizePayStubsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `PeekPayStub`.
message PeekPayStubRequest {
  acme.common.v1.RequestContext context = 1;
  string pay_stub_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekPayStub`.
message PeekPayStubResponse {
  PayStub pay_stub = 1;
  acme.common.v1.OperationResult result = 2;
}
