syntax = "proto3";

package acme.payroll.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/payroll/v1/payroll.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Payroll.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/payroll/v1;payrollv1";
option java_multiple_files = true;
option java_outer_classname = "TaxWithholdingReportingServiceProto";
option java_package = "com.acme.payroll.v1";

// Builds and schedules reports about tax withholdings.
service TaxWithholdingReportingService {
  // Generates a tax withholding.
  rpc GenerateTaxWithholdingReport(GenerateTaxWithholdingReportRequest) returns (GenerateTaxWithholdingReportResponse);

  // Returns a tax withholding.
  rpc FetchTaxWithholdingReport(FetchTaxWithholdingReportRequest) returns (FetchTaxWithholdingReportResponse);

  // Schedules a tax withholding.
  rpc ScheduleTaxWithholdingReport(ScheduleTaxWithholdingReportRequest) returns (ScheduleTaxWithholdingReportResponse);

  // Lists tax withholdings a page at a time.
  rpc ListTaxWithholdingReports(ListTaxWithholdingReportsRequest) returns (ListTaxWithholdingReportsResponse);

  // Shares a tax withholding.
  rpc ShareTaxWithholdingReport(ShareTaxWithholdingReportRequest) returns (ShareTaxWithholdingReportResponse);

  // Deletes a tax withholding.
  rpc DeleteTaxWithholdingReport(DeleteTaxWithholdingReportRequest) returns (DeleteTaxWithholdingReportResponse);
}

// The request of `GenerateTaxWithholdingReport`.
message GenerateTaxWithholdingReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string tax_withholding_id = 2;
  GenerateTaxWithholdingReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateTaxWithholdingReport`.
message GenerateTaxWithholdingReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchTaxWithholdingReport`.
message FetchTaxWithholdingReportRequest {
  acme.common.v1.RequestContext context = 1;
  string tax_withholding_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchTaxWithholdingReport`.
message FetchTaxWithholdingReportResponse {
  TaxWithholding tax_withholding = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleTaxWithholdingReport`.
message ScheduleTaxWithholdingReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string tax_withholding_id = 2;
  ScheduleTaxWithholdingReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleTaxWithholdingReport`.
message ScheduleTaxWithholdingReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListTaxWithholdingReports`.
message ListTaxWithholdingReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated TaxWithholdingStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListTaxWithholdingReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListTaxWithholdingReports`.
message ListTaxWithholdingReportsResponse {
  repeated TaxWithholding tax_withholdings = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareTaxWithholdingReport`.
message ShareTaxWithholdingReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string tax_withholding_id = 2;
  ShareTaxWithholdingReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareTaxWithholdingReport`.
message ShareTaxWithholdingReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  TaxWithholding tax_withholding = 1;
  ShareTaxWithholdingReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteTaxWithholdingReport`.
message DeleteTaxWithholdingReportRequest {
  acme.common.v1.RequestContext context = 1;
  string tax_withholding_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteTaxWithholdingReport`.
message DeleteTaxWithholdingReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
