option csharp_namespace = "Acme.Payroll.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/payroll/v1;payrollv1";
option java_multiple_files = true;
option java_outer_classname = "PayStubWorkflowServiceProto";
option java_package = "com.acme.payroll.v1";

// Runs the long-lived workflow that takes a pay stub from start to finish.
service PayStubWorkflowService {
  // Starts a pay stub.
  rpc StartPayStubWorkflow(StartPayStubWorkflowRequest) returns (StartPayStubWorkflowResponse);

  // Advances a pay stub.
  rpc AdvancePayStubWorkflow(AdvancePayStubWorkflowRequest) returns (AdvancePayStubWorkflowResponse);

  // Cancels a pay stub.
  rpc CancelPayStubWorkflow(CancelPayStubWorkflowRequest) returns (CancelPayStubWorkflowResponse);

  // Retrys a pay stub.
  rpc RetryPayStubWorkflow(RetryPayStubWorkflowRequest) returns (RetryPayStubWorkflowResponse);

  // Pauses a pay stub.
  rpc PausePayStubWorkflow(PausePayStubWorkflowRequest) returns (PausePayStubWorkflowResponse);

  // Resumes a pay stub.
  rpc ResumePayStubWorkflow(ResumePayStubWorkflowRequest) returns (ResumePayStubWorkflowResponse);

  // Returns a pay stub.
  rpc InspectPayStubWorkflow(InspectPayStubWorkflowRequest) returns (InspectPayStubWorkflowResponse);

  // Signals a pay stub.
  rpc SignalPayStubWorkflow(SignalPayStubWorkflowRequest) returns (SignalPayStubWorkflowResponse);
}

// The request of `StartPayStubWorkflow`.
message StartPayStubWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string pay_stub_id = 2;
  PayStub pay_stub = 3;
  StartPayStubWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartPayStubWorkflow`.
message StartPayStubWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PayStub pay_stub = 1;
  StartPayStubWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

