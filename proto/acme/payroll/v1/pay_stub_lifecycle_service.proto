import "acme/payroll/v1/payroll.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Payroll.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/payroll/v1;payrollv1";
option java_multiple_files = true;
option java_outer_classname = "PayStubLifecycleServiceProto";
option java_package = "com.acme.payroll.v1";

// Moves a pay stub between the states of its lifecycle.
service PayStubLifecycleService {
  // Activates a pay stub.
  rpc ActivatePayStub(ActivatePayStubRequest) returns (ActivatePayStubResponse);

  // Suspends a pay stub.
  rpc SuspendPayStub(SuspendPayStubRequest) returns (SuspendPayStubResponse);

  // Reinstates a pay stub.
  rpc ReinstatePayStub(ReinstatePayStubRequest) returns (ReinstatePayStubResponse);

  // Terminates a pay stub.
  rpc TerminatePayStub(TerminatePayStubRequest) returns (TerminatePayStubResponse);

  // Renews a pay stub.
  rpc RenewPayStub(RenewPayStubRequest) returns (RenewPayStubResponse);

  // Expires a pay stub.
  rpc ExpirePayStub(ExpirePayStubRequest) returns (ExpirePayStubResponse);

  // Returns a pay stub.
  rpc GetPayStubLifecycle(GetPayStubLifecycleRequest) returns (GetPayStubLifecycleResponse);

  // Schedules a pay stub.
  rpc SchedulePayStubExpiry(SchedulePayStubExpiryRequest) returns (SchedulePayStubExpiryResponse);
}

// The request of `ActivatePayStub`.
message ActivatePayStubRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string pay_stub_id = 2;
  ActivatePayStubRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivatePayStub`.
message ActivatePayStubResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PayStub pay_stub = 1;
  ActivatePayStubResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

