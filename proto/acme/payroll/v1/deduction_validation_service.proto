// The request of `GetDeductionRules`.
message GetDeductionRulesRequest {
  acme.common.v1.RequestContext context = 1;
  string deduction_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetDeductionRules`.
message GetDeductionRulesResponse {
  Deduction deduction = 1;
  acme.common.v1.OperationResult result = 2;
}
