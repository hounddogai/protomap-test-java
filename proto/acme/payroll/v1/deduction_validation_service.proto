syntax = "proto3";

package acme.payroll.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/payroll/v1/payroll.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Payroll.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/payroll/v1;payrollv1";
option java_multiple_files = true;
option java_outer_classname = "DeductionValidationServiceProto";
option java_package = "com.acme.payroll.v1";

// Checks deductions against the rules before anything acts on them.
service DeductionValidationService {
  // Validates a deduction.
  rpc ValidateDeduction(ValidateDeductionRequest) returns (ValidateDeductionResponse);

  // Previews a deduction.
  rpc PreviewDeduction(PreviewDeductionRequest) returns (PreviewDeductionResponse);

  // Checks a deduction.
  rpc CheckDeductionEligibility(CheckDeductionEligibilityRequest) returns (CheckDeductionEligibilityResponse);

  // Normalizes a deduction.
  rpc NormalizeDeduction(NormalizeDeductionRequest) returns (NormalizeDeductionResponse);

  // Scores a deduction.
  rpc ScoreDeduction(ScoreDeductionRequest) returns (ScoreDeductionResponse);

  // Lints a deduction.
  rpc LintDeductions(LintDeductionsRequest) returns (LintDeductionsResponse);

  // Returns a deduction.
  rpc GetDeductionRules(GetDeductionRulesRequest) returns (GetDeductionRulesResponse);
}

// The request of `ValidateDeduction`.
message ValidateDeductionRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string deduction_id = 2;
  Deduction deduction = 3;
  ValidateDeductionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateDeduction`.
message ValidateDeductionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Deduction deduction = 1;
  ValidateDeductionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

