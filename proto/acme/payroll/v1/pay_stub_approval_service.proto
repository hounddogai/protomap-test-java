syntax = "proto3";

package acme.payroll.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/payroll/v1/payroll.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Payroll.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/payroll/v1;payrollv1";
option java_multiple_files = true;
option java_outer_classname = "PayStubApprovalServiceProto";
option java_package = "com.acme.payroll.v1";

// Routes pay stubs through approval, with escalation and delegation.
service PayStubApprovalService {
  // Submits a pay stub.
  rpc SubmitPayStub(SubmitPayStubRequest) returns (SubmitPayStubResponse);

  // Approves a pay stub.
  rpc ApprovePayStub(ApprovePayStubRequest) returns (ApprovePayStubResponse);

  // Rejects a pay stub.
  rpc RejectPayStub(RejectPayStubRequest) returns (RejectPayStubResponse);

  // Escalates a pay stub.
  rpc EscalatePayStub(EscalatePayStubRequest) returns (EscalatePayStubResponse);

  // Lists pay stubs a page at a time.
  rpc ListPendingPayStubs(ListPendingPayStubsRequest) returns (ListPendingPayStubsResponse);

  // Delegates a pay stub.
  rpc DelegatePayStubApproval(DelegatePayStubApprovalRequest) returns (DelegatePayStubApprovalResponse);

  // Recalls a pay stub.
  rpc RecallPayStub(RecallPayStubRequest) returns (RecallPayStubResponse);

  // Returns a pay stub.
  rpc GetPayStubApprovalStatus(GetPayStubApprovalStatusRequest) returns (GetPayStubApprovalStatusResponse);

  // Comments a pay stub.
  rpc CommentPayStubApproval(CommentPayStubApprovalRequest) returns (CommentPayStubApprovalResponse);
}

// The request of `SubmitPayStub`.
message SubmitPayStubRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string pay_stub_id = 2;
  PayStub pay_stub = 3;
  SubmitPayStubRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitPayStub`.
message SubmitPayStubResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PayStub pay_stub = 1;
  SubmitPayStubResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

