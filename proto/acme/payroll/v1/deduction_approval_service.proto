syntax = "proto3";

package acme.payroll.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/payroll/v1/payroll.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Payroll.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/payroll/v1;payrollv1";
option java_multiple_files = true;
option java_outer_classname = "DeductionApprovalServiceProto";
option java_package = "com.acme.payroll.v1";

// Routes deductions through approval, with escalation and delegation.
service DeductionApprovalService {
  // Submits a deduction.
  rpc SubmitDeduction(SubmitDeductionRequest) returns (SubmitDeductionResponse);

  // Approves a deduction.
  rpc ApproveDeduction(ApproveDeductionRequest) returns (ApproveDeductionResponse);

  // Rejects a deduction.
  rpc RejectDeduction(RejectDeductionRequest) returns (RejectDeductionResponse);

  // Escalates a deduction.
  rpc EscalateDeduction(EscalateDeductionRequest) returns (EscalateDeductionResponse);

  // Lists deductions a page at a time.
  rpc ListPendingDeductions(ListPendingDeductionsRequest) returns (ListPendingDeductionsResponse);

  // Delegates a deduction.
  rpc DelegateDeductionApproval(DelegateDeductionApprovalRequest) returns (DelegateDeductionApprovalResponse);

  // Recalls a deduction.
  rpc RecallDeduction(RecallDeductionRequest) returns (RecallDeductionResponse);

  // Returns a deduction.
  rpc GetDeductionApprovalStatus(GetDeductionApprovalStatusRequest) returns (GetDeductionApprovalStatusResponse);

  // Comments a deduction.
  rpc CommentDeductionApproval(CommentDeductionApprovalRequest) returns (CommentDeductionApprovalResponse);
}

// The request of `SubmitDeduction`.
message SubmitDeductionRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string deduction_id = 2;
  Deduction deduction = 3;
  SubmitDeductionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitDeduction`.
message SubmitDeductionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Deduction deduction = 1;
  SubmitDeductionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

