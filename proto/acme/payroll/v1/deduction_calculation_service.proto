    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Deduction deduction = 1;
  ExplainDeductionCalculationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetDeductionRates`.
message GetDeductionRatesRequest {
