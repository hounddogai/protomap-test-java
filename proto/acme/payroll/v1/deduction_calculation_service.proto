syntax = "proto3";

package acme.payroll.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/payroll/v1/payroll.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Payroll.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/payroll/v1;payrollv1";
option java_multiple_files = true;
option java_outer_classname = "DeductionCalculationServiceProto";
option java_package = "com.acme.payroll.v1";

// Computes the figures of a deduction, such as totals, taxes, and estimates.
service DeductionCalculationService {
  // Calculates a deduction.
  rpc CalculateDeduction(CalculateDeductionRequest) returns (CalculateDeductionResponse);

  // Estimates a deduction.
  rpc EstimateDeduction(EstimateDeductionRequest) returns (EstimateDeductionResponse);

  // Quotes a deduction.
  rpc QuoteDeduction(QuoteDeductionRequest) returns (QuoteDeductionResponse);

  // Compares a deduction.
  rpc CompareDeductionOptions(CompareDeductionOptionsRequest) returns (CompareDeductionOptionsResponse);

  // Recalculates a deduction.
  rpc RecalculateDeductions(RecalculateDeductionsRequest) returns (RecalculateDeductionsResponse);

  // Simulates a deduction.
  rpc SimulateDeduction(SimulateDeductionRequest) returns (SimulateDeductionResponse);

  // Explains a deduction.
  rpc ExplainDeductionCalculation(ExplainDeductionCalculationRequest) returns (ExplainDeductionCalculationResponse);

  // Returns a deduction.
  rpc GetDeductionRates(GetDeductionRatesRequest) returns (GetDeductionRatesResponse);
}

// The request of `CalculateDeduction`.
message CalculateDeductionRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string deduction_id = 2;
  Deduction deduction = 3;
  CalculateDeductionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateDeduction`.
message CalculateDeductionResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateDeductionResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Deduction deduction = 1;
  CalculateDeductionResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

