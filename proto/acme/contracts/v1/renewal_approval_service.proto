syntax = "proto3";

package acme.contracts.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/contracts/v1/contracts.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Contracts.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/contracts/v1;contractsv1";
option java_multiple_files = true;
option java_outer_classname = "RenewalApprovalServiceProto";
option java_package = "com.acme.contracts.v1";

// Routes renewals through approval, with escalation and delegation.
service RenewalApprovalService {
  // Submits a renewal.
  rpc SubmitRenewal(SubmitRenewalRequest) returns (SubmitRenewalResponse);

  // Approves a renewal.
  rpc ApproveRenewal(ApproveRenewalRequest) returns (ApproveRenewalResponse);

  // Rejects a renewal.
  rpc RejectRenewal(RejectRenewalRequest) returns (RejectRenewalResponse);

  // Delegates a renewal.
  rpc DelegateRenewalApproval(DelegateRenewalApprovalRequest) returns (DelegateRenewalApprovalResponse);

  // Recalls a renewal.
  rpc RecallRenewal(RecallRenewalRequest) returns (RecallRenewalResponse);

  // Returns a renewal.
  rpc GetRenewalApprovalStatus(GetRenewalApprovalStatusRequest) returns (GetRenewalApprovalStatusResponse);
}

// The request of `SubmitRenewal`.
message SubmitRenewalRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string renewal_id = 2;
  Renewal renewal = 3;
  SubmitRenewalRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitRenewal`.
message SubmitRenewalResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Renewal renewal = 1;
  SubmitRenewalResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

