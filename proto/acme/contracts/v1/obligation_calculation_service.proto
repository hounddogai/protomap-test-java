syntax = "proto3";

package acme.contracts.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/contracts/v1/contracts.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Contracts.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/contracts/v1;contractsv1";
option java_multiple_files = true;
option java_outer_classname = "ObligationCalculationServiceProto";
option java_package = "com.acme.contracts.v1";

// Computes the figures of an obligation, such as totals, taxes, and estimates.
service ObligationCalculationService {
  // Calculates an obligation.
  rpc CalculateObligation(CalculateObligationRequest) returns (CalculateObligationResponse);

  // Estimates an obligation.
  rpc EstimateObligation(EstimateObligationRequest) returns (EstimateObligationResponse);

  // Quotes an obligation.
  rpc QuoteObligation(QuoteObligationRequest) returns (QuoteObligationResponse);

  // Compares an obligation.
  rpc CompareObligationOptions(CompareObligationOptionsRequest) returns (CompareObligationOptionsResponse);

  // Recalculates an obligation.
  rpc RecalculateObligations(RecalculateObligationsRequest) returns (RecalculateObligationsResponse);

  // Simulates an obligation.
  rpc SimulateObligation(SimulateObligationRequest) returns (SimulateObligationResponse);

  // Explains an obligation.
  rpc ExplainObligationCalculation(ExplainObligationCalculationRequest) returns (ExplainObligationCalculationResponse);

  // Returns an obligation.
  rpc GetObligationRates(GetObligationRatesRequest) returns (GetObligationRatesResponse);
}

// The request of `CalculateObligation`.
message CalculateObligationRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string obligation_id = 2;
  Obligation obligation = 3;
  CalculateObligationRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateObligation`.
message CalculateObligationResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateObligationResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Obligation obligation = 1;
  CalculateObligationResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

