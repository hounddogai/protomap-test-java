syntax = "proto3";

package acme.contracts.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/contracts/v1/contracts.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Contracts.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/contracts/v1;contractsv1";
option java_multiple_files = true;
option java_outer_classname = "ObligationValidationServiceProto";
option java_package = "com.acme.contracts.v1";

// Checks obligations against the rules before anything acts on them.
service ObligationValidationService {
  // Validates an obligation.
  rpc ValidateObligation(ValidateObligationRequest) returns (ValidateObligationResponse);

  // Previews an obligation.
  rpc PreviewObligation(PreviewObligationRequest) returns (PreviewObligationResponse);

  // Checks an obligation.
  rpc CheckObligationEligibility(CheckObligationEligibilityRequest) returns (CheckObligationEligibilityResponse);

  // Normalizes an obligation.
  rpc NormalizeObligation(NormalizeObligationRequest) returns (NormalizeObligationResponse);

  // Explains an obligation.
  rpc ExplainObligationDecision(ExplainObligationDecisionRequest) returns (ExplainObligationDecisionResponse);

  // Scores an obligation.
  rpc ScoreObligation(ScoreObligationRequest) returns (ScoreObligationResponse);

  // Lints an obligation.
  rpc LintObligations(LintObligationsRequest) returns (LintObligationsResponse);

  // Returns an obligation.
  rpc GetObligationRules(GetObligationRulesRequest) returns (GetObligationRulesResponse);
}

// The request of `ValidateObligation`.
message ValidateObligationRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string obligation_id = 2;
  Obligation obligation = 3;
  ValidateObligationRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateObligation`.
message ValidateObligationResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Obligation obligation = 1;
  ValidateObligationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

