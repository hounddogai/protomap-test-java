syntax = "proto3";

package acme.contracts.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/contracts/v1/contracts.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Contracts.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/contracts/v1;contractsv1";
option java_multiple_files = true;
option java_outer_classname = "ContractApprovalServiceProto";
option java_package = "com.acme.contracts.v1";

// Routes contracts through approval, with escalation and delegation.
service ContractApprovalService {
  // Submits a contract.
  rpc SubmitContract(SubmitContractRequest) returns (SubmitContractResponse);

  // Approves a contract.
  rpc ApproveContract(ApproveContractRequest) returns (ApproveContractResponse);

  // Rejects a contract.
  rpc RejectContract(RejectContractRequest) returns (RejectContractResponse);

  // Escalates a contract.
  rpc EscalateContract(EscalateContractRequest) returns (EscalateContractResponse);

  // Lists contracts a page at a time.
  rpc ListPendingContracts(ListPendingContractsRequest) returns (ListPendingContractsResponse);

  // Delegates a contract.
  rpc DelegateContractApproval(DelegateContractApprovalRequest) returns (DelegateContractApprovalResponse);

  // Recalls a contract.
  rpc RecallContract(RecallContractRequest) returns (RecallContractResponse);

  // Returns a contract.
  rpc GetContractApprovalStatus(GetContractApprovalStatusRequest) returns (GetContractApprovalStatusResponse);
}

// The request of `SubmitContract`.
message SubmitContractRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string contract_id = 2;
  Contract contract = 3;
  SubmitContractRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitContract`.
message SubmitContractResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Contract contract = 1;
  SubmitContractResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

