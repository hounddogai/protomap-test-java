syntax = "proto3";

package acme.contracts.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/contracts/v1/contracts.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Contracts.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/contracts/v1;contractsv1";
option java_multiple_files = true;
option java_outer_classname = "ContractClauseApprovalServiceProto";
option java_package = "com.acme.contracts.v1";

// Routes contract clauses through approval, with escalation and delegation.
service ContractClauseApprovalService {
  // Submits a contract clause.
  rpc SubmitContractClause(SubmitContractClauseRequest) returns (SubmitContractClauseResponse);

  // Approves a contract clause.
  rpc ApproveContractClause(ApproveContractClauseRequest) returns (ApproveContractClauseResponse);

  // Rejects a contract clause.
  rpc RejectContractClause(RejectContractClauseRequest) returns (RejectContractClauseResponse);

  // Escalates a contract clause.
  rpc EscalateContractClause(EscalateContractClauseRequest) returns (EscalateContractClauseResponse);

  // Lists contract clauses a page at a time.
  rpc ListPendingContractClauses(ListPendingContractClausesRequest) returns (ListPendingContractClausesResponse);

  // Delegates a contract clause.
  rpc DelegateContractClauseApproval(DelegateContractClauseApprovalRequest) returns (DelegateContractClauseApprovalResponse);

  // Returns a contract clause.
  rpc GetContractClauseApprovalStatus(GetContractClauseApprovalStatusRequest) returns (GetContractClauseApprovalStatusResponse);

  // Comments a contract clause.
  rpc CommentContractClauseApproval(CommentContractClauseApprovalRequest) returns (CommentContractClauseApprovalResponse);
}

// The request of `SubmitContractClause`.
message SubmitContractClauseRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string contract_clause_id = 2;
  ContractClause contract_clause = 3;
  SubmitContractClauseRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitContractClause`.
message SubmitContractClauseResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ContractClause contract_clause = 1;
  SubmitContractClauseResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

