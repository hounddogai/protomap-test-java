syntax = "proto3";

package acme.contracts.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/contracts/v1/contracts.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Contracts.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/contracts/v1;contractsv1";
option java_multiple_files = true;
option java_outer_classname = "RenewalValidationServiceProto";
option java_package = "com.acme.contracts.v1";

// Checks renewals against the rules before anything acts on them.
service RenewalValidationService {
  // Validates a renewal.
  rpc ValidateRenewal(ValidateRenewalRequest) returns (ValidateRenewalResponse);

  // Previews a renewal.
  rpc PreviewRenewal(PreviewRenewalRequest) returns (PreviewRenewalResponse);

  // Checks a renewal.
  rpc CheckRenewalEligibility(CheckRenewalEligibilityRequest) returns (CheckRenewalEligibilityResponse);

  // Normalizes a renewal.
  rpc NormalizeRenewal(NormalizeRenewalRequest) returns (NormalizeRenewalResponse);

  // Explains a renewal.
  rpc ExplainRenewalDecision(ExplainRenewalDecisionRequest) returns (ExplainRenewalDecisionResponse);

  // Scores a renewal.
  rpc ScoreRenewal(ScoreRenewalRequest) returns (ScoreRenewalResponse);

  // Returns a renewal.
  rpc GetRenewalRules(GetRenewalRulesRequest) returns (GetRenewalRulesResponse);
}

// The request of `ValidateRenewal`.
message ValidateRenewalRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string renewal_id = 2;
  Renewal renewal = 3;
  ValidateRenewalRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateRenewal`.
message ValidateRenewalResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Renewal renewal = 1;
  ValidateRenewalResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

