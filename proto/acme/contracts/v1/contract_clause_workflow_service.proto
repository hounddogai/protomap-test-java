syntax = "proto3";

package acme.contracts.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/contracts/v1/contracts.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Contracts.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/contracts/v1;contractsv1";
option java_multiple_files = true;
option java_outer_classname = "ContractClauseWorkflowServiceProto";
option java_package = "com.acme.contracts.v1";

// Runs the long-lived workflow that takes a contract clause from start to finish.
service ContractClauseWorkflowService {
  // Starts a contract clause.
  rpc StartContractClauseWorkflow(StartContractClauseWorkflowRequest) returns (StartContractClauseWorkflowResponse);

  // Advances a contract clause.
  rpc AdvanceContractClauseWorkflow(AdvanceContractClauseWorkflowRequest) returns (AdvanceContractClauseWorkflowResponse);

  // Cancels a contract clause.
  rpc CancelContractClauseWorkflow(CancelContractClauseWorkflowRequest) returns (CancelContractClauseWorkflowResponse);

  // Retrys a contract clause.
  rpc RetryContractClauseWorkflow(RetryContractClauseWorkflowRequest) returns (RetryContractClauseWorkflowResponse);

  // Pauses a contract clause.
  rpc PauseContractClauseWorkflow(PauseContractClauseWorkflowRequest) returns (PauseContractClauseWorkflowResponse);

  // Resumes a contract clause.
  rpc ResumeContractClauseWorkflow(ResumeContractClauseWorkflowRequest) returns (ResumeContractClauseWorkflowResponse);

  // Returns a contract clause.
  rpc InspectContractClauseWorkflow(InspectContractClauseWorkflowRequest) returns (InspectContractClauseWorkflowResponse);

  // Lists contract clauses a page at a time.
  rpc ListContractClauseWorkflows(ListContractClauseWorkflowsRequest) returns (ListContractClauseWorkflowsResponse);

  // Signals a contract clause.
  rpc SignalContractClauseWorkflow(SignalContractClauseWorkflowRequest) returns (SignalContractClauseWorkflowResponse);
}

// The request of `StartContractClauseWorkflow`.
message StartContractClauseWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string contract_clause_id = 2;
  ContractClause contract_clause = 3;
  StartContractClauseWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartContractClauseWorkflow`.
message StartContractClauseWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ContractClause contract_clause = 1;
  StartContractClauseWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

