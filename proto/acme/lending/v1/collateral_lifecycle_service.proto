syntax = "proto3";

package acme.lending.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/lending/v1/lending.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Lending.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/lending/v1;lendingv1";
option java_multiple_files = true;
option java_outer_classname = "CollateralLifecycleServiceProto";
option java_package = "com.acme.lending.v1";

// Moves a collateral between the states of its lifecycle.
service CollateralLifecycleService {
  // Activates a collateral.
  rpc ActivateCollateral(ActivateCollateralRequest) returns (ActivateCollateralResponse);

  // Suspends a collateral.
  rpc SuspendCollateral(SuspendCollateralRequest) returns (SuspendCollateralResponse);

  // Reinstates a collateral.
  rpc ReinstateCollateral(ReinstateCollateralRequest) returns (ReinstateCollateralResponse);

  // Terminates a collateral.
  rpc TerminateCollateral(TerminateCollateralRequest) returns (TerminateCollateralResponse);

  // Renews a collateral.
  rpc RenewCollateral(RenewCollateralRequest) returns (RenewCollateralResponse);

  // Returns a collateral.
  rpc GetCollateralLifecycle(GetCollateralLifecycleRequest) returns (GetCollateralLifecycleResponse);
}

// The request of `ActivateCollateral`.
message ActivateCollateralRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string collateral_id = 2;
  ActivateCollateralRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateCollateral`.
message ActivateCollateralResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Collateral collateral = 1;
  ActivateCollateralResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

