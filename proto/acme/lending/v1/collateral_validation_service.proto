syntax = "proto3";

package acme.lending.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/lending/v1/lending.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Lending.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/lending/v1;lendingv1";
option java_multiple_files = true;
option java_outer_classname = "CollateralValidationServiceProto";
option java_package = "com.acme.lending.v1";

// Checks collaterals against the rules before anything acts on them.
service CollateralValidationService {
  // Validates a collateral.
  rpc ValidateCollateral(ValidateCollateralRequest) returns (ValidateCollateralResponse);

  // Previews a collateral.
  rpc PreviewCollateral(PreviewCollateralRequest) returns (PreviewCollateralResponse);

  // Checks a collateral.
  rpc CheckCollateralEligibility(CheckCollateralEligibilityRequest) returns (CheckCollateralEligibilityResponse);

  // Normalizes a collateral.
  rpc NormalizeCollateral(NormalizeCollateralRequest) returns (NormalizeCollateralResponse);

  // Explains a collateral.
  rpc ExplainCollateralDecision(ExplainCollateralDecisionRequest) returns (ExplainCollateralDecisionResponse);

  // Scores a collateral.
  rpc ScoreCollateral(ScoreCollateralRequest) returns (ScoreCollateralResponse);

  // Lints a collateral.
  rpc LintCollaterals(LintCollateralsRequest) returns (LintCollateralsResponse);

  // Returns a collateral.
  rpc GetCollateralRules(GetCollateralRulesRequest) returns (GetCollateralRulesResponse);
}

// The request of `ValidateCollateral`.
message ValidateCollateralRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string collateral_id = 2;
  Collateral collateral = 3;
  ValidateCollateralRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateCollateral`.
message ValidateCollateralResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Collateral collateral = 1;
  ValidateCollateralResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

