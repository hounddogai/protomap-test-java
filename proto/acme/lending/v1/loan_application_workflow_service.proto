option csharp_namespace = "Acme.Lending.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/lending/v1;lendingv1";
option java_multiple_files = true;
option java_outer_classname = "LoanApplicationWorkflowServiceProto";
option java_package = "com.acme.lending.v1";

// Runs the long-lived workflow that takes a loan application from start to finish.
service LoanApplicationWorkflowService {
  // Starts a loan application.
  rpc StartLoanApplicationWorkflow(StartLoanApplicationWorkflowRequest) returns (StartLoanApplicationWorkflowResponse);

  // Advances a loan application.
  rpc AdvanceLoanApplicationWorkflow(AdvanceLoanApplicationWorkflowRequest) returns (AdvanceLoanApplicationWorkflowResponse);

  // Cancels a loan application.
  rpc CancelLoanApplicationWorkflow(CancelLoanApplicationWorkflowRequest) returns (CancelLoanApplicationWorkflowResponse);

  // Retrys a loan application.
  rpc RetryLoanApplicationWorkflow(RetryLoanApplicationWorkflowRequest) returns (RetryLoanApplicationWorkflowResponse);

  // Pauses a loan application.
  rpc PauseLoanApplicationWorkflow(PauseLoanApplicationWorkflowRequest) returns (PauseLoanApplicationWorkflowResponse);

  // Resumes a loan application.
  rpc ResumeLoanApplicationWorkflow(ResumeLoanApplicationWorkflowRequest) returns (ResumeLoanApplicationWorkflowResponse);

  // Returns a loan application.
  rpc InspectLoanApplicationWorkflow(InspectLoanApplicationWorkflowRequest) returns (InspectLoanApplicationWorkflowResponse);

  // Signals a loan application.
  rpc SignalLoanApplicationWorkflow(SignalLoanApplicationWorkflowRequest) returns (SignalLoanApplicationWorkflowResponse);
}

// The request of `StartLoanApplicationWorkflow`.
message StartLoanApplicationWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string loan_application_id = 2;
  LoanApplication loan_application = 3;
  StartLoanApplicationWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartLoanApplicationWorkflow`.
message StartLoanApplicationWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  LoanApplication loan_application = 1;
  StartLoanApplicationWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

