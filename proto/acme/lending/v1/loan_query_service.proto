syntax = "proto3";

package acme.lending.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/lending/v1/lending.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Lending.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/lending/v1;lendingv1";
option java_multiple_files = true;
option java_outer_classname = "LoanQueryServiceProto";
option java_package = "com.acme.lending.v1";

// Answers read-only questions about loans, for screens and reports.
service LoanQueryService {
  // Returns a loan.
  rpc LookupLoan(LookupLoanRequest) returns (LookupLoanResponse);

  // Lists loans a page at a time.
  rpc BrowseLoans(BrowseLoansRequest) returns (BrowseLoansResponse);

  // Lists loans a page at a time.
  rpc FindLoans(FindLoansRequest) returns (FindLoansResponse);

  // Counts loans by status.
  rpc CountLoans(CountLoansRequest) returns (CountLoansResponse);

  // Returns several loans at once.
  rpc ResolveLoans(ResolveLoansRequest) returns (ResolveLoansResponse);

  // Streams every matching loan.
  rpc ExportLoans(ExportLoansRequest) returns (stream ExportLoansResponse);

  // Summarizes a loan.
  rpc SummarizeLoans(SummarizeLoansRequest) returns (SummarizeLoansResponse);

  // Lists loans a page at a time.
  rpc SuggestLoans(SuggestLoansRequest) returns (SuggestLoansResponse);

  // Returns a loan.
  rpc PeekLoan(PeekLoanRequest) returns (PeekLoanResponse);
}

// The request of `LookupLoan`.
message LookupLoanRequest {
  acme.common.v1.RequestContext context = 1;
  string loan_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupLoan`.
message LookupLoanResponse {
  Loan loan = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseLoans`.
message BrowseLoansRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated LoanStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseLoansRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseLoans`.
message BrowseLoansResponse {
  repeated Loan loans = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindLoans`.
message FindLoansRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated LoanStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindLoansRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindLoans`.
message FindLoansResponse {
  repeated Loan loans = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountLoans`.
message CountLoansRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated LoanStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountLoansRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountLoans`.
message CountLoansResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveLoans`.
message ResolveLoansRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string loan_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveLoans`.
message ResolveLoansResponse {
  repeated Loan loans = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportLoans`.
message ExportLoansRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated LoanStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportLoansRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportLoans`.
message ExportLoansResponse {
  Loan loan = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeLoans`.
message SummarizeLoansRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string loan_id = 2;
  SummarizeLoansRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeLoans`.
message SummarizeLoansResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestLoans`.
message SuggestLoansRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated LoanStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestLoansRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestLoans`.
message SuggestLoansResponse {
  repeated Loan loans = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekLoan`.
message PeekLoanRequest {
  acme.common.v1.RequestContext context = 1;
  string loan_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekLoan`.
message PeekLoanResponse {
  Loan loan = 1;
  acme.common.v1.OperationResult result = 2;
}
