syntax = "proto3";

package acme.lending.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/lending/v1/lending.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Lending.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/lending/v1;lendingv1";
option java_multiple_files = true;
option java_outer_classname = "LoanLifecycleServiceProto";
option java_package = "com.acme.lending.v1";

// Moves a loan between the states of its lifecycle.
service LoanLifecycleService {
  // Activates a loan.
  rpc ActivateLoan(ActivateLoanRequest) returns (ActivateLoanResponse);

  // Suspends a loan.
  rpc SuspendLoan(SuspendLoanRequest) returns (SuspendLoanResponse);

  // Reinstates a loan.
  rpc ReinstateLoan(ReinstateLoanRequest) returns (ReinstateLoanResponse);

  // Terminates a loan.
  rpc TerminateLoan(TerminateLoanRequest) returns (TerminateLoanResponse);

  // Renews a loan.
  rpc RenewLoan(RenewLoanRequest) returns (RenewLoanResponse);

  // Returns a loan.
  rpc GetLoanLifecycle(GetLoanLifecycleRequest) returns (GetLoanLifecycleResponse);

  // Schedules a loan.
  rpc ScheduleLoanExpiry(ScheduleLoanExpiryRequest) returns (ScheduleLoanExpiryResponse);
}

// The request of `ActivateLoan`.
message ActivateLoanRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string loan_id = 2;
  ActivateLoanRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateLoan`.
message ActivateLoanResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Loan loan = 1;
  ActivateLoanResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

