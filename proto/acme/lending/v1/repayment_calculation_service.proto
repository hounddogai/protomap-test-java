syntax = "proto3";

package acme.lending.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/lending/v1/lending.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Lending.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/lending/v1;lendingv1";
option java_multiple_files = true;
option java_outer_classname = "RepaymentCalculationServiceProto";
option java_package = "com.acme.lending.v1";

// Computes the figures of a repayment, such as totals, taxes, and estimates.
service RepaymentCalculationService {
  // Calculates a repayment.
  rpc CalculateRepayment(CalculateRepaymentRequest) returns (CalculateRepaymentResponse);

  // Estimates a repayment.
  rpc EstimateRepayment(EstimateRepaymentRequest) returns (EstimateRepaymentResponse);

  // Quotes a repayment.
  rpc QuoteRepayment(QuoteRepaymentRequest) returns (QuoteRepaymentResponse);

  // Compares a repayment.
  rpc CompareRepaymentOptions(CompareRepaymentOptionsRequest) returns (CompareRepaymentOptionsResponse);

  // Recalculates a repayment.
  rpc RecalculateRepayments(RecalculateRepaymentsRequest) returns (RecalculateRepaymentsResponse);

  // Simulates a repayment.
  rpc SimulateRepayment(SimulateRepaymentRequest) returns (SimulateRepaymentResponse);

  // Explains a repayment.
  rpc ExplainRepaymentCalculation(ExplainRepaymentCalculationRequest) returns (ExplainRepaymentCalculationResponse);

  // Returns a repayment.
  rpc GetRepaymentRates(GetRepaymentRatesRequest) returns (GetRepaymentRatesResponse);
}

// The request of `CalculateRepayment`.
message CalculateRepaymentRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string repayment_id = 2;
  Repayment repayment = 3;
  CalculateRepaymentRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateRepayment`.
message CalculateRepaymentResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateRepaymentResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Repayment repayment = 1;
  CalculateRepaymentResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

