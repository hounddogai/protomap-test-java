    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Loan loan = 1;
  ExplainLoanCalculationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetLoanRates`.
message GetLoanRatesRequest {
