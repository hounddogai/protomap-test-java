syntax = "proto3";

package acme.lending.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/lending/v1/lending.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Lending.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/lending/v1;lendingv1";
option java_multiple_files = true;
option java_outer_classname = "LoanValidationServiceProto";
option java_package = "com.acme.lending.v1";

// Checks loans against the rules before anything acts on them.
service LoanValidationService {
  // Validates a loan.
  rpc ValidateLoan(ValidateLoanRequest) returns (ValidateLoanResponse);

  // Previews a loan.
  rpc PreviewLoan(PreviewLoanRequest) returns (PreviewLoanResponse);

  // Checks a loan.
  rpc CheckLoanEligibility(CheckLoanEligibilityRequest) returns (CheckLoanEligibilityResponse);

  // Normalizes a loan.
  rpc NormalizeLoan(NormalizeLoanRequest) returns (NormalizeLoanResponse);

  // Explains a loan.
  rpc ExplainLoanDecision(ExplainLoanDecisionRequest) returns (ExplainLoanDecisionResponse);

  // Scores a loan.
  rpc ScoreLoan(ScoreLoanRequest) returns (ScoreLoanResponse);

  // Lints a loan.
  rpc LintLoans(LintLoansRequest) returns (LintLoansResponse);

  // Returns a loan.
  rpc GetLoanRules(GetLoanRulesRequest) returns (GetLoanRulesResponse);
}

// The request of `ValidateLoan`.
message ValidateLoanRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string loan_id = 2;
  Loan loan = 3;
  ValidateLoanRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateLoan`.
message ValidateLoanResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Loan loan = 1;
  ValidateLoanResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

