syntax = "proto3";

package acme.lending.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/lending/v1/lending.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Lending.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/lending/v1;lendingv1";
option java_multiple_files = true;
option java_outer_classname = "LoanApprovalServiceProto";
option java_package = "com.acme.lending.v1";

// Routes loans through approval, with escalation and delegation.
service LoanApprovalService {
  // Submits a loan.
  rpc SubmitLoan(SubmitLoanRequest) returns (SubmitLoanResponse);

  // Approves a loan.
  rpc ApproveLoan(ApproveLoanRequest) returns (ApproveLoanResponse);

  // Rejects a loan.
  rpc RejectLoan(RejectLoanRequest) returns (RejectLoanResponse);

  // Escalates a loan.
  rpc EscalateLoan(EscalateLoanRequest) returns (EscalateLoanResponse);

  // Lists loans a page at a time.
  rpc ListPendingLoans(ListPendingLoansRequest) returns (ListPendingLoansResponse);

  // Recalls a loan.
  rpc RecallLoan(RecallLoanRequest) returns (RecallLoanResponse);

  // Returns a loan.
  rpc GetLoanApprovalStatus(GetLoanApprovalStatusRequest) returns (GetLoanApprovalStatusResponse);

  // Comments a loan.
  rpc CommentLoanApproval(CommentLoanApprovalRequest) returns (CommentLoanApprovalResponse);
}

// The request of `SubmitLoan`.
message SubmitLoanRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string loan_id = 2;
  Loan loan = 3;
  SubmitLoanRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitLoan`.
message SubmitLoanResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Loan loan = 1;
  SubmitLoanResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

