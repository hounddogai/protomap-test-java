syntax = "proto3";

package acme.lending.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/lending/v1/lending.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Lending.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/lending/v1;lendingv1";
option java_multiple_files = true;
option java_outer_classname = "CollateralWorkflowServiceProto";
option java_package = "com.acme.lending.v1";

// Runs the long-lived workflow that takes a collateral from start to finish.
service CollateralWorkflowService {
  // Starts a collateral.
  rpc StartCollateralWorkflow(StartCollateralWorkflowRequest) returns (StartCollateralWorkflowResponse);

  // Advances a collateral.
  rpc AdvanceCollateralWorkflow(AdvanceCollateralWorkflowRequest) returns (AdvanceCollateralWorkflowResponse);

  // Cancels a collateral.
  rpc CancelCollateralWorkflow(CancelCollateralWorkflowRequest) returns (CancelCollateralWorkflowResponse);

  // Pauses a collateral.
  rpc PauseCollateralWorkflow(PauseCollateralWorkflowRequest) returns (PauseCollateralWorkflowResponse);

  // Resumes a collateral.
  rpc ResumeCollateralWorkflow(ResumeCollateralWorkflowRequest) returns (ResumeCollateralWorkflowResponse);

  // Lists collaterals a page at a time.
  rpc ListCollateralWorkflows(ListCollateralWorkflowsRequest) returns (ListCollateralWorkflowsResponse);

  // Signals a collateral.
  rpc SignalCollateralWorkflow(SignalCollateralWorkflowRequest) returns (SignalCollateralWorkflowResponse);
}

// The request of `StartCollateralWorkflow`.
message StartCollateralWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string collateral_id = 2;
  Collateral collateral = 3;
  StartCollateralWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartCollateralWorkflow`.
message StartCollateralWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Collateral collateral = 1;
  StartCollateralWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

