syntax = "proto3";

package acme.lending.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/lending/v1/lending.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Lending.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/lending/v1;lendingv1";
option java_multiple_files = true;
option java_outer_classname = "RepaymentApprovalServiceProto";
option java_package = "com.acme.lending.v1";

// Routes repayments through approval, with escalation and delegation.
service RepaymentApprovalService {
  // Submits a repayment.
  rpc SubmitRepayment(SubmitRepaymentRequest) returns (SubmitRepaymentResponse);

  // Approves a repayment.
  rpc ApproveRepayment(ApproveRepaymentRequest) returns (ApproveRepaymentResponse);

  // Rejects a repayment.
  rpc RejectRepayment(RejectRepaymentRequest) returns (RejectRepaymentResponse);

  // Escalates a repayment.
  rpc EscalateRepayment(EscalateRepaymentRequest) returns (EscalateRepaymentResponse);

  // Lists repayments a page at a time.
  rpc ListPendingRepayments(ListPendingRepaymentsRequest) returns (ListPendingRepaymentsResponse);

  // Recalls a repayment.
  rpc RecallRepayment(RecallRepaymentRequest) returns (RecallRepaymentResponse);

  // Returns a repayment.
  rpc GetRepaymentApprovalStatus(GetRepaymentApprovalStatusRequest) returns (GetRepaymentApprovalStatusResponse);

  // Comments a repayment.
  rpc CommentRepaymentApproval(CommentRepaymentApprovalRequest) returns (CommentRepaymentApprovalResponse);
}

// The request of `SubmitRepayment`.
message SubmitRepaymentRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string repayment_id = 2;
  Repayment repayment = 3;
  SubmitRepaymentRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitRepayment`.
message SubmitRepaymentResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Repayment repayment = 1;
  SubmitRepaymentResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

