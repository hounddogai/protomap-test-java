syntax = "proto3";

package acme.lending.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/lending/v1/lending.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Lending.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/lending/v1;lendingv1";
option java_multiple_files = true;
option java_outer_classname = "RepaymentLifecycleServiceProto";
option java_package = "com.acme.lending.v1";

// Moves a repayment between the states of its lifecycle.
service RepaymentLifecycleService {
  // Activates a repayment.
  rpc ActivateRepayment(ActivateRepaymentRequest) returns (ActivateRepaymentResponse);

  // Suspends a repayment.
  rpc SuspendRepayment(SuspendRepaymentRequest) returns (SuspendRepaymentResponse);

  // Terminates a repayment.
  rpc TerminateRepayment(TerminateRepaymentRequest) returns (TerminateRepaymentResponse);

  // Renews a repayment.
  rpc RenewRepayment(RenewRepaymentRequest) returns (RenewRepaymentResponse);

  // Expires a repayment.
  rpc ExpireRepayment(ExpireRepaymentRequest) returns (ExpireRepaymentResponse);

  // Returns a repayment.
  rpc GetRepaymentLifecycle(GetRepaymentLifecycleRequest) returns (GetRepaymentLifecycleResponse);

  // Schedules a repayment.
  rpc ScheduleRepaymentExpiry(ScheduleRepaymentExpiryRequest) returns (ScheduleRepaymentExpiryResponse);
}

// The request of `ActivateRepayment`.
message ActivateRepaymentRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string repayment_id = 2;
  ActivateRepaymentRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateRepayment`.
message ActivateRepaymentResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Repayment repayment = 1;
  ActivateRepaymentResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

