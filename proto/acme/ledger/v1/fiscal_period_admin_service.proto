    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FiscalPeriod fiscal_period = 1;
  RestoreFiscalPeriodResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PurgeFiscalPeriod`.
message PurgeFiscalPeriodRequest {
  acme.common.v1.RequestContext context = 1;
  string fiscal_period_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `PurgeFiscalPeriod`.
message PurgeFiscalPeriodResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}

// The request of `ReassignFiscalPeriod`.
message ReassignFiscalPeriodRequest {
  // What the operation needs besides the record.
  message Details {
    acme.identity.v1.UserRef assignee = 1;
    string queue = 2;
    int32 capacity = 3;
    string assignee_email = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string fiscal_period_id = 2;
  ReassignFiscalPeriodRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ReassignFiscalPeriod`.
message ReassignFiscalPeriodResponse {
  // What the operation decided.
