syntax = "proto3";

package acme.ledger.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/ledger/v1/ledger.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Ledger.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/ledger/v1;ledgerv1";
option java_multiple_files = true;
option java_outer_classname = "FiscalPeriodAdminServiceProto";
option java_package = "com.acme.ledger.v1";

// Operator actions on fiscal periods that support staff run by hand.
service FiscalPeriodAdminService {
  // Archives a fiscal period.
  rpc ArchiveFiscalPeriod(ArchiveFiscalPeriodRequest) returns (ArchiveFiscalPeriodResponse);

  // Restores a fiscal period.
  rpc RestoreFiscalPeriod(RestoreFiscalPeriodRequest) returns (RestoreFiscalPeriodResponse);

  // Deletes a fiscal period.
  rpc PurgeFiscalPeriod(PurgeFiscalPeriodRequest) returns (PurgeFiscalPeriodResponse);

  // Reassigns a fiscal period.
  rpc ReassignFiscalPeriod(ReassignFiscalPeriodRequest) returns (ReassignFiscalPeriodResponse);

  // Locks a fiscal period.
  rpc LockFiscalPeriod(LockFiscalPeriodRequest) returns (LockFiscalPeriodResponse);

  // Unlocks a fiscal period.
  rpc UnlockFiscalPeriod(UnlockFiscalPeriodRequest) returns (UnlockFiscalPeriodResponse);

  // Transfers a fiscal period.
  rpc TransferFiscalPeriod(TransferFiscalPeriodRequest) returns (TransferFiscalPeriodResponse);

  // Repairs a fiscal period.
  rpc RepairFiscalPeriod(RepairFiscalPeriodRequest) returns (RepairFiscalPeriodResponse);

  // Returns a fiscal period.
  rpc InspectFiscalPeriod(InspectFiscalPeriodRequest) returns (InspectFiscalPeriodResponse);
}

// The request of `ArchiveFiscalPeriod`.
message ArchiveFiscalPeriodRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string fiscal_period_id = 2;
  ArchiveFiscalPeriodRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ArchiveFiscalPeriod`.
message ArchiveFiscalPeriodResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FiscalPeriod fiscal_period = 1;
  ArchiveFiscalPeriodResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `RestoreFiscalPeriod`.
message RestoreFiscalPeriodRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
