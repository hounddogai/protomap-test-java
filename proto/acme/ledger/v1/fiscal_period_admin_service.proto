// The request of `InspectFiscalPeriod`.
message InspectFiscalPeriodRequest {
  acme.common.v1.RequestContext context = 1;
  string fiscal_period_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `InspectFiscalPeriod`.
message InspectFiscalPeriodResponse {
