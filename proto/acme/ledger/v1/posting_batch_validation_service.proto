  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PostingBatch posting_batch = 1;
  LintPostingBatchesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetPostingBatchRules`.
message GetPostingBatchRulesRequest {
  acme.common.v1.RequestContext context = 1;
  string posting_batch_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetPostingBatchRules`.
message GetPostingBatchRulesResponse {
  PostingBatch posting_batch = 1;
  acme.common.v1.OperationResult result = 2;
}
