syntax = "proto3";

package acme.ledger.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/ledger/v1/ledger.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Ledger.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/ledger/v1;ledgerv1";
option java_multiple_files = true;
option java_outer_classname = "JournalEntryNotificationServiceProto";
option java_package = "com.acme.ledger.v1";

// Tells the people who follow a journal entry what changed.
service JournalEntryNotificationService {
  // Subscribes a journal entry.
  rpc SubscribeJournalEntryUpdates(SubscribeJournalEntryUpdatesRequest) returns (SubscribeJournalEntryUpdatesResponse);

  // Unsubscribes a journal entry.
  rpc UnsubscribeJournalEntryUpdates(UnsubscribeJournalEntryUpdatesRequest) returns (UnsubscribeJournalEntryUpdatesResponse);

  // Notifys a journal entry.
  rpc NotifyJournalEntryWatchers(NotifyJournalEntryWatchersRequest) returns (NotifyJournalEntryWatchersResponse);

  // Lists journal entries a page at a time.
  rpc ListJournalEntrySubscriptions(ListJournalEntrySubscriptionsRequest) returns (ListJournalEntrySubscriptionsResponse);

  // Sends a journal entry.
  rpc SendJournalEntryTestNotice(SendJournalEntryTestNoticeRequest) returns (SendJournalEntryTestNoticeResponse);

  // Returns a journal entry.
  rpc GetJournalEntryPreferences(GetJournalEntryPreferencesRequest) returns (GetJournalEntryPreferencesResponse);

  // Streams the changes of journal entries as they happen.
  rpc StreamJournalEntryNotices(StreamJournalEntryNoticesRequest) returns (stream StreamJournalEntryNoticesResponse);
}

// The request of `SubscribeJournalEntryUpdates`.
message SubscribeJournalEntryUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string journal_entry_id = 2;
  SubscribeJournalEntryUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SubscribeJournalEntryUpdates`.
message SubscribeJournalEntryUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  JournalEntry journal_entry = 1;
  SubscribeJournalEntryUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `UnsubscribeJournalEntryUpdates`.
message UnsubscribeJournalEntryUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string journal_entry_id = 2;
  UnsubscribeJournalEntryUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `UnsubscribeJournalEntryUpdates`.
message UnsubscribeJournalEntryUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  JournalEntry journal_entry = 1;
  UnsubscribeJournalEntryUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `NotifyJournalEntryWatchers`.
message NotifyJournalEntryWatchersRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string journal_entry_id = 2;
  NotifyJournalEntryWatchersRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `NotifyJournalEntryWatchers`.
message NotifyJournalEntryWatchersResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  JournalEntry journal_entry = 1;
  NotifyJournalEntryWatchersResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListJournalEntrySubscriptions`.
message ListJournalEntrySubscriptionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated JournalEntryStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListJournalEntrySubscriptionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListJournalEntrySubscriptions`.
message ListJournalEntrySubscriptionsResponse {
  repeated JournalEntry journal_entries = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SendJournalEntryTestNotice`.
message SendJournalEntryTestNoticeRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string journal_entry_id = 2;
  SendJournalEntryTestNoticeRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SendJournalEntryTestNotice`.
message SendJournalEntryTestNoticeResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  JournalEntry journal_entry = 1;
  SendJournalEntryTestNoticeResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetJournalEntryPreferences`.
message GetJournalEntryPreferencesRequest {
  acme.common.v1.RequestContext context = 1;
  string journal_entry_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetJournalEntryPreferences`.
message GetJournalEntryPreferencesResponse {
  JournalEntry journal_entry = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `StreamJournalEntryNotices`.
message StreamJournalEntryNoticesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated JournalEntryStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamJournalEntryNoticesRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamJournalEntryNotices`.
message StreamJournalEntryNoticesResponse {
  JournalEntry journal_entry = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}
