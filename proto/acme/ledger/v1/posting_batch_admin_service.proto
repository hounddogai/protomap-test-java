// The request of `RepairPostingBatch`.
message RepairPostingBatchRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string posting_batch_id = 2;
  PostingBatch posting_batch = 3;
  RepairPostingBatchRequest.Details details = 4;
