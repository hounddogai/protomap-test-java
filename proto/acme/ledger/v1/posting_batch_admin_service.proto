syntax = "proto3";

package acme.ledger.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/ledger/v1/ledger.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Ledger.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/ledger/v1;ledgerv1";
option java_multiple_files = true;
option java_outer_classname = "PostingBatchAdminServiceProto";
option java_package = "com.acme.ledger.v1";

// Operator actions on posting batches that support staff run by hand.
service PostingBatchAdminService {
  // Archives a posting batch.
  rpc ArchivePostingBatch(ArchivePostingBatchRequest) returns (ArchivePostingBatchResponse);

  // Restores a posting batch.
  rpc RestorePostingBatch(RestorePostingBatchRequest) returns (RestorePostingBatchResponse);

  // Deletes a posting batch.
  rpc PurgePostingBatch(PurgePostingBatchRequest) returns (PurgePostingBatchResponse);

  // Reassigns a posting batch.
  rpc ReassignPostingBatch(ReassignPostingBatchRequest) returns (ReassignPostingBatchResponse);

  // Locks a posting batch.
  rpc LockPostingBatch(LockPostingBatchRequest) returns (LockPostingBatchResponse);

  // Unlocks a posting batch.
  rpc UnlockPostingBatch(UnlockPostingBatchRequest) returns (UnlockPostingBatchResponse);

  // Transfers a posting batch.
  rpc TransferPostingBatch(TransferPostingBatchRequest) returns (TransferPostingBatchResponse);

  // Repairs a posting batch.
  rpc RepairPostingBatch(RepairPostingBatchRequest) returns (RepairPostingBatchResponse);

  // Returns a posting batch.
  rpc InspectPostingBatch(InspectPostingBatchRequest) returns (InspectPostingBatchResponse);
}

// The request of `ArchivePostingBatch`.
message ArchivePostingBatchRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string posting_batch_id = 2;
  ArchivePostingBatchRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ArchivePostingBatch`.
message ArchivePostingBatchResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PostingBatch posting_batch = 1;
  ArchivePostingBatchResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `RestorePostingBatch`.
message RestorePostingBatchRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
