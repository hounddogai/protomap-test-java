    google.protobuf.Timestamp effective_at = 5;
  }

  PostingBatch posting_batch = 1;
  RestorePostingBatchResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PurgePostingBatch`.
message PurgePostingBatchRequest {
  acme.common.v1.RequestContext context = 1;
  string posting_batch_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `PurgePostingBatch`.
message PurgePostingBatchResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}

// The request of `ReassignPostingBatch`.
message ReassignPostingBatchRequest {
  // What the operation needs besides the record.
  message Details {
    acme.identity.v1.UserRef assignee = 1;
    string queue = 2;
    int32 capacity = 3;
    string assignee_email = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string posting_batch_id = 2;
  ReassignPostingBatchRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ReassignPostingBatch`.
message ReassignPostingBatchResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
