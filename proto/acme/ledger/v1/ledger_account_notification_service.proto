syntax = "proto3";

package acme.ledger.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/ledger/v1/ledger.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Ledger.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/ledger/v1;ledgerv1";
option java_multiple_files = true;
option java_outer_classname = "LedgerAccountNotificationServiceProto";
option java_package = "com.acme.ledger.v1";

// Tells the people who follow a ledger account what changed.
service LedgerAccountNotificationService {
  // Subscribes a ledger account.
  rpc SubscribeLedgerAccountUpdates(SubscribeLedgerAccountUpdatesRequest) returns (SubscribeLedgerAccountUpdatesResponse);

  // Unsubscribes a ledger account.
  rpc UnsubscribeLedgerAccountUpdates(UnsubscribeLedgerAccountUpdatesRequest) returns (UnsubscribeLedgerAccountUpdatesResponse);

  // Notifys a ledger account.
  rpc NotifyLedgerAccountWatchers(NotifyLedgerAccountWatchersRequest) returns (NotifyLedgerAccountWatchersResponse);

  // Lists ledger accounts a page at a time.
  rpc ListLedgerAccountSubscriptions(ListLedgerAccountSubscriptionsRequest) returns (ListLedgerAccountSubscriptionsResponse);

  // Sends a ledger account.
  rpc SendLedgerAccountTestNotice(SendLedgerAccountTestNoticeRequest) returns (SendLedgerAccountTestNoticeResponse);

  // Returns a ledger account.
  rpc GetLedgerAccountPreferences(GetLedgerAccountPreferencesRequest) returns (GetLedgerAccountPreferencesResponse);

  // Streams the changes of ledger accounts as they happen.
  rpc StreamLedgerAccountNotices(StreamLedgerAccountNoticesRequest) returns (stream StreamLedgerAccountNoticesResponse);
}

// The request of `SubscribeLedgerAccountUpdates`.
message SubscribeLedgerAccountUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string ledger_account_id = 2;
  SubscribeLedgerAccountUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SubscribeLedgerAccountUpdates`.
message SubscribeLedgerAccountUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  LedgerAccount ledger_account = 1;
  SubscribeLedgerAccountUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `UnsubscribeLedgerAccountUpdates`.
message UnsubscribeLedgerAccountUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string ledger_account_id = 2;
  UnsubscribeLedgerAccountUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `UnsubscribeLedgerAccountUpdates`.
message UnsubscribeLedgerAccountUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  LedgerAccount ledger_account = 1;
  UnsubscribeLedgerAccountUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `NotifyLedgerAccountWatchers`.
message NotifyLedgerAccountWatchersRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string ledger_account_id = 2;
  NotifyLedgerAccountWatchersRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `NotifyLedgerAccountWatchers`.
message NotifyLedgerAccountWatchersResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  LedgerAccount ledger_account = 1;
  NotifyLedgerAccountWatchersResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListLedgerAccountSubscriptions`.
message ListLedgerAccountSubscriptionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated LedgerAccountStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListLedgerAccountSubscriptionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListLedgerAccountSubscriptions`.
message ListLedgerAccountSubscriptionsResponse {
  repeated LedgerAccount ledger_accounts = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SendLedgerAccountTestNotice`.
message SendLedgerAccountTestNoticeRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string ledger_account_id = 2;
  SendLedgerAccountTestNoticeRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SendLedgerAccountTestNotice`.
message SendLedgerAccountTestNoticeResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  LedgerAccount ledger_account = 1;
  SendLedgerAccountTestNoticeResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetLedgerAccountPreferences`.
message GetLedgerAccountPreferencesRequest {
  acme.common.v1.RequestContext context = 1;
  string ledger_account_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetLedgerAccountPreferences`.
message GetLedgerAccountPreferencesResponse {
  LedgerAccount ledger_account = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `StreamLedgerAccountNotices`.
message StreamLedgerAccountNoticesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated LedgerAccountStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamLedgerAccountNoticesRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamLedgerAccountNotices`.
message StreamLedgerAccountNoticesResponse {
  LedgerAccount ledger_account = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}
