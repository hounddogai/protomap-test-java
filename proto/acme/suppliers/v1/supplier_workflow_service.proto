option csharp_namespace = "Acme.Suppliers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/suppliers/v1;suppliersv1";
option java_multiple_files = true;
option java_outer_classname = "SupplierWorkflowServiceProto";
option java_package = "com.acme.suppliers.v1";

// Runs the long-lived workflow that takes a supplier from start to finish.
service SupplierWorkflowService {
  // Starts a supplier.
  rpc StartSupplierWorkflow(StartSupplierWorkflowRequest) returns (StartSupplierWorkflowResponse);

  // Advances a supplier.
  rpc AdvanceSupplierWorkflow(AdvanceSupplierWorkflowRequest) returns (AdvanceSupplierWorkflowResponse);

  // Cancels a supplier.
  rpc CancelSupplierWorkflow(CancelSupplierWorkflowRequest) returns (CancelSupplierWorkflowResponse);

  // Retrys a supplier.
  rpc RetrySupplierWorkflow(RetrySupplierWorkflowRequest) returns (RetrySupplierWorkflowResponse);

  // Pauses a supplier.
  rpc PauseSupplierWorkflow(PauseSupplierWorkflowRequest) returns (PauseSupplierWorkflowResponse);

  // Resumes a supplier.
  rpc ResumeSupplierWorkflow(ResumeSupplierWorkflowRequest) returns (ResumeSupplierWorkflowResponse);

  // Returns a supplier.
  rpc InspectSupplierWorkflow(InspectSupplierWorkflowRequest) returns (InspectSupplierWorkflowResponse);

  // Lists suppliers a page at a time.
  rpc ListSupplierWorkflows(ListSupplierWorkflowsRequest) returns (ListSupplierWorkflowsResponse);

  // Signals a supplier.
  rpc SignalSupplierWorkflow(SignalSupplierWorkflowRequest) returns (SignalSupplierWorkflowResponse);
}

// The request of `StartSupplierWorkflow`.
message StartSupplierWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string supplier_id = 2;
  Supplier supplier = 3;
  StartSupplierWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartSupplierWorkflow`.
message StartSupplierWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Supplier supplier = 1;
  StartSupplierWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

