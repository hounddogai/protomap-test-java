syntax = "proto3";

package acme.suppliers.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/suppliers/v1/suppliers.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Suppliers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/suppliers/v1;suppliersv1";
option java_multiple_files = true;
option java_outer_classname = "SupplierContractWorkflowServiceProto";
option java_package = "com.acme.suppliers.v1";

// Runs the long-lived workflow that takes a supplier contract from start to finish.
service SupplierContractWorkflowService {
  // Starts a supplier contract.
  rpc StartSupplierContractWorkflow(StartSupplierContractWorkflowRequest) returns (StartSupplierContractWorkflowResponse);

  // Advances a supplier contract.
  rpc AdvanceSupplierContractWorkflow(AdvanceSupplierContractWorkflowRequest) returns (AdvanceSupplierContractWorkflowResponse);

  // Cancels a supplier contract.
  rpc CancelSupplierContractWorkflow(CancelSupplierContractWorkflowRequest) returns (CancelSupplierContractWorkflowResponse);

  // Retrys a supplier contract.
  rpc RetrySupplierContractWorkflow(RetrySupplierContractWorkflowRequest) returns (RetrySupplierContractWorkflowResponse);

  // Pauses a supplier contract.
  rpc PauseSupplierContractWorkflow(PauseSupplierContractWorkflowRequest) returns (PauseSupplierContractWorkflowResponse);

  // Resumes a supplier contract.
  rpc ResumeSupplierContractWorkflow(ResumeSupplierContractWorkflowRequest) returns (ResumeSupplierContractWorkflowResponse);

  // Returns a supplier contract.
  rpc InspectSupplierContractWorkflow(InspectSupplierContractWorkflowRequest) returns (InspectSupplierContractWorkflowResponse);

  // Lists supplier contracts a page at a time.
  rpc ListSupplierContractWorkflows(ListSupplierContractWorkflowsRequest) returns (ListSupplierContractWorkflowsResponse);

  // Signals a supplier contract.
  rpc SignalSupplierContractWorkflow(SignalSupplierContractWorkflowRequest) returns (SignalSupplierContractWorkflowResponse);
}

// The request of `StartSupplierContractWorkflow`.
message StartSupplierContractWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string supplier_contract_id = 2;
  SupplierContract supplier_contract = 3;
  StartSupplierContractWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartSupplierContractWorkflow`.
message StartSupplierContractWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  SupplierContract supplier_contract = 1;
  StartSupplierContractWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

