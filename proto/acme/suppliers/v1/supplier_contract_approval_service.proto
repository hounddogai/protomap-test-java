syntax = "proto3";

package acme.suppliers.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/suppliers/v1/suppliers.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Suppliers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/suppliers/v1;suppliersv1";
option java_multiple_files = true;
option java_outer_classname = "SupplierContractApprovalServiceProto";
option java_package = "com.acme.suppliers.v1";

// Routes supplier contracts through approval, with escalation and delegation.
service SupplierContractApprovalService {
  // Submits a supplier contract.
  rpc SubmitSupplierContract(SubmitSupplierContractRequest) returns (SubmitSupplierContractResponse);

  // Approves a supplier contract.
  rpc ApproveSupplierContract(ApproveSupplierContractRequest) returns (ApproveSupplierContractResponse);

  // Rejects a supplier contract.
  rpc RejectSupplierContract(RejectSupplierContractRequest) returns (RejectSupplierContractResponse);

  // Escalates a supplier contract.
  rpc EscalateSupplierContract(EscalateSupplierContractRequest) returns (EscalateSupplierContractResponse);

  // Lists supplier contracts a page at a time.
  rpc ListPendingSupplierContracts(ListPendingSupplierContractsRequest) returns (ListPendingSupplierContractsResponse);

  // Delegates a supplier contract.
  rpc DelegateSupplierContractApproval(DelegateSupplierContractApprovalRequest) returns (DelegateSupplierContractApprovalResponse);

  // Recalls a supplier contract.
  rpc RecallSupplierContract(RecallSupplierContractRequest) returns (RecallSupplierContractResponse);

  // Returns a supplier contract.
  rpc GetSupplierContractApprovalStatus(GetSupplierContractApprovalStatusRequest) returns (GetSupplierContractApprovalStatusResponse);

  // Comments a supplier contract.
  rpc CommentSupplierContractApproval(CommentSupplierContractApprovalRequest) returns (CommentSupplierContractApprovalResponse);
}

// The request of `SubmitSupplierContract`.
message SubmitSupplierContractRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string supplier_contract_id = 2;
  SupplierContract supplier_contract = 3;
  SubmitSupplierContractRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitSupplierContract`.
message SubmitSupplierContractResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  SupplierContract supplier_contract = 1;
  SubmitSupplierContractResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

