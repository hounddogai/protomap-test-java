syntax = "proto3";

package acme.suppliers.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/suppliers/v1/suppliers.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Suppliers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/suppliers/v1;suppliersv1";
option java_multiple_files = true;
option java_outer_classname = "SupplierRiskApprovalServiceProto";
option java_package = "com.acme.suppliers.v1";

// Routes supplier risks through approval, with escalation and delegation.
service SupplierRiskApprovalService {
  // Submits a supplier risk.
  rpc SubmitSupplierRisk(SubmitSupplierRiskRequest) returns (SubmitSupplierRiskResponse);

  // Approves a supplier risk.
  rpc ApproveSupplierRisk(ApproveSupplierRiskRequest) returns (ApproveSupplierRiskResponse);

  // Rejects a supplier risk.
  rpc RejectSupplierRisk(RejectSupplierRiskRequest) returns (RejectSupplierRiskResponse);

  // Escalates a supplier risk.
  rpc EscalateSupplierRisk(EscalateSupplierRiskRequest) returns (EscalateSupplierRiskResponse);

  // Lists supplier risks a page at a time.
  rpc ListPendingSupplierRisks(ListPendingSupplierRisksRequest) returns (ListPendingSupplierRisksResponse);

  // Recalls a supplier risk.
  rpc RecallSupplierRisk(RecallSupplierRiskRequest) returns (RecallSupplierRiskResponse);

  // Returns a supplier risk.
  rpc GetSupplierRiskApprovalStatus(GetSupplierRiskApprovalStatusRequest) returns (GetSupplierRiskApprovalStatusResponse);

  // Comments a supplier risk.
  rpc CommentSupplierRiskApproval(CommentSupplierRiskApprovalRequest) returns (CommentSupplierRiskApprovalResponse);
}

// The request of `SubmitSupplierRisk`.
message SubmitSupplierRiskRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string supplier_risk_id = 2;
  SupplierRisk supplier_risk = 3;
  SubmitSupplierRiskRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitSupplierRisk`.
message SubmitSupplierRiskResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  SupplierRisk supplier_risk = 1;
  SubmitSupplierRiskResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

