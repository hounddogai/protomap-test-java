syntax = "proto3";

package acme.suppliers.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/suppliers/v1/suppliers.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Suppliers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/suppliers/v1;suppliersv1";
option java_multiple_files = true;
option java_outer_classname = "SupplierRatingApprovalServiceProto";
option java_package = "com.acme.suppliers.v1";

// Routes supplier ratings through approval, with escalation and delegation.
service SupplierRatingApprovalService {
  // Submits a supplier rating.
  rpc SubmitSupplierRating(SubmitSupplierRatingRequest) returns (SubmitSupplierRatingResponse);

  // Approves a supplier rating.
  rpc ApproveSupplierRating(ApproveSupplierRatingRequest) returns (ApproveSupplierRatingResponse);

  // Rejects a supplier rating.
  rpc RejectSupplierRating(RejectSupplierRatingRequest) returns (RejectSupplierRatingResponse);

  // Escalates a supplier rating.
  rpc EscalateSupplierRating(EscalateSupplierRatingRequest) returns (EscalateSupplierRatingResponse);

  // Lists supplier ratings a page at a time.
  rpc ListPendingSupplierRatings(ListPendingSupplierRatingsRequest) returns (ListPendingSupplierRatingsResponse);

  // Delegates a supplier rating.
  rpc DelegateSupplierRatingApproval(DelegateSupplierRatingApprovalRequest) returns (DelegateSupplierRatingApprovalResponse);

  // Recalls a supplier rating.
  rpc RecallSupplierRating(RecallSupplierRatingRequest) returns (RecallSupplierRatingResponse);

  // Returns a supplier rating.
  rpc GetSupplierRatingApprovalStatus(GetSupplierRatingApprovalStatusRequest) returns (GetSupplierRatingApprovalStatusResponse);

  // Comments a supplier rating.
  rpc CommentSupplierRatingApproval(CommentSupplierRatingApprovalRequest) returns (CommentSupplierRatingApprovalResponse);
}

// The request of `SubmitSupplierRating`.
message SubmitSupplierRatingRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string supplier_rating_id = 2;
  SupplierRating supplier_rating = 3;
  SubmitSupplierRatingRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitSupplierRating`.
message SubmitSupplierRatingResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  SupplierRating supplier_rating = 1;
  SubmitSupplierRatingResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

