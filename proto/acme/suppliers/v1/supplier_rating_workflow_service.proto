syntax = "proto3";

package acme.suppliers.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/suppliers/v1/suppliers.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Suppliers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/suppliers/v1;suppliersv1";
option java_multiple_files = true;
option java_outer_classname = "SupplierRatingWorkflowServiceProto";
option java_package = "com.acme.suppliers.v1";

// Runs the long-lived workflow that takes a supplier rating from start to finish.
service SupplierRatingWorkflowService {
  // Starts a supplier rating.
  rpc StartSupplierRatingWorkflow(StartSupplierRatingWorkflowRequest) returns (StartSupplierRatingWorkflowResponse);

  // Advances a supplier rating.
  rpc AdvanceSupplierRatingWorkflow(AdvanceSupplierRatingWorkflowRequest) returns (AdvanceSupplierRatingWorkflowResponse);

  // Cancels a supplier rating.
  rpc CancelSupplierRatingWorkflow(CancelSupplierRatingWorkflowRequest) returns (CancelSupplierRatingWorkflowResponse);

  // Retrys a supplier rating.
  rpc RetrySupplierRatingWorkflow(RetrySupplierRatingWorkflowRequest) returns (RetrySupplierRatingWorkflowResponse);

  // Resumes a supplier rating.
  rpc ResumeSupplierRatingWorkflow(ResumeSupplierRatingWorkflowRequest) returns (ResumeSupplierRatingWorkflowResponse);

  // Returns a supplier rating.
  rpc InspectSupplierRatingWorkflow(InspectSupplierRatingWorkflowRequest) returns (InspectSupplierRatingWorkflowResponse);

  // Lists supplier ratings a page at a time.
  rpc ListSupplierRatingWorkflows(ListSupplierRatingWorkflowsRequest) returns (ListSupplierRatingWorkflowsResponse);

  // Signals a supplier rating.
  rpc SignalSupplierRatingWorkflow(SignalSupplierRatingWorkflowRequest) returns (SignalSupplierRatingWorkflowResponse);
}

// The request of `StartSupplierRatingWorkflow`.
message StartSupplierRatingWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string supplier_rating_id = 2;
  SupplierRating supplier_rating = 3;
  StartSupplierRatingWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartSupplierRatingWorkflow`.
message StartSupplierRatingWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  SupplierRating supplier_rating = 1;
  StartSupplierRatingWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

