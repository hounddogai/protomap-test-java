syntax = "proto3";

package acme.suppliers.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/suppliers/v1/suppliers.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Suppliers.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/suppliers/v1;suppliersv1";
option java_multiple_files = true;
option java_outer_classname = "SupplierRatingValidationServiceProto";
option java_package = "com.acme.suppliers.v1";

// Checks supplier ratings against the rules before anything acts on them.
service SupplierRatingValidationService {
  // Validates a supplier rating.
  rpc ValidateSupplierRating(ValidateSupplierRatingRequest) returns (ValidateSupplierRatingResponse);

  // Previews a supplier rating.
  rpc PreviewSupplierRating(PreviewSupplierRatingRequest) returns (PreviewSupplierRatingResponse);

  // Checks a supplier rating.
  rpc CheckSupplierRatingEligibility(CheckSupplierRatingEligibilityRequest) returns (CheckSupplierRatingEligibilityResponse);

  // Normalizes a supplier rating.
  rpc NormalizeSupplierRating(NormalizeSupplierRatingRequest) returns (NormalizeSupplierRatingResponse);

  // Explains a supplier rating.
  rpc ExplainSupplierRatingDecision(ExplainSupplierRatingDecisionRequest) returns (ExplainSupplierRatingDecisionResponse);

  // Scores a supplier rating.
  rpc ScoreSupplierRating(ScoreSupplierRatingRequest) returns (ScoreSupplierRatingResponse);

  // Lints a supplier rating.
  rpc LintSupplierRatings(LintSupplierRatingsRequest) returns (LintSupplierRatingsResponse);

  // Returns a supplier rating.
  rpc GetSupplierRatingRules(GetSupplierRatingRulesRequest) returns (GetSupplierRatingRulesResponse);
}

// The request of `ValidateSupplierRating`.
message ValidateSupplierRatingRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string supplier_rating_id = 2;
  SupplierRating supplier_rating = 3;
  ValidateSupplierRatingRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateSupplierRating`.
message ValidateSupplierRatingResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  SupplierRating supplier_rating = 1;
  ValidateSupplierRatingResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

