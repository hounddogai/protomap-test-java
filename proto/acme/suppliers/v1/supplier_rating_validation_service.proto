// The request of `ScoreSupplierRating`.
message ScoreSupplierRatingRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string supplier_rating_id = 2;
  SupplierRating supplier_rating = 3;
  ScoreSupplierRatingRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ScoreSupplierRating`.
message ScoreSupplierRatingResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated ScoreSupplierRatingResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  SupplierRating supplier_rating = 1;
  ScoreSupplierRatingResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

