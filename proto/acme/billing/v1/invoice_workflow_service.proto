syntax = "proto3";

package acme.billing.v1;

import "acme/billing/v1/billing.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Billing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/billing/v1;billingv1";
option java_multiple_files = true;
option java_outer_classname = "InvoiceWorkflowServiceProto";
option java_package = "com.acme.billing.v1";

// Runs the long-lived workflow that takes an invoice from start to finish.
service InvoiceWorkflowService {
  // Starts an invoice.
  rpc StartInvoiceWorkflow(StartInvoiceWorkflowRequest) returns (StartInvoiceWorkflowResponse);

  // Advances an invoice.
  rpc AdvanceInvoiceWorkflow(AdvanceInvoiceWorkflowRequest) returns (AdvanceInvoiceWorkflowResponse);

  // Cancels an invoice.
  rpc CancelInvoiceWorkflow(CancelInvoiceWorkflowRequest) returns (CancelInvoiceWorkflowResponse);

  // Retrys an invoice.
  rpc RetryInvoiceWorkflow(RetryInvoiceWorkflowRequest) returns (RetryInvoiceWorkflowResponse);

  // Pauses an invoice.
  rpc PauseInvoiceWorkflow(PauseInvoiceWorkflowRequest) returns (PauseInvoiceWorkflowResponse);

  // Resumes an invoice.
  rpc ResumeInvoiceWorkflow(ResumeInvoiceWorkflowRequest) returns (ResumeInvoiceWorkflowResponse);

  // Returns an invoice.
  rpc InspectInvoiceWorkflow(InspectInvoiceWorkflowRequest) returns (InspectInvoiceWorkflowResponse);

  // Lists invoices a page at a time.
  rpc ListInvoiceWorkflows(ListInvoiceWorkflowsRequest) returns (ListInvoiceWorkflowsResponse);

  // Signals an invoice.
  rpc SignalInvoiceWorkflow(SignalInvoiceWorkflowRequest) returns (SignalInvoiceWorkflowResponse);
}

// The request of `StartInvoiceWorkflow`.
message StartInvoiceWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string invoice_id = 2;
  Invoice invoice = 3;
  StartInvoiceWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartInvoiceWorkflow`.
message StartInvoiceWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Invoice invoice = 1;
  StartInvoiceWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

