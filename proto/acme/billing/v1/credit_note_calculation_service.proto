syntax = "proto3";

package acme.billing.v1;

import "acme/billing/v1/billing.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Billing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/billing/v1;billingv1";
option java_multiple_files = true;
option java_outer_classname = "CreditNoteCalculationServiceProto";
option java_package = "com.acme.billing.v1";

// Computes the figures of a credit note, such as totals, taxes, and estimates.
service CreditNoteCalculationService {
  // Calculates a credit note.
  rpc CalculateCreditNote(CalculateCreditNoteRequest) returns (CalculateCreditNoteResponse);

  // Estimates a credit note.
  rpc EstimateCreditNote(EstimateCreditNoteRequest) returns (EstimateCreditNoteResponse);

  // Quotes a credit note.
  rpc QuoteCreditNote(QuoteCreditNoteRequest) returns (QuoteCreditNoteResponse);

  // Compares a credit note.
  rpc CompareCreditNoteOptions(CompareCreditNoteOptionsRequest) returns (CompareCreditNoteOptionsResponse);

  // Recalculates a credit note.
  rpc RecalculateCreditNotes(RecalculateCreditNotesRequest) returns (RecalculateCreditNotesResponse);

  // Simulates a credit note.
  rpc SimulateCreditNote(SimulateCreditNoteRequest) returns (SimulateCreditNoteResponse);

  // Explains a credit note.
  rpc ExplainCreditNoteCalculation(ExplainCreditNoteCalculationRequest) returns (ExplainCreditNoteCalculationResponse);

  // Returns a credit note.
  rpc GetCreditNoteRates(GetCreditNoteRatesRequest) returns (GetCreditNoteRatesResponse);
}

// The request of `CalculateCreditNote`.
message CalculateCreditNoteRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string credit_note_id = 2;
  CreditNote credit_note = 3;
  CalculateCreditNoteRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateCreditNote`.
message CalculateCreditNoteResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateCreditNoteResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  CreditNote credit_note = 1;
  CalculateCreditNoteResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

