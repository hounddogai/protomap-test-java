syntax = "proto3";

package acme.billing.v1;

import "acme/billing/v1/billing.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Billing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/billing/v1;billingv1";
option java_multiple_files = true;
option java_outer_classname = "PaymentTermValidationServiceProto";
option java_package = "com.acme.billing.v1";

// Checks payment terms against the rules before anything acts on them.
service PaymentTermValidationService {
  // Validates a payment term.
  rpc ValidatePaymentTerm(ValidatePaymentTermRequest) returns (ValidatePaymentTermResponse);

  // Previews a payment term.
  rpc PreviewPaymentTerm(PreviewPaymentTermRequest) returns (PreviewPaymentTermResponse);

  // Checks a payment term.
  rpc CheckPaymentTermEligibility(CheckPaymentTermEligibilityRequest) returns (CheckPaymentTermEligibilityResponse);

  // Explains a payment term.
  rpc ExplainPaymentTermDecision(ExplainPaymentTermDecisionRequest) returns (ExplainPaymentTermDecisionResponse);

  // Scores a payment term.
  rpc ScorePaymentTerm(ScorePaymentTermRequest) returns (ScorePaymentTermResponse);

  // Lints a payment term.
  rpc LintPaymentTerms(LintPaymentTermsRequest) returns (LintPaymentTermsResponse);

  // Returns a payment term.
  rpc GetPaymentTermRules(GetPaymentTermRulesRequest) returns (GetPaymentTermRulesResponse);
}

// The request of `ValidatePaymentTerm`.
message ValidatePaymentTermRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string payment_term_id = 2;
  PaymentTerm payment_term = 3;
  ValidatePaymentTermRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidatePaymentTerm`.
message ValidatePaymentTermResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PaymentTerm payment_term = 1;
  ValidatePaymentTermResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PreviewPaymentTerm`.
message PreviewPaymentTermRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
