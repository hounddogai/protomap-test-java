syntax = "proto3";

package acme.billing.v1;

import "acme/billing/v1/billing.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Billing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/billing/v1;billingv1";
option java_multiple_files = true;
option java_outer_classname = "DunningReportingServiceProto";
option java_package = "com.acme.billing.v1";

// Builds and schedules reports about dunnings.
service DunningReportingService {
  // Generates a dunning.
  rpc GenerateDunningReport(GenerateDunningReportRequest) returns (GenerateDunningReportResponse);

  // Returns a dunning.
  rpc FetchDunningReport(FetchDunningReportRequest) returns (FetchDunningReportResponse);

  // Schedules a dunning.
  rpc ScheduleDunningReport(ScheduleDunningReportRequest) returns (ScheduleDunningReportResponse);

  // Streams the changes of dunnings as they happen.
  rpc StreamDunningMetrics(StreamDunningMetricsRequest) returns (stream StreamDunningMetricsResponse);

  // Lists dunnings a page at a time.
  rpc ListDunningReports(ListDunningReportsRequest) returns (ListDunningReportsResponse);

  // Shares a dunning.
  rpc ShareDunningReport(ShareDunningReportRequest) returns (ShareDunningReportResponse);

  // Counts dunnings by status.
  rpc CountDunningTotals(CountDunningTotalsRequest) returns (CountDunningTotalsResponse);
}

// The request of `GenerateDunningReport`.
message GenerateDunningReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string dunning_id = 2;
  GenerateDunningReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateDunningReport`.
message GenerateDunningReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchDunningReport`.
message FetchDunningReportRequest {
  acme.common.v1.RequestContext context = 1;
  string dunning_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchDunningReport`.
message FetchDunningReportResponse {
  Dunning dunning = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleDunningReport`.
message ScheduleDunningReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string dunning_id = 2;
  ScheduleDunningReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleDunningReport`.
message ScheduleDunningReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamDunningMetrics`.
message StreamDunningMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DunningStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamDunningMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamDunningMetrics`.
message StreamDunningMetricsResponse {
  Dunning dunning = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListDunningReports`.
message ListDunningReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DunningStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListDunningReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListDunningReports`.
message ListDunningReportsResponse {
  repeated Dunning dunnings = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareDunningReport`.
message ShareDunningReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string dunning_id = 2;
  ShareDunningReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareDunningReport`.
message ShareDunningReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Dunning dunning = 1;
  ShareDunningReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountDunningTotals`.
message CountDunningTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated DunningStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountDunningTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountDunningTotals`.
message CountDunningTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}
