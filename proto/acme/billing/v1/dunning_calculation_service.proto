syntax = "proto3";

package acme.billing.v1;

import "acme/billing/v1/billing.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Billing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/billing/v1;billingv1";
option java_multiple_files = true;
option java_outer_classname = "DunningCalculationServiceProto";
option java_package = "com.acme.billing.v1";

// Computes the figures of a dunning, such as totals, taxes, and estimates.
service DunningCalculationService {
  // Calculates a dunning.
  rpc CalculateDunning(CalculateDunningRequest) returns (CalculateDunningResponse);

  // Estimates a dunning.
  rpc EstimateDunning(EstimateDunningRequest) returns (EstimateDunningResponse);

  // Quotes a dunning.
  rpc QuoteDunning(QuoteDunningRequest) returns (QuoteDunningResponse);

  // Compares a dunning.
  rpc CompareDunningOptions(CompareDunningOptionsRequest) returns (CompareDunningOptionsResponse);

  // Recalculates a dunning.
  rpc RecalculateDunnings(RecalculateDunningsRequest) returns (RecalculateDunningsResponse);

  // Simulates a dunning.
  rpc SimulateDunning(SimulateDunningRequest) returns (SimulateDunningResponse);

  // Explains a dunning.
  rpc ExplainDunningCalculation(ExplainDunningCalculationRequest) returns (ExplainDunningCalculationResponse);

  // Returns a dunning.
  rpc GetDunningRates(GetDunningRatesRequest) returns (GetDunningRatesResponse);
}

// The request of `CalculateDunning`.
message CalculateDunningRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string dunning_id = 2;
  Dunning dunning = 3;
  CalculateDunningRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateDunning`.
message CalculateDunningResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateDunningResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Dunning dunning = 1;
  CalculateDunningResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

