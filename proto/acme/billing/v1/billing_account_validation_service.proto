syntax = "proto3";

package acme.billing.v1;

import "acme/billing/v1/billing.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Billing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/billing/v1;billingv1";
option java_multiple_files = true;
option java_outer_classname = "BillingAccountValidationServiceProto";
option java_package = "com.acme.billing.v1";

// Checks billing accounts against the rules before anything acts on them.
service BillingAccountValidationService {
  // Validates a billing account.
  rpc ValidateBillingAccount(ValidateBillingAccountRequest) returns (ValidateBillingAccountResponse);

  // Previews a billing account.
  rpc PreviewBillingAccount(PreviewBillingAccountRequest) returns (PreviewBillingAccountResponse);

  // Checks a billing account.
  rpc CheckBillingAccountEligibility(CheckBillingAccountEligibilityRequest) returns (CheckBillingAccountEligibilityResponse);

  // Normalizes a billing account.
  rpc NormalizeBillingAccount(NormalizeBillingAccountRequest) returns (NormalizeBillingAccountResponse);

  // Explains a billing account.
  rpc ExplainBillingAccountDecision(ExplainBillingAccountDecisionRequest) returns (ExplainBillingAccountDecisionResponse);

  // Scores a billing account.
  rpc ScoreBillingAccount(ScoreBillingAccountRequest) returns (ScoreBillingAccountResponse);

  // Lints a billing account.
  rpc LintBillingAccounts(LintBillingAccountsRequest) returns (LintBillingAccountsResponse);

  // Returns a billing account.
  rpc GetBillingAccountRules(GetBillingAccountRulesRequest) returns (GetBillingAccountRulesResponse);
}

// The request of `ValidateBillingAccount`.
message ValidateBillingAccountRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string billing_account_id = 2;
  BillingAccount billing_account = 3;
  ValidateBillingAccountRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateBillingAccount`.
message ValidateBillingAccountResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  BillingAccount billing_account = 1;
  ValidateBillingAccountResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

