syntax = "proto3";

package acme.billing.v1;

import "acme/billing/v1/billing.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Billing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/billing/v1;billingv1";
option java_multiple_files = true;
option java_outer_classname = "InvoiceApprovalServiceProto";
option java_package = "com.acme.billing.v1";

// Routes invoices through approval, with escalation and delegation.
service InvoiceApprovalService {
  // Submits an invoice.
  rpc SubmitInvoice(SubmitInvoiceRequest) returns (SubmitInvoiceResponse);

  // Approves an invoice.
  rpc ApproveInvoice(ApproveInvoiceRequest) returns (ApproveInvoiceResponse);

  // Rejects an invoice.
  rpc RejectInvoice(RejectInvoiceRequest) returns (RejectInvoiceResponse);

  // Escalates an invoice.
  rpc EscalateInvoice(EscalateInvoiceRequest) returns (EscalateInvoiceResponse);

  // Delegates an invoice.
  rpc DelegateInvoiceApproval(DelegateInvoiceApprovalRequest) returns (DelegateInvoiceApprovalResponse);

  // Recalls an invoice.
  rpc RecallInvoice(RecallInvoiceRequest) returns (RecallInvoiceResponse);

  // Returns an invoice.
  rpc GetInvoiceApprovalStatus(GetInvoiceApprovalStatusRequest) returns (GetInvoiceApprovalStatusResponse);

  // Comments an invoice.
  rpc CommentInvoiceApproval(CommentInvoiceApprovalRequest) returns (CommentInvoiceApprovalResponse);
}

// The request of `SubmitInvoice`.
message SubmitInvoiceRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string invoice_id = 2;
  Invoice invoice = 3;
  SubmitInvoiceRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitInvoice`.
message SubmitInvoiceResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Invoice invoice = 1;
  SubmitInvoiceResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

