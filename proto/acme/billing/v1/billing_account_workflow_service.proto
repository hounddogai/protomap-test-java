import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Billing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/billing/v1;billingv1";
option java_multiple_files = true;
option java_outer_classname = "BillingAccountWorkflowServiceProto";
option java_package = "com.acme.billing.v1";

// Runs the long-lived workflow that takes a billing account from start to finish.
service BillingAccountWorkflowService {
  // Starts a billing account.
  rpc StartBillingAccountWorkflow(StartBillingAccountWorkflowRequest) returns (StartBillingAccountWorkflowResponse);

  // Advances a billing account.
  rpc AdvanceBillingAccountWorkflow(AdvanceBillingAccountWorkflowRequest) returns (AdvanceBillingAccountWorkflowResponse);

  // Cancels a billing account.
  rpc CancelBillingAccountWorkflow(CancelBillingAccountWorkflowRequest) returns (CancelBillingAccountWorkflowResponse);

  // Retrys a billing account.
  rpc RetryBillingAccountWorkflow(RetryBillingAccountWorkflowRequest) returns (RetryBillingAccountWorkflowResponse);

  // Pauses a billing account.
  rpc PauseBillingAccountWorkflow(PauseBillingAccountWorkflowRequest) returns (PauseBillingAccountWorkflowResponse);

  // Resumes a billing account.
  rpc ResumeBillingAccountWorkflow(ResumeBillingAccountWorkflowRequest) returns (ResumeBillingAccountWorkflowResponse);

  // Returns a billing account.
  rpc InspectBillingAccountWorkflow(InspectBillingAccountWorkflowRequest) returns (InspectBillingAccountWorkflowResponse);

  // Lists billing accounts a page at a time.
  rpc ListBillingAccountWorkflows(ListBillingAccountWorkflowsRequest) returns (ListBillingAccountWorkflowsResponse);

  // Signals a billing account.
  rpc SignalBillingAccountWorkflow(SignalBillingAccountWorkflowRequest) returns (SignalBillingAccountWorkflowResponse);
}

// The request of `StartBillingAccountWorkflow`.
message StartBillingAccountWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string billing_account_id = 2;
  BillingAccount billing_account = 3;
  StartBillingAccountWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartBillingAccountWorkflow`.
message StartBillingAccountWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  BillingAccount billing_account = 1;
  StartBillingAccountWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

