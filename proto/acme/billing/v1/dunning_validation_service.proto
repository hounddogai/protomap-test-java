syntax = "proto3";

package acme.billing.v1;

import "acme/billing/v1/billing.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Billing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/billing/v1;billingv1";
option java_multiple_files = true;
option java_outer_classname = "DunningValidationServiceProto";
option java_package = "com.acme.billing.v1";

// Checks dunnings against the rules before anything acts on them.
service DunningValidationService {
  // Validates a dunning.
  rpc ValidateDunning(ValidateDunningRequest) returns (ValidateDunningResponse);

  // Previews a dunning.
  rpc PreviewDunning(PreviewDunningRequest) returns (PreviewDunningResponse);

  // Checks a dunning.
  rpc CheckDunningEligibility(CheckDunningEligibilityRequest) returns (CheckDunningEligibilityResponse);

  // Normalizes a dunning.
  rpc NormalizeDunning(NormalizeDunningRequest) returns (NormalizeDunningResponse);

  // Explains a dunning.
  rpc ExplainDunningDecision(ExplainDunningDecisionRequest) returns (ExplainDunningDecisionResponse);

  // Scores a dunning.
  rpc ScoreDunning(ScoreDunningRequest) returns (ScoreDunningResponse);

  // Lints a dunning.
  rpc LintDunnings(LintDunningsRequest) returns (LintDunningsResponse);

  // Returns a dunning.
  rpc GetDunningRules(GetDunningRulesRequest) returns (GetDunningRulesResponse);
}

// The request of `ValidateDunning`.
message ValidateDunningRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string dunning_id = 2;
  Dunning dunning = 3;
  ValidateDunningRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateDunning`.
message ValidateDunningResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Dunning dunning = 1;
  ValidateDunningResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

