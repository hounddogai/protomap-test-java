syntax = "proto3";

package acme.billing.v1;

import "acme/billing/v1/billing.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Billing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/billing/v1;billingv1";
option java_multiple_files = true;
option java_outer_classname = "InvoiceCalculationServiceProto";
option java_package = "com.acme.billing.v1";

// Computes the figures of an invoice, such as totals, taxes, and estimates.
service InvoiceCalculationService {
  // Calculates an invoice.
  rpc CalculateInvoice(CalculateInvoiceRequest) returns (CalculateInvoiceResponse);

  // Estimates an invoice.
  rpc EstimateInvoice(EstimateInvoiceRequest) returns (EstimateInvoiceResponse);

  // Compares an invoice.
  rpc CompareInvoiceOptions(CompareInvoiceOptionsRequest) returns (CompareInvoiceOptionsResponse);

  // Recalculates an invoice.
  rpc RecalculateInvoices(RecalculateInvoicesRequest) returns (RecalculateInvoicesResponse);

  // Simulates an invoice.
  rpc SimulateInvoice(SimulateInvoiceRequest) returns (SimulateInvoiceResponse);

  // Explains an invoice.
  rpc ExplainInvoiceCalculation(ExplainInvoiceCalculationRequest) returns (ExplainInvoiceCalculationResponse);

  // Returns an invoice.
  rpc GetInvoiceRates(GetInvoiceRatesRequest) returns (GetInvoiceRatesResponse);
}

// The request of `CalculateInvoice`.
message CalculateInvoiceRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string invoice_id = 2;
  Invoice invoice = 3;
  CalculateInvoiceRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateInvoice`.
message CalculateInvoiceResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateInvoiceResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Invoice invoice = 1;
  CalculateInvoiceResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

