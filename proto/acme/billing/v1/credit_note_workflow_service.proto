option csharp_namespace = "Acme.Billing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/billing/v1;billingv1";
option java_multiple_files = true;
option java_outer_classname = "CreditNoteWorkflowServiceProto";
option java_package = "com.acme.billing.v1";

// Runs the long-lived workflow that takes a credit note from start to finish.
service CreditNoteWorkflowService {
  // Starts a credit note.
  rpc StartCreditNoteWorkflow(StartCreditNoteWorkflowRequest) returns (StartCreditNoteWorkflowResponse);

  // Advances a credit note.
  rpc AdvanceCreditNoteWorkflow(AdvanceCreditNoteWorkflowRequest) returns (AdvanceCreditNoteWorkflowResponse);

  // Cancels a credit note.
  rpc CancelCreditNoteWorkflow(CancelCreditNoteWorkflowRequest) returns (CancelCreditNoteWorkflowResponse);

  // Retrys a credit note.
  rpc RetryCreditNoteWorkflow(RetryCreditNoteWorkflowRequest) returns (RetryCreditNoteWorkflowResponse);

  // Pauses a credit note.
  rpc PauseCreditNoteWorkflow(PauseCreditNoteWorkflowRequest) returns (PauseCreditNoteWorkflowResponse);

  // Resumes a credit note.
  rpc ResumeCreditNoteWorkflow(ResumeCreditNoteWorkflowRequest) returns (ResumeCreditNoteWorkflowResponse);

  // Returns a credit note.
  rpc InspectCreditNoteWorkflow(InspectCreditNoteWorkflowRequest) returns (InspectCreditNoteWorkflowResponse);

  // Lists credit notes a page at a time.
  rpc ListCreditNoteWorkflows(ListCreditNoteWorkflowsRequest) returns (ListCreditNoteWorkflowsResponse);

  // Signals a credit note.
  rpc SignalCreditNoteWorkflow(SignalCreditNoteWorkflowRequest) returns (SignalCreditNoteWorkflowResponse);
}

// The request of `StartCreditNoteWorkflow`.
message StartCreditNoteWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string credit_note_id = 2;
  CreditNote credit_note = 3;
  StartCreditNoteWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartCreditNoteWorkflow`.
message StartCreditNoteWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CreditNote credit_note = 1;
  StartCreditNoteWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

