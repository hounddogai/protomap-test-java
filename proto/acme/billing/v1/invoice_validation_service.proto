syntax = "proto3";

package acme.billing.v1;

import "acme/billing/v1/billing.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Billing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/billing/v1;billingv1";
option java_multiple_files = true;
option java_outer_classname = "InvoiceValidationServiceProto";
option java_package = "com.acme.billing.v1";

// Checks invoices against the rules before anything acts on them.
service InvoiceValidationService {
  // Validates an invoice.
  rpc ValidateInvoice(ValidateInvoiceRequest) returns (ValidateInvoiceResponse);

  // Previews an invoice.
  rpc PreviewInvoice(PreviewInvoiceRequest) returns (PreviewInvoiceResponse);

  // Checks an invoice.
  rpc CheckInvoiceEligibility(CheckInvoiceEligibilityRequest) returns (CheckInvoiceEligibilityResponse);

  // Normalizes an invoice.
  rpc NormalizeInvoice(NormalizeInvoiceRequest) returns (NormalizeInvoiceResponse);

  // Explains an invoice.
  rpc ExplainInvoiceDecision(ExplainInvoiceDecisionRequest) returns (ExplainInvoiceDecisionResponse);

  // Scores an invoice.
  rpc ScoreInvoice(ScoreInvoiceRequest) returns (ScoreInvoiceResponse);

  // Lints an invoice.
  rpc LintInvoices(LintInvoicesRequest) returns (LintInvoicesResponse);

  // Returns an invoice.
  rpc GetInvoiceRules(GetInvoiceRulesRequest) returns (GetInvoiceRulesResponse);
}

// The request of `ValidateInvoice`.
message ValidateInvoiceRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string invoice_id = 2;
  Invoice invoice = 3;
  ValidateInvoiceRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateInvoice`.
message ValidateInvoiceResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Invoice invoice = 1;
  ValidateInvoiceResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

