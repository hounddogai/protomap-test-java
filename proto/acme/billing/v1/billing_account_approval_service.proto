syntax = "proto3";

package acme.billing.v1;

import "acme/billing/v1/billing.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Billing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/billing/v1;billingv1";
option java_multiple_files = true;
option java_outer_classname = "BillingAccountApprovalServiceProto";
option java_package = "com.acme.billing.v1";

// Routes billing accounts through approval, with escalation and delegation.
service BillingAccountApprovalService {
  // Submits a billing account.
  rpc SubmitBillingAccount(SubmitBillingAccountRequest) returns (SubmitBillingAccountResponse);

  // Approves a billing account.
  rpc ApproveBillingAccount(ApproveBillingAccountRequest) returns (ApproveBillingAccountResponse);

  // Rejects a billing account.
  rpc RejectBillingAccount(RejectBillingAccountRequest) returns (RejectBillingAccountResponse);

  // Escalates a billing account.
  rpc EscalateBillingAccount(EscalateBillingAccountRequest) returns (EscalateBillingAccountResponse);

  // Lists billing accounts a page at a time.
  rpc ListPendingBillingAccounts(ListPendingBillingAccountsRequest) returns (ListPendingBillingAccountsResponse);

  // Delegates a billing account.
  rpc DelegateBillingAccountApproval(DelegateBillingAccountApprovalRequest) returns (DelegateBillingAccountApprovalResponse);

  // Recalls a billing account.
  rpc RecallBillingAccount(RecallBillingAccountRequest) returns (RecallBillingAccountResponse);

  // Comments a billing account.
  rpc CommentBillingAccountApproval(CommentBillingAccountApprovalRequest) returns (CommentBillingAccountApprovalResponse);
}

// The request of `SubmitBillingAccount`.
message SubmitBillingAccountRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string billing_account_id = 2;
  BillingAccount billing_account = 3;
  SubmitBillingAccountRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitBillingAccount`.
message SubmitBillingAccountResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  BillingAccount billing_account = 1;
  SubmitBillingAccountResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

