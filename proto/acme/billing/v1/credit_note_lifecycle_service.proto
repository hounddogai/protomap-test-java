import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Billing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/billing/v1;billingv1";
option java_multiple_files = true;
option java_outer_classname = "CreditNoteLifecycleServiceProto";
option java_package = "com.acme.billing.v1";

// Moves a credit note between the states of its lifecycle.
service CreditNoteLifecycleService {
  // Activates a credit note.
  rpc ActivateCreditNote(ActivateCreditNoteRequest) returns (ActivateCreditNoteResponse);

  // Suspends a credit note.
  rpc SuspendCreditNote(SuspendCreditNoteRequest) returns (SuspendCreditNoteResponse);

  // Reinstates a credit note.
  rpc ReinstateCreditNote(ReinstateCreditNoteRequest) returns (ReinstateCreditNoteResponse);

  // Terminates a credit note.
  rpc TerminateCreditNote(TerminateCreditNoteRequest) returns (TerminateCreditNoteResponse);

  // Renews a credit note.
  rpc RenewCreditNote(RenewCreditNoteRequest) returns (RenewCreditNoteResponse);

  // Expires a credit note.
  rpc ExpireCreditNote(ExpireCreditNoteRequest) returns (ExpireCreditNoteResponse);

  // Returns a credit note.
  rpc GetCreditNoteLifecycle(GetCreditNoteLifecycleRequest) returns (GetCreditNoteLifecycleResponse);

  // Schedules a credit note.
  rpc ScheduleCreditNoteExpiry(ScheduleCreditNoteExpiryRequest) returns (ScheduleCreditNoteExpiryResponse);
}

// The request of `ActivateCreditNote`.
message ActivateCreditNoteRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string credit_note_id = 2;
  ActivateCreditNoteRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateCreditNote`.
message ActivateCreditNoteResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CreditNote credit_note = 1;
  ActivateCreditNoteResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

