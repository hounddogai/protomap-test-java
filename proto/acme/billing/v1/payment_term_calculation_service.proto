syntax = "proto3";

package acme.billing.v1;

import "acme/billing/v1/billing.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Billing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/billing/v1;billingv1";
option java_multiple_files = true;
option java_outer_classname = "PaymentTermCalculationServiceProto";
option java_package = "com.acme.billing.v1";

// Computes the figures of a payment term, such as totals, taxes, and estimates.
service PaymentTermCalculationService {
  // Calculates a payment term.
  rpc CalculatePaymentTerm(CalculatePaymentTermRequest) returns (CalculatePaymentTermResponse);

  // Estimates a payment term.
  rpc EstimatePaymentTerm(EstimatePaymentTermRequest) returns (EstimatePaymentTermResponse);

  // Quotes a payment term.
  rpc QuotePaymentTerm(QuotePaymentTermRequest) returns (QuotePaymentTermResponse);

  // Compares a payment term.
  rpc ComparePaymentTermOptions(ComparePaymentTermOptionsRequest) returns (ComparePaymentTermOptionsResponse);

  // Recalculates a payment term.
  rpc RecalculatePaymentTerms(RecalculatePaymentTermsRequest) returns (RecalculatePaymentTermsResponse);

  // Explains a payment term.
  rpc ExplainPaymentTermCalculation(ExplainPaymentTermCalculationRequest) returns (ExplainPaymentTermCalculationResponse);
}

// The request of `CalculatePaymentTerm`.
message CalculatePaymentTermRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string payment_term_id = 2;
  PaymentTerm payment_term = 3;
  CalculatePaymentTermRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculatePaymentTerm`.
message CalculatePaymentTermResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculatePaymentTermResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  PaymentTerm payment_term = 1;
  CalculatePaymentTermResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

