syntax = "proto3";

package acme.billing.v1;

import "acme/billing/v1/billing.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Billing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/billing/v1;billingv1";
option java_multiple_files = true;
option java_outer_classname = "CreditNoteValidationServiceProto";
option java_package = "com.acme.billing.v1";

// Checks credit notes against the rules before anything acts on them.
service CreditNoteValidationService {
  // Validates a credit note.
  rpc ValidateCreditNote(ValidateCreditNoteRequest) returns (ValidateCreditNoteResponse);

  // Previews a credit note.
  rpc PreviewCreditNote(PreviewCreditNoteRequest) returns (PreviewCreditNoteResponse);

  // Checks a credit note.
  rpc CheckCreditNoteEligibility(CheckCreditNoteEligibilityRequest) returns (CheckCreditNoteEligibilityResponse);

  // Normalizes a credit note.
  rpc NormalizeCreditNote(NormalizeCreditNoteRequest) returns (NormalizeCreditNoteResponse);

  // Explains a credit note.
  rpc ExplainCreditNoteDecision(ExplainCreditNoteDecisionRequest) returns (ExplainCreditNoteDecisionResponse);

  // Scores a credit note.
  rpc ScoreCreditNote(ScoreCreditNoteRequest) returns (ScoreCreditNoteResponse);

  // Lints a credit note.
  rpc LintCreditNotes(LintCreditNotesRequest) returns (LintCreditNotesResponse);

  // Returns a credit note.
  rpc GetCreditNoteRules(GetCreditNoteRulesRequest) returns (GetCreditNoteRulesResponse);
}

// The request of `ValidateCreditNote`.
message ValidateCreditNoteRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string credit_note_id = 2;
  CreditNote credit_note = 3;
  ValidateCreditNoteRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateCreditNote`.
message ValidateCreditNoteResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CreditNote credit_note = 1;
  ValidateCreditNoteResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

