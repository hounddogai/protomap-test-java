syntax = "proto3";

package acme.billing.v1;

import "acme/billing/v1/billing.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Billing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/billing/v1;billingv1";
option java_multiple_files = true;
option java_outer_classname = "DunningLifecycleServiceProto";
option java_package = "com.acme.billing.v1";

// Moves a dunning between the states of its lifecycle.
service DunningLifecycleService {
  // Activates a dunning.
  rpc ActivateDunning(ActivateDunningRequest) returns (ActivateDunningResponse);

  // Suspends a dunning.
  rpc SuspendDunning(SuspendDunningRequest) returns (SuspendDunningResponse);

  // Reinstates a dunning.
  rpc ReinstateDunning(ReinstateDunningRequest) returns (ReinstateDunningResponse);

  // Terminates a dunning.
  rpc TerminateDunning(TerminateDunningRequest) returns (TerminateDunningResponse);

  // Renews a dunning.
  rpc RenewDunning(RenewDunningRequest) returns (RenewDunningResponse);

  // Expires a dunning.
  rpc ExpireDunning(ExpireDunningRequest) returns (ExpireDunningResponse);

  // Returns a dunning.
  rpc GetDunningLifecycle(GetDunningLifecycleRequest) returns (GetDunningLifecycleResponse);

  // Schedules a dunning.
  rpc ScheduleDunningExpiry(ScheduleDunningExpiryRequest) returns (ScheduleDunningExpiryResponse);
}

// The request of `ActivateDunning`.
message ActivateDunningRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string dunning_id = 2;
  ActivateDunningRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateDunning`.
message ActivateDunningResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Dunning dunning = 1;
  ActivateDunningResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

