syntax = "proto3";

package acme.insurance.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/insurance/v1/insurance.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Insurance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/insurance/v1;insurancev1";
option java_multiple_files = true;
option java_outer_classname = "PolicyApprovalServiceProto";
option java_package = "com.acme.insurance.v1";

// Routes policies through approval, with escalation and delegation.
service PolicyApprovalService {
  // Submits a policy.
  rpc SubmitPolicy(SubmitPolicyRequest) returns (SubmitPolicyResponse);

  // Approves a policy.
  rpc ApprovePolicy(ApprovePolicyRequest) returns (ApprovePolicyResponse);

  // Rejects a policy.
  rpc RejectPolicy(RejectPolicyRequest) returns (RejectPolicyResponse);

  // Escalates a policy.
  rpc EscalatePolicy(EscalatePolicyRequest) returns (EscalatePolicyResponse);

  // Lists policies a page at a time.
  rpc ListPendingPolicies(ListPendingPoliciesRequest) returns (ListPendingPoliciesResponse);

  // Recalls a policy.
  rpc RecallPolicy(RecallPolicyRequest) returns (RecallPolicyResponse);

  // Returns a policy.
  rpc GetPolicyApprovalStatus(GetPolicyApprovalStatusRequest) returns (GetPolicyApprovalStatusResponse);

  // Comments a policy.
  rpc CommentPolicyApproval(CommentPolicyApprovalRequest) returns (CommentPolicyApprovalResponse);
}

// The request of `SubmitPolicy`.
message SubmitPolicyRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string policy_id = 2;
  Policy policy = 3;
  SubmitPolicyRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitPolicy`.
message SubmitPolicyResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Policy policy = 1;
  SubmitPolicyResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

