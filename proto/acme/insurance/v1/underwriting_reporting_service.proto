syntax = "proto3";

package acme.insurance.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/insurance/v1/insurance.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Insurance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/insurance/v1;insurancev1";
option java_multiple_files = true;
option java_outer_classname = "UnderwritingReportingServiceProto";
option java_package = "com.acme.insurance.v1";

// Builds and schedules reports about underwritings.
service UnderwritingReportingService {
  // Generates an underwriting.
  rpc GenerateUnderwritingReport(GenerateUnderwritingReportRequest) returns (GenerateUnderwritingReportResponse);

  // Returns an underwriting.
  rpc FetchUnderwritingReport(FetchUnderwritingReportRequest) returns (FetchUnderwritingReportResponse);

  // Streams the changes of underwritings as they happen.
  rpc StreamUnderwritingMetrics(StreamUnderwritingMetricsRequest) returns (stream StreamUnderwritingMetricsResponse);

  // Shares an underwriting.
  rpc ShareUnderwritingReport(ShareUnderwritingReportRequest) returns (ShareUnderwritingReportResponse);

  // Counts underwritings by status.
  rpc CountUnderwritingTotals(CountUnderwritingTotalsRequest) returns (CountUnderwritingTotalsResponse);

  // Deletes an underwriting.
  rpc DeleteUnderwritingReport(DeleteUnderwritingReportRequest) returns (DeleteUnderwritingReportResponse);
}

// The request of `GenerateUnderwritingReport`.
message GenerateUnderwritingReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string underwriting_id = 2;
  GenerateUnderwritingReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateUnderwritingReport`.
message GenerateUnderwritingReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchUnderwritingReport`.
message FetchUnderwritingReportRequest {
  acme.common.v1.RequestContext context = 1;
  string underwriting_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchUnderwritingReport`.
message FetchUnderwritingReportResponse {
  Underwriting underwriting = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `StreamUnderwritingMetrics`.
message StreamUnderwritingMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated UnderwritingStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamUnderwritingMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamUnderwritingMetrics`.
message StreamUnderwritingMetricsResponse {
  Underwriting underwriting = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ShareUnderwritingReport`.
message ShareUnderwritingReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string underwriting_id = 2;
  ShareUnderwritingReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareUnderwritingReport`.
message ShareUnderwritingReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Underwriting underwriting = 1;
  ShareUnderwritingReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountUnderwritingTotals`.
message CountUnderwritingTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated UnderwritingStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountUnderwritingTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountUnderwritingTotals`.
message CountUnderwritingTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteUnderwritingReport`.
message DeleteUnderwritingReportRequest {
  acme.common.v1.RequestContext context = 1;
  string underwriting_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteUnderwritingReport`.
message DeleteUnderwritingReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
