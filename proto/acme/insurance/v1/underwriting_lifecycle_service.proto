syntax = "proto3";

package acme.insurance.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/insurance/v1/insurance.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Insurance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/insurance/v1;insurancev1";
option java_multiple_files = true;
option java_outer_classname = "UnderwritingLifecycleServiceProto";
option java_package = "com.acme.insurance.v1";

// Moves an underwriting between the states of its lifecycle.
service UnderwritingLifecycleService {
  // Activates an underwriting.
  rpc ActivateUnderwriting(ActivateUnderwritingRequest) returns (ActivateUnderwritingResponse);

  // Suspends an underwriting.
  rpc SuspendUnderwriting(SuspendUnderwritingRequest) returns (SuspendUnderwritingResponse);

  // Reinstates an underwriting.
  rpc ReinstateUnderwriting(ReinstateUnderwritingRequest) returns (ReinstateUnderwritingResponse);

  // Terminates an underwriting.
  rpc TerminateUnderwriting(TerminateUnderwritingRequest) returns (TerminateUnderwritingResponse);

  // Renews an underwriting.
  rpc RenewUnderwriting(RenewUnderwritingRequest) returns (RenewUnderwritingResponse);

  // Expires an underwriting.
  rpc ExpireUnderwriting(ExpireUnderwritingRequest) returns (ExpireUnderwritingResponse);

  // Returns an underwriting.
  rpc GetUnderwritingLifecycle(GetUnderwritingLifecycleRequest) returns (GetUnderwritingLifecycleResponse);

  // Schedules an underwriting.
  rpc ScheduleUnderwritingExpiry(ScheduleUnderwritingExpiryRequest) returns (ScheduleUnderwritingExpiryResponse);
}

// The request of `ActivateUnderwriting`.
message ActivateUnderwritingRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string underwriting_id = 2;
  ActivateUnderwritingRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateUnderwriting`.
message ActivateUnderwritingResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Underwriting underwriting = 1;
  ActivateUnderwritingResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

