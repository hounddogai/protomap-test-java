syntax = "proto3";

package acme.insurance.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/insurance/v1/insurance.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Insurance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/insurance/v1;insurancev1";
option java_multiple_files = true;
option java_outer_classname = "CoverageWorkflowServiceProto";
option java_package = "com.acme.insurance.v1";

// Runs the long-lived workflow that takes a coverage from start to finish.
service CoverageWorkflowService {
  // Starts a coverage.
  rpc StartCoverageWorkflow(StartCoverageWorkflowRequest) returns (StartCoverageWorkflowResponse);

  // Advances a coverage.
  rpc AdvanceCoverageWorkflow(AdvanceCoverageWorkflowRequest) returns (AdvanceCoverageWorkflowResponse);

  // Cancels a coverage.
  rpc CancelCoverageWorkflow(CancelCoverageWorkflowRequest) returns (CancelCoverageWorkflowResponse);

  // Retrys a coverage.
  rpc RetryCoverageWorkflow(RetryCoverageWorkflowRequest) returns (RetryCoverageWorkflowResponse);

  // Pauses a coverage.
  rpc PauseCoverageWorkflow(PauseCoverageWorkflowRequest) returns (PauseCoverageWorkflowResponse);

  // Resumes a coverage.
  rpc ResumeCoverageWorkflow(ResumeCoverageWorkflowRequest) returns (ResumeCoverageWorkflowResponse);

  // Returns a coverage.
  rpc InspectCoverageWorkflow(InspectCoverageWorkflowRequest) returns (InspectCoverageWorkflowResponse);

  // Lists coverages a page at a time.
  rpc ListCoverageWorkflows(ListCoverageWorkflowsRequest) returns (ListCoverageWorkflowsResponse);

  // Signals a coverage.
  rpc SignalCoverageWorkflow(SignalCoverageWorkflowRequest) returns (SignalCoverageWorkflowResponse);
}

// The request of `StartCoverageWorkflow`.
message StartCoverageWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string coverage_id = 2;
  Coverage coverage = 3;
  StartCoverageWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartCoverageWorkflow`.
message StartCoverageWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Coverage coverage = 1;
  StartCoverageWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

