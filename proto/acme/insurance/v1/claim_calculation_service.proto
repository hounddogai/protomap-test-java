syntax = "proto3";

package acme.insurance.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/insurance/v1/insurance.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Insurance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/insurance/v1;insurancev1";
option java_multiple_files = true;
option java_outer_classname = "ClaimCalculationServiceProto";
option java_package = "com.acme.insurance.v1";

// Computes the figures of a claim, such as totals, taxes, and estimates.
service ClaimCalculationService {
  // Calculates a claim.
  rpc CalculateClaim(CalculateClaimRequest) returns (CalculateClaimResponse);

  // Estimates a claim.
  rpc EstimateClaim(EstimateClaimRequest) returns (EstimateClaimResponse);

  // Quotes a claim.
  rpc QuoteClaim(QuoteClaimRequest) returns (QuoteClaimResponse);

  // Compares a claim.
  rpc CompareClaimOptions(CompareClaimOptionsRequest) returns (CompareClaimOptionsResponse);

  // Recalculates a claim.
  rpc RecalculateClaims(RecalculateClaimsRequest) returns (RecalculateClaimsResponse);

  // Simulates a claim.
  rpc SimulateClaim(SimulateClaimRequest) returns (SimulateClaimResponse);

  // Explains a claim.
  rpc ExplainClaimCalculation(ExplainClaimCalculationRequest) returns (ExplainClaimCalculationResponse);

  // Returns a claim.
  rpc GetClaimRates(GetClaimRatesRequest) returns (GetClaimRatesResponse);
}

// The request of `CalculateClaim`.
message CalculateClaimRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string claim_id = 2;
  Claim claim = 3;
  CalculateClaimRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateClaim`.
message CalculateClaimResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateClaimResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Claim claim = 1;
  CalculateClaimResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

