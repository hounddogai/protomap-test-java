syntax = "proto3";

package acme.insurance.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/insurance/v1/insurance.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Insurance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/insurance/v1;insurancev1";
option java_multiple_files = true;
option java_outer_classname = "ClaimValidationServiceProto";
option java_package = "com.acme.insurance.v1";

// Checks claims against the rules before anything acts on them.
service ClaimValidationService {
  // Validates a claim.
  rpc ValidateClaim(ValidateClaimRequest) returns (ValidateClaimResponse);

  // Previews a claim.
  rpc PreviewClaim(PreviewClaimRequest) returns (PreviewClaimResponse);

  // Checks a claim.
  rpc CheckClaimEligibility(CheckClaimEligibilityRequest) returns (CheckClaimEligibilityResponse);

  // Normalizes a claim.
  rpc NormalizeClaim(NormalizeClaimRequest) returns (NormalizeClaimResponse);

  // Explains a claim.
  rpc ExplainClaimDecision(ExplainClaimDecisionRequest) returns (ExplainClaimDecisionResponse);

  // Scores a claim.
  rpc ScoreClaim(ScoreClaimRequest) returns (ScoreClaimResponse);

  // Lints a claim.
  rpc LintClaims(LintClaimsRequest) returns (LintClaimsResponse);

  // Returns a claim.
  rpc GetClaimRules(GetClaimRulesRequest) returns (GetClaimRulesResponse);
}

// The request of `ValidateClaim`.
message ValidateClaimRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string claim_id = 2;
  Claim claim = 3;
  ValidateClaimRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateClaim`.
message ValidateClaimResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Claim claim = 1;
  ValidateClaimResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

