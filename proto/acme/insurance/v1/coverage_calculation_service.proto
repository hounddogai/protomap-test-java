syntax = "proto3";

package acme.insurance.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/insurance/v1/insurance.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Insurance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/insurance/v1;insurancev1";
option java_multiple_files = true;
option java_outer_classname = "CoverageCalculationServiceProto";
option java_package = "com.acme.insurance.v1";

// Computes the figures of a coverage, such as totals, taxes, and estimates.
service CoverageCalculationService {
  // Calculates a coverage.
  rpc CalculateCoverage(CalculateCoverageRequest) returns (CalculateCoverageResponse);

  // Estimates a coverage.
  rpc EstimateCoverage(EstimateCoverageRequest) returns (EstimateCoverageResponse);

  // Quotes a coverage.
  rpc QuoteCoverage(QuoteCoverageRequest) returns (QuoteCoverageResponse);

  // Compares a coverage.
  rpc CompareCoverageOptions(CompareCoverageOptionsRequest) returns (CompareCoverageOptionsResponse);

  // Recalculates a coverage.
  rpc RecalculateCoverages(RecalculateCoveragesRequest) returns (RecalculateCoveragesResponse);

  // Simulates a coverage.
  rpc SimulateCoverage(SimulateCoverageRequest) returns (SimulateCoverageResponse);

  // Explains a coverage.
  rpc ExplainCoverageCalculation(ExplainCoverageCalculationRequest) returns (ExplainCoverageCalculationResponse);
}

// The request of `CalculateCoverage`.
message CalculateCoverageRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string coverage_id = 2;
  Coverage coverage = 3;
  CalculateCoverageRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateCoverage`.
message CalculateCoverageResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateCoverageResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Coverage coverage = 1;
  CalculateCoverageResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

