syntax = "proto3";

package acme.insurance.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/insurance/v1/insurance.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Insurance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/insurance/v1;insurancev1";
option java_multiple_files = true;
option java_outer_classname = "PolicyLifecycleServiceProto";
option java_package = "com.acme.insurance.v1";

// Moves a policy between the states of its lifecycle.
service PolicyLifecycleService {
  // Activates a policy.
  rpc ActivatePolicy(ActivatePolicyRequest) returns (ActivatePolicyResponse);

  // Suspends a policy.
  rpc SuspendPolicy(SuspendPolicyRequest) returns (SuspendPolicyResponse);

  // Reinstates a policy.
  rpc ReinstatePolicy(ReinstatePolicyRequest) returns (ReinstatePolicyResponse);

  // Terminates a policy.
  rpc TerminatePolicy(TerminatePolicyRequest) returns (TerminatePolicyResponse);

  // Renews a policy.
  rpc RenewPolicy(RenewPolicyRequest) returns (RenewPolicyResponse);

  // Expires a policy.
  rpc ExpirePolicy(ExpirePolicyRequest) returns (ExpirePolicyResponse);

  // Returns a policy.
  rpc GetPolicyLifecycle(GetPolicyLifecycleRequest) returns (GetPolicyLifecycleResponse);

  // Schedules a policy.
  rpc SchedulePolicyExpiry(SchedulePolicyExpiryRequest) returns (SchedulePolicyExpiryResponse);
}

// The request of `ActivatePolicy`.
message ActivatePolicyRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string policy_id = 2;
  ActivatePolicyRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivatePolicy`.
message ActivatePolicyResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Policy policy = 1;
  ActivatePolicyResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

