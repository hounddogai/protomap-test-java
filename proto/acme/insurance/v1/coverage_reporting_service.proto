syntax = "proto3";

package acme.insurance.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/insurance/v1/insurance.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Insurance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/insurance/v1;insurancev1";
option java_multiple_files = true;
option java_outer_classname = "CoverageReportingServiceProto";
option java_package = "com.acme.insurance.v1";

// Builds and schedules reports about coverages.
service CoverageReportingService {
  // Generates a coverage.
  rpc GenerateCoverageReport(GenerateCoverageReportRequest) returns (GenerateCoverageReportResponse);

  // Returns a coverage.
  rpc FetchCoverageReport(FetchCoverageReportRequest) returns (FetchCoverageReportResponse);

  // Schedules a coverage.
  rpc ScheduleCoverageReport(ScheduleCoverageReportRequest) returns (ScheduleCoverageReportResponse);

  // Streams the changes of coverages as they happen.
  rpc StreamCoverageMetrics(StreamCoverageMetricsRequest) returns (stream StreamCoverageMetricsResponse);

  // Lists coverages a page at a time.
  rpc ListCoverageReports(ListCoverageReportsRequest) returns (ListCoverageReportsResponse);

  // Shares a coverage.
  rpc ShareCoverageReport(ShareCoverageReportRequest) returns (ShareCoverageReportResponse);

  // Counts coverages by status.
  rpc CountCoverageTotals(CountCoverageTotalsRequest) returns (CountCoverageTotalsResponse);

  // Deletes a coverage.
  rpc DeleteCoverageReport(DeleteCoverageReportRequest) returns (DeleteCoverageReportResponse);
}

// The request of `GenerateCoverageReport`.
message GenerateCoverageReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string coverage_id = 2;
  GenerateCoverageReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateCoverageReport`.
message GenerateCoverageReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchCoverageReport`.
message FetchCoverageReportRequest {
  acme.common.v1.RequestContext context = 1;
  string coverage_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchCoverageReport`.
message FetchCoverageReportResponse {
  Coverage coverage = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleCoverageReport`.
message ScheduleCoverageReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string coverage_id = 2;
  ScheduleCoverageReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleCoverageReport`.
message ScheduleCoverageReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamCoverageMetrics`.
message StreamCoverageMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated CoverageStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamCoverageMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamCoverageMetrics`.
message StreamCoverageMetricsResponse {
  Coverage coverage = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListCoverageReports`.
message ListCoverageReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated CoverageStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListCoverageReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListCoverageReports`.
message ListCoverageReportsResponse {
  repeated Coverage coverages = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareCoverageReport`.
message ShareCoverageReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string coverage_id = 2;
  ShareCoverageReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareCoverageReport`.
message ShareCoverageReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Coverage coverage = 1;
  ShareCoverageReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountCoverageTotals`.
message CountCoverageTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated CoverageStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountCoverageTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountCoverageTotals`.
message CountCoverageTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteCoverageReport`.
message DeleteCoverageReportRequest {
  acme.common.v1.RequestContext context = 1;
  string coverage_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteCoverageReport`.
message DeleteCoverageReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
