syntax = "proto3";

package acme.insurance.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/insurance/v1/insurance.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Insurance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/insurance/v1;insurancev1";
option java_multiple_files = true;
option java_outer_classname = "UnderwritingCalculationServiceProto";
option java_package = "com.acme.insurance.v1";

// Computes the figures of an underwriting, such as totals, taxes, and estimates.
service UnderwritingCalculationService {
  // Calculates an underwriting.
  rpc CalculateUnderwriting(CalculateUnderwritingRequest) returns (CalculateUnderwritingResponse);

  // Estimates an underwriting.
  rpc EstimateUnderwriting(EstimateUnderwritingRequest) returns (EstimateUnderwritingResponse);

  // Quotes an underwriting.
  rpc QuoteUnderwriting(QuoteUnderwritingRequest) returns (QuoteUnderwritingResponse);

  // Compares an underwriting.
  rpc CompareUnderwritingOptions(CompareUnderwritingOptionsRequest) returns (CompareUnderwritingOptionsResponse);

  // Recalculates an underwriting.
  rpc RecalculateUnderwritings(RecalculateUnderwritingsRequest) returns (RecalculateUnderwritingsResponse);

  // Simulates an underwriting.
  rpc SimulateUnderwriting(SimulateUnderwritingRequest) returns (SimulateUnderwritingResponse);

  // Explains an underwriting.
  rpc ExplainUnderwritingCalculation(ExplainUnderwritingCalculationRequest) returns (ExplainUnderwritingCalculationResponse);

  // Returns an underwriting.
  rpc GetUnderwritingRates(GetUnderwritingRatesRequest) returns (GetUnderwritingRatesResponse);
}

// The request of `CalculateUnderwriting`.
message CalculateUnderwritingRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string underwriting_id = 2;
  Underwriting underwriting = 3;
  CalculateUnderwritingRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateUnderwriting`.
message CalculateUnderwritingResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateUnderwritingResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Underwriting underwriting = 1;
  CalculateUnderwritingResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

