syntax = "proto3";

package acme.insurance.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/insurance/v1/insurance.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Insurance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/insurance/v1;insurancev1";
option java_multiple_files = true;
option java_outer_classname = "ClaimQueryServiceProto";
option java_package = "com.acme.insurance.v1";

// Answers read-only questions about claims, for screens and reports.
service ClaimQueryService {
  // Returns a claim.
  rpc LookupClaim(LookupClaimRequest) returns (LookupClaimResponse);

  // Lists claims a page at a time.
  rpc BrowseClaims(BrowseClaimsRequest) returns (BrowseClaimsResponse);

  // Counts claims by status.
  rpc CountClaims(CountClaimsRequest) returns (CountClaimsResponse);

  // Returns several claims at once.
  rpc ResolveClaims(ResolveClaimsRequest) returns (ResolveClaimsResponse);

  // Streams every matching claim.
  rpc ExportClaims(ExportClaimsRequest) returns (stream ExportClaimsResponse);

  // Summarizes a claim.
  rpc SummarizeClaims(SummarizeClaimsRequest) returns (SummarizeClaimsResponse);

  // Lists claims a page at a time.
  rpc SuggestClaims(SuggestClaimsRequest) returns (SuggestClaimsResponse);

  // Returns a claim.
  rpc PeekClaim(PeekClaimRequest) returns (PeekClaimResponse);
}

// The request of `LookupClaim`.
message LookupClaimRequest {
  acme.common.v1.RequestContext context = 1;
  string claim_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupClaim`.
message LookupClaimResponse {
  Claim claim = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseClaims`.
message BrowseClaimsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ClaimStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseClaimsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseClaims`.
message BrowseClaimsResponse {
  repeated Claim claims = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountClaims`.
message CountClaimsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ClaimStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountClaimsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountClaims`.
message CountClaimsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveClaims`.
message ResolveClaimsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string claim_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveClaims`.
message ResolveClaimsResponse {
  repeated Claim claims = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportClaims`.
message ExportClaimsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ClaimStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportClaimsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportClaims`.
message ExportClaimsResponse {
  Claim claim = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeClaims`.
message SummarizeClaimsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string claim_id = 2;
  SummarizeClaimsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeClaims`.
message SummarizeClaimsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestClaims`.
message SuggestClaimsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ClaimStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestClaimsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestClaims`.
message SuggestClaimsResponse {
  repeated Claim claims = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekClaim`.
message PeekClaimRequest {
  acme.common.v1.RequestContext context = 1;
  string claim_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekClaim`.
message PeekClaimResponse {
  Claim claim = 1;
  acme.common.v1.OperationResult result = 2;
}
