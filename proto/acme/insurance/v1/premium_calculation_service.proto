syntax = "proto3";

package acme.insurance.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/insurance/v1/insurance.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Insurance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/insurance/v1;insurancev1";
option java_multiple_files = true;
option java_outer_classname = "PremiumCalculationServiceProto";
option java_package = "com.acme.insurance.v1";

// Computes the figures of a premium, such as totals, taxes, and estimates.
service PremiumCalculationService {
  // Calculates a premium.
  rpc CalculatePremium(CalculatePremiumRequest) returns (CalculatePremiumResponse);

  // Estimates a premium.
  rpc EstimatePremium(EstimatePremiumRequest) returns (EstimatePremiumResponse);

  // Quotes a premium.
  rpc QuotePremium(QuotePremiumRequest) returns (QuotePremiumResponse);

  // Compares a premium.
  rpc ComparePremiumOptions(ComparePremiumOptionsRequest) returns (ComparePremiumOptionsResponse);

  // Recalculates a premium.
  rpc RecalculatePremiums(RecalculatePremiumsRequest) returns (RecalculatePremiumsResponse);

  // Simulates a premium.
  rpc SimulatePremium(SimulatePremiumRequest) returns (SimulatePremiumResponse);

  // Explains a premium.
  rpc ExplainPremiumCalculation(ExplainPremiumCalculationRequest) returns (ExplainPremiumCalculationResponse);

  // Returns a premium.
  rpc GetPremiumRates(GetPremiumRatesRequest) returns (GetPremiumRatesResponse);
}

// The request of `CalculatePremium`.
message CalculatePremiumRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string premium_id = 2;
  Premium premium = 3;
  CalculatePremiumRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculatePremium`.
message CalculatePremiumResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculatePremiumResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Premium premium = 1;
  CalculatePremiumResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

