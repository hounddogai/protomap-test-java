syntax = "proto3";

package acme.insurance.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/insurance/v1/insurance.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Insurance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/insurance/v1;insurancev1";
option java_multiple_files = true;
option java_outer_classname = "CoverageValidationServiceProto";
option java_package = "com.acme.insurance.v1";

// Checks coverages against the rules before anything acts on them.
service CoverageValidationService {
  // Validates a coverage.
  rpc ValidateCoverage(ValidateCoverageRequest) returns (ValidateCoverageResponse);

  // Previews a coverage.
  rpc PreviewCoverage(PreviewCoverageRequest) returns (PreviewCoverageResponse);

  // Checks a coverage.
  rpc CheckCoverageEligibility(CheckCoverageEligibilityRequest) returns (CheckCoverageEligibilityResponse);

  // Normalizes a coverage.
  rpc NormalizeCoverage(NormalizeCoverageRequest) returns (NormalizeCoverageResponse);

  // Explains a coverage.
  rpc ExplainCoverageDecision(ExplainCoverageDecisionRequest) returns (ExplainCoverageDecisionResponse);

  // Scores a coverage.
  rpc ScoreCoverage(ScoreCoverageRequest) returns (ScoreCoverageResponse);

  // Returns a coverage.
  rpc GetCoverageRules(GetCoverageRulesRequest) returns (GetCoverageRulesResponse);
}

// The request of `ValidateCoverage`.
message ValidateCoverageRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string coverage_id = 2;
  Coverage coverage = 3;
  ValidateCoverageRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateCoverage`.
message ValidateCoverageResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Coverage coverage = 1;
  ValidateCoverageResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

