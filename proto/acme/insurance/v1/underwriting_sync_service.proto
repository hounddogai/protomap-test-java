message GetUnderwritingSyncStateRequest {
  acme.common.v1.RequestContext context = 1;
  string underwriting_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetUnderwritingSyncState`.
message GetUnderwritingSyncStateResponse {
  Underwriting underwriting = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ListUnderwritingConflicts`.
message ListUnderwritingConflictsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated UnderwritingStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListUnderwritingConflictsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListUnderwritingConflicts`.
message ListUnderwritingConflictsResponse {
  repeated Underwriting underwritings = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}
