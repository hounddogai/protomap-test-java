syntax = "proto3";

package acme.insurance.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/insurance/v1/insurance.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Insurance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/insurance/v1;insurancev1";
option java_multiple_files = true;
option java_outer_classname = "UnderwritingSyncServiceProto";
option java_package = "com.acme.insurance.v1";

// Keeps underwritings in step with the systems of record in other regions.
service UnderwritingSyncService {
  // Syncs an underwriting.
  rpc SyncUnderwritings(SyncUnderwritingsRequest) returns (SyncUnderwritingsResponse);

  // Pushs an underwriting.
  rpc PushUnderwriting(PushUnderwritingRequest) returns (PushUnderwritingResponse);

  // Pulls an underwriting.
  rpc PullUnderwritings(PullUnderwritingsRequest) returns (PullUnderwritingsResponse);

  // Reconciles an underwriting.
  rpc ReconcileUnderwritings(ReconcileUnderwritingsRequest) returns (ReconcileUnderwritingsResponse);

  // Exchanges changes of underwritings with a peer.
  rpc StreamUnderwritingChanges(stream StreamUnderwritingChangesRequest) returns (stream StreamUnderwritingChangesResponse);

  // Resolves an underwriting.
  rpc ResolveUnderwritingConflict(ResolveUnderwritingConflictRequest) returns (ResolveUnderwritingConflictResponse);

  // Returns an underwriting.
  rpc GetUnderwritingSyncState(GetUnderwritingSyncStateRequest) returns (GetUnderwritingSyncStateResponse);

  // Lists underwritings a page at a time.
  rpc ListUnderwritingConflicts(ListUnderwritingConflictsRequest) returns (ListUnderwritingConflictsResponse);
}

// The request of `SyncUnderwritings`.
message SyncUnderwritingsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string underwriting_id = 2;
  Underwriting underwriting = 3;
  SyncUnderwritingsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SyncUnderwritings`.
message SyncUnderwritingsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Underwriting underwriting = 1;
  SyncUnderwritingsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PushUnderwriting`.
message PushUnderwritingRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
