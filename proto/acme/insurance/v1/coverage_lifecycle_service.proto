syntax = "proto3";

package acme.insurance.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/insurance/v1/insurance.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Insurance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/insurance/v1;insurancev1";
option java_multiple_files = true;
option java_outer_classname = "CoverageLifecycleServiceProto";
option java_package = "com.acme.insurance.v1";

// Moves a coverage between the states of its lifecycle.
service CoverageLifecycleService {
  // Activates a coverage.
  rpc ActivateCoverage(ActivateCoverageRequest) returns (ActivateCoverageResponse);

  // Suspends a coverage.
  rpc SuspendCoverage(SuspendCoverageRequest) returns (SuspendCoverageResponse);

  // Reinstates a coverage.
  rpc ReinstateCoverage(ReinstateCoverageRequest) returns (ReinstateCoverageResponse);

  // Terminates a coverage.
  rpc TerminateCoverage(TerminateCoverageRequest) returns (TerminateCoverageResponse);

  // Expires a coverage.
  rpc ExpireCoverage(ExpireCoverageRequest) returns (ExpireCoverageResponse);

  // Returns a coverage.
  rpc GetCoverageLifecycle(GetCoverageLifecycleRequest) returns (GetCoverageLifecycleResponse);

  // Schedules a coverage.
  rpc ScheduleCoverageExpiry(ScheduleCoverageExpiryRequest) returns (ScheduleCoverageExpiryResponse);
}

// The request of `ActivateCoverage`.
message ActivateCoverageRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string coverage_id = 2;
  ActivateCoverageRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateCoverage`.
message ActivateCoverageResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Coverage coverage = 1;
  ActivateCoverageResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

