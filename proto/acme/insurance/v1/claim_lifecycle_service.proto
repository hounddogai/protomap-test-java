syntax = "proto3";

package acme.insurance.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/insurance/v1/insurance.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Insurance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/insurance/v1;insurancev1";
option java_multiple_files = true;
option java_outer_classname = "ClaimLifecycleServiceProto";
option java_package = "com.acme.insurance.v1";

// Moves a claim between the states of its lifecycle.
service ClaimLifecycleService {
  // Activates a claim.
  rpc ActivateClaim(ActivateClaimRequest) returns (ActivateClaimResponse);

  // Suspends a claim.
  rpc SuspendClaim(SuspendClaimRequest) returns (SuspendClaimResponse);

  // Reinstates a claim.
  rpc ReinstateClaim(ReinstateClaimRequest) returns (ReinstateClaimResponse);

  // Terminates a claim.
  rpc TerminateClaim(TerminateClaimRequest) returns (TerminateClaimResponse);

  // Renews a claim.
  rpc RenewClaim(RenewClaimRequest) returns (RenewClaimResponse);

  // Expires a claim.
  rpc ExpireClaim(ExpireClaimRequest) returns (ExpireClaimResponse);

  // Schedules a claim.
  rpc ScheduleClaimExpiry(ScheduleClaimExpiryRequest) returns (ScheduleClaimExpiryResponse);
}

// The request of `ActivateClaim`.
message ActivateClaimRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string claim_id = 2;
  ActivateClaimRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateClaim`.
message ActivateClaimResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Claim claim = 1;
  ActivateClaimResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

