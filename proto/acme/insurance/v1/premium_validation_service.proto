syntax = "proto3";

package acme.insurance.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/insurance/v1/insurance.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Insurance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/insurance/v1;insurancev1";
option java_multiple_files = true;
option java_outer_classname = "PremiumValidationServiceProto";
option java_package = "com.acme.insurance.v1";

// Checks premiums against the rules before anything acts on them.
service PremiumValidationService {
  // Validates a premium.
  rpc ValidatePremium(ValidatePremiumRequest) returns (ValidatePremiumResponse);

  // Previews a premium.
  rpc PreviewPremium(PreviewPremiumRequest) returns (PreviewPremiumResponse);

  // Checks a premium.
  rpc CheckPremiumEligibility(CheckPremiumEligibilityRequest) returns (CheckPremiumEligibilityResponse);

  // Normalizes a premium.
  rpc NormalizePremium(NormalizePremiumRequest) returns (NormalizePremiumResponse);

  // Scores a premium.
  rpc ScorePremium(ScorePremiumRequest) returns (ScorePremiumResponse);

  // Lints a premium.
  rpc LintPremiums(LintPremiumsRequest) returns (LintPremiumsResponse);

  // Returns a premium.
  rpc GetPremiumRules(GetPremiumRulesRequest) returns (GetPremiumRulesResponse);
}

// The request of `ValidatePremium`.
message ValidatePremiumRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string premium_id = 2;
  Premium premium = 3;
  ValidatePremiumRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidatePremium`.
message ValidatePremiumResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Premium premium = 1;
  ValidatePremiumResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

