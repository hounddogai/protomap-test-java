// The request of `GetPremiumRules`.
message GetPremiumRulesRequest {
  acme.common.v1.RequestContext context = 1;
  string premium_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetPremiumRules`.
message GetPremiumRulesResponse {
  Premium premium = 1;
  acme.common.v1.OperationResult result = 2;
}
