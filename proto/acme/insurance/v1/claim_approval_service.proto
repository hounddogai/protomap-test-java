syntax = "proto3";

package acme.insurance.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/insurance/v1/insurance.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Insurance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/insurance/v1;insurancev1";
option java_multiple_files = true;
option java_outer_classname = "ClaimApprovalServiceProto";
option java_package = "com.acme.insurance.v1";

// Routes claims through approval, with escalation and delegation.
service ClaimApprovalService {
  // Submits a claim.
  rpc SubmitClaim(SubmitClaimRequest) returns (SubmitClaimResponse);

  // Approves a claim.
  rpc ApproveClaim(ApproveClaimRequest) returns (ApproveClaimResponse);

  // Rejects a claim.
  rpc RejectClaim(RejectClaimRequest) returns (RejectClaimResponse);

  // Escalates a claim.
  rpc EscalateClaim(EscalateClaimRequest) returns (EscalateClaimResponse);

  // Lists claims a page at a time.
  rpc ListPendingClaims(ListPendingClaimsRequest) returns (ListPendingClaimsResponse);

  // Delegates a claim.
  rpc DelegateClaimApproval(DelegateClaimApprovalRequest) returns (DelegateClaimApprovalResponse);

  // Recalls a claim.
  rpc RecallClaim(RecallClaimRequest) returns (RecallClaimResponse);

  // Comments a claim.
  rpc CommentClaimApproval(CommentClaimApprovalRequest) returns (CommentClaimApprovalResponse);
}

// The request of `SubmitClaim`.
message SubmitClaimRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string claim_id = 2;
  Claim claim = 3;
  SubmitClaimRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitClaim`.
message SubmitClaimResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Claim claim = 1;
  SubmitClaimResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

