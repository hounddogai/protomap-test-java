syntax = "proto3";

package acme.insurance.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/insurance/v1/insurance.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Insurance.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/insurance/v1;insurancev1";
option java_multiple_files = true;
option java_outer_classname = "PremiumLifecycleServiceProto";
option java_package = "com.acme.insurance.v1";

// Moves a premium between the states of its lifecycle.
service PremiumLifecycleService {
  // Activates a premium.
  rpc ActivatePremium(ActivatePremiumRequest) returns (ActivatePremiumResponse);

  // Suspends a premium.
  rpc SuspendPremium(SuspendPremiumRequest) returns (SuspendPremiumResponse);

  // Reinstates a premium.
  rpc ReinstatePremium(ReinstatePremiumRequest) returns (ReinstatePremiumResponse);

  // Terminates a premium.
  rpc TerminatePremium(TerminatePremiumRequest) returns (TerminatePremiumResponse);

  // Renews a premium.
  rpc RenewPremium(RenewPremiumRequest) returns (RenewPremiumResponse);

  // Expires a premium.
  rpc ExpirePremium(ExpirePremiumRequest) returns (ExpirePremiumResponse);

  // Returns a premium.
  rpc GetPremiumLifecycle(GetPremiumLifecycleRequest) returns (GetPremiumLifecycleResponse);

  // Schedules a premium.
  rpc SchedulePremiumExpiry(SchedulePremiumExpiryRequest) returns (SchedulePremiumExpiryResponse);
}

// The request of `ActivatePremium`.
message ActivatePremiumRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string premium_id = 2;
  ActivatePremiumRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivatePremium`.
message ActivatePremiumResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Premium premium = 1;
  ActivatePremiumResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

