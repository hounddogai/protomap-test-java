// Runs the long-lived workflow that takes an approval inbox from start to finish.
service ApprovalInboxWorkflowService {
  // Starts an approval inbox.
  rpc StartApprovalInboxWorkflow(StartApprovalInboxWorkflowRequest) returns (StartApprovalInboxWorkflowResponse);

  // Advances an approval inbox.
  rpc AdvanceApprovalInboxWorkflow(AdvanceApprovalInboxWorkflowRequest) returns (AdvanceApprovalInboxWorkflowResponse);

  // Cancels an approval inbox.
  rpc CancelApprovalInboxWorkflow(CancelApprovalInboxWorkflowRequest) returns (CancelApprovalInboxWorkflowResponse);

  // Retrys an approval inbox.
  rpc RetryApprovalInboxWorkflow(RetryApprovalInboxWorkflowRequest) returns (RetryApprovalInboxWorkflowResponse);

  // Pauses an approval inbox.
  rpc PauseApprovalInboxWorkflow(PauseApprovalInboxWorkflowRequest) returns (PauseApprovalInboxWorkflowResponse);

  // Resumes an approval inbox.
  rpc ResumeApprovalInboxWorkflow(ResumeApprovalInboxWorkflowRequest) returns (ResumeApprovalInboxWorkflowResponse);

  // Returns an approval inbox.
  rpc InspectApprovalInboxWorkflow(InspectApprovalInboxWorkflowRequest) returns (InspectApprovalInboxWorkflowResponse);

  // Lists approval inboxes a page at a time.
  rpc ListApprovalInboxWorkflows(ListApprovalInboxWorkflowsRequest) returns (ListApprovalInboxWorkflowsResponse);

  // Signals an approval inbox.
  rpc SignalApprovalInboxWorkflow(SignalApprovalInboxWorkflowRequest) returns (SignalApprovalInboxWorkflowResponse);
}

// The request of `StartApprovalInboxWorkflow`.
message StartApprovalInboxWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string approval_inbox_id = 2;
  ApprovalInbox approval_inbox = 3;
  StartApprovalInboxWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartApprovalInboxWorkflow`.
message StartApprovalInboxWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ApprovalInbox approval_inbox = 1;
  StartApprovalInboxWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

