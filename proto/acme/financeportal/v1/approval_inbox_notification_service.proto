syntax = "proto3";

package acme.financeportal.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/financeportal/v1/financeportal.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Financeportal.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/financeportal/v1;financeportalv1";
option java_multiple_files = true;
option java_outer_classname = "ApprovalInboxNotificationServiceProto";
option java_package = "com.acme.financeportal.v1";

// Tells the people who follow an approval inbox what changed.
service ApprovalInboxNotificationService {
  // Subscribes an approval inbox.
  rpc SubscribeApprovalInboxUpdates(SubscribeApprovalInboxUpdatesRequest) returns (SubscribeApprovalInboxUpdatesResponse);

  // Unsubscribes an approval inbox.
  rpc UnsubscribeApprovalInboxUpdates(UnsubscribeApprovalInboxUpdatesRequest) returns (UnsubscribeApprovalInboxUpdatesResponse);

  // Notifys an approval inbox.
  rpc NotifyApprovalInboxWatchers(NotifyApprovalInboxWatchersRequest) returns (NotifyApprovalInboxWatchersResponse);

  // Lists approval inboxes a page at a time.
  rpc ListApprovalInboxSubscriptions(ListApprovalInboxSubscriptionsRequest) returns (ListApprovalInboxSubscriptionsResponse);

  // Sends an approval inbox.
  rpc SendApprovalInboxTestNotice(SendApprovalInboxTestNoticeRequest) returns (SendApprovalInboxTestNoticeResponse);

  // Returns an approval inbox.
  rpc GetApprovalInboxPreferences(GetApprovalInboxPreferencesRequest) returns (GetApprovalInboxPreferencesResponse);

  // Streams the changes of approval inboxes as they happen.
  rpc StreamApprovalInboxNotices(StreamApprovalInboxNoticesRequest) returns (stream StreamApprovalInboxNoticesResponse);
}

// The request of `SubscribeApprovalInboxUpdates`.
message SubscribeApprovalInboxUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string approval_inbox_id = 2;
  SubscribeApprovalInboxUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SubscribeApprovalInboxUpdates`.
message SubscribeApprovalInboxUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ApprovalInbox approval_inbox = 1;
  SubscribeApprovalInboxUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `UnsubscribeApprovalInboxUpdates`.
message UnsubscribeApprovalInboxUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string approval_inbox_id = 2;
  UnsubscribeApprovalInboxUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `UnsubscribeApprovalInboxUpdates`.
message UnsubscribeApprovalInboxUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ApprovalInbox approval_inbox = 1;
  UnsubscribeApprovalInboxUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

