message GetApprovalInboxPreferencesRequest {
  acme.common.v1.RequestContext context = 1;
  string approval_inbox_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetApprovalInboxPreferences`.
message GetApprovalInboxPreferencesResponse {
  ApprovalInbox approval_inbox = 1;
