syntax = "proto3";

package acme.financeportal.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/financeportal/v1/financeportal.proto";
import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Financeportal.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/financeportal/v1;financeportalv1";
option java_multiple_files = true;
option java_outer_classname = "ApprovalInboxIntegrationServiceProto";
option java_package = "com.acme.financeportal.v1";

// Connects external systems that send approval inbox events.
service ApprovalInboxIntegrationService {
  // Connects an approval inbox.
  rpc ConnectApprovalInboxSource(ConnectApprovalInboxSourceRequest) returns (ConnectApprovalInboxSourceResponse);

  // Disconnects an approval inbox.
  rpc DisconnectApprovalInboxSource(DisconnectApprovalInboxSourceRequest) returns (DisconnectApprovalInboxSourceResponse);

  // Takes a stream of approval inboxes and answers once at the end.
  rpc IngestApprovalInboxEvents(stream IngestApprovalInboxEventsRequest) returns (IngestApprovalInboxEventsResponse);

  // Replays an approval inbox.
  rpc ReplayApprovalInboxEvents(ReplayApprovalInboxEventsRequest) returns (ReplayApprovalInboxEventsResponse);

  // Exchanges changes of approval inboxes with a peer.
  rpc RelayApprovalInboxMessages(stream RelayApprovalInboxMessagesRequest) returns (stream RelayApprovalInboxMessagesResponse);

  // Lists approval inboxes a page at a time.
  rpc ListApprovalInboxSources(ListApprovalInboxSourcesRequest) returns (ListApprovalInboxSourcesResponse);

  // Tests an approval inbox.
  rpc TestApprovalInboxConnection(TestApprovalInboxConnectionRequest) returns (TestApprovalInboxConnectionResponse);
}

// The request of `ConnectApprovalInboxSource`.
message ConnectApprovalInboxSourceRequest {
  // What the operation needs besides the record.
  message Details {
    string endpoint = 1;
    google.protobuf.Any envelope = 2;
    string message_id = 3;
    string source_system = 4;
    google.protobuf.Timestamp received_at = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string approval_inbox_id = 2;
  ConnectApprovalInboxSourceRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ConnectApprovalInboxSource`.
message ConnectApprovalInboxSourceResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ApprovalInbox approval_inbox = 1;
  ConnectApprovalInboxSourceResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DisconnectApprovalInboxSource`.
message DisconnectApprovalInboxSourceRequest {
  // What the operation needs besides the record.
  message Details {
    string endpoint = 1;
    google.protobuf.Any envelope = 2;
    string message_id = 3;
    string source_system = 4;
    google.protobuf.Timestamp received_at = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string approval_inbox_id = 2;
  DisconnectApprovalInboxSourceRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `DisconnectApprovalInboxSource`.
message DisconnectApprovalInboxSourceResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ApprovalInbox approval_inbox = 1;
  DisconnectApprovalInboxSourceResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `IngestApprovalInboxEvents`.
message IngestApprovalInboxEventsRequest {
  // What a stream of records starts with.
  message StreamHeader {
    string source = 1;
    string format = 2;
    int64 total_records = 3;
    acme.common.v1.ContactInfo submitted_by = 4;
  }

  acme.common.v1.RequestContext context = 1;
  oneof chunk {
    IngestApprovalInboxEventsRequest.StreamHeader header = 2;
    ApprovalInbox record = 3;
  }
  int64 sequence = 4;
}

// The response of `IngestApprovalInboxEvents`.
message IngestApprovalInboxEventsResponse {
  // A record the import turned down.
  message Rejection {
    int64 sequence = 1;
    string reason = 2;
    string approval_inbox_id = 3;
  }

  int64 accepted = 1;
  int64 rejected = 2;
  repeated IngestApprovalInboxEventsResponse.Rejection rejections = 3;
  acme.common.v1.OperationResult result = 4;
}

// The request of `ReplayApprovalInboxEvents`.
message ReplayApprovalInboxEventsRequest {
  // What the operation needs besides the record.
  message Details {
    string endpoint = 1;
    google.protobuf.Any envelope = 2;
    string message_id = 3;
    string source_system = 4;
    google.protobuf.Timestamp received_at = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string approval_inbox_id = 2;
  ReplayApprovalInboxEventsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ReplayApprovalInboxEvents`.
message ReplayApprovalInboxEventsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ApprovalInbox approval_inbox = 1;
  ReplayApprovalInboxEventsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `RelayApprovalInboxMessages`.
message RelayApprovalInboxMessagesRequest {
  // An acknowledgment of a change the peer sent.
  message ChangeAck {
    int64 sequence = 1;
    string status = 2;
  }

  acme.common.v1.RequestContext context = 1;
  oneof frame {
    ApprovalInbox change = 2;
    RelayApprovalInboxMessagesRequest.ChangeAck ack = 3;
  }
  string cursor = 4;
}

// The response of `RelayApprovalInboxMessages`.
message RelayApprovalInboxMessagesResponse {
  ApprovalInbox approval_inbox = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListApprovalInboxSources`.
message ListApprovalInboxSourcesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ApprovalInboxStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListApprovalInboxSourcesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListApprovalInboxSources`.
message ListApprovalInboxSourcesResponse {
  repeated ApprovalInbox approval_inboxes = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `TestApprovalInboxConnection`.
message TestApprovalInboxConnectionRequest {
  // What the operation needs besides the record.
  message Details {
    string endpoint = 1;
    google.protobuf.Any envelope = 2;
    string message_id = 3;
    string source_system = 4;
    google.protobuf.Timestamp received_at = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string approval_inbox_id = 2;
  TestApprovalInboxConnectionRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `TestApprovalInboxConnection`.
message TestApprovalInboxConnectionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ApprovalInbox approval_inbox = 1;
  TestApprovalInboxConnectionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}
