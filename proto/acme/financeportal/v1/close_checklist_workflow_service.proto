option csharp_namespace = "Acme.Financeportal.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/financeportal/v1;financeportalv1";
option java_multiple_files = true;
option java_outer_classname = "CloseChecklistWorkflowServiceProto";
option java_package = "com.acme.financeportal.v1";

// Runs the long-lived workflow that takes a close checklist from start to finish.
service CloseChecklistWorkflowService {
  // Starts a close checklist.
  rpc StartCloseChecklistWorkflow(StartCloseChecklistWorkflowRequest) returns (StartCloseChecklistWorkflowResponse);

  // Advances a close checklist.
  rpc AdvanceCloseChecklistWorkflow(AdvanceCloseChecklistWorkflowRequest) returns (AdvanceCloseChecklistWorkflowResponse);

  // Cancels a close checklist.
  rpc CancelCloseChecklistWorkflow(CancelCloseChecklistWorkflowRequest) returns (CancelCloseChecklistWorkflowResponse);

  // Retrys a close checklist.
  rpc RetryCloseChecklistWorkflow(RetryCloseChecklistWorkflowRequest) returns (RetryCloseChecklistWorkflowResponse);

  // Pauses a close checklist.
  rpc PauseCloseChecklistWorkflow(PauseCloseChecklistWorkflowRequest) returns (PauseCloseChecklistWorkflowResponse);

  // Resumes a close checklist.
  rpc ResumeCloseChecklistWorkflow(ResumeCloseChecklistWorkflowRequest) returns (ResumeCloseChecklistWorkflowResponse);

  // Returns a close checklist.
  rpc InspectCloseChecklistWorkflow(InspectCloseChecklistWorkflowRequest) returns (InspectCloseChecklistWorkflowResponse);

  // Lists close checklists a page at a time.
  rpc ListCloseChecklistWorkflows(ListCloseChecklistWorkflowsRequest) returns (ListCloseChecklistWorkflowsResponse);

  // Signals a close checklist.
  rpc SignalCloseChecklistWorkflow(SignalCloseChecklistWorkflowRequest) returns (SignalCloseChecklistWorkflowResponse);
}

// The request of `StartCloseChecklistWorkflow`.
message StartCloseChecklistWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string close_checklist_id = 2;
  CloseChecklist close_checklist = 3;
  StartCloseChecklistWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartCloseChecklistWorkflow`.
message StartCloseChecklistWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CloseChecklist close_checklist = 1;
  StartCloseChecklistWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

