syntax = "proto3";

package acme.financeportal.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/financeportal/v1/financeportal.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Financeportal.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/financeportal/v1;financeportalv1";
option java_multiple_files = true;
option java_outer_classname = "CloseChecklistNotificationServiceProto";
option java_package = "com.acme.financeportal.v1";

// Tells the people who follow a close checklist what changed.
service CloseChecklistNotificationService {
  // Subscribes a close checklist.
  rpc SubscribeCloseChecklistUpdates(SubscribeCloseChecklistUpdatesRequest) returns (SubscribeCloseChecklistUpdatesResponse);

  // Unsubscribes a close checklist.
  rpc UnsubscribeCloseChecklistUpdates(UnsubscribeCloseChecklistUpdatesRequest) returns (UnsubscribeCloseChecklistUpdatesResponse);

  // Notifys a close checklist.
  rpc NotifyCloseChecklistWatchers(NotifyCloseChecklistWatchersRequest) returns (NotifyCloseChecklistWatchersResponse);

  // Lists close checklists a page at a time.
  rpc ListCloseChecklistSubscriptions(ListCloseChecklistSubscriptionsRequest) returns (ListCloseChecklistSubscriptionsResponse);

  // Sends a close checklist.
  rpc SendCloseChecklistTestNotice(SendCloseChecklistTestNoticeRequest) returns (SendCloseChecklistTestNoticeResponse);

  // Returns a close checklist.
  rpc GetCloseChecklistPreferences(GetCloseChecklistPreferencesRequest) returns (GetCloseChecklistPreferencesResponse);

  // Streams the changes of close checklists as they happen.
  rpc StreamCloseChecklistNotices(StreamCloseChecklistNoticesRequest) returns (stream StreamCloseChecklistNoticesResponse);
}

// The request of `SubscribeCloseChecklistUpdates`.
message SubscribeCloseChecklistUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string close_checklist_id = 2;
  SubscribeCloseChecklistUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SubscribeCloseChecklistUpdates`.
message SubscribeCloseChecklistUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CloseChecklist close_checklist = 1;
  SubscribeCloseChecklistUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `UnsubscribeCloseChecklistUpdates`.
message UnsubscribeCloseChecklistUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string close_checklist_id = 2;
  UnsubscribeCloseChecklistUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `UnsubscribeCloseChecklistUpdates`.
message UnsubscribeCloseChecklistUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CloseChecklist close_checklist = 1;
  UnsubscribeCloseChecklistUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `NotifyCloseChecklistWatchers`.
message NotifyCloseChecklistWatchersRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
