syntax = "proto3";

package acme.financeportal.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/financeportal/v1/financeportal.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Financeportal.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/financeportal/v1;financeportalv1";
option java_multiple_files = true;
option java_outer_classname = "ApprovalInboxQueryServiceProto";
option java_package = "com.acme.financeportal.v1";

// Answers read-only questions about approval inboxes, for screens and reports.
service ApprovalInboxQueryService {
  // Returns an approval inbox.
  rpc LookupApprovalInbox(LookupApprovalInboxRequest) returns (LookupApprovalInboxResponse);

  // Lists approval inboxes a page at a time.
  rpc BrowseApprovalInboxes(BrowseApprovalInboxesRequest) returns (BrowseApprovalInboxesResponse);

  // Lists approval inboxes a page at a time.
  rpc FindApprovalInboxes(FindApprovalInboxesRequest) returns (FindApprovalInboxesResponse);

  // Counts approval inboxes by status.
  rpc CountApprovalInboxes(CountApprovalInboxesRequest) returns (CountApprovalInboxesResponse);

  // Returns several approval inboxes at once.
  rpc ResolveApprovalInboxes(ResolveApprovalInboxesRequest) returns (ResolveApprovalInboxesResponse);

  // Streams every matching approval inbox.
  rpc ExportApprovalInboxes(ExportApprovalInboxesRequest) returns (stream ExportApprovalInboxesResponse);

  // Summarizes an approval inbox.
  rpc SummarizeApprovalInboxes(SummarizeApprovalInboxesRequest) returns (SummarizeApprovalInboxesResponse);

  // Lists approval inboxes a page at a time.
  rpc SuggestApprovalInboxes(SuggestApprovalInboxesRequest) returns (SuggestApprovalInboxesResponse);

  // Returns an approval inbox.
  rpc PeekApprovalInbox(PeekApprovalInboxRequest) returns (PeekApprovalInboxResponse);
}

// The request of `LookupApprovalInbox`.
message LookupApprovalInboxRequest {
  acme.common.v1.RequestContext context = 1;
  string approval_inbox_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupApprovalInbox`.
message LookupApprovalInboxResponse {
  ApprovalInbox approval_inbox = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseApprovalInboxes`.
message BrowseApprovalInboxesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ApprovalInboxStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseApprovalInboxesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseApprovalInboxes`.
message BrowseApprovalInboxesResponse {
  repeated ApprovalInbox approval_inboxes = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindApprovalInboxes`.
message FindApprovalInboxesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ApprovalInboxStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindApprovalInboxesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindApprovalInboxes`.
message FindApprovalInboxesResponse {
  repeated ApprovalInbox approval_inboxes = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountApprovalInboxes`.
message CountApprovalInboxesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ApprovalInboxStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountApprovalInboxesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountApprovalInboxes`.
message CountApprovalInboxesResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveApprovalInboxes`.
message ResolveApprovalInboxesRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string approval_inbox_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveApprovalInboxes`.
message ResolveApprovalInboxesResponse {
  repeated ApprovalInbox approval_inboxes = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportApprovalInboxes`.
message ExportApprovalInboxesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ApprovalInboxStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportApprovalInboxesRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportApprovalInboxes`.
message ExportApprovalInboxesResponse {
  ApprovalInbox approval_inbox = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeApprovalInboxes`.
message SummarizeApprovalInboxesRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string approval_inbox_id = 2;
  SummarizeApprovalInboxesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeApprovalInboxes`.
message SummarizeApprovalInboxesResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestApprovalInboxes`.
message SuggestApprovalInboxesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated ApprovalInboxStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestApprovalInboxesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestApprovalInboxes`.
message SuggestApprovalInboxesResponse {
  repeated ApprovalInbox approval_inboxes = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekApprovalInbox`.
message PeekApprovalInboxRequest {
  acme.common.v1.RequestContext context = 1;
  string approval_inbox_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekApprovalInbox`.
message PeekApprovalInboxResponse {
  ApprovalInbox approval_inbox = 1;
  acme.common.v1.OperationResult result = 2;
}
