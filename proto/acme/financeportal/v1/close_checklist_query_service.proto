syntax = "proto3";

package acme.financeportal.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/financeportal/v1/financeportal.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Financeportal.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/financeportal/v1;financeportalv1";
option java_multiple_files = true;
option java_outer_classname = "CloseChecklistQueryServiceProto";
option java_package = "com.acme.financeportal.v1";

// Answers read-only questions about close checklists, for screens and reports.
service CloseChecklistQueryService {
  // Returns a close checklist.
  rpc LookupCloseChecklist(LookupCloseChecklistRequest) returns (LookupCloseChecklistResponse);

  // Lists close checklists a page at a time.
  rpc BrowseCloseChecklists(BrowseCloseChecklistsRequest) returns (BrowseCloseChecklistsResponse);

  // Returns several close checklists at once.
  rpc ResolveCloseChecklists(ResolveCloseChecklistsRequest) returns (ResolveCloseChecklistsResponse);

  // Streams every matching close checklist.
  rpc ExportCloseChecklists(ExportCloseChecklistsRequest) returns (stream ExportCloseChecklistsResponse);

  // Summarizes a close checklist.
  rpc SummarizeCloseChecklists(SummarizeCloseChecklistsRequest) returns (SummarizeCloseChecklistsResponse);

  // Lists close checklists a page at a time.
  rpc SuggestCloseChecklists(SuggestCloseChecklistsRequest) returns (SuggestCloseChecklistsResponse);

  // Returns a close checklist.
  rpc PeekCloseChecklist(PeekCloseChecklistRequest) returns (PeekCloseChecklistResponse);
}

// The request of `LookupCloseChecklist`.
message LookupCloseChecklistRequest {
  acme.common.v1.RequestContext context = 1;
  string close_checklist_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupCloseChecklist`.
message LookupCloseChecklistResponse {
  CloseChecklist close_checklist = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseCloseChecklists`.
message BrowseCloseChecklistsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated CloseChecklistStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseCloseChecklistsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseCloseChecklists`.
message BrowseCloseChecklistsResponse {
  repeated CloseChecklist close_checklists = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveCloseChecklists`.
message ResolveCloseChecklistsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string close_checklist_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveCloseChecklists`.
message ResolveCloseChecklistsResponse {
  repeated CloseChecklist close_checklists = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportCloseChecklists`.
message ExportCloseChecklistsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated CloseChecklistStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportCloseChecklistsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportCloseChecklists`.
message ExportCloseChecklistsResponse {
  CloseChecklist close_checklist = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeCloseChecklists`.
message SummarizeCloseChecklistsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string close_checklist_id = 2;
  SummarizeCloseChecklistsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeCloseChecklists`.
message SummarizeCloseChecklistsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestCloseChecklists`.
message SuggestCloseChecklistsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated CloseChecklistStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestCloseChecklistsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestCloseChecklists`.
message SuggestCloseChecklistsResponse {
  repeated CloseChecklist close_checklists = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekCloseChecklist`.
message PeekCloseChecklistRequest {
  acme.common.v1.RequestContext context = 1;
  string close_checklist_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekCloseChecklist`.
message PeekCloseChecklistResponse {
  CloseChecklist close_checklist = 1;
  acme.common.v1.OperationResult result = 2;
}
