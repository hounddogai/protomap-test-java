syntax = "proto3";

package acme.financeportal.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/financeportal/v1/financeportal.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Financeportal.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/financeportal/v1;financeportalv1";
option java_multiple_files = true;
option java_outer_classname = "FinanceWorkspaceGatewayServiceProto";
option java_package = "com.acme.financeportal.v1";

// The edge API that apps call for finance workspaces.
service FinanceWorkspaceGatewayService {
  // Fetchs a finance workspace.
  rpc FetchFinanceWorkspaceView(FetchFinanceWorkspaceViewRequest) returns (FetchFinanceWorkspaceViewResponse);

  // Composes a finance workspace.
  rpc ComposeFinanceWorkspacePage(ComposeFinanceWorkspacePageRequest) returns (ComposeFinanceWorkspacePageResponse);

  // Refreshs a finance workspace.
  rpc RefreshFinanceWorkspace(RefreshFinanceWorkspaceRequest) returns (RefreshFinanceWorkspaceResponse);

  // Submits a finance workspace.
  rpc SubmitFinanceWorkspaceForm(SubmitFinanceWorkspaceFormRequest) returns (SubmitFinanceWorkspaceFormResponse);

  // Tracks a finance workspace.
  rpc TrackFinanceWorkspace(TrackFinanceWorkspaceRequest) returns (TrackFinanceWorkspaceResponse);

  // Streams the changes of finance workspaces as they happen.
  rpc StreamFinanceWorkspaceUpdates(StreamFinanceWorkspaceUpdatesRequest) returns (stream StreamFinanceWorkspaceUpdatesResponse);

  // Takes a stream of finance workspaces and answers once at the end.
  rpc UploadFinanceWorkspaceAttachments(stream UploadFinanceWorkspaceAttachmentsRequest) returns (UploadFinanceWorkspaceAttachmentsResponse);

  // Lists finance workspaces a page at a time.
  rpc SearchFinanceWorkspaceCatalog(SearchFinanceWorkspaceCatalogRequest) returns (SearchFinanceWorkspaceCatalogResponse);

  // Returns a finance workspace.
  rpc GetFinanceWorkspaceSummary(GetFinanceWorkspaceSummaryRequest) returns (GetFinanceWorkspaceSummaryResponse);

  // Starts a finance workspace.
  rpc StartFinanceWorkspaceCheckout(StartFinanceWorkspaceCheckoutRequest) returns (StartFinanceWorkspaceCheckoutResponse);
}

// The request of `FetchFinanceWorkspaceView`.
message FetchFinanceWorkspaceViewRequest {
  // What the operation needs besides the record.
  message Details {
    string device = 1;
    string locale = 2;
    acme.common.v1.GeoPoint location = 3;
    map<string, string> client_hints = 4;
    string session_id = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string finance_workspace_id = 2;
  FinanceWorkspace finance_workspace = 3;
  FetchFinanceWorkspaceViewRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `FetchFinanceWorkspaceView`.
message FetchFinanceWorkspaceViewResponse {
  FinanceWorkspace finance_workspace = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ComposeFinanceWorkspacePage`.
message ComposeFinanceWorkspacePageRequest {
  // What the operation needs besides the record.
  message Details {
    string device = 1;
    string locale = 2;
    acme.common.v1.GeoPoint location = 3;
    map<string, string> client_hints = 4;
    string session_id = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string finance_workspace_id = 2;
  FinanceWorkspace finance_workspace = 3;
  ComposeFinanceWorkspacePageRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ComposeFinanceWorkspacePage`.
message ComposeFinanceWorkspacePageResponse {
  FinanceWorkspace finance_workspace = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `RefreshFinanceWorkspace`.
message RefreshFinanceWorkspaceRequest {
  // What the operation needs besides the record.
  message Details {
    string device = 1;
    string locale = 2;
    acme.common.v1.GeoPoint location = 3;
    map<string, string> client_hints = 4;
    string session_id = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string finance_workspace_id = 2;
  FinanceWorkspace finance_workspace = 3;
  RefreshFinanceWorkspaceRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RefreshFinanceWorkspace`.
message RefreshFinanceWorkspaceResponse {
  FinanceWorkspace finance_workspace = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `SubmitFinanceWorkspaceForm`.
message SubmitFinanceWorkspaceFormRequest {
  // What the operation needs besides the record.
  message Details {
    string device = 1;
    string locale = 2;
    acme.common.v1.GeoPoint location = 3;
    map<string, string> client_hints = 4;
    string session_id = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string finance_workspace_id = 2;
  FinanceWorkspace finance_workspace = 3;
  SubmitFinanceWorkspaceFormRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitFinanceWorkspaceForm`.
message SubmitFinanceWorkspaceFormResponse {
  FinanceWorkspace finance_workspace = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `TrackFinanceWorkspace`.
message TrackFinanceWorkspaceRequest {
  // What the operation needs besides the record.
  message Details {
    string device = 1;
    string locale = 2;
    acme.common.v1.GeoPoint location = 3;
    map<string, string> client_hints = 4;
    string session_id = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string finance_workspace_id = 2;
  FinanceWorkspace finance_workspace = 3;
  TrackFinanceWorkspaceRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `TrackFinanceWorkspace`.
message TrackFinanceWorkspaceResponse {
  FinanceWorkspace finance_workspace = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `StreamFinanceWorkspaceUpdates`.
message StreamFinanceWorkspaceUpdatesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FinanceWorkspaceStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamFinanceWorkspaceUpdatesRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamFinanceWorkspaceUpdates`.
message StreamFinanceWorkspaceUpdatesResponse {
  FinanceWorkspace finance_workspace = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `UploadFinanceWorkspaceAttachments`.
message UploadFinanceWorkspaceAttachmentsRequest {
  // What a stream of records starts with.
  message StreamHeader {
    string source = 1;
    string format = 2;
    int64 total_records = 3;
    acme.common.v1.ContactInfo submitted_by = 4;
  }

  acme.common.v1.RequestContext context = 1;
  oneof chunk {
    UploadFinanceWorkspaceAttachmentsRequest.StreamHeader header = 2;
    FinanceWorkspace record = 3;
  }
  int64 sequence = 4;
}

// The response of `UploadFinanceWorkspaceAttachments`.
message UploadFinanceWorkspaceAttachmentsResponse {
  // A record the import turned down.
  message Rejection {
    int64 sequence = 1;
    string reason = 2;
    string finance_workspace_id = 3;
  }

  int64 accepted = 1;
  int64 rejected = 2;
  repeated UploadFinanceWorkspaceAttachmentsResponse.Rejection rejections = 3;
  acme.common.v1.OperationResult result = 4;
}

// The request of `SearchFinanceWorkspaceCatalog`.
message SearchFinanceWorkspaceCatalogRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated FinanceWorkspaceStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SearchFinanceWorkspaceCatalogRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SearchFinanceWorkspaceCatalog`.
message SearchFinanceWorkspaceCatalogResponse {
  repeated FinanceWorkspace finance_workspaces = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetFinanceWorkspaceSummary`.
message GetFinanceWorkspaceSummaryRequest {
  acme.common.v1.RequestContext context = 1;
  string finance_workspace_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetFinanceWorkspaceSummary`.
message GetFinanceWorkspaceSummaryResponse {
  FinanceWorkspace finance_workspace = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `StartFinanceWorkspaceCheckout`.
message StartFinanceWorkspaceCheckoutRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string finance_workspace_id = 2;
  FinanceWorkspace finance_workspace = 3;
  StartFinanceWorkspaceCheckoutRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartFinanceWorkspaceCheckout`.
message StartFinanceWorkspaceCheckoutResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  FinanceWorkspace finance_workspace = 1;
  StartFinanceWorkspaceCheckoutResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}
