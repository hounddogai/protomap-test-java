syntax = "proto3";

package acme.risk.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/risk/v1/risk.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Risk.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/risk/v1;riskv1";
option java_multiple_files = true;
option java_outer_classname = "RiskRegisterApprovalServiceProto";
option java_package = "com.acme.risk.v1";

// Routes risk registers through approval, with escalation and delegation.
service RiskRegisterApprovalService {
  // Submits a risk register.
  rpc SubmitRiskRegister(SubmitRiskRegisterRequest) returns (SubmitRiskRegisterResponse);

  // Approves a risk register.
  rpc ApproveRiskRegister(ApproveRiskRegisterRequest) returns (ApproveRiskRegisterResponse);

  // Rejects a risk register.
  rpc RejectRiskRegister(RejectRiskRegisterRequest) returns (RejectRiskRegisterResponse);

  // Escalates a risk register.
  rpc EscalateRiskRegister(EscalateRiskRegisterRequest) returns (EscalateRiskRegisterResponse);

  // Lists risk registers a page at a time.
  rpc ListPendingRiskRegisters(ListPendingRiskRegistersRequest) returns (ListPendingRiskRegistersResponse);

  // Delegates a risk register.
  rpc DelegateRiskRegisterApproval(DelegateRiskRegisterApprovalRequest) returns (DelegateRiskRegisterApprovalResponse);

  // Recalls a risk register.
  rpc RecallRiskRegister(RecallRiskRegisterRequest) returns (RecallRiskRegisterResponse);

  // Returns a risk register.
  rpc GetRiskRegisterApprovalStatus(GetRiskRegisterApprovalStatusRequest) returns (GetRiskRegisterApprovalStatusResponse);

  // Comments a risk register.
  rpc CommentRiskRegisterApproval(CommentRiskRegisterApprovalRequest) returns (CommentRiskRegisterApprovalResponse);
}

// The request of `SubmitRiskRegister`.
message SubmitRiskRegisterRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string risk_register_id = 2;
  RiskRegister risk_register = 3;
  SubmitRiskRegisterRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitRiskRegister`.
message SubmitRiskRegisterResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  RiskRegister risk_register = 1;
  SubmitRiskRegisterResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

