syntax = "proto3";

package acme.risk.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/risk/v1/risk.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Risk.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/risk/v1;riskv1";
option java_multiple_files = true;
option java_outer_classname = "ExposureWorkflowServiceProto";
option java_package = "com.acme.risk.v1";

// Runs the long-lived workflow that takes an exposure from start to finish.
service ExposureWorkflowService {
  // Starts an exposure.
  rpc StartExposureWorkflow(StartExposureWorkflowRequest) returns (StartExposureWorkflowResponse);

  // Advances an exposure.
  rpc AdvanceExposureWorkflow(AdvanceExposureWorkflowRequest) returns (AdvanceExposureWorkflowResponse);

  // Cancels an exposure.
  rpc CancelExposureWorkflow(CancelExposureWorkflowRequest) returns (CancelExposureWorkflowResponse);

  // Pauses an exposure.
  rpc PauseExposureWorkflow(PauseExposureWorkflowRequest) returns (PauseExposureWorkflowResponse);

  // Resumes an exposure.
  rpc ResumeExposureWorkflow(ResumeExposureWorkflowRequest) returns (ResumeExposureWorkflowResponse);

  // Returns an exposure.
  rpc InspectExposureWorkflow(InspectExposureWorkflowRequest) returns (InspectExposureWorkflowResponse);

  // Signals an exposure.
  rpc SignalExposureWorkflow(SignalExposureWorkflowRequest) returns (SignalExposureWorkflowResponse);
}

// The request of `StartExposureWorkflow`.
message StartExposureWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string exposure_id = 2;
  Exposure exposure = 3;
  StartExposureWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartExposureWorkflow`.
message StartExposureWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Exposure exposure = 1;
  StartExposureWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

