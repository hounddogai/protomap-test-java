syntax = "proto3";

package acme.risk.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/risk/v1/risk.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Risk.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/risk/v1;riskv1";
option java_multiple_files = true;
option java_outer_classname = "RiskRegisterValidationServiceProto";
option java_package = "com.acme.risk.v1";

// Checks risk registers against the rules before anything acts on them.
service RiskRegisterValidationService {
  // Validates a risk register.
  rpc ValidateRiskRegister(ValidateRiskRegisterRequest) returns (ValidateRiskRegisterResponse);

  // Previews a risk register.
  rpc PreviewRiskRegister(PreviewRiskRegisterRequest) returns (PreviewRiskRegisterResponse);

  // Checks a risk register.
  rpc CheckRiskRegisterEligibility(CheckRiskRegisterEligibilityRequest) returns (CheckRiskRegisterEligibilityResponse);

  // Normalizes a risk register.
  rpc NormalizeRiskRegister(NormalizeRiskRegisterRequest) returns (NormalizeRiskRegisterResponse);

  // Explains a risk register.
  rpc ExplainRiskRegisterDecision(ExplainRiskRegisterDecisionRequest) returns (ExplainRiskRegisterDecisionResponse);

  // Scores a risk register.
  rpc ScoreRiskRegister(ScoreRiskRegisterRequest) returns (ScoreRiskRegisterResponse);

  // Lints a risk register.
  rpc LintRiskRegisters(LintRiskRegistersRequest) returns (LintRiskRegistersResponse);

  // Returns a risk register.
  rpc GetRiskRegisterRules(GetRiskRegisterRulesRequest) returns (GetRiskRegisterRulesResponse);
}

// The request of `ValidateRiskRegister`.
message ValidateRiskRegisterRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string risk_register_id = 2;
  RiskRegister risk_register = 3;
  ValidateRiskRegisterRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateRiskRegister`.
message ValidateRiskRegisterResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  RiskRegister risk_register = 1;
  ValidateRiskRegisterResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

