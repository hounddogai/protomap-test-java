syntax = "proto3";

package acme.risk.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/risk/v1/risk.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Risk.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/risk/v1;riskv1";
option java_multiple_files = true;
option java_outer_classname = "StressTestValidationServiceProto";
option java_package = "com.acme.risk.v1";

// Checks stress tests against the rules before anything acts on them.
service StressTestValidationService {
  // Validates a stress test.
  rpc ValidateStressTest(ValidateStressTestRequest) returns (ValidateStressTestResponse);

  // Previews a stress test.
  rpc PreviewStressTest(PreviewStressTestRequest) returns (PreviewStressTestResponse);

  // Checks a stress test.
  rpc CheckStressTestEligibility(CheckStressTestEligibilityRequest) returns (CheckStressTestEligibilityResponse);

  // Normalizes a stress test.
  rpc NormalizeStressTest(NormalizeStressTestRequest) returns (NormalizeStressTestResponse);

  // Explains a stress test.
  rpc ExplainStressTestDecision(ExplainStressTestDecisionRequest) returns (ExplainStressTestDecisionResponse);

  // Scores a stress test.
  rpc ScoreStressTest(ScoreStressTestRequest) returns (ScoreStressTestResponse);

  // Lints a stress test.
  rpc LintStressTests(LintStressTestsRequest) returns (LintStressTestsResponse);
}

// The request of `ValidateStressTest`.
message ValidateStressTestRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string stress_test_id = 2;
  StressTest stress_test = 3;
  ValidateStressTestRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateStressTest`.
message ValidateStressTestResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  StressTest stress_test = 1;
  ValidateStressTestResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

