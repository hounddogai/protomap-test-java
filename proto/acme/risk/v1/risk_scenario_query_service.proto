syntax = "proto3";

package acme.risk.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/risk/v1/risk.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Risk.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/risk/v1;riskv1";
option java_multiple_files = true;
option java_outer_classname = "RiskScenarioQueryServiceProto";
option java_package = "com.acme.risk.v1";

// Answers read-only questions about risk scenarios, for screens and reports.
service RiskScenarioQueryService {
  // Returns a risk scenario.
  rpc LookupRiskScenario(LookupRiskScenarioRequest) returns (LookupRiskScenarioResponse);

  // Lists risk scenarios a page at a time.
  rpc BrowseRiskScenarios(BrowseRiskScenariosRequest) returns (BrowseRiskScenariosResponse);

  // Counts risk scenarios by status.
  rpc CountRiskScenarios(CountRiskScenariosRequest) returns (CountRiskScenariosResponse);

  // Returns several risk scenarios at once.
  rpc ResolveRiskScenarios(ResolveRiskScenariosRequest) returns (ResolveRiskScenariosResponse);

  // Summarizes a risk scenario.
  rpc SummarizeRiskScenarios(SummarizeRiskScenariosRequest) returns (SummarizeRiskScenariosResponse);

  // Returns a risk scenario.
  rpc PeekRiskScenario(PeekRiskScenarioRequest) returns (PeekRiskScenarioResponse);
}

// The request of `LookupRiskScenario`.
message LookupRiskScenarioRequest {
  acme.common.v1.RequestContext context = 1;
  string risk_scenario_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupRiskScenario`.
message LookupRiskScenarioResponse {
  RiskScenario risk_scenario = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseRiskScenarios`.
message BrowseRiskScenariosRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RiskScenarioStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseRiskScenariosRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseRiskScenarios`.
message BrowseRiskScenariosResponse {
  repeated RiskScenario risk_scenarios = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountRiskScenarios`.
message CountRiskScenariosRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RiskScenarioStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountRiskScenariosRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountRiskScenarios`.
message CountRiskScenariosResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveRiskScenarios`.
message ResolveRiskScenariosRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string risk_scenario_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveRiskScenarios`.
message ResolveRiskScenariosResponse {
  repeated RiskScenario risk_scenarios = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SummarizeRiskScenarios`.
message SummarizeRiskScenariosRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string risk_scenario_id = 2;
  SummarizeRiskScenariosRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeRiskScenarios`.
message SummarizeRiskScenariosResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `PeekRiskScenario`.
message PeekRiskScenarioRequest {
  acme.common.v1.RequestContext context = 1;
  string risk_scenario_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekRiskScenario`.
message PeekRiskScenarioResponse {
  RiskScenario risk_scenario = 1;
  acme.common.v1.OperationResult result = 2;
}
