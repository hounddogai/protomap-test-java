syntax = "proto3";

package acme.risk.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/risk/v1/risk.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Risk.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/risk/v1;riskv1";
option java_multiple_files = true;
option java_outer_classname = "RiskScenarioApprovalServiceProto";
option java_package = "com.acme.risk.v1";

// Routes risk scenarios through approval, with escalation and delegation.
service RiskScenarioApprovalService {
  // Submits a risk scenario.
  rpc SubmitRiskScenario(SubmitRiskScenarioRequest) returns (SubmitRiskScenarioResponse);

  // Approves a risk scenario.
  rpc ApproveRiskScenario(ApproveRiskScenarioRequest) returns (ApproveRiskScenarioResponse);

  // Rejects a risk scenario.
  rpc RejectRiskScenario(RejectRiskScenarioRequest) returns (RejectRiskScenarioResponse);

  // Escalates a risk scenario.
  rpc EscalateRiskScenario(EscalateRiskScenarioRequest) returns (EscalateRiskScenarioResponse);

  // Lists risk scenarios a page at a time.
  rpc ListPendingRiskScenarios(ListPendingRiskScenariosRequest) returns (ListPendingRiskScenariosResponse);

  // Delegates a risk scenario.
  rpc DelegateRiskScenarioApproval(DelegateRiskScenarioApprovalRequest) returns (DelegateRiskScenarioApprovalResponse);

  // Recalls a risk scenario.
  rpc RecallRiskScenario(RecallRiskScenarioRequest) returns (RecallRiskScenarioResponse);

  // Comments a risk scenario.
  rpc CommentRiskScenarioApproval(CommentRiskScenarioApprovalRequest) returns (CommentRiskScenarioApprovalResponse);
}

// The request of `SubmitRiskScenario`.
message SubmitRiskScenarioRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string risk_scenario_id = 2;
  RiskScenario risk_scenario = 3;
  SubmitRiskScenarioRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitRiskScenario`.
message SubmitRiskScenarioResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  RiskScenario risk_scenario = 1;
  SubmitRiskScenarioResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

