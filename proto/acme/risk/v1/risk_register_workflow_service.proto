option csharp_namespace = "Acme.Risk.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/risk/v1;riskv1";
option java_multiple_files = true;
option java_outer_classname = "RiskRegisterWorkflowServiceProto";
option java_package = "com.acme.risk.v1";

// Runs the long-lived workflow that takes a risk register from start to finish.
service RiskRegisterWorkflowService {
  // Starts a risk register.
  rpc StartRiskRegisterWorkflow(StartRiskRegisterWorkflowRequest) returns (StartRiskRegisterWorkflowResponse);

  // Advances a risk register.
  rpc AdvanceRiskRegisterWorkflow(AdvanceRiskRegisterWorkflowRequest) returns (AdvanceRiskRegisterWorkflowResponse);

  // Cancels a risk register.
  rpc CancelRiskRegisterWorkflow(CancelRiskRegisterWorkflowRequest) returns (CancelRiskRegisterWorkflowResponse);

  // Retrys a risk register.
  rpc RetryRiskRegisterWorkflow(RetryRiskRegisterWorkflowRequest) returns (RetryRiskRegisterWorkflowResponse);

  // Pauses a risk register.
  rpc PauseRiskRegisterWorkflow(PauseRiskRegisterWorkflowRequest) returns (PauseRiskRegisterWorkflowResponse);

  // Resumes a risk register.
  rpc ResumeRiskRegisterWorkflow(ResumeRiskRegisterWorkflowRequest) returns (ResumeRiskRegisterWorkflowResponse);

  // Returns a risk register.
  rpc InspectRiskRegisterWorkflow(InspectRiskRegisterWorkflowRequest) returns (InspectRiskRegisterWorkflowResponse);

  // Signals a risk register.
  rpc SignalRiskRegisterWorkflow(SignalRiskRegisterWorkflowRequest) returns (SignalRiskRegisterWorkflowResponse);
}

// The request of `StartRiskRegisterWorkflow`.
message StartRiskRegisterWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string risk_register_id = 2;
  RiskRegister risk_register = 3;
  StartRiskRegisterWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartRiskRegisterWorkflow`.
message StartRiskRegisterWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  RiskRegister risk_register = 1;
  StartRiskRegisterWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

