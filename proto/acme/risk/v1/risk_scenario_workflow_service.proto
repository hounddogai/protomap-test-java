syntax = "proto3";

package acme.risk.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/risk/v1/risk.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Risk.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/risk/v1;riskv1";
option java_multiple_files = true;
option java_outer_classname = "RiskScenarioWorkflowServiceProto";
option java_package = "com.acme.risk.v1";

// Runs the long-lived workflow that takes a risk scenario from start to finish.
service RiskScenarioWorkflowService {
  // Starts a risk scenario.
  rpc StartRiskScenarioWorkflow(StartRiskScenarioWorkflowRequest) returns (StartRiskScenarioWorkflowResponse);

  // Advances a risk scenario.
  rpc AdvanceRiskScenarioWorkflow(AdvanceRiskScenarioWorkflowRequest) returns (AdvanceRiskScenarioWorkflowResponse);

  // Cancels a risk scenario.
  rpc CancelRiskScenarioWorkflow(CancelRiskScenarioWorkflowRequest) returns (CancelRiskScenarioWorkflowResponse);

  // Retrys a risk scenario.
  rpc RetryRiskScenarioWorkflow(RetryRiskScenarioWorkflowRequest) returns (RetryRiskScenarioWorkflowResponse);

  // Returns a risk scenario.
  rpc InspectRiskScenarioWorkflow(InspectRiskScenarioWorkflowRequest) returns (InspectRiskScenarioWorkflowResponse);

  // Lists risk scenarios a page at a time.
  rpc ListRiskScenarioWorkflows(ListRiskScenarioWorkflowsRequest) returns (ListRiskScenarioWorkflowsResponse);

  // Signals a risk scenario.
  rpc SignalRiskScenarioWorkflow(SignalRiskScenarioWorkflowRequest) returns (SignalRiskScenarioWorkflowResponse);
}

// The request of `StartRiskScenarioWorkflow`.
message StartRiskScenarioWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string risk_scenario_id = 2;
  RiskScenario risk_scenario = 3;
  StartRiskScenarioWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartRiskScenarioWorkflow`.
message StartRiskScenarioWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  RiskScenario risk_scenario = 1;
  StartRiskScenarioWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

