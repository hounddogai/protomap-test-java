// The request of `ExplainStressTestCalculation`.
message ExplainStressTestCalculationRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string stress_test_id = 2;
  StressTest stress_test = 3;
  ExplainStressTestCalculationRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ExplainStressTestCalculation`.
message ExplainStressTestCalculationResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  StressTest stress_test = 1;
  ExplainStressTestCalculationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetStressTestRates`.
message GetStressTestRatesRequest {
