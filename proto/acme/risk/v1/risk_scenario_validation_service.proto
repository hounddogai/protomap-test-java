syntax = "proto3";

package acme.risk.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/risk/v1/risk.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Risk.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/risk/v1;riskv1";
option java_multiple_files = true;
option java_outer_classname = "RiskScenarioValidationServiceProto";
option java_package = "com.acme.risk.v1";

// Checks risk scenarios against the rules before anything acts on them.
service RiskScenarioValidationService {
  // Validates a risk scenario.
  rpc ValidateRiskScenario(ValidateRiskScenarioRequest) returns (ValidateRiskScenarioResponse);

  // Previews a risk scenario.
  rpc PreviewRiskScenario(PreviewRiskScenarioRequest) returns (PreviewRiskScenarioResponse);

  // Checks a risk scenario.
  rpc CheckRiskScenarioEligibility(CheckRiskScenarioEligibilityRequest) returns (CheckRiskScenarioEligibilityResponse);

  // Normalizes a risk scenario.
  rpc NormalizeRiskScenario(NormalizeRiskScenarioRequest) returns (NormalizeRiskScenarioResponse);

  // Explains a risk scenario.
  rpc ExplainRiskScenarioDecision(ExplainRiskScenarioDecisionRequest) returns (ExplainRiskScenarioDecisionResponse);

  // Scores a risk scenario.
  rpc ScoreRiskScenario(ScoreRiskScenarioRequest) returns (ScoreRiskScenarioResponse);

  // Lints a risk scenario.
  rpc LintRiskScenarios(LintRiskScenariosRequest) returns (LintRiskScenariosResponse);

  // Returns a risk scenario.
  rpc GetRiskScenarioRules(GetRiskScenarioRulesRequest) returns (GetRiskScenarioRulesResponse);
}

// The request of `ValidateRiskScenario`.
message ValidateRiskScenarioRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string risk_scenario_id = 2;
  RiskScenario risk_scenario = 3;
  ValidateRiskScenarioRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateRiskScenario`.
message ValidateRiskScenarioResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  RiskScenario risk_scenario = 1;
  ValidateRiskScenarioResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

