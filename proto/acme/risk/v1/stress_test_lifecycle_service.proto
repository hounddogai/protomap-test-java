syntax = "proto3";

package acme.risk.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/risk/v1/risk.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Risk.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/risk/v1;riskv1";
option java_multiple_files = true;
option java_outer_classname = "StressTestLifecycleServiceProto";
option java_package = "com.acme.risk.v1";

// Moves a stress test between the states of its lifecycle.
service StressTestLifecycleService {
  // Activates a stress test.
  rpc ActivateStressTest(ActivateStressTestRequest) returns (ActivateStressTestResponse);

  // Suspends a stress test.
  rpc SuspendStressTest(SuspendStressTestRequest) returns (SuspendStressTestResponse);

  // Reinstates a stress test.
  rpc ReinstateStressTest(ReinstateStressTestRequest) returns (ReinstateStressTestResponse);

  // Terminates a stress test.
  rpc TerminateStressTest(TerminateStressTestRequest) returns (TerminateStressTestResponse);

  // Expires a stress test.
  rpc ExpireStressTest(ExpireStressTestRequest) returns (ExpireStressTestResponse);

  // Schedules a stress test.
  rpc ScheduleStressTestExpiry(ScheduleStressTestExpiryRequest) returns (ScheduleStressTestExpiryResponse);
}

// The request of `ActivateStressTest`.
message ActivateStressTestRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string stress_test_id = 2;
  ActivateStressTestRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateStressTest`.
message ActivateStressTestResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  StressTest stress_test = 1;
  ActivateStressTestResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

