syntax = "proto3";

package acme.risk.v1;

option csharp_namespace = "Acme.Risk.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/risk/v1;riskv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.risk.v1";

// A reference to a risk register of the risk domain.
message RiskRegisterRef {
  string risk_register_id = 1;
  string display_name = 2;
  string path = 3;
}

// A reference to a risk scenario of the risk domain.
message RiskScenarioRef {
  string risk_scenario_id = 1;
  string display_name = 2;
  int32 priority = 3;
}

// A reference to an exposure of the risk domain.
message ExposureRef {
  string exposure_id = 1;
  string display_name = 2;
  string currency_code = 3;
}

// A reference to a stress test of the risk domain.
message StressTestRef {
  string stress_test_id = 1;
  string display_name = 2;
  string number = 3;
}
