syntax = "proto3";

package acme.accounting.v1;

import "acme/accounting/v1/accounting.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Accounting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/accounting/v1;accountingv1";
option java_multiple_files = true;
option java_outer_classname = "AllocationValidationServiceProto";
option java_package = "com.acme.accounting.v1";

// Checks allocations against the rules before anything acts on them.
service AllocationValidationService {
  // Validates an allocation.
  rpc ValidateAllocation(ValidateAllocationRequest) returns (ValidateAllocationResponse);

  // Previews an allocation.
  rpc PreviewAllocation(PreviewAllocationRequest) returns (PreviewAllocationResponse);

  // Normalizes an allocation.
  rpc NormalizeAllocation(NormalizeAllocationRequest) returns (NormalizeAllocationResponse);

  // Explains an allocation.
  rpc ExplainAllocationDecision(ExplainAllocationDecisionRequest) returns (ExplainAllocationDecisionResponse);

  // Scores an allocation.
  rpc ScoreAllocation(ScoreAllocationRequest) returns (ScoreAllocationResponse);

  // Lints an allocation.
  rpc LintAllocations(LintAllocationsRequest) returns (LintAllocationsResponse);

  // Returns an allocation.
  rpc GetAllocationRules(GetAllocationRulesRequest) returns (GetAllocationRulesResponse);
}

// The request of `ValidateAllocation`.
message ValidateAllocationRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string allocation_id = 2;
  Allocation allocation = 3;
  ValidateAllocationRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateAllocation`.
message ValidateAllocationResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Allocation allocation = 1;
  ValidateAllocationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

