option csharp_namespace = "Acme.Accounting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/accounting/v1;accountingv1";
option java_multiple_files = true;
option java_outer_classname = "ChartOfAccountsWorkflowServiceProto";
option java_package = "com.acme.accounting.v1";

// Runs the long-lived workflow that takes a chart of accounts from start to finish.
service ChartOfAccountsWorkflowService {
  // Starts a chart of accounts.
  rpc StartChartOfAccountsWorkflow(StartChartOfAccountsWorkflowRequest) returns (StartChartOfAccountsWorkflowResponse);

  // Advances a chart of accounts.
  rpc AdvanceChartOfAccountsWorkflow(AdvanceChartOfAccountsWorkflowRequest) returns (AdvanceChartOfAccountsWorkflowResponse);

  // Cancels a chart of accounts.
  rpc CancelChartOfAccountsWorkflow(CancelChartOfAccountsWorkflowRequest) returns (CancelChartOfAccountsWorkflowResponse);

  // Retrys a chart of accounts.
  rpc RetryChartOfAccountsWorkflow(RetryChartOfAccountsWorkflowRequest) returns (RetryChartOfAccountsWorkflowResponse);

  // Pauses a chart of accounts.
  rpc PauseChartOfAccountsWorkflow(PauseChartOfAccountsWorkflowRequest) returns (PauseChartOfAccountsWorkflowResponse);

  // Resumes a chart of accounts.
  rpc ResumeChartOfAccountsWorkflow(ResumeChartOfAccountsWorkflowRequest) returns (ResumeChartOfAccountsWorkflowResponse);

  // Returns a chart of accounts.
  rpc InspectChartOfAccountsWorkflow(InspectChartOfAccountsWorkflowRequest) returns (InspectChartOfAccountsWorkflowResponse);

  // Lists chart of accountses a page at a time.
  rpc ListChartOfAccountsWorkflows(ListChartOfAccountsWorkflowsRequest) returns (ListChartOfAccountsWorkflowsResponse);

  // Signals a chart of accounts.
  rpc SignalChartOfAccountsWorkflow(SignalChartOfAccountsWorkflowRequest) returns (SignalChartOfAccountsWorkflowResponse);
}

// The request of `StartChartOfAccountsWorkflow`.
message StartChartOfAccountsWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string chart_of_accounts_id = 2;
  ChartOfAccounts chart_of_accounts = 3;
  StartChartOfAccountsWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartChartOfAccountsWorkflow`.
message StartChartOfAccountsWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ChartOfAccounts chart_of_accounts = 1;
  StartChartOfAccountsWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

