syntax = "proto3";

package acme.accounting.v1;

import "acme/accounting/v1/accounting.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Accounting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/accounting/v1;accountingv1";
option java_multiple_files = true;
option java_outer_classname = "ReconciliationValidationServiceProto";
option java_package = "com.acme.accounting.v1";

// Checks reconciliations against the rules before anything acts on them.
service ReconciliationValidationService {
  // Validates a reconciliation.
  rpc ValidateReconciliation(ValidateReconciliationRequest) returns (ValidateReconciliationResponse);

  // Previews a reconciliation.
  rpc PreviewReconciliation(PreviewReconciliationRequest) returns (PreviewReconciliationResponse);

  // Checks a reconciliation.
  rpc CheckReconciliationEligibility(CheckReconciliationEligibilityRequest) returns (CheckReconciliationEligibilityResponse);

  // Normalizes a reconciliation.
  rpc NormalizeReconciliation(NormalizeReconciliationRequest) returns (NormalizeReconciliationResponse);

  // Explains a reconciliation.
  rpc ExplainReconciliationDecision(ExplainReconciliationDecisionRequest) returns (ExplainReconciliationDecisionResponse);

  // Scores a reconciliation.
  rpc ScoreReconciliation(ScoreReconciliationRequest) returns (ScoreReconciliationResponse);

  // Lints a reconciliation.
  rpc LintReconciliations(LintReconciliationsRequest) returns (LintReconciliationsResponse);

  // Returns a reconciliation.
  rpc GetReconciliationRules(GetReconciliationRulesRequest) returns (GetReconciliationRulesResponse);
}

// The request of `ValidateReconciliation`.
message ValidateReconciliationRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string reconciliation_id = 2;
  Reconciliation reconciliation = 3;
  ValidateReconciliationRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateReconciliation`.
message ValidateReconciliationResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Reconciliation reconciliation = 1;
  ValidateReconciliationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

