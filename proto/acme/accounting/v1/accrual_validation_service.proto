syntax = "proto3";

package acme.accounting.v1;

import "acme/accounting/v1/accounting.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Accounting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/accounting/v1;accountingv1";
option java_multiple_files = true;
option java_outer_classname = "AccrualValidationServiceProto";
option java_package = "com.acme.accounting.v1";

// Checks accruals against the rules before anything acts on them.
service AccrualValidationService {
  // Validates an accrual.
  rpc ValidateAccrual(ValidateAccrualRequest) returns (ValidateAccrualResponse);

  // Previews an accrual.
  rpc PreviewAccrual(PreviewAccrualRequest) returns (PreviewAccrualResponse);

  // Checks an accrual.
  rpc CheckAccrualEligibility(CheckAccrualEligibilityRequest) returns (CheckAccrualEligibilityResponse);

  // Normalizes an accrual.
  rpc NormalizeAccrual(NormalizeAccrualRequest) returns (NormalizeAccrualResponse);

  // Explains an accrual.
  rpc ExplainAccrualDecision(ExplainAccrualDecisionRequest) returns (ExplainAccrualDecisionResponse);

  // Scores an accrual.
  rpc ScoreAccrual(ScoreAccrualRequest) returns (ScoreAccrualResponse);

  // Lints an accrual.
  rpc LintAccruals(LintAccrualsRequest) returns (LintAccrualsResponse);

  // Returns an accrual.
  rpc GetAccrualRules(GetAccrualRulesRequest) returns (GetAccrualRulesResponse);
}

// The request of `ValidateAccrual`.
message ValidateAccrualRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string accrual_id = 2;
  Accrual accrual = 3;
  ValidateAccrualRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateAccrual`.
message ValidateAccrualResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Accrual accrual = 1;
  ValidateAccrualResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

