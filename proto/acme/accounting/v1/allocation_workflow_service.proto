option csharp_namespace = "Acme.Accounting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/accounting/v1;accountingv1";
option java_multiple_files = true;
option java_outer_classname = "AllocationWorkflowServiceProto";
option java_package = "com.acme.accounting.v1";

// Runs the long-lived workflow that takes an allocation from start to finish.
service AllocationWorkflowService {
  // Starts an allocation.
  rpc StartAllocationWorkflow(StartAllocationWorkflowRequest) returns (StartAllocationWorkflowResponse);

  // Advances an allocation.
  rpc AdvanceAllocationWorkflow(AdvanceAllocationWorkflowRequest) returns (AdvanceAllocationWorkflowResponse);

  // Cancels an allocation.
  rpc CancelAllocationWorkflow(CancelAllocationWorkflowRequest) returns (CancelAllocationWorkflowResponse);

  // Retrys an allocation.
  rpc RetryAllocationWorkflow(RetryAllocationWorkflowRequest) returns (RetryAllocationWorkflowResponse);

  // Pauses an allocation.
  rpc PauseAllocationWorkflow(PauseAllocationWorkflowRequest) returns (PauseAllocationWorkflowResponse);

  // Resumes an allocation.
  rpc ResumeAllocationWorkflow(ResumeAllocationWorkflowRequest) returns (ResumeAllocationWorkflowResponse);

  // Returns an allocation.
  rpc InspectAllocationWorkflow(InspectAllocationWorkflowRequest) returns (InspectAllocationWorkflowResponse);

  // Lists allocations a page at a time.
  rpc ListAllocationWorkflows(ListAllocationWorkflowsRequest) returns (ListAllocationWorkflowsResponse);

  // Signals an allocation.
  rpc SignalAllocationWorkflow(SignalAllocationWorkflowRequest) returns (SignalAllocationWorkflowResponse);
}

// The request of `StartAllocationWorkflow`.
message StartAllocationWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string allocation_id = 2;
  Allocation allocation = 3;
  StartAllocationWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartAllocationWorkflow`.
message StartAllocationWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Allocation allocation = 1;
  StartAllocationWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

