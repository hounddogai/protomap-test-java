syntax = "proto3";

package acme.accounting.v1;

import "acme/accounting/v1/accounting.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Accounting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/accounting/v1;accountingv1";
option java_multiple_files = true;
option java_outer_classname = "AllocationApprovalServiceProto";
option java_package = "com.acme.accounting.v1";

// Routes allocations through approval, with escalation and delegation.
service AllocationApprovalService {
  // Submits an allocation.
  rpc SubmitAllocation(SubmitAllocationRequest) returns (SubmitAllocationResponse);

  // Approves an allocation.
  rpc ApproveAllocation(ApproveAllocationRequest) returns (ApproveAllocationResponse);

  // Lists allocations a page at a time.
  rpc ListPendingAllocations(ListPendingAllocationsRequest) returns (ListPendingAllocationsResponse);

  // Delegates an allocation.
  rpc DelegateAllocationApproval(DelegateAllocationApprovalRequest) returns (DelegateAllocationApprovalResponse);

  // Recalls an allocation.
  rpc RecallAllocation(RecallAllocationRequest) returns (RecallAllocationResponse);

  // Returns an allocation.
  rpc GetAllocationApprovalStatus(GetAllocationApprovalStatusRequest) returns (GetAllocationApprovalStatusResponse);

  // Comments an allocation.
  rpc CommentAllocationApproval(CommentAllocationApprovalRequest) returns (CommentAllocationApprovalResponse);
}

// The request of `SubmitAllocation`.
message SubmitAllocationRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string allocation_id = 2;
  Allocation allocation = 3;
  SubmitAllocationRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitAllocation`.
message SubmitAllocationResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Allocation allocation = 1;
  SubmitAllocationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ApproveAllocation`.
message ApproveAllocationRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
