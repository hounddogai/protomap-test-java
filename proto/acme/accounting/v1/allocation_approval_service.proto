  acme.common.v1.RequestContext context = 1;
  string allocation_id = 2;
  Allocation allocation = 3;
  ApproveAllocationRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ApproveAllocation`.
message ApproveAllocationResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Allocation allocation = 1;
  ApproveAllocationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListPendingAllocations`.
message ListPendingAllocationsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated AllocationStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListPendingAllocationsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListPendingAllocations`.
message ListPendingAllocationsResponse {
  repeated Allocation allocations = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

