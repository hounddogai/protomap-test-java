// The request of `GetAllocationApprovalStatus`.
message GetAllocationApprovalStatusRequest {
  acme.common.v1.RequestContext context = 1;
  string allocation_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetAllocationApprovalStatus`.
message GetAllocationApprovalStatusResponse {
