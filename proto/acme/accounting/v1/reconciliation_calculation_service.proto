syntax = "proto3";

package acme.accounting.v1;

import "acme/accounting/v1/accounting.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Accounting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/accounting/v1;accountingv1";
option java_multiple_files = true;
option java_outer_classname = "ReconciliationCalculationServiceProto";
option java_package = "com.acme.accounting.v1";

// Computes the figures of a reconciliation, such as totals, taxes, and estimates.
service ReconciliationCalculationService {
  // Calculates a reconciliation.
  rpc CalculateReconciliation(CalculateReconciliationRequest) returns (CalculateReconciliationResponse);

  // Estimates a reconciliation.
  rpc EstimateReconciliation(EstimateReconciliationRequest) returns (EstimateReconciliationResponse);

  // Quotes a reconciliation.
  rpc QuoteReconciliation(QuoteReconciliationRequest) returns (QuoteReconciliationResponse);

  // Compares a reconciliation.
  rpc CompareReconciliationOptions(CompareReconciliationOptionsRequest) returns (CompareReconciliationOptionsResponse);

  // Recalculates a reconciliation.
  rpc RecalculateReconciliations(RecalculateReconciliationsRequest) returns (RecalculateReconciliationsResponse);

  // Simulates a reconciliation.
  rpc SimulateReconciliation(SimulateReconciliationRequest) returns (SimulateReconciliationResponse);

  // Explains a reconciliation.
  rpc ExplainReconciliationCalculation(ExplainReconciliationCalculationRequest) returns (ExplainReconciliationCalculationResponse);

  // Returns a reconciliation.
  rpc GetReconciliationRates(GetReconciliationRatesRequest) returns (GetReconciliationRatesResponse);
}

// The request of `CalculateReconciliation`.
message CalculateReconciliationRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string reconciliation_id = 2;
  Reconciliation reconciliation = 3;
  CalculateReconciliationRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateReconciliation`.
message CalculateReconciliationResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateReconciliationResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Reconciliation reconciliation = 1;
  CalculateReconciliationResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

