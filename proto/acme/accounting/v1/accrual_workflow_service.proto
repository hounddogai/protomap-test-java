syntax = "proto3";

package acme.accounting.v1;

import "acme/accounting/v1/accounting.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Accounting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/accounting/v1;accountingv1";
option java_multiple_files = true;
option java_outer_classname = "AccrualWorkflowServiceProto";
option java_package = "com.acme.accounting.v1";

// Runs the long-lived workflow that takes an accrual from start to finish.
service AccrualWorkflowService {
  // Starts an accrual.
  rpc StartAccrualWorkflow(StartAccrualWorkflowRequest) returns (StartAccrualWorkflowResponse);

  // Advances an accrual.
  rpc AdvanceAccrualWorkflow(AdvanceAccrualWorkflowRequest) returns (AdvanceAccrualWorkflowResponse);

  // Cancels an accrual.
  rpc CancelAccrualWorkflow(CancelAccrualWorkflowRequest) returns (CancelAccrualWorkflowResponse);

  // Retrys an accrual.
  rpc RetryAccrualWorkflow(RetryAccrualWorkflowRequest) returns (RetryAccrualWorkflowResponse);

  // Pauses an accrual.
  rpc PauseAccrualWorkflow(PauseAccrualWorkflowRequest) returns (PauseAccrualWorkflowResponse);

  // Resumes an accrual.
  rpc ResumeAccrualWorkflow(ResumeAccrualWorkflowRequest) returns (ResumeAccrualWorkflowResponse);

  // Returns an accrual.
  rpc InspectAccrualWorkflow(InspectAccrualWorkflowRequest) returns (InspectAccrualWorkflowResponse);

  // Lists accruals a page at a time.
  rpc ListAccrualWorkflows(ListAccrualWorkflowsRequest) returns (ListAccrualWorkflowsResponse);

  // Signals an accrual.
  rpc SignalAccrualWorkflow(SignalAccrualWorkflowRequest) returns (SignalAccrualWorkflowResponse);
}

// The request of `StartAccrualWorkflow`.
message StartAccrualWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string accrual_id = 2;
  Accrual accrual = 3;
  StartAccrualWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartAccrualWorkflow`.
message StartAccrualWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Accrual accrual = 1;
  StartAccrualWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

