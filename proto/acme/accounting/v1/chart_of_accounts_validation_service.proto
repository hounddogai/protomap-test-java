syntax = "proto3";

package acme.accounting.v1;

import "acme/accounting/v1/accounting.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Accounting.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/accounting/v1;accountingv1";
option java_multiple_files = true;
option java_outer_classname = "ChartOfAccountsValidationServiceProto";
option java_package = "com.acme.accounting.v1";

// Checks chart of accountses against the rules before anything acts on them.
service ChartOfAccountsValidationService {
  // Validates a chart of accounts.
  rpc ValidateChartOfAccounts(ValidateChartOfAccountsRequest) returns (ValidateChartOfAccountsResponse);

  // Previews a chart of accounts.
  rpc PreviewChartOfAccounts(PreviewChartOfAccountsRequest) returns (PreviewChartOfAccountsResponse);

  // Checks a chart of accounts.
  rpc CheckChartOfAccountsEligibility(CheckChartOfAccountsEligibilityRequest) returns (CheckChartOfAccountsEligibilityResponse);

  // Normalizes a chart of accounts.
  rpc NormalizeChartOfAccounts(NormalizeChartOfAccountsRequest) returns (NormalizeChartOfAccountsResponse);

  // Explains a chart of accounts.
  rpc ExplainChartOfAccountsDecision(ExplainChartOfAccountsDecisionRequest) returns (ExplainChartOfAccountsDecisionResponse);

  // Scores a chart of accounts.
  rpc ScoreChartOfAccounts(ScoreChartOfAccountsRequest) returns (ScoreChartOfAccountsResponse);

  // Lints a chart of accounts.
  rpc LintChartOfAccountses(LintChartOfAccountsesRequest) returns (LintChartOfAccountsesResponse);

  // Returns a chart of accounts.
  rpc GetChartOfAccountsRules(GetChartOfAccountsRulesRequest) returns (GetChartOfAccountsRulesResponse);
}

// The request of `ValidateChartOfAccounts`.
message ValidateChartOfAccountsRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string chart_of_accounts_id = 2;
  ChartOfAccounts chart_of_accounts = 3;
  ValidateChartOfAccountsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateChartOfAccounts`.
message ValidateChartOfAccountsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ChartOfAccounts chart_of_accounts = 1;
  ValidateChartOfAccountsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

