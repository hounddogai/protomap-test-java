syntax = "proto3";

package acme.procurement.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/procurement/v1/procurement.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Procurement.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/procurement/v1;procurementv1";
option java_multiple_files = true;
option java_outer_classname = "RfqApprovalServiceProto";
option java_package = "com.acme.procurement.v1";

// Routes rfqs through approval, with escalation and delegation.
service RfqApprovalService {
  // Submits a rfq.
  rpc SubmitRfq(SubmitRfqRequest) returns (SubmitRfqResponse);

  // Approves a rfq.
  rpc ApproveRfq(ApproveRfqRequest) returns (ApproveRfqResponse);

  // Rejects a rfq.
  rpc RejectRfq(RejectRfqRequest) returns (RejectRfqResponse);

  // Escalates a rfq.
  rpc EscalateRfq(EscalateRfqRequest) returns (EscalateRfqResponse);

  // Lists rfqs a page at a time.
  rpc ListPendingRfqs(ListPendingRfqsRequest) returns (ListPendingRfqsResponse);

  // Delegates a rfq.
  rpc DelegateRfqApproval(DelegateRfqApprovalRequest) returns (DelegateRfqApprovalResponse);

  // Recalls a rfq.
  rpc RecallRfq(RecallRfqRequest) returns (RecallRfqResponse);

  // Returns a rfq.
  rpc GetRfqApprovalStatus(GetRfqApprovalStatusRequest) returns (GetRfqApprovalStatusResponse);

  // Comments a rfq.
  rpc CommentRfqApproval(CommentRfqApprovalRequest) returns (CommentRfqApprovalResponse);
}

// The request of `SubmitRfq`.
message SubmitRfqRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string rfq_id = 2;
  Rfq rfq = 3;
  SubmitRfqRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitRfq`.
message SubmitRfqResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Rfq rfq = 1;
  SubmitRfqResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

