syntax = "proto3";

package acme.procurement.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/procurement/v1/procurement.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Procurement.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/procurement/v1;procurementv1";
option java_multiple_files = true;
option java_outer_classname = "PurchaseRequisitionValidationServiceProto";
option java_package = "com.acme.procurement.v1";

// Checks purchase requisitions against the rules before anything acts on them.
service PurchaseRequisitionValidationService {
  // Validates a purchase requisition.
  rpc ValidatePurchaseRequisition(ValidatePurchaseRequisitionRequest) returns (ValidatePurchaseRequisitionResponse);

  // Previews a purchase requisition.
  rpc PreviewPurchaseRequisition(PreviewPurchaseRequisitionRequest) returns (PreviewPurchaseRequisitionResponse);

  // Checks a purchase requisition.
  rpc CheckPurchaseRequisitionEligibility(CheckPurchaseRequisitionEligibilityRequest) returns (CheckPurchaseRequisitionEligibilityResponse);

  // Normalizes a purchase requisition.
  rpc NormalizePurchaseRequisition(NormalizePurchaseRequisitionRequest) returns (NormalizePurchaseRequisitionResponse);

  // Explains a purchase requisition.
  rpc ExplainPurchaseRequisitionDecision(ExplainPurchaseRequisitionDecisionRequest) returns (ExplainPurchaseRequisitionDecisionResponse);

  // Scores a purchase requisition.
  rpc ScorePurchaseRequisition(ScorePurchaseRequisitionRequest) returns (ScorePurchaseRequisitionResponse);

  // Lints a purchase requisition.
  rpc LintPurchaseRequisitions(LintPurchaseRequisitionsRequest) returns (LintPurchaseRequisitionsResponse);

  // Returns a purchase requisition.
  rpc GetPurchaseRequisitionRules(GetPurchaseRequisitionRulesRequest) returns (GetPurchaseRequisitionRulesResponse);
}

// The request of `ValidatePurchaseRequisition`.
message ValidatePurchaseRequisitionRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string purchase_requisition_id = 2;
  PurchaseRequisition purchase_requisition = 3;
  ValidatePurchaseRequisitionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidatePurchaseRequisition`.
message ValidatePurchaseRequisitionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PurchaseRequisition purchase_requisition = 1;
  ValidatePurchaseRequisitionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

