syntax = "proto3";

package acme.procurement.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/procurement/v1/procurement.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Procurement.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/procurement/v1;procurementv1";
option java_multiple_files = true;
option java_outer_classname = "RfqReportingServiceProto";
option java_package = "com.acme.procurement.v1";

// Builds and schedules reports about rfqs.
service RfqReportingService {
  // Generates a rfq.
  rpc GenerateRfqReport(GenerateRfqReportRequest) returns (GenerateRfqReportResponse);

  // Returns a rfq.
  rpc FetchRfqReport(FetchRfqReportRequest) returns (FetchRfqReportResponse);

  // Schedules a rfq.
  rpc ScheduleRfqReport(ScheduleRfqReportRequest) returns (ScheduleRfqReportResponse);

  // Streams the changes of rfqs as they happen.
  rpc StreamRfqMetrics(StreamRfqMetricsRequest) returns (stream StreamRfqMetricsResponse);

  // Lists rfqs a page at a time.
  rpc ListRfqReports(ListRfqReportsRequest) returns (ListRfqReportsResponse);

  // Counts rfqs by status.
  rpc CountRfqTotals(CountRfqTotalsRequest) returns (CountRfqTotalsResponse);

  // Deletes a rfq.
  rpc DeleteRfqReport(DeleteRfqReportRequest) returns (DeleteRfqReportResponse);
}

// The request of `GenerateRfqReport`.
message GenerateRfqReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string rfq_id = 2;
  GenerateRfqReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateRfqReport`.
message GenerateRfqReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchRfqReport`.
message FetchRfqReportRequest {
  acme.common.v1.RequestContext context = 1;
  string rfq_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchRfqReport`.
message FetchRfqReportResponse {
  Rfq rfq = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleRfqReport`.
message ScheduleRfqReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string rfq_id = 2;
  ScheduleRfqReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleRfqReport`.
message ScheduleRfqReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamRfqMetrics`.
message StreamRfqMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RfqStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamRfqMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamRfqMetrics`.
message StreamRfqMetricsResponse {
  Rfq rfq = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListRfqReports`.
message ListRfqReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RfqStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListRfqReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListRfqReports`.
message ListRfqReportsResponse {
  repeated Rfq rfqs = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountRfqTotals`.
message CountRfqTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RfqStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountRfqTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountRfqTotals`.
message CountRfqTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteRfqReport`.
message DeleteRfqReportRequest {
  acme.common.v1.RequestContext context = 1;
  string rfq_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteRfqReport`.
message DeleteRfqReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
