syntax = "proto3";

package acme.procurement.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/procurement/v1/procurement.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Procurement.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/procurement/v1;procurementv1";
option java_multiple_files = true;
option java_outer_classname = "RfqValidationServiceProto";
option java_package = "com.acme.procurement.v1";

// Checks rfqs against the rules before anything acts on them.
service RfqValidationService {
  // Validates a rfq.
  rpc ValidateRfq(ValidateRfqRequest) returns (ValidateRfqResponse);

  // Previews a rfq.
  rpc PreviewRfq(PreviewRfqRequest) returns (PreviewRfqResponse);

  // Checks a rfq.
  rpc CheckRfqEligibility(CheckRfqEligibilityRequest) returns (CheckRfqEligibilityResponse);

  // Normalizes a rfq.
  rpc NormalizeRfq(NormalizeRfqRequest) returns (NormalizeRfqResponse);

  // Explains a rfq.
  rpc ExplainRfqDecision(ExplainRfqDecisionRequest) returns (ExplainRfqDecisionResponse);

  // Scores a rfq.
  rpc ScoreRfq(ScoreRfqRequest) returns (ScoreRfqResponse);

  // Lints a rfq.
  rpc LintRfqs(LintRfqsRequest) returns (LintRfqsResponse);

  // Returns a rfq.
  rpc GetRfqRules(GetRfqRulesRequest) returns (GetRfqRulesResponse);
}

// The request of `ValidateRfq`.
message ValidateRfqRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string rfq_id = 2;
  Rfq rfq = 3;
  ValidateRfqRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateRfq`.
message ValidateRfqResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Rfq rfq = 1;
  ValidateRfqResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

