option csharp_namespace = "Acme.Procurement.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/procurement/v1;procurementv1";
option java_multiple_files = true;
option java_outer_classname = "PurchaseRequisitionWorkflowServiceProto";
option java_package = "com.acme.procurement.v1";

// Runs the long-lived workflow that takes a purchase requisition from start to finish.
service PurchaseRequisitionWorkflowService {
  // Starts a purchase requisition.
  rpc StartPurchaseRequisitionWorkflow(StartPurchaseRequisitionWorkflowRequest) returns (StartPurchaseRequisitionWorkflowResponse);

  // Advances a purchase requisition.
  rpc AdvancePurchaseRequisitionWorkflow(AdvancePurchaseRequisitionWorkflowRequest) returns (AdvancePurchaseRequisitionWorkflowResponse);

  // Cancels a purchase requisition.
  rpc CancelPurchaseRequisitionWorkflow(CancelPurchaseRequisitionWorkflowRequest) returns (CancelPurchaseRequisitionWorkflowResponse);

  // Retrys a purchase requisition.
  rpc RetryPurchaseRequisitionWorkflow(RetryPurchaseRequisitionWorkflowRequest) returns (RetryPurchaseRequisitionWorkflowResponse);

  // Resumes a purchase requisition.
  rpc ResumePurchaseRequisitionWorkflow(ResumePurchaseRequisitionWorkflowRequest) returns (ResumePurchaseRequisitionWorkflowResponse);

  // Returns a purchase requisition.
  rpc InspectPurchaseRequisitionWorkflow(InspectPurchaseRequisitionWorkflowRequest) returns (InspectPurchaseRequisitionWorkflowResponse);

  // Lists purchase requisitions a page at a time.
  rpc ListPurchaseRequisitionWorkflows(ListPurchaseRequisitionWorkflowsRequest) returns (ListPurchaseRequisitionWorkflowsResponse);

  // Signals a purchase requisition.
  rpc SignalPurchaseRequisitionWorkflow(SignalPurchaseRequisitionWorkflowRequest) returns (SignalPurchaseRequisitionWorkflowResponse);
}

// The request of `StartPurchaseRequisitionWorkflow`.
message StartPurchaseRequisitionWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string purchase_requisition_id = 2;
  PurchaseRequisition purchase_requisition = 3;
  StartPurchaseRequisitionWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartPurchaseRequisitionWorkflow`.
message StartPurchaseRequisitionWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PurchaseRequisition purchase_requisition = 1;
  StartPurchaseRequisitionWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

