syntax = "proto3";

package acme.procurement.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/procurement/v1/procurement.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Procurement.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/procurement/v1;procurementv1";
option java_multiple_files = true;
option java_outer_classname = "PurchaseOrderWorkflowServiceProto";
option java_package = "com.acme.procurement.v1";

// Runs the long-lived workflow that takes a purchase order from start to finish.
service PurchaseOrderWorkflowService {
  // Starts a purchase order.
  rpc StartPurchaseOrderWorkflow(StartPurchaseOrderWorkflowRequest) returns (StartPurchaseOrderWorkflowResponse);

  // Advances a purchase order.
  rpc AdvancePurchaseOrderWorkflow(AdvancePurchaseOrderWorkflowRequest) returns (AdvancePurchaseOrderWorkflowResponse);

  // Cancels a purchase order.
  rpc CancelPurchaseOrderWorkflow(CancelPurchaseOrderWorkflowRequest) returns (CancelPurchaseOrderWorkflowResponse);

  // Retrys a purchase order.
  rpc RetryPurchaseOrderWorkflow(RetryPurchaseOrderWorkflowRequest) returns (RetryPurchaseOrderWorkflowResponse);

  // Returns a purchase order.
  rpc InspectPurchaseOrderWorkflow(InspectPurchaseOrderWorkflowRequest) returns (InspectPurchaseOrderWorkflowResponse);

  // Lists purchase orders a page at a time.
  rpc ListPurchaseOrderWorkflows(ListPurchaseOrderWorkflowsRequest) returns (ListPurchaseOrderWorkflowsResponse);

  // Signals a purchase order.
  rpc SignalPurchaseOrderWorkflow(SignalPurchaseOrderWorkflowRequest) returns (SignalPurchaseOrderWorkflowResponse);
}

// The request of `StartPurchaseOrderWorkflow`.
message StartPurchaseOrderWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string purchase_order_id = 2;
  PurchaseOrder purchase_order = 3;
  StartPurchaseOrderWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartPurchaseOrderWorkflow`.
message StartPurchaseOrderWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PurchaseOrder purchase_order = 1;
  StartPurchaseOrderWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

