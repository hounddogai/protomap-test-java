syntax = "proto3";

package acme.procurement.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/procurement/v1/procurement.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Procurement.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/procurement/v1;procurementv1";
option java_multiple_files = true;
option java_outer_classname = "GoodsReceiptLifecycleServiceProto";
option java_package = "com.acme.procurement.v1";

// Moves a goods receipt between the states of its lifecycle.
service GoodsReceiptLifecycleService {
  // Activates a goods receipt.
  rpc ActivateGoodsReceipt(ActivateGoodsReceiptRequest) returns (ActivateGoodsReceiptResponse);

  // Suspends a goods receipt.
  rpc SuspendGoodsReceipt(SuspendGoodsReceiptRequest) returns (SuspendGoodsReceiptResponse);

  // Reinstates a goods receipt.
  rpc ReinstateGoodsReceipt(ReinstateGoodsReceiptRequest) returns (ReinstateGoodsReceiptResponse);

  // Renews a goods receipt.
  rpc RenewGoodsReceipt(RenewGoodsReceiptRequest) returns (RenewGoodsReceiptResponse);

  // Expires a goods receipt.
  rpc ExpireGoodsReceipt(ExpireGoodsReceiptRequest) returns (ExpireGoodsReceiptResponse);

  // Returns a goods receipt.
  rpc GetGoodsReceiptLifecycle(GetGoodsReceiptLifecycleRequest) returns (GetGoodsReceiptLifecycleResponse);

  // Schedules a goods receipt.
  rpc ScheduleGoodsReceiptExpiry(ScheduleGoodsReceiptExpiryRequest) returns (ScheduleGoodsReceiptExpiryResponse);
}

// The request of `ActivateGoodsReceipt`.
message ActivateGoodsReceiptRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string goods_receipt_id = 2;
  ActivateGoodsReceiptRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateGoodsReceipt`.
message ActivateGoodsReceiptResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  GoodsReceipt goods_receipt = 1;
  ActivateGoodsReceiptResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

