syntax = "proto3";

package acme.procurement.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/procurement/v1/procurement.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Procurement.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/procurement/v1;procurementv1";
option java_multiple_files = true;
option java_outer_classname = "GoodsReceiptWorkflowServiceProto";
option java_package = "com.acme.procurement.v1";

// Runs the long-lived workflow that takes a goods receipt from start to finish.
service GoodsReceiptWorkflowService {
  // Starts a goods receipt.
  rpc StartGoodsReceiptWorkflow(StartGoodsReceiptWorkflowRequest) returns (StartGoodsReceiptWorkflowResponse);

  // Advances a goods receipt.
  rpc AdvanceGoodsReceiptWorkflow(AdvanceGoodsReceiptWorkflowRequest) returns (AdvanceGoodsReceiptWorkflowResponse);

  // Cancels a goods receipt.
  rpc CancelGoodsReceiptWorkflow(CancelGoodsReceiptWorkflowRequest) returns (CancelGoodsReceiptWorkflowResponse);

  // Pauses a goods receipt.
  rpc PauseGoodsReceiptWorkflow(PauseGoodsReceiptWorkflowRequest) returns (PauseGoodsReceiptWorkflowResponse);

  // Resumes a goods receipt.
  rpc ResumeGoodsReceiptWorkflow(ResumeGoodsReceiptWorkflowRequest) returns (ResumeGoodsReceiptWorkflowResponse);

  // Lists goods receipts a page at a time.
  rpc ListGoodsReceiptWorkflows(ListGoodsReceiptWorkflowsRequest) returns (ListGoodsReceiptWorkflowsResponse);

  // Signals a goods receipt.
  rpc SignalGoodsReceiptWorkflow(SignalGoodsReceiptWorkflowRequest) returns (SignalGoodsReceiptWorkflowResponse);
}

// The request of `StartGoodsReceiptWorkflow`.
message StartGoodsReceiptWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string goods_receipt_id = 2;
  GoodsReceipt goods_receipt = 3;
  StartGoodsReceiptWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartGoodsReceiptWorkflow`.
message StartGoodsReceiptWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  GoodsReceipt goods_receipt = 1;
  StartGoodsReceiptWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

