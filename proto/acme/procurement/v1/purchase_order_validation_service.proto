syntax = "proto3";

package acme.procurement.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/procurement/v1/procurement.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Procurement.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/procurement/v1;procurementv1";
option java_multiple_files = true;
option java_outer_classname = "PurchaseOrderValidationServiceProto";
option java_package = "com.acme.procurement.v1";

// Checks purchase orders against the rules before anything acts on them.
service PurchaseOrderValidationService {
  // Validates a purchase order.
  rpc ValidatePurchaseOrder(ValidatePurchaseOrderRequest) returns (ValidatePurchaseOrderResponse);

  // Previews a purchase order.
  rpc PreviewPurchaseOrder(PreviewPurchaseOrderRequest) returns (PreviewPurchaseOrderResponse);

  // Checks a purchase order.
  rpc CheckPurchaseOrderEligibility(CheckPurchaseOrderEligibilityRequest) returns (CheckPurchaseOrderEligibilityResponse);

  // Normalizes a purchase order.
  rpc NormalizePurchaseOrder(NormalizePurchaseOrderRequest) returns (NormalizePurchaseOrderResponse);

  // Explains a purchase order.
  rpc ExplainPurchaseOrderDecision(ExplainPurchaseOrderDecisionRequest) returns (ExplainPurchaseOrderDecisionResponse);

  // Scores a purchase order.
  rpc ScorePurchaseOrder(ScorePurchaseOrderRequest) returns (ScorePurchaseOrderResponse);

  // Lints a purchase order.
  rpc LintPurchaseOrders(LintPurchaseOrdersRequest) returns (LintPurchaseOrdersResponse);

  // Returns a purchase order.
  rpc GetPurchaseOrderRules(GetPurchaseOrderRulesRequest) returns (GetPurchaseOrderRulesResponse);
}

// The request of `ValidatePurchaseOrder`.
message ValidatePurchaseOrderRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string purchase_order_id = 2;
  PurchaseOrder purchase_order = 3;
  ValidatePurchaseOrderRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidatePurchaseOrder`.
message ValidatePurchaseOrderResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PurchaseOrder purchase_order = 1;
  ValidatePurchaseOrderResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

