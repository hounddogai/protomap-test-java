syntax = "proto3";

package acme.procurement.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/procurement/v1/procurement.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Procurement.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/procurement/v1;procurementv1";
option java_multiple_files = true;
option java_outer_classname = "PurchaseOrderQueryServiceProto";
option java_package = "com.acme.procurement.v1";

// Answers read-only questions about purchase orders, for screens and reports.
service PurchaseOrderQueryService {
  // Returns a purchase order.
  rpc LookupPurchaseOrder(LookupPurchaseOrderRequest) returns (LookupPurchaseOrderResponse);

  // Lists purchase orders a page at a time.
  rpc BrowsePurchaseOrders(BrowsePurchaseOrdersRequest) returns (BrowsePurchaseOrdersResponse);

  // Lists purchase orders a page at a time.
  rpc FindPurchaseOrders(FindPurchaseOrdersRequest) returns (FindPurchaseOrdersResponse);

  // Counts purchase orders by status.
  rpc CountPurchaseOrders(CountPurchaseOrdersRequest) returns (CountPurchaseOrdersResponse);

  // Returns several purchase orders at once.
  rpc ResolvePurchaseOrders(ResolvePurchaseOrdersRequest) returns (ResolvePurchaseOrdersResponse);

  // Streams every matching purchase order.
  rpc ExportPurchaseOrders(ExportPurchaseOrdersRequest) returns (stream ExportPurchaseOrdersResponse);

  // Summarizes a purchase order.
  rpc SummarizePurchaseOrders(SummarizePurchaseOrdersRequest) returns (SummarizePurchaseOrdersResponse);

  // Lists purchase orders a page at a time.
  rpc SuggestPurchaseOrders(SuggestPurchaseOrdersRequest) returns (SuggestPurchaseOrdersResponse);

  // Returns a purchase order.
  rpc PeekPurchaseOrder(PeekPurchaseOrderRequest) returns (PeekPurchaseOrderResponse);
}

// The request of `LookupPurchaseOrder`.
message LookupPurchaseOrderRequest {
  acme.common.v1.RequestContext context = 1;
  string purchase_order_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupPurchaseOrder`.
message LookupPurchaseOrderResponse {
  PurchaseOrder purchase_order = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowsePurchaseOrders`.
message BrowsePurchaseOrdersRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PurchaseOrderStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowsePurchaseOrdersRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowsePurchaseOrders`.
message BrowsePurchaseOrdersResponse {
  repeated PurchaseOrder purchase_orders = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindPurchaseOrders`.
message FindPurchaseOrdersRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PurchaseOrderStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindPurchaseOrdersRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindPurchaseOrders`.
message FindPurchaseOrdersResponse {
  repeated PurchaseOrder purchase_orders = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountPurchaseOrders`.
message CountPurchaseOrdersRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PurchaseOrderStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountPurchaseOrdersRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountPurchaseOrders`.
message CountPurchaseOrdersResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolvePurchaseOrders`.
message ResolvePurchaseOrdersRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string purchase_order_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolvePurchaseOrders`.
message ResolvePurchaseOrdersResponse {
  repeated PurchaseOrder purchase_orders = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportPurchaseOrders`.
message ExportPurchaseOrdersRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PurchaseOrderStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportPurchaseOrdersRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportPurchaseOrders`.
message ExportPurchaseOrdersResponse {
  PurchaseOrder purchase_order = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizePurchaseOrders`.
message SummarizePurchaseOrdersRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string purchase_order_id = 2;
  SummarizePurchaseOrdersRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizePurchaseOrders`.
message SummarizePurchaseOrdersResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestPurchaseOrders`.
message SuggestPurchaseOrdersRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PurchaseOrderStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestPurchaseOrdersRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestPurchaseOrders`.
message SuggestPurchaseOrdersResponse {
  repeated PurchaseOrder purchase_orders = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekPurchaseOrder`.
message PeekPurchaseOrderRequest {
  acme.common.v1.RequestContext context = 1;
  string purchase_order_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekPurchaseOrder`.
message PeekPurchaseOrderResponse {
  PurchaseOrder purchase_order = 1;
  acme.common.v1.OperationResult result = 2;
}
