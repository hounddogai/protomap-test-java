syntax = "proto3";

package acme.procurement.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/procurement/v1/procurement.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Procurement.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/procurement/v1;procurementv1";
option java_multiple_files = true;
option java_outer_classname = "PurchaseRequisitionApprovalServiceProto";
option java_package = "com.acme.procurement.v1";

// Routes purchase requisitions through approval, with escalation and delegation.
service PurchaseRequisitionApprovalService {
  // Submits a purchase requisition.
  rpc SubmitPurchaseRequisition(SubmitPurchaseRequisitionRequest) returns (SubmitPurchaseRequisitionResponse);

  // Approves a purchase requisition.
  rpc ApprovePurchaseRequisition(ApprovePurchaseRequisitionRequest) returns (ApprovePurchaseRequisitionResponse);

  // Rejects a purchase requisition.
  rpc RejectPurchaseRequisition(RejectPurchaseRequisitionRequest) returns (RejectPurchaseRequisitionResponse);

  // Escalates a purchase requisition.
  rpc EscalatePurchaseRequisition(EscalatePurchaseRequisitionRequest) returns (EscalatePurchaseRequisitionResponse);

  // Lists purchase requisitions a page at a time.
  rpc ListPendingPurchaseRequisitions(ListPendingPurchaseRequisitionsRequest) returns (ListPendingPurchaseRequisitionsResponse);

  // Delegates a purchase requisition.
  rpc DelegatePurchaseRequisitionApproval(DelegatePurchaseRequisitionApprovalRequest) returns (DelegatePurchaseRequisitionApprovalResponse);

  // Recalls a purchase requisition.
  rpc RecallPurchaseRequisition(RecallPurchaseRequisitionRequest) returns (RecallPurchaseRequisitionResponse);

  // Returns a purchase requisition.
  rpc GetPurchaseRequisitionApprovalStatus(GetPurchaseRequisitionApprovalStatusRequest) returns (GetPurchaseRequisitionApprovalStatusResponse);

  // Comments a purchase requisition.
  rpc CommentPurchaseRequisitionApproval(CommentPurchaseRequisitionApprovalRequest) returns (CommentPurchaseRequisitionApprovalResponse);
}

// The request of `SubmitPurchaseRequisition`.
message SubmitPurchaseRequisitionRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string purchase_requisition_id = 2;
  PurchaseRequisition purchase_requisition = 3;
  SubmitPurchaseRequisitionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitPurchaseRequisition`.
message SubmitPurchaseRequisitionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PurchaseRequisition purchase_requisition = 1;
  SubmitPurchaseRequisitionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

