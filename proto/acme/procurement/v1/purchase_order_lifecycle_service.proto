import "acme/procurement/v1/procurement.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Procurement.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/procurement/v1;procurementv1";
option java_multiple_files = true;
option java_outer_classname = "PurchaseOrderLifecycleServiceProto";
option java_package = "com.acme.procurement.v1";

// Moves a purchase order between the states of its lifecycle.
service PurchaseOrderLifecycleService {
  // Activates a purchase order.
  rpc ActivatePurchaseOrder(ActivatePurchaseOrderRequest) returns (ActivatePurchaseOrderResponse);

  // Suspends a purchase order.
  rpc SuspendPurchaseOrder(SuspendPurchaseOrderRequest) returns (SuspendPurchaseOrderResponse);

  // Reinstates a purchase order.
  rpc ReinstatePurchaseOrder(ReinstatePurchaseOrderRequest) returns (ReinstatePurchaseOrderResponse);

  // Terminates a purchase order.
  rpc TerminatePurchaseOrder(TerminatePurchaseOrderRequest) returns (TerminatePurchaseOrderResponse);

  // Renews a purchase order.
  rpc RenewPurchaseOrder(RenewPurchaseOrderRequest) returns (RenewPurchaseOrderResponse);

  // Expires a purchase order.
  rpc ExpirePurchaseOrder(ExpirePurchaseOrderRequest) returns (ExpirePurchaseOrderResponse);

  // Returns a purchase order.
  rpc GetPurchaseOrderLifecycle(GetPurchaseOrderLifecycleRequest) returns (GetPurchaseOrderLifecycleResponse);

  // Schedules a purchase order.
  rpc SchedulePurchaseOrderExpiry(SchedulePurchaseOrderExpiryRequest) returns (SchedulePurchaseOrderExpiryResponse);
}

// The request of `ActivatePurchaseOrder`.
message ActivatePurchaseOrderRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string purchase_order_id = 2;
  ActivatePurchaseOrderRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivatePurchaseOrder`.
message ActivatePurchaseOrderResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PurchaseOrder purchase_order = 1;
  ActivatePurchaseOrderResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

