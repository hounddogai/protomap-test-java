syntax = "proto3";

package acme.procurement.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/procurement/v1/procurement.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Procurement.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/procurement/v1;procurementv1";
option java_multiple_files = true;
option java_outer_classname = "GoodsReceiptValidationServiceProto";
option java_package = "com.acme.procurement.v1";

// Checks goods receipts against the rules before anything acts on them.
service GoodsReceiptValidationService {
  // Validates a goods receipt.
  rpc ValidateGoodsReceipt(ValidateGoodsReceiptRequest) returns (ValidateGoodsReceiptResponse);

  // Previews a goods receipt.
  rpc PreviewGoodsReceipt(PreviewGoodsReceiptRequest) returns (PreviewGoodsReceiptResponse);

  // Checks a goods receipt.
  rpc CheckGoodsReceiptEligibility(CheckGoodsReceiptEligibilityRequest) returns (CheckGoodsReceiptEligibilityResponse);

  // Normalizes a goods receipt.
  rpc NormalizeGoodsReceipt(NormalizeGoodsReceiptRequest) returns (NormalizeGoodsReceiptResponse);

  // Scores a goods receipt.
  rpc ScoreGoodsReceipt(ScoreGoodsReceiptRequest) returns (ScoreGoodsReceiptResponse);

  // Lints a goods receipt.
  rpc LintGoodsReceipts(LintGoodsReceiptsRequest) returns (LintGoodsReceiptsResponse);

  // Returns a goods receipt.
  rpc GetGoodsReceiptRules(GetGoodsReceiptRulesRequest) returns (GetGoodsReceiptRulesResponse);
}

// The request of `ValidateGoodsReceipt`.
message ValidateGoodsReceiptRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string goods_receipt_id = 2;
  GoodsReceipt goods_receipt = 3;
  ValidateGoodsReceiptRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateGoodsReceipt`.
message ValidateGoodsReceiptResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  GoodsReceipt goods_receipt = 1;
  ValidateGoodsReceiptResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PreviewGoodsReceipt`.
message PreviewGoodsReceiptRequest {
  // What the operation needs besides the record.
  message Details {
