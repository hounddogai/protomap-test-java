syntax = "proto3";

package acme.procurement.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/procurement/v1/procurement.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Procurement.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/procurement/v1;procurementv1";
option java_multiple_files = true;
option java_outer_classname = "RfqLifecycleServiceProto";
option java_package = "com.acme.procurement.v1";

// Moves a rfq between the states of its lifecycle.
service RfqLifecycleService {
  // Activates a rfq.
  rpc ActivateRfq(ActivateRfqRequest) returns (ActivateRfqResponse);

  // Suspends a rfq.
  rpc SuspendRfq(SuspendRfqRequest) returns (SuspendRfqResponse);

  // Reinstates a rfq.
  rpc ReinstateRfq(ReinstateRfqRequest) returns (ReinstateRfqResponse);

  // Terminates a rfq.
  rpc TerminateRfq(TerminateRfqRequest) returns (TerminateRfqResponse);

  // Renews a rfq.
  rpc RenewRfq(RenewRfqRequest) returns (RenewRfqResponse);

  // Expires a rfq.
  rpc ExpireRfq(ExpireRfqRequest) returns (ExpireRfqResponse);

  // Returns a rfq.
  rpc GetRfqLifecycle(GetRfqLifecycleRequest) returns (GetRfqLifecycleResponse);

  // Schedules a rfq.
  rpc ScheduleRfqExpiry(ScheduleRfqExpiryRequest) returns (ScheduleRfqExpiryResponse);
}

// The request of `ActivateRfq`.
message ActivateRfqRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string rfq_id = 2;
  ActivateRfqRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateRfq`.
message ActivateRfqResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Rfq rfq = 1;
  ActivateRfqResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

