syntax = "proto3";

package acme.collections.v1;

import "acme/collections/v1/collections.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Collections.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/collections/v1;collectionsv1";
option java_multiple_files = true;
option java_outer_classname = "WriteOffApprovalServiceProto";
option java_package = "com.acme.collections.v1";

// Routes write offs through approval, with escalation and delegation.
service WriteOffApprovalService {
  // Submits a write off.
  rpc SubmitWriteOff(SubmitWriteOffRequest) returns (SubmitWriteOffResponse);

  // Approves a write off.
  rpc ApproveWriteOff(ApproveWriteOffRequest) returns (ApproveWriteOffResponse);

  // Rejects a write off.
  rpc RejectWriteOff(RejectWriteOffRequest) returns (RejectWriteOffResponse);

  // Escalates a write off.
  rpc EscalateWriteOff(EscalateWriteOffRequest) returns (EscalateWriteOffResponse);

  // Lists write offs a page at a time.
  rpc ListPendingWriteOffs(ListPendingWriteOffsRequest) returns (ListPendingWriteOffsResponse);

  // Recalls a write off.
  rpc RecallWriteOff(RecallWriteOffRequest) returns (RecallWriteOffResponse);

  // Comments a write off.
  rpc CommentWriteOffApproval(CommentWriteOffApprovalRequest) returns (CommentWriteOffApprovalResponse);
}

// The request of `SubmitWriteOff`.
message SubmitWriteOffRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string write_off_id = 2;
  WriteOff write_off = 3;
  SubmitWriteOffRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitWriteOff`.
message SubmitWriteOffResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  WriteOff write_off = 1;
  SubmitWriteOffResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

