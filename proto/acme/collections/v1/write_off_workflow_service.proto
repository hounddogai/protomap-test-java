option csharp_namespace = "Acme.Collections.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/collections/v1;collectionsv1";
option java_multiple_files = true;
option java_outer_classname = "WriteOffWorkflowServiceProto";
option java_package = "com.acme.collections.v1";

// Runs the long-lived workflow that takes a write off from start to finish.
service WriteOffWorkflowService {
  // Starts a write off.
  rpc StartWriteOffWorkflow(StartWriteOffWorkflowRequest) returns (StartWriteOffWorkflowResponse);

  // Advances a write off.
  rpc AdvanceWriteOffWorkflow(AdvanceWriteOffWorkflowRequest) returns (AdvanceWriteOffWorkflowResponse);

  // Cancels a write off.
  rpc CancelWriteOffWorkflow(CancelWriteOffWorkflowRequest) returns (CancelWriteOffWorkflowResponse);

  // Retrys a write off.
  rpc RetryWriteOffWorkflow(RetryWriteOffWorkflowRequest) returns (RetryWriteOffWorkflowResponse);

  // Pauses a write off.
  rpc PauseWriteOffWorkflow(PauseWriteOffWorkflowRequest) returns (PauseWriteOffWorkflowResponse);

  // Resumes a write off.
  rpc ResumeWriteOffWorkflow(ResumeWriteOffWorkflowRequest) returns (ResumeWriteOffWorkflowResponse);

  // Returns a write off.
  rpc InspectWriteOffWorkflow(InspectWriteOffWorkflowRequest) returns (InspectWriteOffWorkflowResponse);

  // Lists write offs a page at a time.
  rpc ListWriteOffWorkflows(ListWriteOffWorkflowsRequest) returns (ListWriteOffWorkflowsResponse);

  // Signals a write off.
  rpc SignalWriteOffWorkflow(SignalWriteOffWorkflowRequest) returns (SignalWriteOffWorkflowResponse);
}

// The request of `StartWriteOffWorkflow`.
message StartWriteOffWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string write_off_id = 2;
  WriteOff write_off = 3;
  StartWriteOffWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartWriteOffWorkflow`.
message StartWriteOffWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  WriteOff write_off = 1;
  StartWriteOffWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

