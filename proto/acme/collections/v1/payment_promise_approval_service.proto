syntax = "proto3";

package acme.collections.v1;

import "acme/collections/v1/collections.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Collections.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/collections/v1;collectionsv1";
option java_multiple_files = true;
option java_outer_classname = "PaymentPromiseApprovalServiceProto";
option java_package = "com.acme.collections.v1";

// Routes payment promises through approval, with escalation and delegation.
service PaymentPromiseApprovalService {
  // Submits a payment promise.
  rpc SubmitPaymentPromise(SubmitPaymentPromiseRequest) returns (SubmitPaymentPromiseResponse);

  // Approves a payment promise.
  rpc ApprovePaymentPromise(ApprovePaymentPromiseRequest) returns (ApprovePaymentPromiseResponse);

  // Rejects a payment promise.
  rpc RejectPaymentPromise(RejectPaymentPromiseRequest) returns (RejectPaymentPromiseResponse);

  // Escalates a payment promise.
  rpc EscalatePaymentPromise(EscalatePaymentPromiseRequest) returns (EscalatePaymentPromiseResponse);

  // Lists payment promises a page at a time.
  rpc ListPendingPaymentPromises(ListPendingPaymentPromisesRequest) returns (ListPendingPaymentPromisesResponse);

  // Recalls a payment promise.
  rpc RecallPaymentPromise(RecallPaymentPromiseRequest) returns (RecallPaymentPromiseResponse);

  // Returns a payment promise.
  rpc GetPaymentPromiseApprovalStatus(GetPaymentPromiseApprovalStatusRequest) returns (GetPaymentPromiseApprovalStatusResponse);

  // Comments a payment promise.
  rpc CommentPaymentPromiseApproval(CommentPaymentPromiseApprovalRequest) returns (CommentPaymentPromiseApprovalResponse);
}

// The request of `SubmitPaymentPromise`.
message SubmitPaymentPromiseRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string payment_promise_id = 2;
  PaymentPromise payment_promise = 3;
  SubmitPaymentPromiseRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitPaymentPromise`.
message SubmitPaymentPromiseResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PaymentPromise payment_promise = 1;
  SubmitPaymentPromiseResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

