syntax = "proto3";

package acme.collections.v1;

import "acme/collections/v1/collections.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Collections.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/collections/v1;collectionsv1";
option java_multiple_files = true;
option java_outer_classname = "PaymentPromiseWorkflowServiceProto";
option java_package = "com.acme.collections.v1";

// Runs the long-lived workflow that takes a payment promise from start to finish.
service PaymentPromiseWorkflowService {
  // Starts a payment promise.
  rpc StartPaymentPromiseWorkflow(StartPaymentPromiseWorkflowRequest) returns (StartPaymentPromiseWorkflowResponse);

  // Advances a payment promise.
  rpc AdvancePaymentPromiseWorkflow(AdvancePaymentPromiseWorkflowRequest) returns (AdvancePaymentPromiseWorkflowResponse);

  // Cancels a payment promise.
  rpc CancelPaymentPromiseWorkflow(CancelPaymentPromiseWorkflowRequest) returns (CancelPaymentPromiseWorkflowResponse);

  // Retrys a payment promise.
  rpc RetryPaymentPromiseWorkflow(RetryPaymentPromiseWorkflowRequest) returns (RetryPaymentPromiseWorkflowResponse);

  // Resumes a payment promise.
  rpc ResumePaymentPromiseWorkflow(ResumePaymentPromiseWorkflowRequest) returns (ResumePaymentPromiseWorkflowResponse);

  // Returns a payment promise.
  rpc InspectPaymentPromiseWorkflow(InspectPaymentPromiseWorkflowRequest) returns (InspectPaymentPromiseWorkflowResponse);

  // Lists payment promises a page at a time.
  rpc ListPaymentPromiseWorkflows(ListPaymentPromiseWorkflowsRequest) returns (ListPaymentPromiseWorkflowsResponse);

  // Signals a payment promise.
  rpc SignalPaymentPromiseWorkflow(SignalPaymentPromiseWorkflowRequest) returns (SignalPaymentPromiseWorkflowResponse);
}

// The request of `StartPaymentPromiseWorkflow`.
message StartPaymentPromiseWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string payment_promise_id = 2;
  PaymentPromise payment_promise = 3;
  StartPaymentPromiseWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartPaymentPromiseWorkflow`.
message StartPaymentPromiseWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PaymentPromise payment_promise = 1;
  StartPaymentPromiseWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

