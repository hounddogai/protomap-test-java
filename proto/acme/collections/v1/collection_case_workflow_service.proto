option csharp_namespace = "Acme.Collections.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/collections/v1;collectionsv1";
option java_multiple_files = true;
option java_outer_classname = "CollectionCaseWorkflowServiceProto";
option java_package = "com.acme.collections.v1";

// Runs the long-lived workflow that takes a collection case from start to finish.
service CollectionCaseWorkflowService {
  // Starts a collection case.
  rpc StartCollectionCaseWorkflow(StartCollectionCaseWorkflowRequest) returns (StartCollectionCaseWorkflowResponse);

  // Advances a collection case.
  rpc AdvanceCollectionCaseWorkflow(AdvanceCollectionCaseWorkflowRequest) returns (AdvanceCollectionCaseWorkflowResponse);

  // Cancels a collection case.
  rpc CancelCollectionCaseWorkflow(CancelCollectionCaseWorkflowRequest) returns (CancelCollectionCaseWorkflowResponse);

  // Retrys a collection case.
  rpc RetryCollectionCaseWorkflow(RetryCollectionCaseWorkflowRequest) returns (RetryCollectionCaseWorkflowResponse);

  // Pauses a collection case.
  rpc PauseCollectionCaseWorkflow(PauseCollectionCaseWorkflowRequest) returns (PauseCollectionCaseWorkflowResponse);

  // Resumes a collection case.
  rpc ResumeCollectionCaseWorkflow(ResumeCollectionCaseWorkflowRequest) returns (ResumeCollectionCaseWorkflowResponse);

  // Returns a collection case.
  rpc InspectCollectionCaseWorkflow(InspectCollectionCaseWorkflowRequest) returns (InspectCollectionCaseWorkflowResponse);

  // Lists collection cases a page at a time.
  rpc ListCollectionCaseWorkflows(ListCollectionCaseWorkflowsRequest) returns (ListCollectionCaseWorkflowsResponse);

  // Signals a collection case.
  rpc SignalCollectionCaseWorkflow(SignalCollectionCaseWorkflowRequest) returns (SignalCollectionCaseWorkflowResponse);
}

// The request of `StartCollectionCaseWorkflow`.
message StartCollectionCaseWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string collection_case_id = 2;
  CollectionCase collection_case = 3;
  StartCollectionCaseWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartCollectionCaseWorkflow`.
message StartCollectionCaseWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CollectionCase collection_case = 1;
  StartCollectionCaseWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

