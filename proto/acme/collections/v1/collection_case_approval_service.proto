// The response of `RejectCollectionCase`.
message RejectCollectionCaseResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CollectionCase collection_case = 1;
  RejectCollectionCaseResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `EscalateCollectionCase`.
message EscalateCollectionCaseRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string collection_case_id = 2;
  CollectionCase collection_case = 3;
  EscalateCollectionCaseRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `EscalateCollectionCase`.
message EscalateCollectionCaseResponse {
