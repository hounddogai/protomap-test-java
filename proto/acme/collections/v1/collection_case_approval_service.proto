syntax = "proto3";

package acme.collections.v1;

import "acme/collections/v1/collections.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Collections.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/collections/v1;collectionsv1";
option java_multiple_files = true;
option java_outer_classname = "CollectionCaseApprovalServiceProto";
option java_package = "com.acme.collections.v1";

// Routes collection cases through approval, with escalation and delegation.
service CollectionCaseApprovalService {
  // Submits a collection case.
  rpc SubmitCollectionCase(SubmitCollectionCaseRequest) returns (SubmitCollectionCaseResponse);

  // Approves a collection case.
  rpc ApproveCollectionCase(ApproveCollectionCaseRequest) returns (ApproveCollectionCaseResponse);

  // Rejects a collection case.
  rpc RejectCollectionCase(RejectCollectionCaseRequest) returns (RejectCollectionCaseResponse);

  // Escalates a collection case.
  rpc EscalateCollectionCase(EscalateCollectionCaseRequest) returns (EscalateCollectionCaseResponse);

  // Lists collection cases a page at a time.
  rpc ListPendingCollectionCases(ListPendingCollectionCasesRequest) returns (ListPendingCollectionCasesResponse);

  // Returns a collection case.
  rpc GetCollectionCaseApprovalStatus(GetCollectionCaseApprovalStatusRequest) returns (GetCollectionCaseApprovalStatusResponse);
}

// The request of `SubmitCollectionCase`.
message SubmitCollectionCaseRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string collection_case_id = 2;
  CollectionCase collection_case = 3;
  SubmitCollectionCaseRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitCollectionCase`.
message SubmitCollectionCaseResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CollectionCase collection_case = 1;
  SubmitCollectionCaseResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ApproveCollectionCase`.
message ApproveCollectionCaseRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
