  acme.common.v1.RequestContext context = 1;
  string collection_case_id = 2;
  CollectionCase collection_case = 3;
  ApproveCollectionCaseRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ApproveCollectionCase`.
message ApproveCollectionCaseResponse {
