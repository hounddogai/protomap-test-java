// The request of `ListPendingCollectionCases`.
message ListPendingCollectionCasesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated CollectionCaseStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListPendingCollectionCasesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListPendingCollectionCases`.
message ListPendingCollectionCasesResponse {
  repeated CollectionCase collection_cases = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetCollectionCaseApprovalStatus`.
message GetCollectionCaseApprovalStatusRequest {
  acme.common.v1.RequestContext context = 1;
  string collection_case_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetCollectionCaseApprovalStatus`.
message GetCollectionCaseApprovalStatusResponse {
  CollectionCase collection_case = 1;
  acme.common.v1.OperationResult result = 2;
}
