syntax = "proto3";

package acme.invoicing.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/invoicing/v1/invoicing.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Invoicing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/invoicing/v1;invoicingv1";
option java_multiple_files = true;
option java_outer_classname = "InvoiceTemplateApprovalServiceProto";
option java_package = "com.acme.invoicing.v1";

// Routes invoice templates through approval, with escalation and delegation.
service InvoiceTemplateApprovalService {
  // Submits an invoice template.
  rpc SubmitInvoiceTemplate(SubmitInvoiceTemplateRequest) returns (SubmitInvoiceTemplateResponse);

  // Approves an invoice template.
  rpc ApproveInvoiceTemplate(ApproveInvoiceTemplateRequest) returns (ApproveInvoiceTemplateResponse);

  // Rejects an invoice template.
  rpc RejectInvoiceTemplate(RejectInvoiceTemplateRequest) returns (RejectInvoiceTemplateResponse);

  // Escalates an invoice template.
  rpc EscalateInvoiceTemplate(EscalateInvoiceTemplateRequest) returns (EscalateInvoiceTemplateResponse);

  // Lists invoice templates a page at a time.
  rpc ListPendingInvoiceTemplates(ListPendingInvoiceTemplatesRequest) returns (ListPendingInvoiceTemplatesResponse);

  // Delegates an invoice template.
  rpc DelegateInvoiceTemplateApproval(DelegateInvoiceTemplateApprovalRequest) returns (DelegateInvoiceTemplateApprovalResponse);

  // Recalls an invoice template.
  rpc RecallInvoiceTemplate(RecallInvoiceTemplateRequest) returns (RecallInvoiceTemplateResponse);

  // Returns an invoice template.
  rpc GetInvoiceTemplateApprovalStatus(GetInvoiceTemplateApprovalStatusRequest) returns (GetInvoiceTemplateApprovalStatusResponse);

  // Comments an invoice template.
  rpc CommentInvoiceTemplateApproval(CommentInvoiceTemplateApprovalRequest) returns (CommentInvoiceTemplateApprovalResponse);
}

// The request of `SubmitInvoiceTemplate`.
message SubmitInvoiceTemplateRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string invoice_template_id = 2;
  InvoiceTemplate invoice_template = 3;
  SubmitInvoiceTemplateRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitInvoiceTemplate`.
message SubmitInvoiceTemplateResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  InvoiceTemplate invoice_template = 1;
  SubmitInvoiceTemplateResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

