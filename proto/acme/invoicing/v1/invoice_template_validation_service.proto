syntax = "proto3";

package acme.invoicing.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/invoicing/v1/invoicing.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Invoicing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/invoicing/v1;invoicingv1";
option java_multiple_files = true;
option java_outer_classname = "InvoiceTemplateValidationServiceProto";
option java_package = "com.acme.invoicing.v1";

// Checks invoice templates against the rules before anything acts on them.
service InvoiceTemplateValidationService {
  // Validates an invoice template.
  rpc ValidateInvoiceTemplate(ValidateInvoiceTemplateRequest) returns (ValidateInvoiceTemplateResponse);

  // Previews an invoice template.
  rpc PreviewInvoiceTemplate(PreviewInvoiceTemplateRequest) returns (PreviewInvoiceTemplateResponse);

  // Checks an invoice template.
  rpc CheckInvoiceTemplateEligibility(CheckInvoiceTemplateEligibilityRequest) returns (CheckInvoiceTemplateEligibilityResponse);

  // Normalizes an invoice template.
  rpc NormalizeInvoiceTemplate(NormalizeInvoiceTemplateRequest) returns (NormalizeInvoiceTemplateResponse);

  // Explains an invoice template.
  rpc ExplainInvoiceTemplateDecision(ExplainInvoiceTemplateDecisionRequest) returns (ExplainInvoiceTemplateDecisionResponse);

  // Scores an invoice template.
  rpc ScoreInvoiceTemplate(ScoreInvoiceTemplateRequest) returns (ScoreInvoiceTemplateResponse);

  // Lints an invoice template.
  rpc LintInvoiceTemplates(LintInvoiceTemplatesRequest) returns (LintInvoiceTemplatesResponse);

  // Returns an invoice template.
  rpc GetInvoiceTemplateRules(GetInvoiceTemplateRulesRequest) returns (GetInvoiceTemplateRulesResponse);
}

// The request of `ValidateInvoiceTemplate`.
message ValidateInvoiceTemplateRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string invoice_template_id = 2;
  InvoiceTemplate invoice_template = 3;
  ValidateInvoiceTemplateRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateInvoiceTemplate`.
message ValidateInvoiceTemplateResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  InvoiceTemplate invoice_template = 1;
  ValidateInvoiceTemplateResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

