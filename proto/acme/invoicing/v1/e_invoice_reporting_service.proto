syntax = "proto3";

package acme.invoicing.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/invoicing/v1/invoicing.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Invoicing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/invoicing/v1;invoicingv1";
option java_multiple_files = true;
option java_outer_classname = "EInvoiceReportingServiceProto";
option java_package = "com.acme.invoicing.v1";

// Builds and schedules reports about e invoices.
service EInvoiceReportingService {
  // Generates an e invoice.
  rpc GenerateEInvoiceReport(GenerateEInvoiceReportRequest) returns (GenerateEInvoiceReportResponse);

  // Returns an e invoice.
  rpc FetchEInvoiceReport(FetchEInvoiceReportRequest) returns (FetchEInvoiceReportResponse);

  // Streams the changes of e invoices as they happen.
  rpc StreamEInvoiceMetrics(StreamEInvoiceMetricsRequest) returns (stream StreamEInvoiceMetricsResponse);

  // Lists e invoices a page at a time.
  rpc ListEInvoiceReports(ListEInvoiceReportsRequest) returns (ListEInvoiceReportsResponse);

  // Shares an e invoice.
  rpc ShareEInvoiceReport(ShareEInvoiceReportRequest) returns (ShareEInvoiceReportResponse);

  // Counts e invoices by status.
  rpc CountEInvoiceTotals(CountEInvoiceTotalsRequest) returns (CountEInvoiceTotalsResponse);

  // Deletes an e invoice.
  rpc DeleteEInvoiceReport(DeleteEInvoiceReportRequest) returns (DeleteEInvoiceReportResponse);
}

// The request of `GenerateEInvoiceReport`.
message GenerateEInvoiceReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string e_invoice_id = 2;
  GenerateEInvoiceReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateEInvoiceReport`.
message GenerateEInvoiceReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchEInvoiceReport`.
message FetchEInvoiceReportRequest {
  acme.common.v1.RequestContext context = 1;
  string e_invoice_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchEInvoiceReport`.
message FetchEInvoiceReportResponse {
  EInvoice e_invoice = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `StreamEInvoiceMetrics`.
message StreamEInvoiceMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated EInvoiceStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamEInvoiceMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamEInvoiceMetrics`.
message StreamEInvoiceMetricsResponse {
  EInvoice e_invoice = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListEInvoiceReports`.
message ListEInvoiceReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated EInvoiceStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListEInvoiceReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListEInvoiceReports`.
message ListEInvoiceReportsResponse {
  repeated EInvoice e_invoices = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareEInvoiceReport`.
message ShareEInvoiceReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string e_invoice_id = 2;
  ShareEInvoiceReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareEInvoiceReport`.
message ShareEInvoiceReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  EInvoice e_invoice = 1;
  ShareEInvoiceReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountEInvoiceTotals`.
message CountEInvoiceTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated EInvoiceStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountEInvoiceTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountEInvoiceTotals`.
message CountEInvoiceTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteEInvoiceReport`.
message DeleteEInvoiceReportRequest {
  acme.common.v1.RequestContext context = 1;
  string e_invoice_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteEInvoiceReport`.
message DeleteEInvoiceReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
