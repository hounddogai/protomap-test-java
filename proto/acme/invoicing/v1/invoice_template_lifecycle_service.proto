option csharp_namespace = "Acme.Invoicing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/invoicing/v1;invoicingv1";
option java_multiple_files = true;
option java_outer_classname = "InvoiceTemplateLifecycleServiceProto";
option java_package = "com.acme.invoicing.v1";

// Moves an invoice template between the states of its lifecycle.
service InvoiceTemplateLifecycleService {
  // Activates an invoice template.
  rpc ActivateInvoiceTemplate(ActivateInvoiceTemplateRequest) returns (ActivateInvoiceTemplateResponse);

  // Suspends an invoice template.
  rpc SuspendInvoiceTemplate(SuspendInvoiceTemplateRequest) returns (SuspendInvoiceTemplateResponse);

  // Reinstates an invoice template.
  rpc ReinstateInvoiceTemplate(ReinstateInvoiceTemplateRequest) returns (ReinstateInvoiceTemplateResponse);

  // Terminates an invoice template.
  rpc TerminateInvoiceTemplate(TerminateInvoiceTemplateRequest) returns (TerminateInvoiceTemplateResponse);

  // Renews an invoice template.
  rpc RenewInvoiceTemplate(RenewInvoiceTemplateRequest) returns (RenewInvoiceTemplateResponse);

  // Expires an invoice template.
  rpc ExpireInvoiceTemplate(ExpireInvoiceTemplateRequest) returns (ExpireInvoiceTemplateResponse);

  // Returns an invoice template.
  rpc GetInvoiceTemplateLifecycle(GetInvoiceTemplateLifecycleRequest) returns (GetInvoiceTemplateLifecycleResponse);

  // Schedules an invoice template.
  rpc ScheduleInvoiceTemplateExpiry(ScheduleInvoiceTemplateExpiryRequest) returns (ScheduleInvoiceTemplateExpiryResponse);
}

// The request of `ActivateInvoiceTemplate`.
message ActivateInvoiceTemplateRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string invoice_template_id = 2;
  ActivateInvoiceTemplateRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateInvoiceTemplate`.
message ActivateInvoiceTemplateResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  InvoiceTemplate invoice_template = 1;
  ActivateInvoiceTemplateResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

