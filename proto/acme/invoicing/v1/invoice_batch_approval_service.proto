syntax = "proto3";

package acme.invoicing.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/invoicing/v1/invoicing.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Invoicing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/invoicing/v1;invoicingv1";
option java_multiple_files = true;
option java_outer_classname = "InvoiceBatchApprovalServiceProto";
option java_package = "com.acme.invoicing.v1";

// Routes invoice batches through approval, with escalation and delegation.
service InvoiceBatchApprovalService {
  // Submits an invoice batch.
  rpc SubmitInvoiceBatch(SubmitInvoiceBatchRequest) returns (SubmitInvoiceBatchResponse);

  // Approves an invoice batch.
  rpc ApproveInvoiceBatch(ApproveInvoiceBatchRequest) returns (ApproveInvoiceBatchResponse);

  // Rejects an invoice batch.
  rpc RejectInvoiceBatch(RejectInvoiceBatchRequest) returns (RejectInvoiceBatchResponse);

  // Escalates an invoice batch.
  rpc EscalateInvoiceBatch(EscalateInvoiceBatchRequest) returns (EscalateInvoiceBatchResponse);

  // Delegates an invoice batch.
  rpc DelegateInvoiceBatchApproval(DelegateInvoiceBatchApprovalRequest) returns (DelegateInvoiceBatchApprovalResponse);

  // Recalls an invoice batch.
  rpc RecallInvoiceBatch(RecallInvoiceBatchRequest) returns (RecallInvoiceBatchResponse);

  // Comments an invoice batch.
  rpc CommentInvoiceBatchApproval(CommentInvoiceBatchApprovalRequest) returns (CommentInvoiceBatchApprovalResponse);
}

// The request of `SubmitInvoiceBatch`.
message SubmitInvoiceBatchRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string invoice_batch_id = 2;
  InvoiceBatch invoice_batch = 3;
  SubmitInvoiceBatchRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitInvoiceBatch`.
message SubmitInvoiceBatchResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  InvoiceBatch invoice_batch = 1;
  SubmitInvoiceBatchResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

