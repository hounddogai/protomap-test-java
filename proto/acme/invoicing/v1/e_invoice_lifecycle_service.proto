option csharp_namespace = "Acme.Invoicing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/invoicing/v1;invoicingv1";
option java_multiple_files = true;
option java_outer_classname = "EInvoiceLifecycleServiceProto";
option java_package = "com.acme.invoicing.v1";

// Moves an e invoice between the states of its lifecycle.
service EInvoiceLifecycleService {
  // Activates an e invoice.
  rpc ActivateEInvoice(ActivateEInvoiceRequest) returns (ActivateEInvoiceResponse);

  // Suspends an e invoice.
  rpc SuspendEInvoice(SuspendEInvoiceRequest) returns (SuspendEInvoiceResponse);

  // Reinstates an e invoice.
  rpc ReinstateEInvoice(ReinstateEInvoiceRequest) returns (ReinstateEInvoiceResponse);

  // Terminates an e invoice.
  rpc TerminateEInvoice(TerminateEInvoiceRequest) returns (TerminateEInvoiceResponse);

  // Renews an e invoice.
  rpc RenewEInvoice(RenewEInvoiceRequest) returns (RenewEInvoiceResponse);

  // Expires an e invoice.
  rpc ExpireEInvoice(ExpireEInvoiceRequest) returns (ExpireEInvoiceResponse);

  // Returns an e invoice.
  rpc GetEInvoiceLifecycle(GetEInvoiceLifecycleRequest) returns (GetEInvoiceLifecycleResponse);

  // Schedules an e invoice.
  rpc ScheduleEInvoiceExpiry(ScheduleEInvoiceExpiryRequest) returns (ScheduleEInvoiceExpiryResponse);
}

// The request of `ActivateEInvoice`.
message ActivateEInvoiceRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string e_invoice_id = 2;
  ActivateEInvoiceRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateEInvoice`.
message ActivateEInvoiceResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  EInvoice e_invoice = 1;
  ActivateEInvoiceResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

