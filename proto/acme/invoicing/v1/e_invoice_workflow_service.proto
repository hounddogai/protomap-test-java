option csharp_namespace = "Acme.Invoicing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/invoicing/v1;invoicingv1";
option java_multiple_files = true;
option java_outer_classname = "EInvoiceWorkflowServiceProto";
option java_package = "com.acme.invoicing.v1";

// Runs the long-lived workflow that takes an e invoice from start to finish.
service EInvoiceWorkflowService {
  // Starts an e invoice.
  rpc StartEInvoiceWorkflow(StartEInvoiceWorkflowRequest) returns (StartEInvoiceWorkflowResponse);

  // Advances an e invoice.
  rpc AdvanceEInvoiceWorkflow(AdvanceEInvoiceWorkflowRequest) returns (AdvanceEInvoiceWorkflowResponse);

  // Cancels an e invoice.
  rpc CancelEInvoiceWorkflow(CancelEInvoiceWorkflowRequest) returns (CancelEInvoiceWorkflowResponse);

  // Retrys an e invoice.
  rpc RetryEInvoiceWorkflow(RetryEInvoiceWorkflowRequest) returns (RetryEInvoiceWorkflowResponse);

  // Pauses an e invoice.
  rpc PauseEInvoiceWorkflow(PauseEInvoiceWorkflowRequest) returns (PauseEInvoiceWorkflowResponse);

  // Resumes an e invoice.
  rpc ResumeEInvoiceWorkflow(ResumeEInvoiceWorkflowRequest) returns (ResumeEInvoiceWorkflowResponse);

  // Returns an e invoice.
  rpc InspectEInvoiceWorkflow(InspectEInvoiceWorkflowRequest) returns (InspectEInvoiceWorkflowResponse);

  // Lists e invoices a page at a time.
  rpc ListEInvoiceWorkflows(ListEInvoiceWorkflowsRequest) returns (ListEInvoiceWorkflowsResponse);

  // Signals an e invoice.
  rpc SignalEInvoiceWorkflow(SignalEInvoiceWorkflowRequest) returns (SignalEInvoiceWorkflowResponse);
}

// The request of `StartEInvoiceWorkflow`.
message StartEInvoiceWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string e_invoice_id = 2;
  EInvoice e_invoice = 3;
  StartEInvoiceWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartEInvoiceWorkflow`.
message StartEInvoiceWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  EInvoice e_invoice = 1;
  StartEInvoiceWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

