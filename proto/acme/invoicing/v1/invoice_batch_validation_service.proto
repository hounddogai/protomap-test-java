syntax = "proto3";

package acme.invoicing.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/invoicing/v1/invoicing.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Invoicing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/invoicing/v1;invoicingv1";
option java_multiple_files = true;
option java_outer_classname = "InvoiceBatchValidationServiceProto";
option java_package = "com.acme.invoicing.v1";

// Checks invoice batches against the rules before anything acts on them.
service InvoiceBatchValidationService {
  // Validates an invoice batch.
  rpc ValidateInvoiceBatch(ValidateInvoiceBatchRequest) returns (ValidateInvoiceBatchResponse);

  // Previews an invoice batch.
  rpc PreviewInvoiceBatch(PreviewInvoiceBatchRequest) returns (PreviewInvoiceBatchResponse);

  // Checks an invoice batch.
  rpc CheckInvoiceBatchEligibility(CheckInvoiceBatchEligibilityRequest) returns (CheckInvoiceBatchEligibilityResponse);

  // Normalizes an invoice batch.
  rpc NormalizeInvoiceBatch(NormalizeInvoiceBatchRequest) returns (NormalizeInvoiceBatchResponse);

  // Explains an invoice batch.
  rpc ExplainInvoiceBatchDecision(ExplainInvoiceBatchDecisionRequest) returns (ExplainInvoiceBatchDecisionResponse);

  // Scores an invoice batch.
  rpc ScoreInvoiceBatch(ScoreInvoiceBatchRequest) returns (ScoreInvoiceBatchResponse);

  // Lints an invoice batch.
  rpc LintInvoiceBatches(LintInvoiceBatchesRequest) returns (LintInvoiceBatchesResponse);
}

// The request of `ValidateInvoiceBatch`.
message ValidateInvoiceBatchRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string invoice_batch_id = 2;
  InvoiceBatch invoice_batch = 3;
  ValidateInvoiceBatchRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateInvoiceBatch`.
message ValidateInvoiceBatchResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  InvoiceBatch invoice_batch = 1;
  ValidateInvoiceBatchResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

