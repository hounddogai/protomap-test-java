option csharp_namespace = "Acme.Invoicing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/invoicing/v1;invoicingv1";
option java_multiple_files = true;
option java_outer_classname = "InvoiceBatchWorkflowServiceProto";
option java_package = "com.acme.invoicing.v1";

// Runs the long-lived workflow that takes an invoice batch from start to finish.
service InvoiceBatchWorkflowService {
  // Starts an invoice batch.
  rpc StartInvoiceBatchWorkflow(StartInvoiceBatchWorkflowRequest) returns (StartInvoiceBatchWorkflowResponse);

  // Advances an invoice batch.
  rpc AdvanceInvoiceBatchWorkflow(AdvanceInvoiceBatchWorkflowRequest) returns (AdvanceInvoiceBatchWorkflowResponse);

  // Cancels an invoice batch.
  rpc CancelInvoiceBatchWorkflow(CancelInvoiceBatchWorkflowRequest) returns (CancelInvoiceBatchWorkflowResponse);

  // Retrys an invoice batch.
  rpc RetryInvoiceBatchWorkflow(RetryInvoiceBatchWorkflowRequest) returns (RetryInvoiceBatchWorkflowResponse);

  // Pauses an invoice batch.
  rpc PauseInvoiceBatchWorkflow(PauseInvoiceBatchWorkflowRequest) returns (PauseInvoiceBatchWorkflowResponse);

  // Resumes an invoice batch.
  rpc ResumeInvoiceBatchWorkflow(ResumeInvoiceBatchWorkflowRequest) returns (ResumeInvoiceBatchWorkflowResponse);

  // Returns an invoice batch.
  rpc InspectInvoiceBatchWorkflow(InspectInvoiceBatchWorkflowRequest) returns (InspectInvoiceBatchWorkflowResponse);

  // Lists invoice batches a page at a time.
  rpc ListInvoiceBatchWorkflows(ListInvoiceBatchWorkflowsRequest) returns (ListInvoiceBatchWorkflowsResponse);
}

// The request of `StartInvoiceBatchWorkflow`.
message StartInvoiceBatchWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string invoice_batch_id = 2;
  InvoiceBatch invoice_batch = 3;
  StartInvoiceBatchWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartInvoiceBatchWorkflow`.
message StartInvoiceBatchWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  InvoiceBatch invoice_batch = 1;
  StartInvoiceBatchWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

