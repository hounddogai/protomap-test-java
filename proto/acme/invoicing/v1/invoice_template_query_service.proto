syntax = "proto3";

package acme.invoicing.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/invoicing/v1/invoicing.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Invoicing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/invoicing/v1;invoicingv1";
option java_multiple_files = true;
option java_outer_classname = "InvoiceTemplateQueryServiceProto";
option java_package = "com.acme.invoicing.v1";

// Answers read-only questions about invoice templates, for screens and reports.
service InvoiceTemplateQueryService {
  // Returns an invoice template.
  rpc LookupInvoiceTemplate(LookupInvoiceTemplateRequest) returns (LookupInvoiceTemplateResponse);

  // Lists invoice templates a page at a time.
  rpc BrowseInvoiceTemplates(BrowseInvoiceTemplatesRequest) returns (BrowseInvoiceTemplatesResponse);

  // Lists invoice templates a page at a time.
  rpc FindInvoiceTemplates(FindInvoiceTemplatesRequest) returns (FindInvoiceTemplatesResponse);

  // Counts invoice templates by status.
  rpc CountInvoiceTemplates(CountInvoiceTemplatesRequest) returns (CountInvoiceTemplatesResponse);

  // Returns several invoice templates at once.
  rpc ResolveInvoiceTemplates(ResolveInvoiceTemplatesRequest) returns (ResolveInvoiceTemplatesResponse);

  // Streams every matching invoice template.
  rpc ExportInvoiceTemplates(ExportInvoiceTemplatesRequest) returns (stream ExportInvoiceTemplatesResponse);

  // Summarizes an invoice template.
  rpc SummarizeInvoiceTemplates(SummarizeInvoiceTemplatesRequest) returns (SummarizeInvoiceTemplatesResponse);

  // Lists invoice templates a page at a time.
  rpc SuggestInvoiceTemplates(SuggestInvoiceTemplatesRequest) returns (SuggestInvoiceTemplatesResponse);
}

// The request of `LookupInvoiceTemplate`.
message LookupInvoiceTemplateRequest {
  acme.common.v1.RequestContext context = 1;
  string invoice_template_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupInvoiceTemplate`.
message LookupInvoiceTemplateResponse {
  InvoiceTemplate invoice_template = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseInvoiceTemplates`.
message BrowseInvoiceTemplatesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated InvoiceTemplateStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseInvoiceTemplatesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseInvoiceTemplates`.
message BrowseInvoiceTemplatesResponse {
  repeated InvoiceTemplate invoice_templates = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindInvoiceTemplates`.
message FindInvoiceTemplatesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated InvoiceTemplateStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindInvoiceTemplatesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindInvoiceTemplates`.
message FindInvoiceTemplatesResponse {
  repeated InvoiceTemplate invoice_templates = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountInvoiceTemplates`.
message CountInvoiceTemplatesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated InvoiceTemplateStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountInvoiceTemplatesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountInvoiceTemplates`.
message CountInvoiceTemplatesResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveInvoiceTemplates`.
message ResolveInvoiceTemplatesRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string invoice_template_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveInvoiceTemplates`.
message ResolveInvoiceTemplatesResponse {
  repeated InvoiceTemplate invoice_templates = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportInvoiceTemplates`.
message ExportInvoiceTemplatesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated InvoiceTemplateStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportInvoiceTemplatesRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportInvoiceTemplates`.
message ExportInvoiceTemplatesResponse {
  InvoiceTemplate invoice_template = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeInvoiceTemplates`.
message SummarizeInvoiceTemplatesRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string invoice_template_id = 2;
  SummarizeInvoiceTemplatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeInvoiceTemplates`.
message SummarizeInvoiceTemplatesResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestInvoiceTemplates`.
message SuggestInvoiceTemplatesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated InvoiceTemplateStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestInvoiceTemplatesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestInvoiceTemplates`.
message SuggestInvoiceTemplatesResponse {
  repeated InvoiceTemplate invoice_templates = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}
