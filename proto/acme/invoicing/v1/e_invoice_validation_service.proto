syntax = "proto3";

package acme.invoicing.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/invoicing/v1/invoicing.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Invoicing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/invoicing/v1;invoicingv1";
option java_multiple_files = true;
option java_outer_classname = "EInvoiceValidationServiceProto";
option java_package = "com.acme.invoicing.v1";

// Checks e invoices against the rules before anything acts on them.
service EInvoiceValidationService {
  // Validates an e invoice.
  rpc ValidateEInvoice(ValidateEInvoiceRequest) returns (ValidateEInvoiceResponse);

  // Previews an e invoice.
  rpc PreviewEInvoice(PreviewEInvoiceRequest) returns (PreviewEInvoiceResponse);

  // Checks an e invoice.
  rpc CheckEInvoiceEligibility(CheckEInvoiceEligibilityRequest) returns (CheckEInvoiceEligibilityResponse);

  // Normalizes an e invoice.
  rpc NormalizeEInvoice(NormalizeEInvoiceRequest) returns (NormalizeEInvoiceResponse);

  // Explains an e invoice.
  rpc ExplainEInvoiceDecision(ExplainEInvoiceDecisionRequest) returns (ExplainEInvoiceDecisionResponse);

  // Scores an e invoice.
  rpc ScoreEInvoice(ScoreEInvoiceRequest) returns (ScoreEInvoiceResponse);

  // Lints an e invoice.
  rpc LintEInvoices(LintEInvoicesRequest) returns (LintEInvoicesResponse);

  // Returns an e invoice.
  rpc GetEInvoiceRules(GetEInvoiceRulesRequest) returns (GetEInvoiceRulesResponse);
}

// The request of `ValidateEInvoice`.
message ValidateEInvoiceRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string e_invoice_id = 2;
  EInvoice e_invoice = 3;
  ValidateEInvoiceRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateEInvoice`.
message ValidateEInvoiceResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  EInvoice e_invoice = 1;
  ValidateEInvoiceResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

