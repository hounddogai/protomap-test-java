syntax = "proto3";

package acme.invoicing.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/invoicing/v1/invoicing.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Invoicing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/invoicing/v1;invoicingv1";
option java_multiple_files = true;
option java_outer_classname = "EInvoiceApprovalServiceProto";
option java_package = "com.acme.invoicing.v1";

// Routes e invoices through approval, with escalation and delegation.
service EInvoiceApprovalService {
  // Submits an e invoice.
  rpc SubmitEInvoice(SubmitEInvoiceRequest) returns (SubmitEInvoiceResponse);

  // Approves an e invoice.
  rpc ApproveEInvoice(ApproveEInvoiceRequest) returns (ApproveEInvoiceResponse);

  // Rejects an e invoice.
  rpc RejectEInvoice(RejectEInvoiceRequest) returns (RejectEInvoiceResponse);

  // Escalates an e invoice.
  rpc EscalateEInvoice(EscalateEInvoiceRequest) returns (EscalateEInvoiceResponse);

  // Lists e invoices a page at a time.
  rpc ListPendingEInvoices(ListPendingEInvoicesRequest) returns (ListPendingEInvoicesResponse);

  // Delegates an e invoice.
  rpc DelegateEInvoiceApproval(DelegateEInvoiceApprovalRequest) returns (DelegateEInvoiceApprovalResponse);

  // Recalls an e invoice.
  rpc RecallEInvoice(RecallEInvoiceRequest) returns (RecallEInvoiceResponse);

  // Returns an e invoice.
  rpc GetEInvoiceApprovalStatus(GetEInvoiceApprovalStatusRequest) returns (GetEInvoiceApprovalStatusResponse);

  // Comments an e invoice.
  rpc CommentEInvoiceApproval(CommentEInvoiceApprovalRequest) returns (CommentEInvoiceApprovalResponse);
}

// The request of `SubmitEInvoice`.
message SubmitEInvoiceRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string e_invoice_id = 2;
  EInvoice e_invoice = 3;
  SubmitEInvoiceRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitEInvoice`.
message SubmitEInvoiceResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  EInvoice e_invoice = 1;
  SubmitEInvoiceResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

