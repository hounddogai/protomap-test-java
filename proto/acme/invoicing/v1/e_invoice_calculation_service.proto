syntax = "proto3";

package acme.invoicing.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/invoicing/v1/invoicing.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Invoicing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/invoicing/v1;invoicingv1";
option java_multiple_files = true;
option java_outer_classname = "EInvoiceCalculationServiceProto";
option java_package = "com.acme.invoicing.v1";

// Computes the figures of an e invoice, such as totals, taxes, and estimates.
service EInvoiceCalculationService {
  // Calculates an e invoice.
  rpc CalculateEInvoice(CalculateEInvoiceRequest) returns (CalculateEInvoiceResponse);

  // Estimates an e invoice.
  rpc EstimateEInvoice(EstimateEInvoiceRequest) returns (EstimateEInvoiceResponse);

  // Quotes an e invoice.
  rpc QuoteEInvoice(QuoteEInvoiceRequest) returns (QuoteEInvoiceResponse);

  // Compares an e invoice.
  rpc CompareEInvoiceOptions(CompareEInvoiceOptionsRequest) returns (CompareEInvoiceOptionsResponse);

  // Recalculates an e invoice.
  rpc RecalculateEInvoices(RecalculateEInvoicesRequest) returns (RecalculateEInvoicesResponse);

  // Simulates an e invoice.
  rpc SimulateEInvoice(SimulateEInvoiceRequest) returns (SimulateEInvoiceResponse);

  // Explains an e invoice.
  rpc ExplainEInvoiceCalculation(ExplainEInvoiceCalculationRequest) returns (ExplainEInvoiceCalculationResponse);

  // Returns an e invoice.
  rpc GetEInvoiceRates(GetEInvoiceRatesRequest) returns (GetEInvoiceRatesResponse);
}

// The request of `CalculateEInvoice`.
message CalculateEInvoiceRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string e_invoice_id = 2;
  EInvoice e_invoice = 3;
  CalculateEInvoiceRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateEInvoice`.
message CalculateEInvoiceResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateEInvoiceResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  EInvoice e_invoice = 1;
  CalculateEInvoiceResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

