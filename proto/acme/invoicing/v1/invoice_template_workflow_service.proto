option csharp_namespace = "Acme.Invoicing.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/invoicing/v1;invoicingv1";
option java_multiple_files = true;
option java_outer_classname = "InvoiceTemplateWorkflowServiceProto";
option java_package = "com.acme.invoicing.v1";

// Runs the long-lived workflow that takes an invoice template from start to finish.
service InvoiceTemplateWorkflowService {
  // Starts an invoice template.
  rpc StartInvoiceTemplateWorkflow(StartInvoiceTemplateWorkflowRequest) returns (StartInvoiceTemplateWorkflowResponse);

  // Advances an invoice template.
  rpc AdvanceInvoiceTemplateWorkflow(AdvanceInvoiceTemplateWorkflowRequest) returns (AdvanceInvoiceTemplateWorkflowResponse);

  // Retrys an invoice template.
  rpc RetryInvoiceTemplateWorkflow(RetryInvoiceTemplateWorkflowRequest) returns (RetryInvoiceTemplateWorkflowResponse);

  // Pauses an invoice template.
  rpc PauseInvoiceTemplateWorkflow(PauseInvoiceTemplateWorkflowRequest) returns (PauseInvoiceTemplateWorkflowResponse);

  // Resumes an invoice template.
  rpc ResumeInvoiceTemplateWorkflow(ResumeInvoiceTemplateWorkflowRequest) returns (ResumeInvoiceTemplateWorkflowResponse);

  // Returns an invoice template.
  rpc InspectInvoiceTemplateWorkflow(InspectInvoiceTemplateWorkflowRequest) returns (InspectInvoiceTemplateWorkflowResponse);

  // Lists invoice templates a page at a time.
  rpc ListInvoiceTemplateWorkflows(ListInvoiceTemplateWorkflowsRequest) returns (ListInvoiceTemplateWorkflowsResponse);

  // Signals an invoice template.
  rpc SignalInvoiceTemplateWorkflow(SignalInvoiceTemplateWorkflowRequest) returns (SignalInvoiceTemplateWorkflowResponse);
}

// The request of `StartInvoiceTemplateWorkflow`.
message StartInvoiceTemplateWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string invoice_template_id = 2;
  InvoiceTemplate invoice_template = 3;
  StartInvoiceTemplateWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartInvoiceTemplateWorkflow`.
message StartInvoiceTemplateWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  InvoiceTemplate invoice_template = 1;
  StartInvoiceTemplateWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

